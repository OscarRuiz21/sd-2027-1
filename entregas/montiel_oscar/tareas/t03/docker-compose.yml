name: t03-redis-cluster

x-redis: &redis
  image: redis:8-alpine
  command:
    - redis-server
    - --port
    - "6379"
    - --cluster-enabled
    - "yes"
    - --cluster-config-file
    - nodes.conf
    - --cluster-node-timeout
    - "5000"
    - --appendonly
    - "yes"
    - --protected-mode
    - "no"
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 2s
    timeout: 2s
    retries: 20

services:
  redis-1:
    <<: *redis
    volumes:
      - redis1-data:/data

  redis-2:
    <<: *redis
    volumes:
      - redis2-data:/data

  redis-3:
    <<: *redis
    volumes:
      - redis3-data:/data

volumes:
  redis1-data:
  redis2-data:
  redis3-data:
