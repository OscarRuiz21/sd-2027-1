services:

  server:
    build: ./server
    ports:
      - "8000:8000"
      - "50051:50051"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/students/1')"]
      interval: 5s
      timeout: 3s
      retries: 10

  client:
    build: ./client
    depends_on:
      server:
        condition: service_healthy
    command: ["python", "client.py", "2"]