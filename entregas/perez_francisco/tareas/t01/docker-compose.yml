services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: t01-server
    ports:
      - "8081:8080"
      - "50051:50051"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - t01-network

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    networks:
      - t01-network

networks:
  t01-network:
    driver: bridge
