syntax = "proto3";

package products;

service ProductService {
  rpc GetProduct (ProductRequest) returns (ProductResponse);
}

message ProductRequest {
  int32 id = 1;
}

message ProductResponse {
  int32 id = 1;
  string nombre = 2;
  string categoria = 3;
  bool disponible = 4;
  bool encontrado = 5;
  string mensaje = 6;
}
