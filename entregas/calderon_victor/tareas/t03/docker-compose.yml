services:
  cassandra-1:
    image: cassandra:5.0
    container_name: cassandra-1
    hostname: cassandra-1
    environment:
      CASSANDRA_CLUSTER_NAME: "sd-sharding"
      CASSANDRA_SEEDS: "cassandra-1"
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "100M"
    networks:
      cassandra-net:
        ipv4_address: 172.28.0.11
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e \"describe cluster\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  cassandra-2:
    image: cassandra:5.0
    container_name: cassandra-2
    hostname: cassandra-2
    environment:
      CASSANDRA_CLUSTER_NAME: "sd-sharding"
      CASSANDRA_SEEDS: "cassandra-1"
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "100M"
    networks:
      cassandra-net:
        ipv4_address: 172.28.0.12
    depends_on:
      cassandra-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e \"describe cluster\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

networks:
  cassandra-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
