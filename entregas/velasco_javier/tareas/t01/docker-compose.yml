services:
  servidor:
    build: { context: ., dockerfile: server/Dockerfile }
    networks: [red-boings]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      retries: 10

  cliente:
    build: { context: ., dockerfile: cliente/Dockerfile }
    environment:
      SERVIDOR_HOST: servidor       
    networks: [red-boings]
    depends_on:
      servidor: { condition: service_healthy }
    profiles: ["cliente"]          

  sniffer:
    image: nicolaka/netshoot
    network_mode: "service:servidor"
    cap_add: [NET_ADMIN, NET_RAW]
    command: sleep infinity
    profiles: ["medicion"]

networks:
  red-boings: