name: amy-rest-grpc
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:50051:50051"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,grpc,catalog_pb2 as p,catalog_pb2_grpc as s; urllib.request.urlopen('http://localhost:8080/products/1',timeout=2).read(); s.CatalogStub(grpc.insecure_channel('localhost:50051')).GetProduct(p.GetProductRequest(id=1),timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      REST_HOST: server
      GRPC_HOST: server
    depends_on:
      server:
        condition: service_healthy
  grpcurl:
    profiles: ["tools"]
    image: fullstorydev/grpcurl:v1.9.3
    volumes:
      - ./proto:/protos:ro
    entrypoint: ["/bin/grpcurl", "-plaintext", "-import-path", "/protos", "-proto", "catalog.proto"]
