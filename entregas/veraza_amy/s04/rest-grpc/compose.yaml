name: amy-rest-grpc
services:
  rest:
    build:
      context: .
      dockerfile: rest/Dockerfile
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/products/1', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 10
  grpc:
    build:
      context: .
      dockerfile: grpc/Dockerfile
    ports:
      - "127.0.0.1:50051:50051"
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc,catalog_pb2 as p,catalog_pb2_grpc as s; s.CatalogStub(grpc.insecure_channel('localhost:50051')).GetProduct(p.GetProductRequest(id=1),timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: grpc/Dockerfile
    environment:
      REST_HOST: rest
      GRPC_HOST: grpc
    depends_on:
      rest:
        condition: service_healthy
      grpc:
        condition: service_healthy
    command: ["python", "-m", "unittest", "-v", "test_services"]
  grpcurl:
    profiles: ["tools"]
    image: fullstorydev/grpcurl:v1.9.3
    volumes:
      - ./proto:/protos:ro
    entrypoint: ["/bin/grpcurl", "-plaintext", "-import-path", "/protos", "-proto", "catalog.proto"]
