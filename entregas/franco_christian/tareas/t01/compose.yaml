services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: t01-server
    ports:
      - "5000:5000"
      - "50051:50051"
    networks:
      - t01-network

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: t01-client
    depends_on:
      - server
    networks:
      - t01-network

networks:
  t01-network:
    driver: bridge
