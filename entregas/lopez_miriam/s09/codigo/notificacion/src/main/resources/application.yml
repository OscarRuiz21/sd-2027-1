server:
  port: 8080

spring:
  application:
    name: notificacion

  datasource:
    # Cada servicio apunta a SU base (notificacion). Nadie mas la lee ni la escribe.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notificacion}
    username: ${DB_USER:mexibanco}
    password: ${DB_PASSWORD:mexibanco}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  # v09: configuracion del broker RabbitMQ.
  # En Docker Compose el host es el nombre del servicio: rabbitmq.
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:mexibanco}
    password: ${RABBIT_PASSWORD:mexibanco}

    # LAB S09: configuracion del consumidor.
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 5

  mvc:
    # Los errores de validacion tambien salen como Problem Details.
    problemdetails:
      enabled: true

# Configuracion del directorio Eureka.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: ${EUREKA_CONSULTA_S:30}

  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: ${EUREKA_LATIDO_S:30}
    lease-expiration-duration-in-seconds: ${EUREKA_EXPIRA_S:90}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
