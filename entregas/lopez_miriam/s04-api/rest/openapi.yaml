openapi: 3.0.0
info:
  title: API de suma
  version: 1.0.0

paths:
  /sumar:
    post:
      summary: Suma dos números
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - a
                - b
              properties:
                a:
                  type: number
                b:
                  type: number
      responses:
        "200":
          description: Suma realizada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultado:
                    type: number
        "400":
          description: Datos inválidos