services:
  cobros:
    build: .
    ports:
      - "127.0.0.1:8083:8080"
    volumes:
      - datos:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/salud', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  datos:
