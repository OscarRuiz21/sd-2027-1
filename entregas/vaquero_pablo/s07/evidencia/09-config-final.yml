name: mexi-banco-v06
services:
  cuenta:
    build:
      context: /Users/pablovaquero/.codex/.chatgpt-projects/g-p-6a9bbe98e4488191b8bbcae2fec84038/mexi-banco-s07/cuenta
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
        required: true
      discovery:
        condition: service_healthy
        required: true
    deploy:
      replicas: 3
    environment:
      BALANCEADOR_CACHE: 5s
      DB_HOST: db
      DB_NAME: cuenta
      DB_PASSWORD: mexibanco
      DB_PORT: "5432"
      DB_USER: mexibanco
      EUREKA_CONSULTA_S: "5"
      EUREKA_EXPIRA_S: "15"
      EUREKA_LATIDO_S: "5"
      EUREKA_URL: http://discovery:8761/eureka/
      MOVIMIENTO_URL: http://movimiento:8080
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1
      timeout: 3s
      interval: 5s
      retries: 5
      start_period: 2m0s
    networks:
      default: null
  db:
    environment:
      POSTGRES_PASSWORD: mexibanco
      POSTGRES_USER: mexibanco
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U mexibanco -d spei
      timeout: 3s
      interval: 5s
      retries: 10
    image: postgres:17-alpine
    networks:
      default: null
    volumes:
      - type: volume
        source: datos
        target: /var/lib/postgresql/data
        volume: {}
      - type: bind
        source: /Users/pablovaquero/.codex/.chatgpt-projects/g-p-6a9bbe98e4488191b8bbcae2fec84038/mexi-banco-s07/db/init
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: true
  discovery:
    build:
      context: /Users/pablovaquero/.codex/.chatgpt-projects/g-p-6a9bbe98e4488191b8bbcae2fec84038/mexi-banco-s07/discovery
      dockerfile: Dockerfile
    environment:
      EUREKA_AUTOPRESERVACION: "false"
      EUREKA_BARRIDO_MS: "5000"
      EUREKA_CACHE_MS: "5000"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8761/actuator/health | grep -q UP || exit 1
      timeout: 3s
      interval: 5s
      retries: 5
      start_period: 1m30s
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8761
        published: "8761"
        protocol: tcp
  gateway:
