services:

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: t01-server
    ports:
      - "8000:8000"
      - "50051:50051"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/personas/1')"]
      interval: 5s
      timeout: 3s
      retries: 5

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: t01-client
    environment:
      SERVIDOR: server
    depends_on:
      server:
        condition: service_healthy