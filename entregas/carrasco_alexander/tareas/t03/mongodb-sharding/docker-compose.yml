services:
  configsvr:
    image: mongo:7.0
    command: ["mongod", "--configsvr", "--replSet", "cfgRS", "--bind_ip_all"]
    volumes:
      - config_data:/data/configdb

  shard1:
    image: mongo:7.0
    command: ["mongod", "--shardsvr", "--replSet", "shard1RS", "--bind_ip_all"]
    volumes:
      - shard1_data:/data/db

  shard2:
    image: mongo:7.0
    command: ["mongod", "--shardsvr", "--replSet", "shard2RS", "--bind_ip_all"]
    volumes:
      - shard2_data:/data/db

  mongos:
    image: mongo:7.0
    command: ["mongos", "--configdb", "cfgRS/configsvr:27019", "--bind_ip_all"]
    ports:
      - "27017:27017"
    depends_on:
      - configsvr
      - shard1
      - shard2

volumes:
  config_data:
  shard1_data:
  shard2_data:
