syntax = "proto3";

package supermercado;

service Inventario {
    rpc GetProducto (ProductoRequest) returns (ProductoResponse);
}

message ProductoRequest {
    int32 id = 1;
}

message ProductoResponse {
    bool encontrado = 1;
    string nombre = 2;
    string descripcion = 3;
    float precio = 4;
    int32 existencias = 5;
}