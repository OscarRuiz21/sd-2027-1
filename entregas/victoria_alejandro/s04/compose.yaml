services:
  web:
    image: nginx:alpine
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_started

  db:
    image: postgres:17-alpine
    env_file: .env.prod
    volumes:
      - datos_banco_practica:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  cache:
    image: redis:8-alpine

volumes:
  datos_banco_practica: