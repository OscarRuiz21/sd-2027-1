syntax = "proto3";
package farmaya;

//servicio y sus métodos
service Catalogo {
  rpc ObtenerMedicamento (MedicamentoRequest) returns (MedicamentoResponse);
}

// estructura del request
message MedicamentoRequest {
  string id = 1;
}

// estructura del response
message MedicamentoResponse {
  string id = 1;
  string nombre = 2;
  double precio = 3;
  bool encontrado = 4;
}