/* Motor de diagramas animados · componentes sobre tokens de tema.
   Tema por defecto: "reel" oscuro. Un theme.css del proyecto redefine los tokens en `body`
   (toda la presentación) o en `body.th-<nombre>` (escenas con `theme: '<nombre>'`). */
body{
  --letterbox:#05080B; --bg:#0B1016; --grid:rgba(255,255,255,.028);
  --glow1:rgba(94,184,242,.07); --glow2:rgba(163,227,106,.05);
  --panel-a:#19222D; --panel-b:#121922; --line:#283441; --bar:#26313D; --bar2:#33414F;
  --ink:#EEF3F7; --mute:#8D9AA8; --faint:#5A6776;
  --title:var(--ink); --sub:var(--mute); --tag:var(--green); --hl:var(--green);
  --prog:var(--green); --track:#1B2530; --rail-off:#243040;
  --chip-bg:#0E141B; --tint:10%; --card:rgba(17,24,32,.92); --term-bg:rgba(15,21,29,.82); --term-ink:#C8D2DB;
  --wire:#2E3B48; --halo:#0B1016; --x-fill:#1A0F14;
  --shadow:0 14px 34px rgba(0,0,0,.45); --inset:inset 0 1px 0 rgba(255,255,255,.05);
  --cap-shadow:0 2px 20px rgba(0,0,0,.7); --glow-k:28%; --state-tint:0%;
  --green:#A3E36A; --blue:#5EB8F2; --sky:#5EB8F2; --violet:#A48BFA; --amber:#F6A93B; --red:#FF5C7A; --gray:#7C8896; --inkc:#EEF3F7;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --title-w:800; --title-size:84px; --title-track:-.025em; --node-case:uppercase; --radius:14px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{height:100%}
body{margin:0;background:var(--letterbox);color:var(--ink);font-family:var(--display);overflow:hidden;-webkit-font-smoothing:antialiased;transition:background-color .5s}

#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));
  background:
    radial-gradient(900px 600px at 68% 45%,var(--glow1),transparent 70%),
    radial-gradient(700px 500px at 30% 80%,var(--glow2),transparent 70%),
    var(--bg);
  overflow:hidden;border-radius:6px;cursor:pointer;user-select:none}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:40px 40px;-webkit-mask-image:radial-gradient(ellipse at 60% 45%,#000 40%,transparent 85%);mask-image:radial-gradient(ellipse at 60% 45%,#000 40%,transparent 85%)}
#wires{position:absolute;left:0;top:0;width:1600px;height:900px;overflow:visible;z-index:1;pointer-events:none}
#layer{position:absolute;inset:0;z-index:2;pointer-events:none}
/* cambio de lámina: lo anterior se desvanece rápido antes de construir lo nuevo */
#layer,#wires,.head,.cap{transition:opacity .17s ease}
#stage.leaving :is(#layer,#wires,.head,.cap){opacity:0}

/* Encabezado de escena */
.head{position:absolute;left:80px;top:78px;width:540px;z-index:3}
.tag{font:500 20px/1.2 var(--mono);letter-spacing:.14em;color:var(--tag);text-transform:uppercase}
.title{margin:22px 0 0;font-family:var(--display);font-weight:var(--title-w);font-size:var(--title-size);line-height:.98;letter-spacing:var(--title-track);color:var(--title);text-wrap:balance}
.sub{margin:14px 0 0;font:500 38px/1.15 var(--display);color:var(--sub);letter-spacing:-.01em;text-wrap:balance}
.head>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.head .title{animation-delay:.07s}.head .sub{animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
/* layout: 'wide' → encabezado bajo y ancho; el diagrama ocupa todo el ancho debajo */
.head.wide{width:1440px}
.head.wide .title{margin-top:16px;font-size:calc(var(--title-size) * .7)}
.head.wide .sub{margin-top:8px;font-size:30px}

/* Riel de bloques (DECK.rail + scene.block) */
.rail{position:absolute;right:80px;top:40px;display:flex;align-items:center;gap:7px;z-index:4}
.rail i{display:block;width:40px;height:6px;border-radius:1px;background:var(--rail-off);transition:background .4s}
.rail i.on{background:var(--tag)}
.rail b{margin-left:8px;font:600 16px/1 var(--display);color:var(--tag)}

/* Tonos: definen --c; los estados van después y ganan */
.t-green{--c:var(--green)}.t-blue{--c:var(--blue)}.t-sky{--c:var(--sky)}.t-violet{--c:var(--violet)}
.t-amber{--c:var(--amber)}.t-red{--c:var(--red)}.t-gray{--c:var(--gray)}.t-ink{--c:var(--inkc)}

/* Elementos del diagrama */
.it{position:absolute;opacity:0;transform:translateY(14px) scale(.97);
  transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1),border-color .35s,box-shadow .35s,background .35s}
.it.on{opacity:1;transform:none}

.node{width:220px;height:104px;padding:16px 18px;border-radius:var(--radius);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c,transparent) var(--state-tint),var(--panel-a)),color-mix(in srgb,var(--c,transparent) var(--state-tint),var(--panel-b)));
  border:1.5px solid var(--line);box-shadow:var(--shadow),var(--inset)}
.node .t{font:700 21px/1 var(--display);letter-spacing:.02em;text-transform:var(--node-case);white-space:nowrap;color:var(--ink)}
.node .m{margin-top:9px;font:400 15px/18px var(--mono);color:var(--mute);max-height:36px;overflow:hidden;transition:color .3s}
.node .bar{position:absolute;left:18px;right:44px;bottom:15px;height:4px;border-radius:2px;background:var(--bar)}
.node .bar::after{content:"";position:absolute;left:0;top:0;bottom:0;width:38%;border-radius:2px;background:var(--bar2)}
.node .dot{position:absolute;right:16px;bottom:13px;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.node.fill{background:var(--c);border-color:var(--c)}
.node.fill .t{color:#fff}.node.fill .m{color:rgba(255,255,255,.74)}
.node.fill .bar{background:rgba(255,255,255,.22)}.node.fill .bar::after{background:rgba(255,255,255,.4)}
.node.fill .dot{background:#fff;box-shadow:none}

.chip{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;padding:0 16px;border-radius:9px;white-space:nowrap;
  border:1.5px solid color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) var(--tint),var(--chip-bg));
  color:var(--c);font:700 18px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;
  box-shadow:0 0 24px color-mix(in srgb,var(--c) 18%,transparent)}
.chip .k{font:500 15px/1 var(--mono);color:var(--faint);letter-spacing:.05em}
.chip.mono{font:600 19px/1 var(--mono);letter-spacing:.02em;text-transform:none}

.label{font:600 22px/1.3 var(--display);color:var(--c)}
.label.mono{font:500 16px/1.45 var(--mono);letter-spacing:.08em;text-transform:uppercase}

.users{display:grid;justify-items:center;gap:8px}
.users .row{display:flex;gap:10px}
.users svg{width:42px;height:48px;overflow:visible}
.users svg *{fill:none;stroke-width:5;stroke-linecap:round}
.users .cnt{font:500 17px/1 var(--mono);color:var(--green);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.users.surge svg{animation:bob .5s ease-in-out infinite alternate}
.users.surge svg:nth-child(2n){animation-delay:.25s}
@keyframes bob{to{transform:translateY(-5px)}}

.metric{width:290px;padding:14px 16px;border-radius:12px;background:var(--card);border:1.5px solid var(--line)}
.metric .h{font:500 13px/1 var(--mono);letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.metric .r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:10px;white-space:nowrap}
.metric .k{font:400 15px/1 var(--mono);color:var(--mute)}
.metric .v{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--ink);transition:color .3s}
.metric svg{display:block;margin-top:12px;width:100%;height:36px;overflow:visible}
.metric path{fill:none;stroke-width:2.5;stroke-linejoin:round;transition:opacity .4s}
.metric .calm{stroke:var(--green)}.metric .spike{stroke:var(--red);opacity:0}

.line{height:0;border-top:2px dashed var(--c)}
.line span{position:absolute;right:0;top:-30px;font:500 15px/1 var(--mono);letter-spacing:.12em;color:var(--c);white-space:nowrap}
.line.v{width:0;border-top:0;border-left:2px dashed var(--c)}
.line.v span{top:-28px;left:0;right:auto;transform:translateX(-50%)}

/* Definición: el único objeto con marco resaltado de la lámina; la explicación parte de aquí.
   El término va como pestaña sobre el borde superior; `tone` (o --tag por defecto) colorea marco y pestaña. */
.term{width:440px;padding:30px 26px 24px;border-radius:var(--radius);
  border:1.5px solid color-mix(in srgb,var(--c,var(--tag)) 75%,transparent);
  background:color-mix(in srgb,var(--c,var(--tag)) 6%,var(--term-bg));
  box-shadow:0 0 0 5px color-mix(in srgb,var(--c,var(--tag)) 9%,transparent),0 0 48px color-mix(in srgb,var(--c,var(--tag)) 14%,transparent),var(--shadow)}
.term .k{position:absolute;left:20px;top:0;transform:translateY(-50%);max-width:calc(100% - 40px);padding:6px 11px;border-radius:7px;
  border:1.5px solid color-mix(in srgb,var(--c,var(--tag)) 75%,transparent);background:var(--bg);
  font:600 14px/1.2 var(--mono);letter-spacing:.16em;color:var(--c,var(--tag));text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term .v{font:500 23px/1.38 var(--display);color:var(--ink)}
.term em,.list em{font-style:normal;font-weight:700;color:var(--hl)}

.list{width:420px;padding:16px 18px;border-radius:12px;background:var(--term-bg);border:1.5px solid var(--line)}
.list .lh{margin-bottom:12px;font:600 13px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c,var(--tag))}
.list ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.list li{font:400 16px/1.38 var(--display);color:var(--term-ink)}
.list li b{font-weight:700;color:var(--ink)}
.list.mono li{font:500 16px/1.2 var(--mono);padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel-b);color:var(--ink)}

.img img{display:block;width:auto}

/* Estados (después de tonos y de .on) */
.it.hot,.edge.hot{--c:var(--red)}.it.ok{--c:var(--green)}.it.pulse{--c:var(--blue)}
.node.hot,.node.ok,.node.pulse,.metric.hot,.list.hot,.list.ok,.list.pulse,.term.hot,.term.ok,.term.pulse{border-color:var(--c);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent),0 0 36px color-mix(in srgb,var(--c) var(--glow-k),transparent),var(--shadow)}
.node.hot .dot{background:var(--red);box-shadow:0 0 12px var(--red);animation:blink .8s steps(2) infinite}
.node.pulse{animation:pulse 1.4s ease-in-out infinite}
.metric.hot .v{color:var(--red)}.metric.hot .calm{opacity:0}.metric.hot .spike{opacity:1}
.it.dim{opacity:.22}
.node.down{opacity:.5}
.node.down .t,.node.down .m{color:var(--faint)}
.node.down .dot{background:var(--faint);box-shadow:none}
.node.down::after{content:"";position:absolute;inset:-1px;border-radius:var(--radius);
  background:linear-gradient(to top right,transparent calc(50% - 1.5px),var(--red) calc(50% - 1.5px),var(--red) calc(50% + 1.5px),transparent calc(50% + 1.5px))}
.flash{animation:flash 1s ease}
@keyframes flash{0%,30%{color:var(--ink);text-shadow:0 0 14px var(--c,var(--green))}}
@keyframes blink{50%{opacity:.25}}
@keyframes pulse{50%{box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent),0 0 56px color-mix(in srgb,var(--c) 45%,transparent),var(--shadow)}}

/* Conexiones */
.edge{opacity:0;transition:opacity .4s}
.edge.on{opacity:1}
.edge .base{fill:none;stroke:var(--wire);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .7s cubic-bezier(.3,.7,.2,1)}
.edge.on .base{stroke-dashoffset:0}
.edge .bead{fill:none;stroke:var(--c);stroke-width:6;stroke-linecap:round;stroke-dasharray:0 18;opacity:0;transition:opacity .4s .45s,stroke .3s}
.edge.on .bead{opacity:.95}
.edge.flow .bead{animation:march 1.1s linear infinite}
.edge.fast .bead{animation-duration:.42s}
.edge.slow .bead{animation-duration:2.8s}
.edge.dim{opacity:.18}
.edge.broken .base{opacity:0}
.edge.broken .bead{stroke:var(--red);stroke-width:2.5;stroke-linecap:butt;stroke-dasharray:8 9;animation:none;opacity:1}
.edge .x{opacity:0;transition:opacity .3s}
.edge.broken .x{opacity:1}
.edge .x circle{fill:var(--x-fill);stroke:var(--red);stroke-width:2}
.edge .x path{stroke:var(--red);stroke-width:2.5;stroke-linecap:round}
.edge .head{fill:var(--c);opacity:0;transition:opacity .4s .45s}
.edge.on .head{opacity:1}
.edge.broken .head{fill:var(--red)}
.edge .elab{font:500 15px var(--mono);letter-spacing:.05em;fill:var(--c);paint-order:stroke;stroke:var(--halo);stroke-width:6px;stroke-linejoin:round;opacity:0;transition:opacity .4s .3s}
.edge.on .elab{opacity:1}
@keyframes march{to{stroke-dashoffset:-18}}

/* ---------- Diagramas compilados con Archify (type: 'archify') ----------
   El SVG trae las clases semánticas de Archify (c-*, a-*, t-*, s-*); aquí se pintan con los tokens del tema.
   --k es la escala del SVG en pantalla: lo que deba medir lo mismo en px se divide entre --k.
   Los estados llegan en data-st (hot ok pulse down dim gone · flow fast slow broken). */
.arch{--k:1}
.arch svg{display:block;width:100%;height:100%;overflow:visible}
.arch text{font-family:var(--mono);fill:var(--mute);transition:fill .3s}
.arch .t-primary{font-family:var(--display);font-weight:700;fill:var(--ink);text-transform:var(--node-case);letter-spacing:.02em}
.arch .t-muted{fill:var(--mute)}.arch .t-dim{fill:var(--faint)}
.arch .t-frontend,.arch .s-frontend{fill:var(--sky);color:var(--sky)}
.arch .t-backend,.arch .s-backend{fill:var(--blue);color:var(--blue)}
.arch .t-database,.arch .s-database{fill:var(--violet);color:var(--violet)}
.arch .t-cloud,.arch .s-cloud{fill:var(--amber);color:var(--amber)}
.arch .t-security,.arch .s-security{fill:var(--red);color:var(--red)}
.arch .t-messagebus,.arch .s-messagebus{fill:var(--violet);color:var(--violet)}
.arch .t-external,.arch .s-external{fill:var(--gray);color:var(--gray)}
.arch .c-mask{fill:var(--halo)}
.arch .c-frontend{--kc:var(--sky)}.arch .c-backend{--kc:var(--blue)}.arch .c-database{--kc:var(--violet)}
.arch .c-cloud{--kc:var(--amber)}.arch .c-security{--kc:var(--red)}.arch .c-messagebus{--kc:var(--violet)}.arch .c-external{--kc:var(--gray)}
.arch :is(.c-frontend,.c-backend,.c-database,.c-cloud,.c-security,.c-messagebus,.c-external){
  fill:color-mix(in srgb,var(--kc) 7%,var(--panel-a));stroke:color-mix(in srgb,var(--kc) 32%,var(--line));transition:stroke .35s,filter .35s}
.arch .c-lane{fill:color-mix(in srgb,var(--panel-a) 28%,transparent);stroke:var(--line);stroke-dasharray:6 6}
.arch .c-region{fill:color-mix(in srgb,var(--amber) 4%,transparent);stroke:color-mix(in srgb,var(--amber) 45%,var(--line));stroke-dasharray:8 4}
.arch .c-security-group{fill:none;stroke:color-mix(in srgb,var(--red) 45%,var(--line));stroke-dasharray:4 4}
.arch .semantic-sigil{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.arch .semantic-sigil .sigil-fill{fill:currentColor;stroke:none}
/* logos de productos (campo brand de Archify): insignia blanca con marco del tema */
.arch .brand-mark-badge{fill:#fff;stroke:none}
.arch .brand-mark-frame{fill:none;stroke:var(--line);stroke-width:.8;vector-effect:non-scaling-stroke}
.arch .brand-mark-fallback{fill:none;stroke:var(--mute);stroke-width:1.15}
.arch :is(.a-default,.a-emphasis,.a-security,.a-dashed){fill:none;stroke:var(--wire)}
.arch .a-security{stroke-dasharray:5 5}.arch .a-dashed{stroke-dasharray:4 4}
.arch .m-default{fill:var(--faint)}.arch .m-emphasis{fill:var(--blue)}.arch .m-security{fill:var(--amber)}.arch .m-dashed{fill:var(--violet)}
.arch [data-edge-id],.arch .ab{--c:var(--c0,var(--blue))}
.arch [data-edge-id] text{fill:var(--c)}
.arch [data-node-id]{transition:opacity .45s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.arch [data-edge-id],.arch path[data-composition-points]{transition:opacity .4s}
/* .pre: recién construido con entrada animada; stagger() lo quita y cada nodo/relación entra con su retraso */
.arch.pre :is([data-node-id],[data-edge-id],path[data-composition-points],.ab,.ax){opacity:0!important}
.arch.pre [data-node-id]{transform:translateY(calc(10px / var(--k)))}
/* cuentas sobre cada relación: punteadas siempre, en movimiento con flow */
.arch .ab{fill:none;stroke:var(--c);stroke-width:calc(5.5px / var(--k));stroke-linecap:round;stroke-dasharray:0 calc(17px / var(--k));opacity:.9;transition:opacity .4s,stroke .3s}
.arch .ab[data-st~=flow]{animation:abm 1.1s linear infinite}
.arch .ab[data-st~=fast]{animation-duration:.42s}
.arch .ab[data-st~=slow]{animation-duration:2.8s}
@keyframes abm{to{stroke-dashoffset:calc(-17px / var(--k))}}
.arch [data-st~=hot]{--c:var(--red)}.arch [data-st~=ok]{--c:var(--green)}
.arch path[data-composition-points][data-st~=broken]{opacity:0}
.arch .ab[data-st~=broken]{stroke:var(--red);stroke-width:calc(2.5px / var(--k));stroke-linecap:butt;stroke-dasharray:calc(8px / var(--k)) calc(9px / var(--k));animation:none;opacity:1}
.arch .ax{visibility:hidden;transition:opacity .3s}
.arch .ax[data-st~=broken]{visibility:visible}
.arch .ax circle{fill:var(--x-fill);stroke:var(--red);stroke-width:2}
.arch .ax path{stroke:var(--red);stroke-width:2.5;stroke-linecap:round}
/* nodos */
.arch [data-st~=hot]{--sc:var(--red)}.arch [data-st~=ok]{--sc:var(--green)}.arch [data-st~=pulse]{--sc:var(--blue)}
.arch [data-node-id]:is([data-st~=hot],[data-st~=ok],[data-st~=pulse])>rect:not(.c-mask){stroke:var(--sc);stroke-width:calc(2.5px / var(--k));
  filter:drop-shadow(0 0 calc(16px / var(--k)) color-mix(in srgb,var(--sc) 55%,transparent))}
.arch [data-node-id][data-st~=pulse]>rect:not(.c-mask){animation:axp 1.4s ease-in-out infinite}
@keyframes axp{50%{filter:drop-shadow(0 0 calc(30px / var(--k)) color-mix(in srgb,var(--sc) 85%,transparent))}}
.arch [data-node-id][data-st~=down]{opacity:.5}
.arch [data-node-id][data-st~=down] text{fill:var(--faint)}
.arch .axd{fill:none;stroke:var(--red);stroke-width:calc(3px / var(--k));stroke-linecap:round;opacity:0;transition:opacity .3s}
.arch [data-st~=down] .axd{opacity:1}
.arch [data-st~=dim]{opacity:.18}.arch [data-st~=dim] [data-st~=dim]{opacity:1}
.arch [data-st~=gone]{opacity:0}.arch [data-st~=gone] [data-st~=gone]{opacity:1}
.arch text.flash{animation:axf 1s ease}
@keyframes axf{0%,30%{fill:var(--hl)}}

/* Subtítulo palabra por palabra (solo modo narrado) */
.cap{position:absolute;left:120px;right:120px;top:742px;margin:0;text-align:center;z-index:4;color:var(--ink);
  font:700 44px/1.18 var(--display);letter-spacing:-.01em;text-wrap:balance;text-shadow:var(--cap-shadow)}
.cap[hidden]{display:none}
.cap .w{display:inline-block;opacity:0;animation:wordIn .42s cubic-bezier(.2,.8,.2,1) forwards}
.cap .hl{color:var(--hl)}
@keyframes wordIn{from{opacity:0;transform:translateY(10px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

.foot{position:absolute;left:80px;right:80px;bottom:30px;display:flex;align-items:center;gap:28px;z-index:4;
  font:500 13px/1 var(--mono);letter-spacing:.2em;color:var(--faint);text-transform:uppercase}
.foot .track{flex:1;height:2px;background:var(--track);position:relative;overflow:hidden}
.foot .track i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--prog);transition:width .5s}
#count{font-variant-numeric:tabular-nums;letter-spacing:.12em}

/* Fuera del escenario: ayuda y notas (siempre oscuros) */
#hint{position:fixed;top:14px;right:16px;z-index:10;padding:8px 12px;border-radius:8px;
  font:500 12px/1.4 var(--mono);letter-spacing:.06em;color:#7A8794;background:rgba(10,15,20,.85);border:1px solid #1E2833;transition:opacity .8s}
#hint.gone{opacity:0}
#notes{position:fixed;left:0;right:0;bottom:0;z-index:9;max-height:48vh;overflow:auto;padding:20px max(16px,4vw) 28px;
  background:rgba(8,12,17,.97);border-top:1px solid #243140;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#notes.open{transform:none}
#notes .nt{font:500 12px/1 var(--mono);letter-spacing:.16em;color:#A3E36A;text-transform:uppercase}
#notes .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:28px;margin-top:14px}
#notes h4{margin:0 0 10px;font:600 13px/1 var(--mono);letter-spacing:.12em;color:#5A6776;text-transform:uppercase}
#notes ol{margin:0;padding-left:1.4em;display:grid;gap:6px}
#notes li{font:500 16px/1.45 var(--display);color:#7F8C99;max-width:65ch}
#notes li.cur{color:#EEF3F7}
#notes li.cur::marker{color:#A3E36A}
#notes p{margin:0;font:400 16px/1.55 var(--display);color:#B7C2CC;max-width:65ch}
#notes b{color:#A3E36A;font-weight:600}

/* ?check mide la composición final: sin animaciones ni transiciones */
body.check *,body.check *::before,body.check *::after{animation:none!important;transition:none!important}
/* ?print (lo usa deck.py pdf): la lámina en su estado final, sin movimiento ni ayudas de pantalla */
body.print *,body.print *::before,body.print *::after{animation:none!important;transition:none!important}
body.print #hint,body.print #notes{display:none}
body.print .cap .w{opacity:1}
body.print #stage{border-radius:0;background:var(--bg)}
/* en el PDF, sombras, halos y degradados difusos se rasterizan: se cambian por anillos y bordes vectoriales */
body.print #stage::before{-webkit-mask-image:none;mask-image:none;opacity:.55}
body.print *,body.print *::before,body.print *::after{box-shadow:none!important;text-shadow:none!important;filter:none!important}
body.print .it:is(.hot,.ok,.pulse){box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent)!important}
body.print .term{box-shadow:0 0 0 5px color-mix(in srgb,var(--c,var(--tag)) 14%,transparent)!important}
body.print .arch [data-node-id]:is([data-st~=hot],[data-st~=ok],[data-st~=pulse])>rect:not(.c-mask){stroke-width:calc(4px / var(--k))}

/* ---------- Formato reel (DECK.format: 'reel'): 1080×1920 para video vertical ----------
   Zona segura x 65–940 · y 270–1248: arriba la barra de la app, a la derecha los botones, abajo la descripción.
   Gancho y 300–520 · definición y≈560 (se encoge con `mini`) · diagrama y 660–1100 · subtítulos y 1110–1240. */
body.fmt-reel{--title-size:96px}
body.fmt-reel #stage,body.fmt-reel #wires{width:1080px;height:1920px}
body.fmt-reel #stage{border-radius:0;
  background:radial-gradient(900px 900px at 50% 42%,var(--glow1),transparent 70%),radial-gradient(700px 700px at 30% 70%,var(--glow2),transparent 70%),var(--bg)}
body.fmt-reel #stage::before{background-size:54px 54px;-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 35%,transparent 80%);mask-image:radial-gradient(ellipse at 50% 45%,#000 35%,transparent 80%)}
body.fmt-reel .head{left:65px;top:300px;width:875px}
body.fmt-reel .tag{font-size:26px;letter-spacing:.12em}
body.fmt-reel .title{margin-top:18px;line-height:1}
body.fmt-reel .sub{margin-top:14px;font-size:46px;line-height:1.12}
body.fmt-reel :is(.foot,.rail){display:none}
body.fmt-reel .node{width:250px;height:120px;padding:18px 20px;border-width:2px}
body.fmt-reel .node .t{font-size:32px}
body.fmt-reel .node .m{margin-top:10px;font-size:22px;line-height:26px;max-height:52px}
body.fmt-reel .node .bar{left:20px;right:50px;bottom:16px;height:5px}
body.fmt-reel .node .dot{right:18px;bottom:14px;width:10px;height:10px}
body.fmt-reel .chip{height:64px;padding:0 22px;gap:12px;border-radius:12px;border-width:2px;font-size:28px}
body.fmt-reel .chip .k{font-size:22px}
body.fmt-reel .chip.mono{font-size:28px}
body.fmt-reel .label{font-size:32px}
body.fmt-reel .label.mono{font-size:24px}
body.fmt-reel .metric{width:400px;padding:20px 22px}
body.fmt-reel .metric .h{font-size:22px}
body.fmt-reel .metric .k{font-size:24px}
body.fmt-reel .metric .v{font-size:42px}
body.fmt-reel .list{width:875px;padding:22px 26px}
body.fmt-reel .list .lh{font-size:22px}
body.fmt-reel .list li,body.fmt-reel .list.mono li{font-size:30px}
body.fmt-reel .term{width:875px;padding:42px 34px 32px;border-width:2px}
body.fmt-reel .term .k{left:28px;padding:8px 14px;font-size:22px}
body.fmt-reel .term .v{font-size:44px;line-height:1.28}
/* `mini`: la definición cede el espacio al diagrama y queda como un renglón bajo su pestaña */
body.fmt-reel .term.mini{padding:30px 34px 18px}
body.fmt-reel .term.mini .v{font-size:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term .c{display:none}
.term em,.term .c em{font-style:normal;font-weight:700;color:var(--hl)}
body.fmt-reel .term.mini .c{display:block;font:500 34px/1.2 var(--display);color:var(--ink);white-space:nowrap}
body.fmt-reel .term.mini:has(.c) .v{display:none}
body.fmt-reel .edge .base{stroke-width:3}
body.fmt-reel .edge .bead{stroke-width:9;stroke-dasharray:0 26}
body.fmt-reel .edge.flow .bead{animation-name:marchR}
body.fmt-reel .edge.broken .bead{stroke-width:3.5;stroke-dasharray:11 12}
body.fmt-reel .edge .x circle{r:15px;stroke-width:3}
body.fmt-reel .edge .x path{stroke-width:3.5}
body.fmt-reel .edge .elab{font-size:22px;stroke-width:8px}
@keyframes marchR{to{stroke-dashoffset:-26}}
/* subtítulos: en pantalla la frase completa; al reproducir (P o video), frases cortas que se llenan al decirse */
body.fmt-reel .cap{left:65px;right:140px;top:1110px;font:700 46px/1.15 var(--display)}
body.fmt-reel .cap.chunk{font:800 64px/1.06 var(--display);letter-spacing:-.015em;animation:chunkIn .2s cubic-bezier(.2,.8,.2,1) both}
body.fmt-reel .cap.chunk .w{animation:none;opacity:.42;transition:opacity .12s}
body.fmt-reel .cap.chunk .w.said{opacity:1}
@keyframes chunkIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
body.video #notes{display:none}
body.video #stage{cursor:none}
/* carrusel (1080×1350, recortado de y 270) y portada: estado final del paso, frase completa y sin ayudas */
body:is(.carrusel,.portada) *,body:is(.carrusel,.portada) *::before,body:is(.carrusel,.portada) *::after{animation:none!important;transition:none!important}
body:is(.carrusel,.portada) :is(#hint,#notes){display:none}
body.carrusel .cap .w{opacity:1}

/* Motor de láminas animadas.
   Modo lámina (por defecto): la escena se ve completa al entrar y lo único que se mueve es el diagrama
   (estado base `set` y, si hay `loop`, tiempos que se repiten solos).
   Modo narrado (opcional): si la escena trae `steps`, avanza paso a paso con subtítulos.
   Formato reel (DECK.format: 'reel'): escenario vertical de 1080×1920; con P o en ?video los pasos siguen la voz
   grabada (window.VOZ, de deck.py voz) o un ritmo estimado, con subtítulos en frases cortas. */
(() => {
  const D = window.DECK, S = D.scenes;
  const $ = id => document.getElementById(id);
  const stage = $('stage'), layer = $('layer'), wires = $('wires'), head = $('head'),
        cap = $('cap'), notes = $('notes'), hint = $('hint');

  const still = print || carrusel || portada || flag('still');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const reel = D.format === 'reel';
  const [W, H] = reel ? [1080, 1920] : [1600, 900];
  // tamaño por defecto de cada tipo (lo usan las conexiones y check); en reel los componentes crecen para leerse en un celular
  const DEF = reel
    ? { node: [250, 120], chip: [0, 64], metric: [400, 230], term: [875, 250], label: [400, 44], line: [0, 0], archify: [875, 400] }
    : { node: [220, 104], chip: [0, 44], metric: [290, 170], term: [440, 160], label: [300, 30], line: [0, 0], archify: [920, 700] };
  const TONE = { chip: 'blue', label: 'green', line: 'red' };
  const ATONE = { 'a-default': 'blue', 'a-emphasis': 'blue', 'a-dashed': 'violet', 'a-security': 'amber' };
  const MODES = [reel && 'fmt-reel', check && 'check', print && 'print', video && 'video', carrusel && 'carrusel', portada && 'portada'].filter(Boolean);
  let si = -1, st = 0, built = -1, navTok = 0, timer = null, loopT = null, swapT = null, reg = {}, geo = {}, reelT = [];

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const num = n => Math.round(n).toLocaleString('en-US');

  }
  const lastStep = i => S[i].steps ? S[i].steps.length - 1 : 0;
  function next() { if (S[si].steps && st < lastStep(si)) go(si, st + 1); else if (si < S.length - 1) go(si + 1, 0); else stop(); }
  function prev() { if (S[si].steps && st > 0) go(si, st - 1); else if (si > 0) go(si - 1, lastStep(si - 1)); }
  function stop() { clearTimeout(timer); timer = null; reelStop(); }
  function play() {
    if (reel) return reelPlay();   // el reel se reproduce completo con su línea de tiempo (voz o ritmo estimado)
    const sc = S[si];
    const ms = sc.steps ? 1300 + (sc.steps[st].say || '').split(/\s+/).length * 330
      : sc.dur || Math.max(10000, (sc.loop || []).reduce((n, b) => n + (b.ms || D.beat || 2600), 0) * 2);
    timer = setTimeout(() => { if (si === S.length - 1 && st === lastStep(si)) return stop(); next(); play(); }, ms);
  }
  function fullscreen() {
    try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (_) {}
  }

  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter'].includes(k)) { e.preventDefault(); stop(); next(); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); stop(); prev(); }
    else if (k === 'n' || k === 'N') notes.classList.toggle('open');
    else if (k === 'p' || k === 'P') (timer || reelT.length) ? stop() : play();
    else if (k === 'f' || k === 'F') fullscreen();
    else if (k === 'Home') { stop(); go(0, 0); }
    else if (k === 'End') { stop(); go(S.length - 1, lastStep(S.length - 1)); }
  });
  stage.addEventListener('click', e => {
    stop();
    const r = stage.getBoundingClientRect();
    (e.clientX - r.left < r.width * 0.28) ? prev() : next();
  });
  setTimeout(() => hint.classList.add('gone'), 6000);

  /* ---------- ?check: revisión automática de composición (la lee deck.py check) ---------- */
  function runCheck() {
    const report = [];
    S.forEach((sc, i) => {
      const issues = new Set();
      try {
        si = i; st = 0;
        // en un reel cambia la composición de paso a paso (la definición se encoge): se revisa cada paso
        const beats = sc.steps ? (reel ? [...sc.steps.keys()] : [sc.steps.length - 1]) : [...Array(Math.max(1, (sc.loop || []).length)).keys()];
        build(sc.steps ? null : slideState(0, false));
        for (const b of beats) {
          st = b;
          sc.steps ? paint(stepState(false), false) : paint(slideState(b, false), false);
          measure(sc, b, issues);
        }
      } catch (err) { issues.add('error: ' + err.message); }
      report.push({ slide: i + 1, tag: sc.tag, issues: [...issues] });
    });
    const pre = document.createElement('pre');
    pre.id = 'report'; pre.hidden = true; pre.textContent = JSON.stringify(report);
    document.body.append(pre);
  }
  // zona segura del reel: fuera de ella la tapan los botones, la descripción o la barra superior de la app
  const SAFE = { x0: 65, x1: 940, y0: 270, y1: 1248 };
  function measure(sc, beat, issues) {
    const R0 = stage.getBoundingClientRect(), s = R0.width / W;
    const bx = el => { const r = el.getBoundingClientRect(); return { x: (r.left - R0.left) / s, y: (r.top - R0.top) / s, w: r.width / s, h: r.height / s }; };
    const union = bs => {
      const x = Math.min(...bs.map(b => b.x)), y = Math.min(...bs.map(b => b.y));
      return { x, y, w: Math.max(...bs.map(b => b.x + b.w)) - x, h: Math.max(...bs.map(b => b.y + b.h)) - y };
    };
    const tb = el => { const rg = document.createRange(); rg.selectNodeContents(el); const r = rg.getBoundingClientRect(); return { x: (r.left - R0.left) / s, y: (r.top - R0.top) / s, w: r.width / s, h: r.height / s }; };
    const when = sc.steps ? (reel ? ` (paso ${beat + 1})` : '') : sc.loop && sc.loop.length > 1 ? ` (tiempo ${beat + 1})` : '';
    const lim = reel ? (sc.steps ? 1100 : SAFE.y1) : sc.steps ? 730 : 840, boxes = [];
    const unsafe = b => reel && (b.x < SAFE.x0 - 1 || b.x + b.w > SAFE.x1 + 1 || b.y < SAFE.y0 - 1);
    // cada línea del encabezado (tag, título, subtítulo) cuenta por separado: su rectángulo envolvente daba falsos encimados
    [...head.children].filter(n => n.textContent.trim()).forEach(n => {
      const b = tb(n);
      boxes.push({ id: 'el encabezado', b });
      if (unsafe(b)) issues.add(`el encabezado («${n.textContent.trim()}») sale de la zona segura del reel (x ${SAFE.x0}–${SAFE.x1}, y ≥ ${SAFE.y0})`);
    });
    for (const it of sc.items || []) {
      const r = reg[it.id], type = it.type || 'node';
      if (!r.el.classList.contains('on')) continue;
      let b = bx(r.el);
      if (type === 'term' && r.el.querySelector(':scope > .k')) b = union([b, bx(r.el.querySelector(':scope > .k'))]);   // la pestaña sobresale del marco
      if (type === 'archify') {
        const parts = [...r.el.querySelectorAll('g[data-node-id], path[data-composition-points], [data-graph-role], g[data-edge-id]')].map(bx).filter(p => p.w || p.h);
        if (parts.length) b = union(parts);
        const k = +r.el.dataset.k, minPx = reel ? 20 : 12;
        let min = Infinity, which = '';
        r.el.querySelectorAll('text').forEach(t => {
          if (t.dataset.detail === 'fine' || !t.textContent.trim()) return;
          const px = (+t.getAttribute('font-size') || 10) * k;
          if (px < min) { min = px; which = t.textContent.trim(); }
        });
        if (min < minPx) issues.add(`${it.id}: letra de ${min.toFixed(0)} px («${which}») a escala ${k.toFixed(2)}×; dale más espacio (w/h) o compacta el diagrama`);
        r.el.querySelectorAll('g[data-node-id]').forEach(g => {
          const box = g.querySelector('rect:not(.c-mask)');
          if (!box) return;
          const A = bx(box);
          g.querySelectorAll('text[data-node-label], text[data-detail="context"]').forEach(t => {
            if (bx(t).w > A.w - 4) issues.add(`${it.id}/${g.dataset.nodeId}: «${t.textContent.trim()}» no cabe en su caja con la fuente del tema`);
          });
        });
      } else if (reel) {
        // en un celular, menos de 22 px no se lee
        let min = Infinity, which = '';
        r.el.querySelectorAll('*').forEach(n => {
          if (!n.getClientRects().length || ![...n.childNodes].some(c => c.nodeType === 3 && c.textContent.trim())) return;
          const px = parseFloat(getComputedStyle(n).fontSize);
          if (px < min) { min = px; which = n.textContent.trim(); }
        });
        if (min < 22) issues.add(`${it.id}: letra de ${Math.round(min)} px («${which}»); en un reel el mínimo es 22 px${when}`);
      }
      if (type !== 'line') boxes.push({ id: it.id, b, it });
      if (b.y + b.h > lim + 1) issues.add(`${it.id}: termina en y=${Math.round(b.y + b.h)} y se mete ${sc.steps ? 'bajo el subtítulo' : reel ? 'bajo la descripción de la app' : 'en el pie'} (máx. ${lim})${when}`);
      if (b.x < -1 || b.y < -1 || b.x + b.w > W + 1) issues.add(`${it.id}: se sale del escenario${when}`);
      else if (unsafe(b)) issues.add(`${it.id}: sale de la zona segura del reel (x ${SAFE.x0}–${SAFE.x1}, y ≥ ${SAFE.y0})${when}`);
      // títulos y renglones de métrica van en un renglón (se miden a lo ancho); el meta se recorta a dos renglones (a lo alto)
      r.el.querySelectorAll(':scope > .t, :scope > .r, :scope > .k').forEach(t => {
        if (t.scrollWidth > t.clientWidth + 2) issues.add(`${it.id}: «${t.textContent.trim()}» no cabe a lo ancho${when}`);
      });
      r.el.querySelectorAll(':scope > .m').forEach(t => {
        if (getComputedStyle(t).overflowY !== 'visible' && t.scrollHeight > t.clientHeight + 4) issues.add(`${it.id}: «${t.textContent.trim()}» pasa de dos renglones${when}`);
      });
    }
    const area = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
    for (let i = 0; i < boxes.length; i++)
      for (let j = i + 1; j < boxes.length; j++) {
        const A = boxes[i], B = boxes[j];
        if (A.it?.over || B.it?.over || A.id === B.id) continue;
        if (area(A.b, B.b) > 24) issues.add(`${A.id} y ${B.id} se enciman${when}`);
      }
    for (const e of sc.edges || []) {
      const g = reg[e.id].el;
      if (!g.classList.contains('on') || g.classList.contains('dim')) continue;
      const p = g.querySelector('.bead'), L = p.getTotalLength();
      for (let d = 10; d < L - 10; d += 6) {
        const q = p.getPointAtLength(d);
        for (const B of boxes) {
          if (!B.it || B.id === e.from || B.id === e.to || ['label', 'line'].includes(B.it.type)) continue;
          const b = B.b;
          if (q.x > b.x + 4 && q.x < b.x + b.w - 4 && q.y > b.y + 4 && q.y < b.y + b.h - 4) issues.add(`la conexión ${e.id} atraviesa ${B.id}${when}`);
        }
      }
    }
    // etiquetas de conexiones nativas encimadas sobre un elemento, incluidos sus propios extremos (Archify valida las suyas al construir)
    for (const e of sc.edges || []) {
      const g = reg[e.id].el, lab = g.querySelector('.elab');
      if (!lab || !g.classList.contains('on') || !lab.textContent.trim()) continue;
      const T = bx(lab);
      for (const B of boxes) {
        if (!B.it || B.it.type === 'line') continue;
        if (area(T, B.b) > 12) issues.add(`la etiqueta «${lab.textContent.trim()}» de ${e.id} se encima con ${B.id}${when}`);
      }
    }
  }

  // ?still = estado final sin animaciones (capturas); #n = lámina n, #n.t = tiempo t de su loop (o paso t en narrado)
  // Antes de construir se esperan las fuentes del tema (máx. 2.5 s): el texto SVG y el recorte de los diagramas dependen de sus medidas.
  // Se cargan todas las caras declaradas de las familias del tema (cualquier grosor): check y el PDF miden al instante,
  // y una cara sin cargar (p. ej. un título en 600) se medía con la fuente de respaldo, más ancha.
  function fontsReady() {
    if (!document.fonts) return Promise.resolve();
    const cs = getComputedStyle(document.body), clean = f => f.trim().replace(/^["']|["']$/g, '');
    const names = new Set([cs.getPropertyValue('--display'), cs.getPropertyValue('--mono')].join(',').split(',').map(clean).filter(Boolean));
    const faces = [...document.fonts].filter(f => names.has(clean(f.family)));
    return Promise.race([Promise.all(faces.map(f => f.load().catch(() => null))), new Promise(r => setTimeout(r, still || check ? 6000 : 2500))]);
  }
  // ?pages = lo que leen deck.py pdf y extras: tamaño del escenario, páginas del PDF (una por lámina en el tiempo `pdf`,
  // 1 por defecto, el último paso en narradas, o todos con pdf: 'todos'; ?pages=all imprime todos los tiempos de los loops),
  // láminas del carrusel y paso de la portada
  if (flag('pages')) {
    const all = /[?&]pages=all\b/.test(location.search), out = [];
    S.forEach((sc, i) => {
      const n = sc.steps ? sc.steps.length : Math.max(1, (sc.loop || []).length);
      const every = sc.pdf === 'todos' || (all && !sc.steps);
      (every ? [...Array(n).keys()].map(k => k + 1) : [Math.min(Math.max(Math.round(+sc.pdf) || (sc.steps ? n : 1), 1), n)])
        .forEach(b => out.push(`${i + 1}.${b}`));
    });
    const pre = document.createElement('pre');
    pre.id = 'pages'; pre.hidden = true;
    pre.textContent = JSON.stringify({ size: [W, H], format: reel ? 'reel' : 'laminas', pages: out, carrusel: carruselList(),
      portada: String((D.portada || {}).paso || (S[0].steps ? '1.1' : '1')), dur: reel ? timeline().dur : null });
    document.body.append(pre);
    return;
  }
  if (still || check || video) hint.remove();
  if (check) { fontsReady().then(runCheck); return; }
  // ?video (lo usa deck.py video): el reel completo desde el segundo 0 con su línea de tiempo; el reloj lo controla la captura
  if (video) { fontsReady().then(() => { document.body.dataset.listo = '1'; reelPlay(); }); return; }
  const m = /^#(\d+)(?:\.(\d+))?$/.exec(location.hash);
  const clamp = (x, lo, hi) => Math.min(Math.max(x, lo), hi);
  const a = m ? clamp(+m[1] - 1, 0, S.length - 1) : 0;
  const nb = S[a].steps ? S[a].steps.length : Math.max(1, (S[a].loop || []).length);
  const b = m && m[2] ? clamp(+m[2] - 1, 0, nb - 1) : 0;
  fontsReady().then(() => go(a, b, !still));
})();

</script>
