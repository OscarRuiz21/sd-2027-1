<section aria-label="Lámina 22: El saldo"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title22 desc22" style="--blue:#2f6db5;--violet:#7546b3;--amber:#986008;--green:#217448;--red:#bc3433;--muted:#59666c;--line:#d6dbd8">
<title id="title22">El saldo</title><desc id="desc22">Comparación entre PostgreSQL y MongoDB para transferir dinero. La transacción relacional conserva los invariantes entre dos cuentas; MongoDB requiere una transacción multidocumento.</desc><defs></defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#f7f6f1" stroke="none" stroke-width="0"/>

<section aria-label="Lámina 23: Anillos de fraude"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title23 desc23" style="--blue:#2f6db5;--violet:#7546b3;--amber:#986008;--green:#217448;--red:#bc3433;--muted:#59666c;--line:#d6dbd8">
<title id="title23">Anillos de fraude</title><desc id="desc23">El relacional recorre transferencias con un join por salto. El grafo, una copia derivada, sigue conexiones para encontrar rutas de 3 a 6 saltos que vuelven a la cuenta.</desc><defs></defs>

<text x="1536" y="57" style="font-size:22px;fill:#59666c;font-family:Arial, Helvetica, sans-serif;font-weight:400" letter-spacing="1.6" text-anchor="end" class="small">MEXI BANCO · 2 DE 4</text>
<line x1="64" y1="82" x2="1536" y2="82" stroke="#d6dbd8" stroke-width="2"/>
<text x="64" y="170" style="font-size:78px;fill:#202b33;font-family:Arial, Helvetica, sans-serif;font-weight:700" letter-spacing="-3">Anillos de fraude</text>

<text x="66" y="269" style="font-size:30px;fill:#202b33;font-family:Arial, Helvetica, sans-serif;font-weight:400" class="body">Anillo: el dinero sale de una cuenta y vuelve a ella en 3 a 6 saltos dentro de 24 h.</text>

<text x="132" y="411" style="font-size:22px;fill:#59666c;font-family:Arial, Helvetica, sans-serif;font-weight:700">PostgreSQL</text>

<text x="94" y="452" style="font-size:22px;fill:#202b33;font-family:Menlo, Consolas, &#x27;Courier New&#x27;, monospace;font-weight:400" xml:space="preserve">WITH RECURSIVE r(cta, n) AS (</text>
<text x="94" y="482" style="font-size:22px;fill:#202b33;font-family:Menlo, Consolas, &#x27;Courier New&#x27;, monospace;font-weight:400" xml:space="preserve">  SELECT :clabe, 0</text>
<text x="94" y="512" style="font-size:22px;fill:#202b33;font-family:Menlo, Consolas, &#x27;Courier New&#x27;, monospace;font-weight:400" xml:space="preserve">  UNION ALL</text>
<text x="94" y="542" style="font-size:22px;fill:#202b33;font-family:Menlo, Consolas, &#x27;Courier New&#x27;, monospace;font-weight:400" xml:space="preserve">  SELECT t.destino, r.n + 1</text>
<rect x="84" y="552" width="674" height="28" rx="0" fill="#f6ecd8" stroke="none" stroke-width="0"/>
<text x="94" y="572" style="font-size:22px;fill:#202b33;font-family:Menlo, Consolas, &#x27;Courier New&#x27;, monospace;font-weight:400" xml:space="preserve">  FROM r JOIN transferencia t ON t.origen = r.cta</text>
<text x="94" y="602" style="font-size:22px;fill:#202b33;font-family:Menlo, Consolas, &#x27;Courier New&#x27;, monospace;font-weight:400" xml:space="preserve">  WHERE r.n &lt; 6</text>
<text x="750" y="602" style="font-size:20px;fill:#986008;font-family:Arial, Helvetica, sans-serif;font-weight:700" text-anchor="end">↑ un join por salto, hasta 6</text>
<text x="94" y="632" style="font-size:22px;fill:#202b33;font-family:Menlo, Consolas, &#x27;Courier New&#x27;, monospace;font-weight:400" xml:space="preserve">    AND t.ts &gt; now() - interval &#x27;24 hours&#x27;)</text>
<text x="94" y="662" style="font-size:22px;fill:#202b33;font-family:Menlo, Consolas, &#x27;Courier New&#x27;, monospace;font-weight:400" xml:space="preserve">SELECT count(*) FROM r</text>
<text x="94" y="692" style="font-size:22px;fill:#202b33;font-family:Menlo, Consolas, &#x27;Courier New&#x27;, monospace;font-weight:400" xml:space="preserve">WHERE cta = :clabe AND n &gt;= 3;</text>
<text x="86" y="744" style="font-size:24px;fill:#bc3433;font-family:Arial, Helvetica, sans-serif;font-weight:700">✗ De 3 a 6 saltos: un join por salto</text>

<rect x="1359.90625" y="380" width="154.09375" height="32" rx="8" fill="#e5eefb" stroke="#2f6db5" stroke-width="2"/>
<text x="1371.90625" y="402" style="font-size:20px;fill:#2f6db5;font-family:Arial, Helvetica, sans-serif;font-weight:400">copia derivada</text>
<rect x="844" y="422" width="674" height="166" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="1.5"/>
<text x="864" y="452" style="font-size:22px;fill:#202b33;font-family:Menlo, Consolas, &#x27;Courier New&#x27;, monospace;font-weight:400" xml:space="preserve">MATCH ruta = (c:Cuenta {clabe: $clabe})</text>
<rect x="850" y="462" width="662" height="28" rx="0" fill="#e5eefb" stroke="none" stroke-width="0"/>
<text x="864" y="482" style="font-size:22px;fill:#202b33;font-family:Menlo, Consolas, &#x27;Courier New&#x27;, monospace;font-weight:400" xml:space="preserve">  -[:TRANSFIRIO*3..6]-&gt;(c)</text>
<text x="1504" y="482" style="font-size:20px;fill:#2f6db5;font-family:Arial, Helvetica, sans-serif;font-weight:700" text-anchor="end">3 a 6 saltos, de vuelta a c</text>
<text x="864" y="512" style="font-size:22px;fill:#202b33;font-family:Menlo, Consolas, &#x27;Courier New&#x27;, monospace;font-weight:400" xml:space="preserve">WHERE all(t IN relationships(ruta)</text>
<text x="864" y="542" style="font-size:22px;fill:#202b33;font-family:Menlo, Consolas, &#x27;Courier New&#x27;, monospace;font-weight:400" xml:space="preserve">  WHERE t.ts &gt; datetime() - duration(&#x27;P1D&#x27;))</text>

<section aria-label="Lámina 24: Boletos que expiran"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title24 desc24" style="--blue:#2f6db5;--violet:#7546b3;--amber:#986008;--green:#217448;--red:#bc3433;--muted:#59666c;--line:#d6dbd8">
<title id="title24">Boletos que expiran</title><desc id="desc24">Redis confirma una reserva, pierde la llave durante un failover y permite un segundo dueño. PostgreSQL usa un índice UNIQUE y solo reemplaza una reserva vencida.</desc><defs></defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#f7f6f1" stroke="none" stroke-width="0"/>
<text x="64" y="57" style="font-size:22px;fill:#202b33;font-family:Arial, Helvetica, sans-serif;font-weight:400" letter-spacing="1.6" class="small">24 / UNO CONTRA OTRO</text>
<text x="1536" y="57" style="font-size:22px;fill:#59666c;font-family:Arial, Helvetica, sans-serif;font-weight:400" letter-spacing="1.6" text-anchor="end" class="small">PROYECTOS · 3 DE 4</text>

<text x="66" y="218" style="font-size:36px;fill:#59666c;font-family:Arial, Helvetica, sans-serif;font-weight:400">¿El TTL de Redis o <tspan style="font-family:Menlo, Consolas, &#x27;Courier New&#x27;, monospace;font-size:30px;">UNIQUE (evento, asiento)</tspan>?</text>
<text x="66" y="269" style="font-size:30px;fill:#202b33;font-family:Arial, Helvetica, sans-serif;font-weight:400" class="body">Apartar un asiento 10 minutos: si no pagas se libera, y nunca puede tener dos dueños.</text>

<text x="132" y="411" style="font-size:22px;fill:#59666c;font-family:Arial, Helvetica, sans-serif;font-weight:700">Redis</text>

<section aria-label="Lámina 28: Dónde vive"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title28 desc28" style="--blue:#2f6db5;--violet:#7546b3;--amber:#986008;--green:#217448;--red:#bc3433;--muted:#59666c;--line:#d6dbd8">
<title id="title28">Dónde vive</title><desc id="desc28">Seis capas de caché muestran quién las invalida. Caffeine mantiene tres copias locales, una vieja y otra vacía; Redis comparte una copia entre tres réplicas a 0.5 ms de red y añade un componente que puede fallar.</desc><defs>

<section aria-label="Lámina 36: Qué no se cachea en Mexi Banco"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title36 desc36" style="--blue:#2f6db5;--violet:#7546b3;--amber:#986008;--green:#217448;--red:#bc3433;--muted:#59666c;--line:#d6dbd8">
<title id="title36">Qué no se cachea en Mexi Banco</title><desc id="desc36">Tabla de cinco decisiones para Mexi Banco: autorizar saldo en la base con UPDATE condicional; cachear saldo para mostrar y catálogo SPEI; proteger idempotencia y sesiones; evitar caché de respuestas autenticadas en CDN. El caso Steam de 2015 afectó páginas de unos 34 000 usuarios.</desc><defs>

scripts.push(...["Qué decir:\n\n\"Hoy toda la clase gira alrededor de una pregunta: ¿dónde vive cada dato, y qué pasa cuando vive en más de un lugar?\n\nEn la figura, el saldo de una cuenta de Mexi Banco: la verdad vive en el ledger, en PostgreSQL. Alrededor hay copias, cada una por una razón: la caché para leer rápido, el índice para buscar, el grafo para recorrer relaciones y el blockchain, que es una copia que todos pueden verificar.\n\nFíjense en la caché: dice $1 500 y la verdad dice $1 000. Esa diferencia es la clase de hoy.\n\nEl recorrido: primero, por qué usar varias bases; luego, qué significa de verdad SQL contra NoSQL; las familias; la caché; y el blockchain visto como una base de datos más.\"\n\nPregunta para el grupo: \"¿En cuántos lugares creen que vive su saldo cuando lo ven en la app del banco?\"\n\nTransición: \"Empecemos por la primera mitad de la pregunta: ¿dónde vive cada dato?\"\n\nFuente:\n\nEl hilo \"una verdad, varias copias\" es de contexto-clase.md.\n\nLa composición (un objeto central rodeado de nodos) sigue la portada de la S10, que viene de Systemic Stack ep. 40.\n\nLos montos $1 000 y $1 500 son ilustrativos.\n\nDato para quien pregunte: hoy el paper de Nakamoto cumple 18 años (31-oct-2008). Se usa en el bloque 6.", "Qué decir:\n\n\"¿Dónde vive cada dato? Donde mejor sirve a cómo se usa. No clavas con desarmador ni atornillas con martillo.\n\nFowler cuenta de un equipo que solo buscaba elementos de página por su ID, sin transacciones y sin compartir la base. Dice que ese problema 'se resuelve mucho mejor con un almacén clave-valor que con el martillo relacional corporativo que tuvieron que usar'.\n\nEl nombre viene de la programación políglota de Neal Ford (2006): 'elegir el lenguaje correcto para el trabajo puede ser más productivo que intentar meter todo en un solo lenguaje'. Fowler lo pasa a los datos: primero preguntamos cómo queremos manipular el dato, y solo después qué tecnología conviene.\"\n\nMexi Banco: el ledger necesita transacción y UNIQUE, que es la herramienta de precisión. El saldo que se muestra se lee por CLABE a cada rato y puede ir un poco atrás: eso es Redis.\n\nPreguntas para el grupo:\n\n\"¿Qué dato de Mexi Banco se lee muchísimo más de lo que se escribe?\" Respuesta: el saldo que se muestra.\n\n\"¿Alguien ha visto un proyecto donde hasta las sesiones viven en la base relacional?\"\n\nAnalogías alternas, por si alguien las trae:\n\n\"No lleves un cuchillo a un tiroteo\" (Programación y más, 00:25). Sugiere que siempre gana lo más potente, y en datos gana lo suficiente.\n\nLa flotilla de Data Decoded (05:56): un Ferrari fuera de camino o un camión de mudanza en Fórmula 1. Su límite es que los vehículos no llevan la misma carga a la vez.\n\nDónde se rompe la caja de herramientas se ve en la lámina de lo que cuesta.\n\nTransición: \"Si cada dato pide su herramienta, ¿por qué no existe una base que lo haga todo bien?\"\n\nFuentes:\n\nFowler, PolyglotPersistence, bliki, 16-nov-2011, con la cita del \"corporate relational hammer\". Su nota 1 dice que Scott Leberknight fue el primero en usar el término.\n\nFord (2006), vía el bliki y NoSQL Distilled, p. 133.\n\nLa metáfora también está en Programación y más (00:00), CodeLucky (00:51) y Data Decoded (04:15).\n\n[VERIFICAR: la paráfrasis del equipo de Fowler (\"solo leía páginas por su ID\") sale de la consolidación, que lo resume como \"solo buscaba elementos de página por ID\" · cotejar la redacción con el bliki antes de leerla en voz alta.]\n\n[VERIFICAR: la \"ley del martillo\" de Maslow (1966) · solo si alguien la menciona; viene de memoria.]\n\nQuitado de la lámina (dilo si sirve): Se elige por el trabajo que hace el dato, no por costumbre. Un equipo solo leía páginas por su ID, sin transacciones ni base compartida. Original en inglés: \"the corporate relational hammer\" (Fowler, 2011). En Mexi Banco, el ledger guarda cuenta y movimiento y usa UNIQUE contra duplicados; el saldo para mostrar se lee con GET /cuentas/{clabe} y es una copia rápida por CLABE.", "Qué decir:\n\n\"BettaTech lo dice directo: no existe una base que sea la mejor en todo. NoSQL Distilled lo explica así: guardar transacciones, cachear sesiones y recorrer el grafo de lo que compraron los amigos de un cliente son problemas esencialmente distintos.\n\nCada motor contestó de antemano tres preguntas: cómo se escribe, cómo se lee y qué se garantiza.\n\nEl ejemplo más chico es un índice. Sin él, buscar una CLABE entre un millón es leer el millón. Con él, bajas unos cuantos nodos de un árbol B. Pero cada inserción ahora escribe en dos lados: en la tabla y en el índice. Codd ya lo decía en 1970.\n\nY el índice es justo una copia derivada de una columna: el hilo de hoy aparece desde aquí. Un motor es un paquete de cientos de decisiones como esta.\"\n\nMexi Banco: en diseno.md el mismo dominio tiene siete requisitos distintos.\n\nEl ledger es linealizable y el saldo es derivado y puede ir atrás.\n\nLa autorización de tarjeta tiene que tardar menos de 100 ms.\n\nLa notificación es best-effort y el estado de cuenta tolera 24 h.\n\nEl antifraude es asíncrono y el SPEI es externo e irreversible.\n\nPreguntas para el grupo:\n\n\"La tabla de movimientos recibe muchísimas inserciones y casi nunca se busca por monto. ¿Le ponen índice al monto?\" Respuesta: no; cada índice encarece cada inserción.\n\n\"¿Cuál de las tres preguntas es la que más pesa para el ledger?\" Respuesta: qué se garantiza.\n\nTransición: \"Si cada dato contesta distinto las tres preguntas, ¿cómo se ve una aplicación que le da a cada uno su almacén? Fowler la dibujó.\"\n\nFuentes:\n\nBettaTech, 06:54 (\"no existe una base de datos que sea la mejor en todo\"), 14:40 (buscar el usuario 1 entre un millón y el árbol B, fotograma t001540.jpg) y 15:55 (los índices hacen más lenta la escritura).\n\nCodd, A Relational Model of Data for Large Shared Data Banks, CACM 13(6), 1970, §1.2.2: un índice \"tends to improve response to queries and updates and, at the same time, slow down response to insertions and deletions\".\n\nSadalage y Fowler, NoSQL Distilled, cap. 13, p. 133.\n\nEl ejemplo con CLABE es la versión Mexi Banco del usuario 1 de BettaTech.\n\nQuitado de la lámina (dilo si sirve): Lo que abarata una operación encarece otra: no hay base que gane en todo. ¿Cómo se escribe?: volumen, solo inserción o en el lugar, ráfagas. ¿Cómo se lee?: clave, rango, ad hoc, relaciones, texto, agregados. ¿Qué se garantiza?: transacción, consistencia, durabilidad. Un motor es un paquete de respuestas ya tomadas. Codd, 1970: mejora consultas, frena inserciones y borrados.", "Qué decir:\n\n\"Esta es la figura de la lectura: ocho datos de una tienda en línea y seis motores distintos. Los datos financieros y los reportes van en RDBMS; las sesiones, en Redis; el carrito, en un clave-valor; las recomendaciones, en un grafo; el catálogo, en documentos; la analítica y las bitácoras de actividad, en Cassandra.\n\nFowler mismo pone una nota al pie. Se las leo traducida: 'No tomen demasiado en serio el ejemplo del diagrama. No estoy recomendando qué tecnología de base de datos usar para qué tipo de servicio. Pero sí creo que la gente debería considerar este tipo de tecnologías como parte de la arquitectura de la aplicación.'\n\nLos chips de color son nuestra lectura, no la de Fowler: unos datos son la verdad, otros se derivan de ellos y otros se pueden perder sin drama.\"\n\nSi alguien pregunta por la versión del libro: NoSQL Distilled (cap. 13, figs. 13.1 a 13.3) cuenta la misma tienda como evolución.\n\nPrimero todo vive en un RDBMS.\n\nDespués el carrito y la sesión pasan a clave-valor, porque se acceden por ID de usuario y de sesión y son datos transitorios.\n\nAl final los pedidos completados van a un almacén de documentos, el inventario y el precio se quedan en el RDBMS legado y un grafo atiende \"tus amigos también compraron\".\n\nEl libro manda los pedidos a documentos; el bliki manda los datos financieros a RDBMS. Por eso la lección es la pregunta, no la marca.\n\nPreguntas para el grupo:\n\n\"¿Por qué el carrito no va en la misma base que los datos financieros?\" Respuesta: se accede por ID de usuario, es transitorio y tiene que estar siempre disponible (NoSQL Distilled, §13.2).\n\n\"¿Qué tiles se pueden reconstruir si se pierden?\" Respuesta: reportes, analítica y recomendaciones, porque se derivan de otros datos.\n\nTransición: \"Todo esto es una sola aplicación. Entonces, ¿políglota es lo mismo que microservicios con una base cada uno?\"\n\nFuentes:\n\nFowler, PolyglotPersistence (2011), figura \"Speculative Retailers Web Application\" (fuentes/img/fowler-2011-speculative-retailer.png) y nota 2: \"Don't take the example in the diagram too seriously. I'm not making any recommendations about which database technology to use for what kind of service. But I do think that people should consider these kinds of technologies as part of application architecture.\"\n\nNoSQL Distilled, figs. 13.1 a 13.3 (pp. 134 y 135).\n\nCodeLucky (07:21) reproduce casi tal cual el ejemplo del libro, pero con cifras sin fuente. No se usan.\n\n[VERIFICAR: qué dato alimenta a cada derivado (reportes a partir de los datos financieros; analítica y recomendaciones a partir de la bitácora de actividad) · es interpretación nuestra, Fowler no dibuja flechas. Por eso la lámina no las dibuja.]\n\nQuitado de la lámina (dilo si sirve): La figura del bliki de Fowler (2011): una tienda en línea con ocho datos y seis motores. Título de la figura: Speculative Retailers Web Application (una tienda hipotética). Nombres originales de las cajas: User sessions, Financial Data, Shopping Cart, Recommendations, Product Catalog, Reporting, Analytics, User activity logs. De su nota 2: no dice qué motor usar para qué; pide considerarlos en la arquitectura. Encabezado de la leyenda: \"Cómo leerla hoy\".\n\nQuitado de la lámina (dilo si sirve): SU NOTA 2.", "Qué decir:\n\n\"En la S04 vimos 'cada servicio dueño de su almacén'. Eso es propiedad: nadie más toca mi base. Políglota es otra pregunta: cuántos motores distintos hay.\n\nMexi Banco es el ejemplo perfecto. En la v05 era un monolito con un PostgreSQL. En la v06a lo partimos: cuentas y transferencias tienen cada uno su PostgreSQL. Cambió el dueño y no cambió el motor, así que no es políglota.\n\nY al revés: un monolito puede ser políglota. Fowler dice que el efecto políglota aparece 'incluso dentro de una sola aplicación'.\"\n\nLo que las une: NoSQL Distilled §13.3 propone envolver cada almacén en un servicio. \"Encapsular el acceso a datos en servicios reduce el impacto de elegir un motor en el resto del sistema\" (§13.8).\n\nPreguntas para el grupo:\n\n\"Si cuentas guarda además el saldo en Redis, ¿en qué cuadro cae Mexi Banco?\" Respuesta: abajo a la derecha. Hay dos motores y los dos son de cuentas.\n\n\"¿En qué cuadro está el proyecto de su equipo hoy?\"\n\nTransición: \"Moverse a la derecha de la matriz no es gratis. ¿Qué se paga?\"\n\nFuentes:\n\nConsolidación, §5.4.\n\nFowler (2011): \"This polyglot affect will be apparent even within a single application\".\n\nNoSQL Distilled, figs. 13.3 y 13.5 y Key Points (p. 140).\n\nmaterias/sd/mexi-banco-evolucion.md: v05, un monolito; v06a, cuentas-service (Postgres), transferencias-service (su propia Postgres) y notificaciones-service (stub).\n\n[VERIFICAR: que la base del monolito v05 es PostgreSQL · mexi-banco-evolucion.md solo dice \"db y app en compose\".]\n\nQuitado de la lámina (dilo si sirve): Una base por servicio habla de propiedad: quién puede tocar esos datos. Políglota habla de tecnología: cuántos motores distintos hay. Son ejes independientes. Monolito v05: un dueño, un motor. Monolito políglota: una aplicación, varios motores. En Mexi Banco v06a, notificaciones es un stub, sin base. Dueños separados, un solo motor: no es políglota. Servicios políglotas: como la fig. 13.5 de NoSQL Distilled.", "Qué decir:\n\n\"Aquí la caja de herramientas deja de servir. El clavo no tiene que coincidir con el tornillo, pero el mismo cliente vive en el ledger y en la caché, y las dos copias tienen que coincidir. Fowler lo dice así: el punto único de verdad transaccional deja de mandar.\n\nPrimer costo: ninguna transacción abarca dos almacenes. No hay un @Transactional que cubra PostgreSQL y Redis. Eso se paga con lo que ya vimos: una sola fuente de verdad, Outbox para la doble escritura y saga cuando el invariante cruza servicios.\n\nSegundo: cada motor hay que operarlo todos los días. NoSQL Distilled dice que la aplicación necesita todas sus bases en producción al mismo tiempo, y también en UAT, QA y Dev.\n\nTercero: si una petición necesita cuatro almacenes al 99.9 %, queda en 0.999⁴, más o menos 99.6 %. Se pasa de unos 43 minutos de caída al mes a unas 2.9 horas.\n\nCuarto, los antipatrones: volverse políglota antes de conocer cómo se accede a los datos, y meter un motor nuevo por una mejora menor.\"\n\nMexi Banco: la transferencia confirma en PostgreSQL y después borra saldo:{clabe} en Redis. Si ese borrado se pierde, el saldo viejo vive hasta que venza el TTL. Es el hito F3 de v09: provocar el saldo viejo a propósito.\n\nPreguntas para el grupo:\n\n\"¿Qué pasa si el proceso se cae entre el COMMIT en PostgreSQL y el DEL en Redis?\" Respuesta: el saldo viejo vive hasta el TTL.\n\n\"Si transferir toca PostgreSQL, Redis y el broker, cada uno al 99.9 %, ¿cuánto da la transferencia?\" Respuesta: 0.999³ ≈ 99.7 %.\n\nMatices para quien pregunte:\n\nCodeLucky presenta la políglota como resiliencia (03:01). Solo lo es si el almacén que se cae es prescindible y se aísla con circuit breaker o bulkhead (S08). Si la petición necesita los cuatro, la disponibilidad baja.\n\nRachoork agrega otros dos antipatrones: la abstracción pobre (detalles del motor regados por toda la app) e ignorar el costo operativo. También muestra un respaldo \"coordinado\" que no es consistente: pg_dump y luego mongodump, mientras el sistema sigue escribiendo. Es otra cara del mismo costo.\n\n\"¿Redis es base o caché?\" Puede ser las dos y puede persistir, pero no como la fuente de verdad del dinero (libro, Cap. 10, §7.6).\n\nTransición:\n\nCon tiempo, a la válvula: \"Entonces, ¿cuándo sí vale la pena?\"\n\nSi se salta la válvula, di la regla de viva voz y abre el bloque 2: \"La regla corta: relacional por defecto, y un motor nuevo cuando puedas nombrar la métrica que falla. Entonces, ¿qué significa de verdad SQL contra NoSQL?\"\n\nFuentes:\n\nFowler (2011): \"The transactional single point of truth will no longer hold sway (although its role as such has often been illusory)\" y \"Each data storage mechanism introduces a new interface to be learned\".\n\nNoSQL Distilled §13.4 (\"as long as we ensure that the application can deal with stale data\"), §13.6 (los DBA \"more poly-skilled\") y §13.7 (\"The application now needs all databases in production at the same time\").\n\nLos antipatrones son del artículo de Rachoork en Medium (fuentes/05-medium-rachoork.md). Sus cifras del \"caso real\" no van.\n\nLa disponibilidad es cálculo propio sobre un mes de 30 días (43 200 min):\n\n0.1 % de caída son 43.2 min.\n\n1 - 0.999⁴ = 0.003994, que son 172.5 min, unas 2.9 h.\n\nSupone almacenes independientes y una petición que necesita los cuatro.\n\n[VERIFICAR: Spring Data Redis puede \"unirse\" a una transacción de Spring con setEnableTransactionSupport(true), pero solo encola los comandos en MULTI/EXEC al hacer commit; no es atómico con PostgreSQL · si alguien pregunta, la respuesta es que sigue sin haber una transacción común.]\n\nQuitado de la lámina (dilo si sirve): El mismo cliente vive en varios almacenes, y sus copias tienen que coincidir. Dónde se rompe la analogía: las herramientas, cada una hace su trabajo, sola; las bases guardan el mismo dato en dos lugares, que tienen que coincidir. Operación: respaldos, parches, monitoreo y guardias × N motores, en producción, QA y Dev.", "Qué decir:\n\n\"Fowler pone condiciones que los videos se saltan: solo en proyectos estratégicos, y por dos motivos, reducir la fricción de desarrollo o atender necesidades intensas de datos. Y aun así escribe: 'muchos proyectos, probablemente la mayoría, están mejor quedándose con la ortodoxia relacional. Pero la minoría que no debería es significativa.'\n\nLa regla para su proyecto: relacional por defecto, y un motor nuevo solo cuando puedan nombrar la métrica que falla y el beneficio pague lo que vimos en la lámina anterior.\n\nEn Mexi Banco la autorización de tarjeta tiene que tardar menos de 100 ms y el estado de cuenta tolera 24 h: son requisitos de órdenes de magnitud distintos dentro del mismo banco.\"\n\nAnécdota de apoyo, sin cifras: en Data Decoded (06:48), un fundador migra de un clave-valor gestionado (DynamoDB) a SQL y dice \"My refactor is a major simplification\". A veces lo correcto es una base menos.\n\nSi preguntan \"¿y si elegí mal?\": se migra, y cuesta. Uber dejó PostgreSQL por MySQL en 2016. Por eso conviene esconder el acceso detrás de servicios y repositorios (NoSQL Distilled, §13.3).\n\nTransición al bloque 2: \"Relacional por defecto, de acuerdo. Pero entonces, ¿qué significa de verdad SQL contra NoSQL? Spoiler: no es el lenguaje de consulta.\"\n\nFuentes:\n\nFowler (2011): \"you should only consider projects that are at the strategic end of the UtilityVsStrategicDichotomy\", \"either reducing development drag or dealing with intensive data needs\" y \"many projects, probably a majority, are better off sticking with the relational orthodoxy. But the minority that shouldn't is a significant one.\"\n\nNoSQL Distilled, cap. 15, §15.3 Sticking with the Default.\n\nRachoork (Medium), \"cuándo sí adoptarla\": modelos muy distintos, rendimiento que difiere en órdenes de magnitud, escalas heterogéneas y madurez operativa.\n\ndiseno.md: autorización de tarjeta en menos de 100 ms y estado de cuenta con 24 h de retraso aceptable.\n\nKlitzke, Uber Engineering, 26-jul-2016.\n\n[VERIFICAR: \"p99\" en el chip es nuestro · diseno.md dice \"menos de 100 ms\" sin percentil; la consolidación propone preguntar \"¿en qué percentil?\".]\n\nQuitado de la lámina (dilo si sirve): Fowler: solo en proyectos estratégicos, por fricción de desarrollo o datos intensos. ¿Es un proyecto estratégico?: fricción de desarrollo o datos intensos. ¿El beneficio paga el costo?: operación, consistencia y disponibilidad. El motor nuevo va detrás de un servicio: su API esconde el motor al resto del sistema. Relacional por defecto: lo que ya sabes operar. Señales de que sí (Rachoork): modelos de datos muy distintos, como tablas, documentos y grafos juntos; escalas heterogéneas, porque unos datos crecen mucho más que otros; y un equipo que ya opera varios motores, con respaldos, guardias y monitoreo.", "Qué decir: \"Quitemos lo que no es: no es el lenguaje, porque Cassandra tiene CQL, que parece SQL y no es relacional. Tampoco es la velocidad. Son dos cosas. Primero, el modelo: tablas normalizadas que reúnes al leer, o un agregado que guardas armado. Segundo, el patrón de acceso: lo relacional te perdona no saber qué vas a preguntar mañana, y NoSQL es rapidísimo para lo que diseñaste y caro para lo demás. La guía oficial de DynamoDB lo dice igual: no diseñes el esquema hasta saber qué preguntas va a contestar.\"\n\nPrecisión: Sadalage y Fowler llaman a clave-valor, documentos y columnas anchas \"aggregate-oriented\". El agregado es la unidad de lectura, de atomicidad y de reparto. Los grafos también son NoSQL, pero no son agregados; van en el bloque 3.\n\nSi sale la contradicción entre videos: Programación y más (03:49) dice \"si no sabes cómo está estructurada tu información, usa documentos\", y Data Decoded dice que si no conoces tus consultas, SQL perdona. Se reconcilian así:\n\nSi lo que no conoces es la forma de cada registro, el documento da flexibilidad.\n\nSi lo que no conoces son las preguntas, conviene lo relacional.\n\nEn un banco las preguntas cambian (auditoría, reportes, reguladores), así que gana lo relacional.\n\nPreguntas para el grupo:\n\n\"¿Qué consultas de Mexi Banco conocemos hoy?\" (saldo por CLABE, movimientos de una cuenta).\n\n\"Si mañana el regulador pide 'todas las transferencias de más de $50,000 hacia cuentas abiertas este mes', ¿qué modelo te perdona?\"\n\nTransición: \"El primer eje concreto: si NoSQL 'no tiene esquema', ¿dónde quedó el esquema?\"\n\nFuentes:\n\nData Decoded, 03:00 a 03:25: \"SQL databases like Aurora, they're forgiving. You don't have to know every single question [...] NoSQL databases like DynamoDB [...] incredibly fast and cheap for the things you plan for, but you have to plan for them perfectly\". El video lo generó NotebookLM y es fuente terciaria. La primaria es AWS.\n\nAWS, NoSQL design for DynamoDB: \"you shouldn't start designing your schema for DynamoDB until you know the questions it will need to answer\". También: \"For an RDBMS, you can go ahead and create a normalized data model without thinking about access patterns\". Y: \"data can be queried efficiently in a limited number of ways, outside of which queries can be expensive and slow\".\n\nNoSQL Distilled, cap. 2 (aggregate-oriented).\n\nBettaTech, 03:54: SQL no es sinónimo de relacional.\n\nQuitado de la lámina (dilo si sirve): «Tablas normalizadas, unidas con joins al leer»; «unidas por llaves foráneas»; «el agregado se lee y se reparte entero»; la cita «SQL perdona no conocer tus consultas; NoSQL es rápido para lo que planeaste» (Data Decoded, 03:00, paráfrasis); la cita «You shouldn't start designing your schema for DynamoDB until you know the questions it will need to answer» (AWS, NoSQL design for DynamoDB).", "Qué decir: \"Los videos dicen 'insertas y te olvidas' o 'no tienen esquema'. Kleppmann dice que 'schemaless' engaña. El término correcto es esquema al leer: la estructura está implícita y se interpreta cuando lees. Ustedes que vienen de Java ya lo conocen. El esquema al escribir es el compilador que no te deja asignar un String a un int. El esquema al leer es el lenguaje dinámico que truena, o no truena, cuando ya está corriendo. Miren el mismo RFC de 14 caracteres: PostgreSQL lo rechaza en la puerta, MongoDB lo guarda, y ahora el if de Java es el esquema.\"\n\nPrecisiones:\n\nAgregar una columna sin DEFAULT nunca reescribió la tabla en PostgreSQL. Desde PostgreSQL 11, tampoco con un DEFAULT constante (notas de versión de PostgreSQL 11, 18-oct-2018). Las filas viejas ven rfc_titular en NULL.\n\nEn el documento, migrar poco a poco es la \"Incremental Migration\" de NoSQL Distilled, §12.3.1, p. 130: el código acepta las dos formas y reescribe cuando toca.\n\nMongoDB también puede validar con $jsonSchema (desde la 3.6 [VERIFICAR: sale de un anuncio de MongoDB, no de las notas de versión]). Cassandra declara sus tablas tipadas en CQL. Esto se retoma en la lámina de mitos.\n\nEn Mexi Banco: un cambio en cuenta es una migración versionada en el repo. Si el saldo cacheado en Redis cambia de forma, el código que lo lee tiene que aceptar las dos formas mientras dure el TTL.\n\nPreguntas para el grupo:\n\n\"¿Qué prefieren: que el error salga al guardar o al leer, quizá meses después?\"\n\n\"¿En dónde vive el esquema de MongoDB en un equipo de 10 personas?\" (en el código de todos los que leen).\n\nTransición: \"Ya sabemos dónde vive la forma del dato. Ahora, ¿el dato vive en un lugar o en muchos?\"\n\nFuentes:\n\nKleppmann, DDIA, cap. 2: \"Document databases are sometimes called schemaless, but that's misleading [...] A more accurate term is schema-on-read\" (vía cita secundaria). [VERIFICAR: la comparación con el tipado estático y el dinámico está en el mismo capítulo · confirmada solo vía secundaria.]\n\nVideos que lo dicen mal: BettaTech, 04:45; Programación y más, 02:06 y 02:58; Vida MRR, 00:25; CodeLucky, 01:17.\n\nEl mensaje real de PostgreSQL lleva dos espacios después de \"ERROR:\". En la lámina va con uno.\n\nEjemplo aprobado: la entidad de Mexi Banco es cuenta, con titular. Se agrega rfc_titular; en MongoDB la colección es cuentas y el código Java usa doc.getString(\"rfc_titular\"). Luis usa _id \"014180655091234560\" y Ana \"014180655091234567\". Se dividieron las instrucciones y el mensaje de error en renglones sin abreviar el código.\n\nQuitado de la lámina (dilo si sirve): «El esquema existe en los dos casos; cambia dónde se hace cumplir.»; del lado de PostgreSQL, «se revisa antes de correr»; del lado de MongoDB, «se revisa al ejecutar».", "Qué decir: \"Es la tabla de BettaTech. Alice tiene dos pedidos y su correo va copiado en los dos. Cambia el correo, alguien actualiza una fila, y ahora la base tiene dos verdades: ¿cuál es el correo de Alice? Normalizar es sacar el correo a cliente: una sola copia y una escritura, y al leer pagas un join. Escálenlo: con 10,000 movimientos y el correo embebido en cada uno, son 10,000 escrituras contra una. Pero BettaTech remata al revés: en DynamoDB a veces conviene repetir datos para leer rápido. Copiar no es pecado. Es una decisión que tomas cuando conoces la consulta, y es justo el hilo de hoy: una verdad y varias copias.\"\n\nPrecisión importante: copiar es lo correcto cuando el valor es histórico. El monto de cada movimiento o el precio en el momento de la venta no deben seguir al dato actual. Si el precio solo viviera en producto, cambiarlo reescribiría el pasado. Eso no es desnormalizar por velocidad: es otro dato.\n\nEn Mexi Banco: el ledger va normalizado (cuenta y movimiento). El estado de cuenta, que tolera 24 h de retraso, es un documento desnormalizado que se arma por lotes. El saldo en Redis es una copia derivada.\n\nPreguntas para el grupo:\n\n\"Si Alice cambia su correo, ¿cuántas filas hay que tocar en la tabla de la izquierda?\"\n\n\"En Mexi Banco, ¿el nombre del titular debería ir copiado en cada movimiento?\" (Depende de para qué: en el estado de cuenta, sí; en el ledger, no.)\n\nAviso para Oscar: en BettaTech, la pantalla de las formas normales (17:12) dice \"1NF: eliminar datos repetidos\". Eso no es la 1FN: la 1FN pide valores atómicos, y quitar la redundancia es cosa de la 2FN y la 3FN. No lo repitas si pones el video. La tabla de la lámina se queda en la idea de la 3FN, sin nombrar formas.\n\nTransición: \"Normalizar o copiar es una decisión sobre el dato. Ahora, ¿qué garantías da la base cuando escribes?\"\n\nFuentes:\n\nBettaTech, 17:38 (tabla inicial, fotograma t001736) y 18:03 (la anomalía con aliceNEW@ej.com, fotograma t001812).\n\nBettaTech desde el 20:29: la dependencia transitiva del email (t002050), la 3FN con clientes C1 y C2 en el 21:04 (t002122), \"en DynamoDB es a veces preferible tener datos repetidos\" en el 21:30 y \"ten en cuenta qué queries quieres hacer\" en el 24:00.\n\nProgramación y más, 02:58 a 03:24: normalizado contra desnormalizado (t000334).\n\nAWS: \"a NoSQL database organizes data so that its shape in the database corresponds with what will be queried\".\n\nMongoDB, Transactions: \"the denormalized data model (embedded documents and arrays) will continue to be optimal\".\n\nEl escalado a 10,000 movimientos es un cálculo propio sobre el ejemplo, no está en el video.\n\nQuitado de la lámina (dilo si sirve): «Desnormalizar: lo que se lee junto se guarda junto, y cada copia se escribe aparte.»; los rótulos completos «DESNORMALIZADO: EL CORREO VA EN CADA PEDIDO» y «NORMALIZADO: EL CORREO VIVE EN CLIENTE»; «✓ Cambiar el correo: 1 escritura»; «Costo: leer el pedido con su correo pide un join» (lo dice el pie: normalizar paga al leer); el final del título de las barras, «Y CAMBIA SU CORREO».", "Qué decir: \"Se suele presentar como bancos con ACID contra redes sociales con BASE. Brewer, que inventó BASE con su grupo a fines de los noventa, dice otra cosa: son dos filosofías en los extremos opuestos de un espectro. Mexi Banco tiene operaciones en todo el espectro. Antes, separemos las dos C. La de ACID es que la transacción respeta las reglas de la base, como llaves únicas o saldo ≥ 0. La de CAP es solo que las copias se comporten como una sola, y Brewer dice que es un subconjunto estricto de la primera. Y el ejemplo del propio Brewer es un banco: el cajero automático.\"\n\nEl cajero, con sus palabras:\n\n\"In the design of an automated teller machine (ATM), strong consistency would appear to be the logical choice, but in practice, A trumps C.\"\n\n\"The key invariant is that the balance should be zero or higher.\"\n\nSin red, en stand-in mode: \"modern ATMs limit the net withdrawal to at most k, where k might be $200.\"\n\nDespués: \"The bank compensates by charging a fee and expecting repayment.\"\n\nEs BASE en el borde, con el riesgo acotado y una compensación de por medio. Es la misma idea que la saga de la S08.\n\nEn Mexi Banco:\n\nEl cargo y el abono dentro de cuentas caben en una transacción ACID local.\n\nEntre servicios ya no hay transacción: la saga con compensación es BASE en la práctica.\n\nLa autorización de tarjeta (\"menos de 100 ms, disponibilidad sobre consistencia\", diseno.md) es el cajero de Brewer.\n\nPreguntas para el grupo:\n\n\"Si el cajero se queda sin red, ¿lo dejarían dar dinero? ¿Cuánto?\"\n\n\"¿Qué riesgo acepta el banco con k = $200, y con qué lo cubre?\"\n\n\"¿ACID es exclusivo de SQL?\" (No: MongoDB tiene transacciones multidocumento y Neo4j es transaccional. Lo vemos en los mitos.)\n\nAviso para Oscar: BettaTech (12:05 a 12:35) confunde la C de CAP con la de ACID (\"no queremos que se queden usuarios sin dirección\" es la C de ACID). También presenta CAP como \"elige dos de tres\". No lo repitas.\n\nTransición: \"Con esto ya separamos lo que de verdad distingue a SQL de NoSQL: el modelo, el esquema, la normalización y qué se garantiza. Y si NoSQL no es una sola cosa, ¿qué familias hay?\"\n\nFuentes:\n\nBrewer, \"CAP Twelve Years Later\", IEEE Computer 45(2), 2012: \"ACID and BASE represent two design philosophies at opposite ends of the consistency-availability spectrum\"; \"In ACID, the C means that a transaction preserves all the database rules, such as unique keys\"; la C de CAP es \"a strict subset of ACID consistency\"; \"My colleagues and I created BASE in the late 1990s\".\n\n[VERIFICAR: ACID de Härder y Reuter, 1983 · de memoria.]\n\n[VERIFICAR: BASE en Fox et al., SOSP 1997 · Brewer solo dice \"late 1990s\".]\n\n[VERIFICAR: Kleppmann, DDIA cap. 7, \"la única definición sensata de BASE es 'no ACID'\" · no se cotejó la redacción; no la cites textual.]\n\nQuitado de la lámina (dilo si sirve): «Son los extremos de un espectro, no dos bandos (Brewer, 2012).»; el rótulo «UN ESPECTRO, NO DOS CAMPOS»; «prioriza consistencia» y «prioriza disponibilidad» en los extremos; las sublíneas de los puntos: «transacción local», «compensa después», «riesgo acotado: k», «puede ir atrás»; «todas las réplicas como una»; «Brewer: subconjunto estricto».", "Qué decir: \"Al bloque anterior le faltó esto: NoSQL junta cosas que no se parecen entre sí. Nuestro criterio para contar una familia es que tenga una pregunta típica y una estructura de datos que la vuelve barata. Con eso salen ocho, más un puente que no es familia, porque su modelo es relacional. El número es una convención: cada video que vieron cuenta distinto, y DB-Engines ni siquiera mide calidad, mide popularidad.\"\n\nPreguntas para el grupo:\n\n\"¿En qué casilla cae etcd, el que vimos con Raft?\" Va en clave-valor, y es CP: la familia no dice nada de la consistencia.\n\n\"¿Cuál de estas ocho ya usa Mexi Banco hoy?\" Relacional y clave-valor (Redis).\n\nDos vecinos que no cuentan como familia, para quien pregunte:\n\nColumnar analítico (ClickHouse, BigQuery, Redshift, Snowflake): es el modelo relacional guardado por columna, o sea una arquitectura, no un modelo (Abadi 2010; Stonebraker y Pavlo 2024).\n\nAlmacén de objetos (S3, MinIO): una llave apunta a un archivo grande e inmutable.\n\nDato de DB-Engines: en el ranking de julio de 2026, los cuatro primeros son relacionales (Oracle, MySQL, SQL Server y PostgreSQL); MongoDB está en 5.º lugar, Redis en 8.º y Cassandra en 10.º. Redgate compró DB-Engines en junio de 2024. Un mismo motor sale en varias categorías: MongoDB aparece en vectorial, búsqueda y series de tiempo. Eso apoya la idea de que las familias son patrones de acceso, no productos.\n\nTransición: \"Empecemos por la familia por defecto, la que guarda la verdad.\"\n\nFuentes:\n\nfuentes/02-familias-de-bd.md §1 (taxonomía y DB-Engines).\n\nfuentes/01-poliglota-sql-nosql.md, subtema 3 (cuántas cuenta cada fuente).\n\nProgramación y más, 09:21, fotograma t000922.jpg: su mapa de 12 casillas, cuatro SQL y ocho NoSQL.\n\n[VERIFICAR: la lista exacta de categorías de DB-Engines (unas quince) · la página de definiciones no cargó; por eso la lámina dice solo \"más categorías\".]\n\nQuitado de la lámina (dilo si sirve): Si dos motores responden lo mismo con la misma estructura, son de la misma familia. Estructura de cada familia: Relacional, B-tree · WAL · MVCC; Clave-valor, tabla hash particionada; Documentos, agregado JSON anidado; Columnas anchas, LSM-tree · clustering key; Grafos, adyacencia por punteros; Búsqueda, índice invertido; Series de tiempo, bloques · delta-of-delta; Vectorial, índice ANN · HNSW; Puente NewSQL, Raft, sharding, 2PC y relojes. Preguntas completas: ¿Qué es verdad ahora y se cumplen las reglas? ¿Qué hay en esta llave? Lo quiero ya. ¿Me das el expediente completo en una lectura? ¿Esta partición, en orden, con millones de escrituras? ¿Cómo se conecta esto con aquello, y a cuántos saltos? ¿Qué documentos dicen esto, ordenados por relevancia? ¿Cómo se comportó esta métrica en esta ventana? Cada fuente cuenta distinto: BettaTech · 4, Vida MRR · 5, CodeLucky · 6, Programación y más · 7. DB-Engines usa más categorías y mide popularidad (menciones, búsquedas, empleos), no calidad.", "Qué decir: \"Es la familia por defecto, desde Codd en 1970, y su pregunta es la del banco. La garantía la da el motor, no nuestro código: el CHECK, el UNIQUE y la transacción. Stack Overflow, en 2016, atendía más de 500 millones de consultas SQL al día con dos clústeres. Lo que cuesta no es leer, es escribir: hay un solo primario.\"\n\nPreguntas para el grupo:\n\n\"Si dos transferencias leen el mismo saldo de 18,450.75 al mismo tiempo, ¿quién evita que quede negativo?\" La transacción y el CHECK.\n\n\"Con 500 millones de consultas al día, ¿por qué Stack Overflow no pasó todo a NoSQL?\"\n\nExtras, solo si sobra tiempo:\n\nNotion (6-oct-2021) partió su PostgreSQL en 480 shards lógicos sobre 32 bases físicas, usando el workspace como llave (sharding a mano, S07).\n\nOpenAI (22-ene-2026) atiende ChatGPT, con 800 millones de usuarios, con un solo primario de PostgreSQL y casi 50 réplicas de lectura.\n\nTransición: \"¿Y si lo único que necesito es leer lo de una llave, muchísimas veces y muy rápido?\"\n\nFuentes: fuentes/02-familias-de-bd.md §2.1. Craver, \"Stack Overflow: The Architecture, 2016 Edition\", 17-feb-2016. Stack Overflow blog, 28-ago-2025 (la mudanza a la nube).\n\n[VERIFICAR: OpenAI con un primario y casi 50 réplicas · el post original dio 403; las cifras vienen de InfoQ (12-feb-2026). Decirlo solo con ese matiz.]\n\n[VERIFICAR: PostgreSQL 19 estaba en RC1 el 30-oct; si sale la versión final antes del sábado, cambiar el chip.]\n\nQuitado de la lámina (dilo si sirve): Motores: autogestionado PostgreSQL 18.6; gestionado Amazon Aurora PostgreSQL. Estructura: llave o rango en O(log n); WAL: todo o nada al COMMIT. Brilla en: reglas entre filas (CHECK, UNIQUE, llaves foráneas); escrituras todo o nada (cargo y movimiento: un COMMIT); consultas no previstas (joins y optimizador por costos). No brilla en: escribir más que un nodo (solo escribe el primario); esquemas muy variables (N joins o tablas EAV); texto con relevancia (LIKE '%renta%' barre todo). Caso Stack Overflow, 9-feb-2016: 66 millones de cargas de página; SQL Server · 4 servidores; 384 y 768 GB de RAM. Cifra histórica: desde 2025 corre en la nube. Mexi Banco, tabla cuenta: CLABE 014180655091234567, CLIENTE C-1027, SALDO 18450.75, PRIMARY KEY. La regla la cuida el motor, no el código.", "Qué decir: \"Es un diccionario gigante. La llave decide el slot y cada operación toca una sola partición, por eso escala casi en línea recta. El caso de libro es la tabla de posiciones: un sorted set mantiene el orden mientras sube cada puntaje, y nadie hace ORDER BY en cada refresco. En Mexi Banco, Redis guarda una copia del saldo que se permite ir 30 segundos atrás; la verdad sigue en PostgreSQL.\"\n\nPreguntas para el grupo:\n\n\"¿Cómo encuentro todas las sesiones del cliente C-1027 si la llave es sesion:9f3a7c?\" No se puede sin barrer o sin otro índice.\n\nAl equipo del juez en línea: \"¿Dónde vive su tabla de posiciones, y de dónde la reconstruyen si Redis se cae?\" De los envíos y veredictos, que están en relacional.\n\n\"etcd también es clave-valor y es la verdad de Kubernetes. ¿Entonces la familia dice algo de la consistencia?\" No.\n\nPrecisión: desde Redis 6.2, ZREVRANGE se considera obsoleto en favor de ZRANGE ... REV, pero sigue funcionando; se dejó por legible.\n\nTransición: \"¿Y si lo que guardo no es un valor, sino un expediente completo con cosas anidadas?\"\n\nFuentes: fuentes/02-familias-de-bd.md §2.2 y escenario 7 de §3. Craver, 17-feb-2016 (Redis: \"cada instancia por debajo de 2 % de CPU\"). Programación y más, precisión 7 del reporte (etcd).\n\n[VERIFICAR: el día exacto de los 5,831,683,114 aciertos de Redis · el archivo dice \"2016\" sin día; la lámina no pone día.] [VERIFICAR: la obsolescencia de ZREVRANGE desde la 6.2 · no está en el archivo; es de memoria.]\n\nQuitado de la lámina (dilo si sirve): Motores: autogestionado Valkey 9.1.3; gestionado Amazon DynamoDB. El valor es un blob o una estructura simple: contador, lista o conjunto ordenado. Estructura: hash(llave) elige uno de 16,384 slots: O(1). Brilla en: latencia mínima (O(1), en memoria); escala casi lineal (cada llave vive en un slot); contadores, TTL, rankings (INCR, SET NX, sorted sets). No brilla en: buscar por otro campo (sin índice, toca barrer); reglas entre llaves (multillave solo en un slot); ser la verdad en Redis (un failover puede perder datos). Caso: ZINCRBY concurso 1 ana y ZREVRANGE concurso 0 2 WITHSCORES; posiciones 1 caro 7, 2 ana 6 (+1), 3 beto 5; top N en O(log n) aunque refresquen cientos de veces por segundo. En producción: Stack Overflow, 2016, 5,831,683,114 aciertos de Redis en un día. Mexi Banco: saldo:014180655091234567 → 18450.75, EX 30; SET saldo:014180655091234567 18450.75 EX 30. Puede ir hasta 30 s atrás; la verdad sigue en cuentas.", "Qué decir: \"El documento es el agregado: lo que la app lee de un jalón. Cada restaurante arma su menú distinto, con combos, tamaños y extras. En relacional eso acaba en una tabla EAV (entidad, atributo, valor), con un join por cada atributo. Aquí la app lee el menú completo en una lectura. Pero el pedido y el pago no van aquí: ahí sí hay reglas entre registros.\"\n\nPreguntas para el grupo:\n\n\"¿El pedido y el cobro del delivery también van en este documento?\" No: van en relacional. Es lo que retoma el bloque 4.\n\n\"¿Cuántas tablas necesitarías para los menús de 500 restaurantes que no se parecen?\"\n\nDatos para quien pregunte:\n\neBay (31-ene-2017): Oracle guarda un resumen como copia persistente. Al comprimir el documento, el oplog bajó de unos 150 GB/h a unos 11 GB/h y el objeto promedio, de unos 32 KB a unos 5 KB.\n\nContraejemplo de Discord (13-ene-2017): con unos 100 millones de mensajes en MongoDB, \"los datos y el índice ya no cabían en RAM\".\n\nUber Docstore (23-feb-2021) es de documentos con esquema al escribir y Raft por partición: \"documentos\" no quiere decir \"sin consistencia\".\n\nJSONB en PostgreSQL cubre muchos de estos casos.\n\nLa etiqueta AUTOGESTIONADO describe la operación, no la licencia; MongoDB Community usa SSPL.\n\nTransición: \"¿Y si en vez de leer un expediente necesito escribir millones de eventos por segundo y leerlos en orden?\"\n\nFuentes: fuentes/02-familias-de-bd.md §2.3 y escenario 10 de §3. Ramaswamy (eBay), 31-ene-2017. Programación y más, 02:58 a 03:49 (t000334.jpg, tienda SQL contra documento).\n\n[VERIFICAR: las licencias (MongoDB con SSPL) · el archivo no las revisó en la fuente oficial.]\n\nQuitado de la lámina (dilo si sirve): Motores: autogestionado MongoDB Community 9.0; gestionado MongoDB Atlas. Se pueden crear índices secundarios sobre sus campos. Estructura: lo que se lee junto, se guarda junto: sin joins. Brilla en: leer el agregado entero (se guarda junto, sin joins); atributos que varían (esquema al leer, sin ALTER); escribir un documento (sin transacción distribuida). No brilla en: muchos a muchos ($lookup caro o datos copiados); reglas entre documentos (transacción multidocumento); agregados sin tope (máximo 16 MB por documento). Caso, el menú como documento: { \"_id\": \"rest-118\", \"combos\": [ { \"nombre\": \"Combo 2\", \"tamaños\": [\"chico\", \"grande\"], \"extras\": { \"queso\": 15, \"papas\": 25 } } ] }; en relacional sería ✗ tabla EAV. eBay, 31-ene-2017. Mexi Banco: { \"_id\": \"C-1027\", \"canales\": [\"push\", \"email\"], \"silencio\": { \"desde\": \"22:00\", \"hasta\": \"07:00\" } }. Cada cliente trae sus propios campos: esquema al leer.", "Qué decir: \"El nombre engaña: suena a 'columnar', pero dentro de cada partición las filas se guardan completas y en orden. Columnar de verdad es otra cosa: Redshift o ClickHouse guardan cada columna aparte para sumar millones de filas leyendo dos columnas. Aquí la pregunta es 'dame esta partición en orden', mientras el LSM-tree aguanta escrituras secuenciales sin parar. Discord se movió de 177 nodos de Cassandra a 72 de ScyllaDB: la misma familia y el mismo CQL. Huyó de las pausas de GC y de la compactación, no del modelo.\"\n\nPreguntas para el grupo:\n\n\"¿Para qué está mes dentro de la partition key?\" Para que ninguna partición crezca sin tope. Es el mismo truco del bucket de Discord, ((channel_id, bucket), message_id).\n\n\"Si quiero el monto total por hora del último año, ¿uso esta tabla?\" No: recorre todos los nodos; eso es columnar analítico.\n\nAl equipo de paquetería: \"Los escaneos de una guía, siempre leídos en orden, ¿se parecen a este patrón?\" Partición por guia y clustering por ts; para su tamaño basta PostgreSQL.\n\nDatos extra:\n\nDiscord en 2017 tenía 12 nodos con RF = 3 y más de 120 millones de mensajes al día. La migración corrió a 3.2 millones de mensajes por segundo.\n\nFacebook (LADIS 2009): Cassandra nació para la búsqueda del Inbox, con más de 50 TB en 150 nodos.\n\nTransición: \"Hasta aquí todo se lee por llave. ¿Y si la pregunta es cómo se conecta una cosa con otra?\"\n\nFuentes: fuentes/02-familias-de-bd.md §2.4 y §1 (vecinos). Ingram, \"How Discord Stores Trillions of Messages\", 6-mar-2023. Vishnevskiy, 13-ene-2017. Stonebraker y Pavlo (2024): el modelo de familias de columnas \"no es un modelo de datos columnar\".\n\n[VERIFICAR: la cita de Kleppmann (DDIA) de que llamarlas orientadas a columnas \"es muy engañoso\" · solo se confirmó por subrayados de lectores de la 1.ª edición; no citarla textual.] [VERIFICAR: Pinterest retiró HBase por TiDB · las cifras vienen de resúmenes; no usar en clase sin matiz.]\n\nQuitado de la lámina (dilo si sirve): Motores: autogestionado Apache Cassandra 5.0.9; gestionado Amazon Keyspaces. No es columnar: dentro de la partición guarda por fila. Estructura: orden por clustering key. Brilla en: escrituras masivas (LSM-tree: escribe en secuencia); rangos en una partición (ya vienen ordenados por ts); crecer agregando nodos (la partition key reparte). No brilla en: consultas no previstas (una tabla por consulta); sumar la tabla entera (SUM global: recorre todo); borrar mucho (tombstones y compactación). Caso Discord, 6-mar-2023: ✓ misma familia, mismo CQL; huyó de las pausas de GC; p99 lectura: 40 a 125 → 15 ms; p99 inserción: 5 a 70 → 5 ms. Mexi Banco: partition key ('014180655091234567', '2026-10'); 2026-10-30 23:58 CARGO 9500.00 SPEI a banco 072; 2026-10-28 09:15 CARGO 1250.00 Pago renta octubre; PRIMARY KEY ((clabe, mes), ts), ts DESC.", "Qué decir: \"Aquí la relación es un dato: cada nodo apunta a sus vecinos, y un salto es seguir un puntero, no hacer un join. LinkedIn lo midió: si tu primer grado son unos cientos, tu segundo grado tiene al menos 50,000, y calcularlo con joins equivale a unas 250 búsquedas aleatorias. En Mexi Banco, el antifraude busca anillos: dinero que regresa a la cuenta de origen en 3 a 6 saltos. Ojo: que haya relaciones no basta; cliente, cuenta y movimiento son dos joins y no necesitan grafo.\"\n\nPreguntas para el grupo:\n\n\"Cliente → cuenta → movimiento, ¿necesita una base de grafos?\" No: la profundidad es fija.\n\n\"¿Por qué es difícil repartir un grafo en shards?\" Cada arista cortada es un salto por red (S07).\n\nDato extra: Facebook TAO (USENIX ATC 2013) modela el grafo social y procesa mil millones de lecturas por segundo, pero guarda en MySQL con una caché que entiende el grafo. Usar el modelo de grafo no obliga a usar un motor de grafos.\n\nTransición: \"¿Y si la pregunta es qué movimientos dicen 'renta', aunque lo escriban distinto?\"\n\nFuentes: fuentes/02-familias-de-bd.md §2.5. Meyer, Carter y Rodriguez, \"LIquid: The soul of a new graph database, Part 1\", 23-jul-2020. Programación y más, 06:48 (t000658.jpg y t000704.jpg, grafo contra relacional).\n\nApoyo al diagrama de Mexi Banco: ¿el dinero regresa en 3 a 6 saltos?\n\nQuitado de la lámina (dilo si sirve): Motores: autogestionado Neo4j 2026.10 Community; gestionado Amazon Neptune. Nodos y aristas, cada uno con etiqueta y propiedades. Estructura: cuesta lo que recorres, no lo que mide la tabla. Brilla en: profundidad variable (3 a 6 saltos sin joins); patrones con forma (ciclos y caminos más cortos); relaciones nuevas (otra etiqueta, sin migrar). No brilla en: repartirse en shards (cada corte: saltos por red); reportes y sumas masivas (no recorre en secuencia); profundidad fija (cliente → cuenta: dos joins). Caso LinkedIn LIquid, 23-jul-2020: 1.er grado, unos cientos; 2.º grado, 50,000 o más. Por eso hicieron su propia base de grafos. Mexi Banco: (:Cuenta 014180655091234567)-[:TRANSFIRIO]->(:Cuenta 072180001122334455), monto 9500.00 · 30-oct-2026 23:58; MATCH r = (c:Cuenta)-[:TRANSFIRIO*3..6]->(c) RETURN r LIMIT 10.", "Qué decir: \"Un cliente busca 'renta coyoacan', sin acento. LIKE '%renta%' no puede usar el B-tree porque empieza con comodín, así que barre la tabla, no encuentra 'Coyoacán' con acento y no sabe ordenar. El buscador analiza el texto al indexar: minúsculas, sin acentos, raíces, sinónimos. Luego va directo a la lista de cada término y ordena por relevancia. Antes de montar OpenSearch hay un paso intermedio en PostgreSQL: tsvector con un índice GIN. Y es una copia: la verdad del movimiento sigue en PostgreSQL.\"\n\nPreguntas para el grupo:\n\n\"¿Por qué LIKE 'renta%' sí puede usar un índice y LIKE '%renta%' no?\"\n\nAl equipo de mascotas extraviadas: \"'perrita café collar rojo' cerca de Iztapalapa, ¿LIKE o índice invertido?\" Índice invertido, con sinónimos (perrita → perro) y filtro geográfico; las alertas por municipio se quedan en relacional.\n\nPrecisión: con la configuración 'spanish', to_tsvector saca raíces pero no quita acentos. Para que \"coyoacan\" encuentre \"Coyoacán\" en PostgreSQL hace falta la extensión unaccent. Por eso la lámina le atribuye la tolerancia a acentos al índice invertido del buscador, y muestra el GIN solo como paso intermedio.\n\nDato extra: GitHub (6-feb-2023) hizo su propio motor de código con un índice de trigramas (un índice invertido especializado): 115 TB de código, 15.5 mil millones de documentos y un p99 de unos 100 ms por shard.\n\nTransición: \"¿Y si lo que llega no es texto, sino una métrica cada 15 segundos?\"\n\nFuentes: fuentes/02-familias-de-bd.md §2.6 y escenario 4 de §3. Craver, 17-feb-2016 (Elasticsearch, 3 nodos por centro de datos). Programación y más, 07:39 (t000746.jpg, el índice invertido). Elastic, \"Near real-time search\".\n\n[VERIFICAR: que to_tsvector('spanish', ...) no quita acentos sin unaccent · no está en el archivo; es de la documentación de PostgreSQL de memoria. Probarlo antes de decirlo.]\n\nEl índice es una copia: MOV-88213 se copia desde PostgreSQL por CDC o por eventos.\n\nQuitado de la lámina (dilo si sirve): Motores: autogestionado OpenSearch 3.9; gestionado Elastic Cloud. Cada texto se analiza y se parte en términos. Estructura: como el índice al final de un libro: término → páginas. Brilla en: texto libre (sin acentos, raíces, sinónimos); relevancia y facetas (puntuación BM25 por término); escalar lecturas (shards y réplicas en paralelo). No brilla en: ser la verdad (si se corrompe, se reconstruye); leer lo recién escrito (visible hasta 1 s después); reescribir lo mismo (segmentos inmutables). LIKE '%renta%': «Coyoacán» no es «coyoacan» y no ordena por relevancia. Índice invertido: quita acentos al indexar y ordena por relevancia (BM25). En producción: Stack Overflow, 2016, 17,158,874 búsquedas al día. Mexi Banco: { \"concepto\": \"Pago renta octubre depto Coyoacán\" }. Paso intermedio, sin otro motor: CREATE INDEX mov_texto ON movimiento USING gin (to_tsvector('spanish', concepto));", "Qué decir: \"Las métricas llegan cada 15 segundos, así que la diferencia entre instantes casi siempre es la misma. Si guardo la diferencia de la diferencia, casi siempre guardo un cero, y el cero cabe en un bit. Con eso y con XOR para los valores, Gorilla bajó de 16 a 1.37 bytes por punto, 12 veces menos. A cambio, acepta perder pequeñas cantidades de datos: sirve para telemetría, no para dinero.\"\n\nPreguntas para el grupo:\n\n\"¿Por qué no guardar aquí los movimientos de Mexi Banco?\" Un movimiento tiene identidad y no se muestrea.\n\n\"¿Qué pasa si pongo la CLABE como etiqueta?\" Una serie por cuenta: alta cardinalidad.\n\nDatos extra:\n\nGorilla, comparado con su versión anterior sobre HBase: latencia de consulta 73 veces menor y throughput 14 veces mayor.\n\nPrometheus guarda bloques de 2 horas, a 1 o 2 bytes por muestra.\n\nUber M3 (7-ago-2018): 6.6 mil millones de series; dejaron Cassandra por la carga operativa y la compactación.\n\nTransición: \"¿Y si la pregunta no es exacta, sino 'qué se parece a esto'?\"\n\nFuentes: fuentes/02-familias-de-bd.md §2.7. Pelkonen et al., \"Gorilla\", PVLDB 8(12), 2015. Prometheus, documentación de almacenamiento.\n\n[VERIFICAR: que un delta-of-delta de 0 se codifica con un solo bit y que los \"16 bytes\" son 8 del instante más 8 del valor · viene del paper de Gorilla (§4.1), pero no está en el archivo. El ejemplo 0, 15, 30, 46 y 61 lo construí yo con un scrape de 15 s.] [VERIFICAR: que el stack LGTM de la v08 guarda las métricas en Prometheus o Mimir · el repo público solo llega a la v06.]\n\nQuitado de la lámina (dilo si sirve): Motores: autogestionado Prometheus 3.15; gestionado Grafana Cloud. Se guardan en bloques por tiempo y se comprimen con delta-of-delta y XOR. Estructura: guarda la diferencia de la diferencia: casi siempre 0. Brilla en: ingesta masiva (se agrega al final de la serie); mucho en poco espacio (1 a 2 bytes por muestra); retención barata (se borra un bloque entero). No brilla en: corregir puntos sueltos (bloques inmutables); alta cardinalidad (un id por etiqueta: millones); registros de negocio (un movimiento no se muestrea). Caso Facebook Gorilla, VLDB 2015: sin comprimir, 16 bytes por punto; Gorilla, 1.37 bytes por punto; unos 12 millones de puntos por segundo · 26 h en memoria. Mexi Banco: mexibanco_spei_enviadas_total {banco_destino=\"072\", resultado=\"ok\"} 18342 @1793404800 (métrica, etiquetas, valor e instante); 1793404800 = 31-oct-2026 00:00 UTC. ✗ Con la CLABE como etiqueta: millones de series.", "Qué decir: \"Aquí no buscamos palabras sino significado: 'me cobraron doble' encuentra 'cargo duplicado' sin compartir palabras. Comparar contra todos sería lento; HNSW arma un grafo por capas y baja como en una skip list, revisando solo lo cercano. El precio es que es aproximado y vive en RAM. Spotify cambió Annoy, que impulsaba Discover Weekly, por Voyager, basada en hnswlib: más de 10 veces más rápida con el mismo recall.\"\n\nPreguntas para el grupo:\n\nAl equipo de streaming: \"'Canciones parecidas a esta', ¿grafo o vectorial? ¿Y 'lo que escuchan tus amigos'?\" Lo parecido es vectorial; lo de los amigos es un recorrido, o sea grafo.\n\n\"Si cambian el modelo de embeddings, ¿qué pasa con el índice?\" Hay que reindexar todo: es derivado.\n\nDatos extra:\n\nNotion (19-feb-2026): en dos años de búsqueda vectorial escalaron 10 veces y bajaron 90 % el costo.\n\npgvector indexa hasta 2,000 dimensiones con el tipo vector, y los resultados de un HNSW pueden cambiar después de crear el índice.\n\nTransición: \"Ocho familias. Falta el puente: ¿y si quiero exactamente la relacional, pero un nodo ya no alcanza?\"\n\nFuentes: fuentes/02-familias-de-bd.md §2.8 y escenario 8 de §3. Sobot, \"Introducing Voyager\", 25-oct-2023. Malkov y Yashunin, HNSW, arXiv 1603.09320.\n\nQuitado de la lámina (dilo si sirve): Motores: autogestionado pgvector 0.8.7; gestionado Pinecone. Se buscan los k vecinos más cercanos por coseno o por distancia euclidiana. Estructura: un grafo por capas: se baja como en una skip list. Brilla en: parecido por significado (no necesita la misma palabra); sin revisar todo (HNSW o IVF: solo lo cercano); filtros híbridos (vector más metadatos). No brilla en: exactitud (cambia recall por velocidad); memoria (HNSW vive en RAM); ser la verdad (otro modelo: reindexar todo). Caso Spotify, 25-oct-2023: Annoy impulsó Discover Weekly y Home; Voyager es hasta 50 % más precisa a igual velocidad y usa hasta 4× menos memoria. Mexi Banco: 'me cobraron dos veces el SPEI de la renta' → vector(768); CREATE INDEX ON ticket_soporte USING hnsw (embedding vector_cosine_ops); SELECT id, texto FROM ticket_soporte ORDER BY embedding <=> $1 LIMIT 5;", "Qué decir: \"El modelo es relacional, con SQL y ACID; lo nuevo es cómo se reparte. La tabla se parte en rangos, eso es sharding. Cada rango se replica con consenso, eso es Raft. Si una transferencia toca dos rangos, se confirma con 2PC. Y para ordenar commits en todo el planeta, Spanner usa TrueTime, relojes con GPS y atómicos. Es la S06, la S07, la S08 y la S10 en un solo motor. Google lo hizo porque el último resharding a mano de su MySQL de anuncios les tomó más de dos años.\"\n\nPreguntas para el grupo:\n\n\"¿Qué le pasa a un rango si pierde la mayoría?\" Deja de aceptar escrituras: es CP.\n\n\"¿Por qué un id autoincremental es mala idea aquí?\" Todas las escrituras caen en el último rango: el hot spot de la S07.\n\nDatos extra: TiDB y YugabyteDB son de la misma idea. Amazon Aurora DSQL está disponible en general desde el 27-may-2025. En Spanner, además de la ronda de consenso, cada commit paga el commit wait de TrueTime.\n\nLa etiqueta AUTOGESTIONADO describe la operación; no se afirma aquí una licencia para CockroachDB.\n\nTransición: \"Ya tenemos el mapa completo. ¿Cómo se ve Mexi Banco si cada dato vive en la familia que le toca?\"\n\nFuentes: fuentes/02-familias-de-bd.md §2.9 y §1 (\"por qué NewSQL es puente\"). Corbett et al., \"Spanner\", OSDI 2012 (F1: \"el último resharding tomó más de dos años de esfuerzo intenso\"; TrueTime \"generalmente por debajo de 10 ms\"). AWS, disponibilidad general de Aurora DSQL.\n\n[VERIFICAR: CockroachDB usa relojes lógicos híbridos (HLC) y no TrueTime · no está en el archivo; decirlo solo si alguien pregunta por CockroachDB.] [VERIFICAR: la licencia actual de CockroachDB · no está en el archivo.] [VERIFICAR: Pinterest pasó de HBase a TiDB en parte por índices secundarios y transacciones · las fuentes dieron 403.]\n\nQuitado de la lámina (dilo si sirve): Motores: autogestionado CockroachDB 26.2; gestionado Google Cloud Spanner. Definición completa: SQL y ACID como en la relacional, pero el motor parte cada tabla en rangos y replica cada rango con consenso. Raft (S06): cada rango elige su líder y replica por mayoría. Sharding (S07): la tabla se parte en rangos que se dividen y se mueven solos. 2PC (S08): si la transacción toca dos rangos, se confirma con 2PC. Relojes (S10): Spanner usa TrueTime con GPS y relojes atómicos, error < 10 ms. Caso Google F1 sobre Spanner (OSDI 2012): más de 2 años duró el último resharding a mano de su MySQL de anuncios. F1 corre con 5 réplicas en EE. UU.", "Qué decir: \"Así queda Mexi Banco si cada dato vive en su familia. A la izquierda, la verdad: dos PostgreSQL, una por servicio, y las preferencias en documentos. A la derecha, copias que se alimentan de eventos, por Outbox o por CDC; si una se pierde, se reconstruye desde la verdad. Y abajo, lo que no se separa nunca, porque son invariantes: el saldo con sus movimientos, la llave de idempotencia con su transferencia, y el outbox con la transferencia, porque si vive en otra base ya no es outbox.\"\n\nPreguntas para el grupo:\n\n\"Si la llave de idempotencia vive en Redis y hay un failover, ¿qué pasa?\" Una escritura ya confirmada se puede perder, y el SPEI sale dos veces.\n\n\"¿Cuál de las copias azules podrías borrar completa hoy y reconstruir mañana?\" Cualquiera.\n\n\"¿Qué se pierde al separar cuentas de transferencias?\" La transacción que abarcaba todo; se compensa con una saga (S08).\n\nLo que no cupo en la lámina, para decirlo de palabra:\n\nSesiones y límites de tasa: clave-valor, efímeros, con TTL.\n\nMétricas del SPEI: series de tiempo (telemetría).\n\nTickets parecidos: pgvector, con el embedding al crear el ticket.\n\nEstados de cuenta en PDF: objetos (MinIO o S3), la verdad del archivo.\n\nQué cuesta:\n\nEl dual write es una trampa: si el código escribe en PostgreSQL y luego publica en Kafka y muere entre las dos, el evento se pierde.\n\nCada copia tiene un retraso que hay que declarar (\"el saldo de la app puede ir 30 s atrás\").\n\nCada motor es otro respaldo y otra guardia.\n\nTransición al bloque 4: \"Con un caso concreto, ¿cómo se decide? Pongamos dos familias a pelear por el mismo dato.\"\n\nFuentes: fuentes/02-familias-de-bd.md §4 (tabla, qué se pierde y dónde NO conviene separar). Plan de evolución de Mexi Banco: v09 (Redis read model), v10 (TransferenciaRealizada) y v11 (antifraude consume de Kafka). Outbox Event Router de Debezium.\n\nQuitado de la lámina (dilo si sirve): Cada dato vive en la familia que responde su pregunta. Qué guarda cada verdad: cuentas, cuenta + movimiento; transferencias, transferencia + idempotencia + outbox. Kafka: eventos. Cómo se mantiene cada copia: saldo para mostrar, DEL + TTL; antifraude, topic; búsqueda de movimientos, CDC; reportes y regulador, Kafka. Saldo con movimientos: misma base, misma transacción: el saldo no puede ser eventual. Llave de idempotencia: UNIQUE en la misma transacción; en Redis podría perderse: SPEI doble. Outbox con la transferencia: entra en la misma transacción; en otra base ya no es outbox.", "- Apertura, que responde a la pregunta del bloque 3: \"Con un caso concreto, ¿cómo se decide? Vamos a poner dos familias a pelear por el mismo dato y ver cuál tiene la estructura que coincide con la pregunta. Son cuatro duelos; el primero es el dato más sagrado de Mexi Banco.\"\n\nQué decir: \"El saldo tiene un invariante que cruza dos registros: lo que sale de una cuenta entra a otra, y ninguna baja de cero. En PostgreSQL son dos UPDATE en una transacción local; el saldo >= :m del WHERE impide gastar lo que no hay, y el CHECK es la red de seguridad. En MongoDB cada cuenta es un documento y escribir un documento sí es atómico, pero aquí son dos: necesitas sesión y transacción multidocumento en cada transferencia. Funcionan, pero si las usas en cada operación, tu modelo en realidad es relacional.\"\n\nPara leer el código: :o, :d y :m son origen, destino y monto; en el shell, o, d y m son las mismas variables.\n\nPrecisión para quien pregunte: en Mongo, un updateOne que no encuentra nada (saldo insuficiente) no aborta solo. La aplicación revisa matchedCount y llama a s.abortTransaction(). Es el mismo papel que el \"0 filas\" del lado relacional.\n\nPreguntas para el grupo:\n• \"¿Y si meto las dos cuentas en el mismo documento?\" Respuesta: cualquier cuenta le puede transferir a cualquier otra, así que el agregado sería el banco entero; el agregado natural es la cuenta.\n• \"¿Qué pasa si quito el AND saldo >= :m?\" Respuesta: el CHECK aborta la transacción con un error. Sigue siendo correcto, pero la regla de negocio se vuelve una excepción.\n\nPara amarrar con Mexi Banco: el libro mayor cumple que el saldo es igual al saldo inicial, más los abonos, menos los cargos. Por eso saldo y movimientos van en la misma base y en la misma transacción: si se separan, el saldo se vuelve eventual.\n\nTransición: \"Aquí el relacional ganó por invariantes. Ahora un caso donde el relacional sí puede, pero cada salto le cuesta.\"\n\nFuentes: fuentes/02-familias-de-bd.md, §3 fila 1 (la consulta exacta); §2.3, \"Invariantes entre documentos\" (\"si las usas en cada operación, tu modelo en realidad es relacional\"); §4, \"Dónde NO conviene separar\" (saldo y movimientos).\n\n[VERIFICAR: transacciones multidocumento desde MongoDB 4.0 en replica sets y desde 4.2 en clústeres fragmentados · la fuente solo dice \"desde la 4.0\"; la lámina dice solo eso.]\n\nQuitado de la lámina (dilo si sirve): \"Si el primer UPDATE toca 0 filas, no alcanza: ROLLBACK.\" · \"Transacciones multidocumento: existen desde MongoDB 4.0.\" · Veredicto: \"Gana relacional: los dos saldos cambian juntos o ninguno, y ninguno baja de cero.\"", "- Qué decir: \"A 2 saltos, por ejemplo '¿esta cuenta le pagó a alguien que le pagó a una cuenta marcada?', bastan dos joins y PostgreSQL lo hace bien. El anillo es otra cosa: de 3 a 6 saltos en 24 horas, y cada nivel de la recursión es otro join contra millones de transferencias; los caminos se multiplican con cada salto. En el grafo cada nodo apunta a sus vecinos, así que el costo depende de lo que recorres y no del tamaño de la tabla. LinkedIn lo midió: con un join, tu segundo grado ya cuesta unas 250 búsquedas aleatorias.\"\n\nEl hilo de la clase: el grafo de antifraude es una copia derivada. Lo alimenta el topic de movimientos y la verdad sigue en PostgreSQL. Si el grafo se corrompe, se reconstruye desde ahí.\n\nPara leer el código: las dos consultas cuentan cuántas rutas de 3 a 6 saltos regresan a la cuenta. $clabe y :clabe son el mismo parámetro y P1D es \"un día\" en ISO 8601.\n\nPrecisión para quien pregunte: la consulta SQL cuenta paseos y puede repetir cuentas intermedias, o la misma transferencia. Para quedarse solo con ciclos simples, PostgreSQL trae la cláusula CYCLE. Cypher no repite la misma arista dentro de un patrón.\n\nPara quien pregunte \"¿entonces Facebook usa Neo4j?\": no. TAO modela el grafo social como objetos y asociaciones, pero guarda sobre MySQL con una caché encima. Usar el modelo de grafo no obliga a usar un motor de grafos.\n\nPreguntas para el grupo:\n• \"¿Cuántos joins hace la consulta SQL para 6 saltos?\" (6, uno por nivel).\n• \"Cliente, cuenta, movimiento: ¿grafo o relacional?\" Relacional: la profundidad es fija y bastan dos joins. \"Hay relaciones\" no quiere decir \"necesito grafos\".\n\nTransición: \"Hasta aquí, Mexi Banco. Ahora un dominio de sus proyectos, y es el que más trampa tiene.\"\n\nFuentes: fuentes/02-familias-de-bd.md, §3 fila 3; §2.5 Grafos (LinkedIn LIquid, 23-jul-2020: \"unas 250 búsquedas aleatorias\" y \"al menos 50,000 entidades\"; el patrón -[:TRANSFIRIO*3..6]->; TAO); §2.1 (\"WITH RECURSIVE paga un join por salto\").\n\n[VERIFICAR: la cláusula CYCLE de WITH RECURSIVE existe desde PostgreSQL 14 · lo digo de memoria; no está en las fuentes.]\n\nQuitado de la lámina (dilo si sirve): Escenario original: \"antifraude: ¿el dinero que salió de esta cuenta regresó a ella?\" · Chip \"WITH RECURSIVE\" del encabezado relacional · \"LinkedIn: con unos cientos de contactos, tu 2.º grado pasa de 50,000; con un join, unas 250 búsquedas aleatorias.\" · Veredicto: \"Gana el grafo (copia derivada) desde 3 saltos; a 2 saltos basta relacional.\"", "- Qué decir: \"El TTL de Redis tienta, y mucho: SET con NX aparta solo si nadie lo tiene, y EX 600 lo libera en 10 minutos sin ningún cron. Funciona hasta el día del failover. Redis replica de forma asíncrona y su propia especificación admite que una escritura ya confirmada se puede perder: la réplica que asciende no tiene la llave, el segundo SET también responde OK y dos personas pagan el F12. En PostgreSQL, el índice UNIQUE solo deja una fila por asiento; ON CONFLICT reemplaza la reserva solo si ya venció, y si la sentencia afecta 0 filas, el asiento ya tiene dueño.\"\n\nLo que Redis sí hace bien aquí: pintar el mapa de asientos para miles de personas que solo miran. Es una copia que se permite estar vieja; si dice \"libre\" y ya no lo está, la base lo rechaza al apartar.\n\nLa alternativa del \"o bien\" aplica cuando cualquier asiento de la zona sirve. Los asientos ya existen como filas y cada quien toma uno distinto sin esperar a los demás:\n    SELECT asiento FROM asiento\n     WHERE evento = 77 AND zona = 'B'\n       AND (cliente IS NULL OR expira_en < now())\n     ORDER BY asiento\n     LIMIT 1\n     FOR UPDATE SKIP LOCKED;\n    Luego, en la misma transacción, un UPDATE asiento SET cliente = :c, expira_en = now() + interval '10 minutes' sobre la fila que regresó, y el COMMIT.\n\nEs el mismo argumento que la llave de idempotencia del SPEI en Mexi Banco: si vive en Redis y un failover la pierde, el SPEI sale dos veces. Por eso va con un UNIQUE junto a la transferencia.\n\nPreguntas para el grupo:\n• \"Si Redis responde OK, ¿la reserva ya es segura?\" No: el OK lo da el primario antes de replicar.\n• \"¿Qué parte de su sistema no puede repetirse nunca?\" Esa parte va en la base de registro.\n\nPreguntas en vivo a los equipos (sin nombres; Oscar elige a quién):\n• \"Para paquetería: cada escaneo en sucursal es un evento de rastreo de la guía. ¿En qué familia lo guardarían?\" Respuesta corta: a escala nacional, columnas anchas. Solo se agregan eventos y siempre se lee \"los eventos de esta guía, en orden\", con partición por guia y clustering por ts, y no hay invariantes entre guías. Para el proyecto basta PostgreSQL: la familia se elige por patrón y por escala.\n• \"Para el juez en línea: la tabla de posiciones durante el concurso, ¿ORDER BY en cada refresco o sorted set?\" Respuesta corta: un sorted set con ZINCRBY y ZREVRANGE, que da el top N en O(log n) con cientos de refrescos por segundo. Los envíos y veredictos se quedan en relacional, que es la verdad, y desde ahí se reconstruye la tabla. Es la misma lección de los boletos: Redis para lo rápido, la base para lo que no puede perderse.\n\nTransición: \"Tres duelos, tres ganadores. El último no tiene perdedor: un mismo sistema con dos familias.\"\n\nFuentes: fuentes/02-familias-de-bd.md, §3 fila 6 (la consulta y la frase \"Redis puede acelerar el mapa de asientos, pero no decide quién se queda con uno\"), filas 5 y 7 para las preguntas, §2.2 (\"No brilla: ser la fuente de verdad\") y §4 (la llave de idempotencia). Libro, cap. 10, §7.6: Redis Cluster usa replicación asíncrona y \"usualmente hay pequeñas ventanas en las que escrituras reconocidas pueden perderse\".\n\n[VERIFICAR: que el comando WAIT de Redis reduce la ventana pero no vuelve a Redis fuertemente consistente · lo digo de memoria; solo si alguien lo pregunta.]\n\nQuitado de la lámina (dilo si sirve): Failover completo: \"el primario cae antes de replicar y la réplica asciende sin esa llave.\" · \"Redis replica de forma asíncrona (libro, cap. 10, §7.6).\" · \"o bien: SELECT ... FOR UPDATE SKIP LOCKED\" · Chip \"SET NX EX 600\" del encabezado Redis · Escenario original: \"dos personas eligen el asiento F12 del evento 77 en el mismo segundo.\" · Veredicto (⚠ TRAMPA): \"El TTL expira bien, pero no garantiza un solo dueño: decide la base.\"", "- Qué decir: \"Cada restaurante arma su menú distinto: uno tiene tamaños, otro extras, otro combos. En relacional terminarías con tablas EAV o con veinte columnas en NULL; un documento por restaurante se lee completo en una sola consulta. Pero en cuanto alguien pide, aparecen reglas: el total cuadra con los renglones, hay un solo pago por pedido y el precio queda congelado aunque mañana cambie el menú. Eso va en relacional y en una transacción. Fíjense en el 110: es el Pastor de 95 más el queso de 15, copiado del menú en el momento de pedir.\"\n\nCierre del bloque: \"Cuatro duelos y una sola regla: gana la familia cuya estructura coincide con la pregunta, y la verdad se queda donde viven los invariantes.\"\n\nPreguntas para el grupo:\n• \"Si mañana el Pastor sube a 105, ¿qué le pasa al pedido 5001?\" Nada: el renglón guarda los 110 que se cobraron.\n• \"¿Podría el menú ir en JSONB dentro de PostgreSQL?\" Sí, y para un proyecto chico es buena opción, porque es una sola base que operar.\n\nPreguntas en vivo a los equipos (sin nombres):\n• \"Para streaming: 'canciones parecidas a esta' y 'lo que escuchan tus amigos', ¿son la misma familia?\" Respuesta corta: no. Lo parecido es vectorial: embeddings y búsqueda ANN, como Spotify con Voyager. Lo de tus amigos es un recorrido: grafo.\n• \"Para mascotas extraviadas: alguien busca 'perrita café collar rojo' cerca de Iztapalapa, y luego hay que avisar a los vecinos. ¿Qué familias?\" Respuesta corta: un índice invertido, con sinónimos (perrita → perro), tolerancia a errores y filtro geográfico en una sola consulta. Las alertas por municipio (\"a quién le aviso\") van en relacional, con un índice en municipio.\n\nPara quien pregunte por un caso real: eBay guarda el carrito completo de cada usuario como un solo objeto JSON en MongoDB, y Oracle guarda un resumen como copia persistente. Documentos para el agregado y relacional para la verdad.\n\nTransición al descanso: \"Antes del descanso, piénsenlo: el saldo que ve el cliente en la app, ¿tiene que salir siempre de la base? Regresando, lo vemos con la caché.\"\n\nFuentes: fuentes/02-familias-de-bd.md, §3 fila 10 (el menú en documentos y el pedido y el pago en relacional, \"porque ahí
