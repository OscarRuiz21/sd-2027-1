 sí hay invariantes\"), filas 8 y 9 para las preguntas, §2.3 Documentos (esquema en lectura, EAV y el caso de eBay del 31-ene-2017).\n\nQuitado de la lámina (dilo si sirve): Escenario original: \"Tacos Don Memo arma su menú con combos, tamaños y extras; tú pides y pagas.\" · \"Cada platillo trae sus propios campos: sin tablas EAV.\" · Pie original (es la pregunta de la transición al descanso): \"El saldo que ve el cliente en la app, ¿tiene que salir siempre de la base?\"", "Qué decir: \"Antes del descanso quedó una pregunta: el saldo que ve el cliente en la app, ¿tiene que salir siempre de la base? Para contestarla hay que ver cuánto cuesta ir lejos. Si una referencia a memoria durara 1 min 40 s, una ida y vuelta dentro del centro de datos duraría casi seis días, un seek de disco casi cuatro meses y un paquete a Europa y de regreso casi cinco años. Una caché local vive en el renglón de la memoria y Redis en el de la red: los dos están órdenes de magnitud antes que el disco.\"\n\nPreguntas para el grupo:\n\n\"En esta escala, ¿cuánto tarda un GET a Redis en el mismo centro de datos?\" (unos 5.8 días).\n\n\"¿Y si ese Redis está en otra región?\" (años).\n\nDato medido, para quien pregunte: un get a memcache en Facebook tardaba 333 µs de mediana y 1.135 ms en el p95, contando red, ruteo y deserialización (Nishtala et al., 2013, §7.1).\n\nTransición: \"Pero el profesor de FIUBA insiste en que la velocidad no es lo que más compra la caché. Hagamos la cuenta con Mexi Banco en quincena.\"\n\nFuentes: Dean, Designs, Lessons and Advice from Building Large Distributed Systems, LADIS 2009, lámina \"Numbers Everyone Should Know\". Norvig publica una tabla casi idéntica con el seek en 8 ms. La columna escalada es cuenta nuestra (fuentes/03-cache.md, §1).\n\n[VERIFICAR: latencias de hardware actual (SSD NVMe, red de 25 Gbps) · la tabla es de 2009 y la versión interactiva de Colin Scott extrapola, no mide; no dar cifras actuales en vivo.]\n\nQuitado de la lámina (dilo si sirve): Más cerca no es un poco más rápido: es otro orden de magnitud. · DEAN, 2009 · Enviar 2 KB por red de 1 Gbps · 20 µs · 5.6 horas · Leer 1 MB secuencial de memoria · 250 µs · 2.9 días · Leer 1 MB secuencial de disco · 20 ms · 7.6 meses · Hardware de 2009. Lo que vale es el orden: memoria, red, disco, otro continente.", "Qué decir: \"El profesor de FIUBA lo escribe en el pizarrón: el objetivo de la caché es aumentar la capacidad del sistema, el throughput máximo. Con la ley de Little, una base con 50 conexiones y 10 ms por consulta aguanta 5 000 por segundo; en quincena llegan 10 000, el doble. Con 90 % de aciertos a la base le llegan 1 000; con 99 %, 100. Fíjense: el hit ratio sube 9 puntos, pero la carga baja 10 veces, porque lo que manda es la tasa de fallos. La latencia mejora menos (6.7 y 16.7 veces) que la carga. Y el lado oscuro: si Redis se cae, la base recibe el doble de lo que aguanta. La caché ya es parte de la capacidad; AWS llama a eso un servicio adicto a su caché.\"\n\nPreguntas para el grupo:\n\n\"Si el hit ratio sube de 90 a 99 %, ¿cuántas veces baja la carga de la base?\" (10).\n\n\"¿Qué pasa si reinician Redis a las 12 del día de quincena?\"\n\n\"¿Ustedes notarían la diferencia entre 10 ms y 1.5 ms en la app?\" (no; por eso la razón es la capacidad).\n\nPrecisión, para quien pregunte: la cuenta de FIUBA usa 98 %, 1 ms contra 10 ms, y da 1.18 ms, \"unas 8 veces más capacidad\". Esas 8 veces son de la capa web; la base recibe 50 veces menos lecturas. Los pools de Facebook fallan entre 0.053 % y 7.85 % de las veces (Nishtala et al., tabla 2).\n\nTransición: \"Ya sabemos para qué. Ahora, ¿dónde ponemos esa copia?\"\n\nFuentes:\n\nFIUBA TA050 clase 9: 0:24:58 (throughput = paralelismo / tiempo por query), 0:32:01 (la cuenta del 98 %), 0:35:01 (el objetivo es la capacidad) y 0:36:46 (proteger la base).\n\nFotogramas t003214.jpg (look-aside con \"hit ratio 98 %\") y t003534.jpg (la cuenta y \"OBJETIVO: aumentar la capacidad del sistema\").\n\nCuenta de Mexi Banco: fuentes/03-cache.md, §1, con supuestos ilustrativos.\n\nChhabra, Caching challenges and strategies, Amazon Builders' Library, 2019.\n\n[VERIFICAR: el umbral de 400 ms que menciona el video (0:34:09) sería de Doherty y Thadani, IBM, 1982 · solo hay fuentes secundarias; no citar al autor en vivo.]\n\nQuitado de la lámina (dilo si sirve): La base aguanta 50 conexiones / 0.010 s = 5 000 consultas por segundo (ley de Little). · latencia promedio = t_caché + (1 − h) · t_base · 10 000 lecturas/s · consultas a la base · uso de la capacidad · 100 % · latencia promedio 10 ms más la cola · 0.5 + 0.1 × 10 = 1.5 ms · 0.5 + 0.01 × 10 = 0.6 ms · La cuenta · t_base = 10 ms (Postgres) · t_caché = 0.5 ms (Redis) · pool = 50 (conexiones) · 50 / 0.010 s = 5 000/s (tope) · Azul: caché · verde: base", "Qué decir: \"Puede haber una copia en cada capa: la caché HTTP del navegador, la CDN, el gateway, la memoria de cada JVM, un Redis aparte y hasta dentro de la base, el buffer pool, que es coherente por construcción. Lo importante es quién la invalida, porque en cada capa es alguien distinto. Hoy nos quedamos con la 4 y la 5. Caffeine vive en el heap de cada réplica: cuesta nanosegundos, pero con tres réplicas de cuentas hay tres copias que no se ven entre sí. Redis es una sola copia compartida, a una ida y vuelta de red, y es una pieza más que puede caerse.\"\n\nPreguntas para el grupo:\n\n\"¿Caffeine o Redis para el catálogo de bancos SPEI? ¿Y para el saldo que se muestra?\" (Caffeine para lo que cambia poco y es igual para todos; Redis si todas las réplicas deben ver lo mismo o se invalida al escribir).\n\n\"Si la réplica 1 atendió la transferencia, ¿cómo se entera la réplica 2?\" (no se entera; solo por TTL).\n\nPara quien pregunte:\n\nRedis 6 tiene client-side caching: el servidor recuerda qué claves leyó cada cliente y le manda INVALIDATE cuando cambian.\n\nInnoDB suele usar hasta el 80 % de la RAM para su buffer pool; Postgres recomienda empezar shared_buffers en 25 %.\n\nMySQL retiró su caché de resultados en la 8.0 porque no escalaba (Lord, 2017).\n\nUna réplica de lectura también es una copia que puede ir atrás, pero completa y mantenida por la base; la caché es parcial y la mantiene tu código.\n\nTransición: \"Sea cual sea la capa, la copia muere de alguna forma. Veamos cuáles.\"\n\nFuentes: fuentes/03-cache.md, §2; Chhabra, 2019 (\"los datos en caché serán inconsistentes de servidor a servidor en toda la flota\"); RFC 9111; manual de MySQL 8.4; docs de PostgreSQL y de Redis.\n\nQuitado de la lámina (dilo si sirve): Cache-Control · CloudFront · proxy_cache · Caffeine · Redis · buffer pool · más cerca del usuario · más cerca de la verdad · vieja · ✗ 3 copias que no se ven: la 2 no se entera del cambio · cada réplica arranca vacía · ✓ una sola copia para todas las réplicas · un salto de red y", "Qué decir: \"Una entrada de caché muere de tres formas. Expira: le pusimos 600 segundos y TTL nos dice cuánto le queda. Se desaloja: se acabó la memoria y Redis saca la menos usada, pero solo si se lo pedimos, porque de fábrica rechaza escrituras. Y se invalida: alguien sabe que la verdad cambió y hace DEL. Solo esa tercera tiene que ver con la verdad; el TTL solo acota cuánto dura el error. Por eso el profesor de FIUBA aconseja invalidar explícitamente y dejar el TTL por si acaso, como red de seguridad contra bugs. En Spring, @Cacheable es el GET y el SET, y @CacheEvict es el DEL.\"\n\nPreguntas para el grupo:\n\n\"Si configuro volatile-lru y ninguna clave tiene TTL, ¿qué pasa cuando se llena?\" (se comporta como noeviction y rechaza escrituras).\n\n\"¿Un SET de refresco conserva el TTL?\" (no; lo descarta, salvo con KEEPTTL).\n\n\"¿Y si pongo un TTL de un segundo y ya?\" (mata el hit ratio; FIUBA 0:47:54).\n\nPara quien pregunte:\n\nTTL regresa -2 si la clave no existe y -1 si no tiene TTL.\n\nEl LRU de Redis es aproximado por muestreo (maxmemory-samples 5).\n\nCaffeine usa Window TinyLFU.\n\n@CachePut siempre ejecuta y escribe: actualiza, no invalida, y por eso no lo usamos (siguiente lámina).\n\nUna llamada desde la misma clase no pasa por el proxy y no se cachea.\n\nEn Spring Data Redis las claves no expiran salvo que se configure el TTL.\n\nTransición: \"Ya vimos la invalidación con DEL. Pero hay más formas de que la app conviva con la base: cinco patrones.\"\n\nFuentes:\n\nDocs de Redis: comando SET, Key eviction.\n\nDocs de Spring Framework: Declarative Annotation-based Caching.\n\nLibro, cap. 10, §7.3, §7.4 y §7.7.\n\nFIUBA 0:46:37 (el TTL como atajo), 0:47:54 y 0:48:21 (el TTL como red de seguridad); fotograma t004816.jpg (READ y WRITE con DELETE).\n\nfuentes/03-cache.md, §3.\n\n[VERIFICAR: RedisCacheManager guarda la clave como cuenta::002180000000000001 (doble dos puntos) con el prefijo por defecto · la lámina usa cuenta: en los comandos para que se lean fácil; en el lab se ve el prefijo real.]\n\n[VERIFICAR: cuentas.cargar(clabe, monto) es un método de repositorio con el UPDATE ... WHERE saldo >= :m de la última lámina del bloque · el lab v06 descuenta en la entidad JPA; ajustar al nombre real del lab v09.]\n\nQuitado de la lámina (dilo si sirve): Solo la tercera sabe que la verdad cambió. · Sale la que menos se usó hace poco", "Qué decir: \"Cache-aside es el del lab: la app pregunta a la caché, y si falla va a la base y llena la caché; al escribir, actualiza la base y hace DEL. En read-through la app solo habla con la caché, y la caché sabe cargar: así funcionan una CDN, DAX de Amazon y un LoadingCache de Caffeine. Del lado de la escritura: write-through escribe en las dos a la vez, write-behind confirma en la caché y propaga después (por eso nunca para dinero) y write-around escribe solo en la base.\"\n\nPreguntas para el grupo:\n\n\"¿Por qué write-behind nunca para movimientos?\" (si la caché muere antes de propagar, se pierde una escritura que ya confirmamos; la caché se volvió la fuente de verdad).\n\n\"En cache-aside, ¿qué pasa si Redis se cae?\" (la app sigue, más lenta; regresa la cuenta de la capacidad).\n\nPara quien pregunte: FIUBA los llama look-aside y look-through (0:38:06). Read-through es común: la documentación de DAX dice que en un miss \"hace un GetItem eventualmente consistente contra DynamoDB\" y lo guarda. Lo raro es escribir uno mismo un servidor read-through con lógica de negocio.\n\nTransición: \"Ojo con write-through: el ejemplo de AWS hace UPDATE y luego SET a la caché. Esa es justo la secuencia que Facebook evita. ¿Por qué?\"\n\nFuentes:\n\nAWS, guía de ElastiCache, Caching strategies (lazy loading y write-through; \"cache miss penalty\", \"stale data\", \"cache churn\").\n\nDocumentación de DAX (read-through, write-through y write-around).\n\nDocs de Redis (cache-aside, write-through y write-behind).\n\nLibro, cap. 10, §7.2; fuentes/03-cache.md, §4.\n\nFIUBA 0:38:06; fotograma t003214.jpg para el dibujo de look-aside.\n\nRecorte de densidad aplicado según Dudas, punto 8: los pies grises bajo los cinco minidiagramas pasan a estas notas. Cache-aside: la app llena la caché. Read-through: la caché se llena sola. Write-through: escribe en las dos. Write-behind: la base, después. Write-around: solo la base.\n\nQuitado de la lámina (dilo si sirve): ✓ Simple; si la caché muere, la app sigue · Sí existe: CDN, DAX, Caffeine LoadingCache · ✓ Un solo lugar carga y agrupa misses · Mexi Banco: catálogo de bancos SPEI · ✓ Lo recién escrito ya está en caché · Mexi Banco: perfil del cliente · ✓ Escrituras rapidísimas, en lote · ✓ No llena la caché con lo que no se lee · Mexi Banco: carga de movimientos históricos", "Qué decir: \"Dos transferencias sobre la misma cuenta: A deja 1 500 y B deja 900, y en la base gana B. Si cada una hace SET a la caché después de escribir, las respuestas pueden llegar en otro orden, y la caché se queda con 1 500 para siempre si no hay TTL. Con DEL da igual el orden y da igual borrar dos veces: el próximo lector falla, lee 900 y llena la caché. El profesor de FIUBA dice que escribir en la base y en la caché es una mini transacción distribuida. Por eso el orden importa: primero la verdad, y el DEL después del commit.\"\n\nPreguntas para el grupo:\n\n\"Con SET, ¿qué valor queda en la caché?\" (1 500, el viejo).\n\n\"¿Qué pasa si el DEL se manda dos veces?\" (nada: es idempotente).\n\n\"¿Y si borro antes del commit?\" (un lector se mete en la ventana y recarga el viejo).\n\nEn Spring:\n\n@CacheEvict y no @CachePut.\n\nTransactionAwareCacheDecorator ejecuta put y evict \"solo en la fase posterior al commit de una transacción exitosa\", y RedisCacheManager lo activa con transactionAware().\n\nSi memcache falla después de escribir la base, no es grave: el próximo miss trae el valor bueno. Al revés (caché primero y base después), si falla la base la caché queda con un valor que nunca existió (FIUBA 0:51:30).\n\nTransición: \"Borrar resuelve la carrera de dos escritores. Pero hay otra, entre un lector y un escritor, que el DEL no arregla.\"\n\nFuentes:\n\nFIUBA 0:48:48 (carrera 1), 0:51:02 (\"el delete es, como dice el paper, idempotente\") y 0:51:30; fotograma t005104.jpg (C1 y C2 con SET(x,1) y SET(x,2) tachados y DELETE(x) en rojo).\n\nNishtala et al., 2013, §2.\n\nJavadoc de Spring Framework de TransactionAwareCacheDecorator.\n\n[VERIFICAR: si en Spring Boot un @CacheEvict dentro de un método @Transactional corre antes o después del commit sin transactionAware() · depende del orden de los interceptores y no está probado; en vivo, decir \"actívalo con transactionAware()\" y no afirmar el comportamiento por defecto.]\n\nQuitado de la lámina (dilo si sirve): Con SET, si dos escrituras se cruzan, la caché se queda con la que llegó al último. · «Elegimos borrar los datos de la caché en vez de actualizarlos porque los borrados son idempotentes.» · Nishtala et al., Scaling Memcache at Facebook, NSDI 2013, §2", "Qué decir: \"Es la misma carrera de antes, ahora entre un lector y un escritor. A falla, lee V1 y se queda dormido. Mientras, B escribe V2 y hace su DEL, como debe. A despierta y guarda V1. Nada falló y la caché quedó envenenada. Facebook lo arregla con leases: en un miss, memcached entrega un token de 64 bits atado a la clave, y el SET tiene que traerlo. El DEL de B anula el token, así que el SET viejo de A se rechaza. El profesor de FIUBA lo llama optimistic locking, y el paper lo compara con load-link/store-conditional: es de la familia del CAS.\"\n\nPreguntas para el grupo:\n\n\"¿Qué pieza falló aquí?\" (ninguna).\n\n\"¿El TTL lo arregla?\" (solo acota cuánto dura).\n\n\"¿Por qué esto es fácil de hacer en memcached?\" (cada clave vive en una sola máquina, \"no hay que hacer ningún Raft\", FIUBA 1:24:36).\n\nPara quien pregunte:\n\nRedis no trae leases; lo más cercano es SET k v IFEQ viejo (desde 8.4) o WATCH, MULTI y EXEC.\n\nMeta cuenta la misma carrera en TAO con x = 42 y x = 43, y agrega que versionar ayuda salvo cuando la versión nueva se desaloja antes de que llegue el relleno viejo (Pan, 2022).\n\nEl paper no da un TTL del lease en milisegundos; lo que da es la ventana de 10 segundos.\n\nTransición: \"El lease tiene un segundo uso: cuando miles fallan a la vez, solo uno va a la base.\"\n\nFuentes:\n\nNishtala et al., 2013, §3.2.1 (token de 64 bits, un lease por clave cada 10 s, de 17 000 a 1 300 consultas por segundo).\n\nFIUBA 1:24:59 (carrera 3) y 1:27:36 (lease como optimistic locking y CAS).\n\nFotogramas t013506.jpg y t013742.jpg, de cuando el profesor vuelve a la página en el cierre: GET(K) → (MISS, LEASE), SET(K, V1, L1) con \"ERROR\", y la tabla K | V | L con la fila tachada.\n\nGray y Cheriton, 1989, origen de los leases.\n\n[VERIFICAR: que IFEQ esté en Redis desde la 8.4 · viene de fuentes/03-cache.md y no lo cotejé contra la documentación.]\n\nQuitado de la lámina (dilo si sirve): El lease es un permiso para hacer SET, y cualquier DEL lo anula. · hasta que expire, o para siempre · 64 bits · GET k → miss + L2 → SELECT V2 → SET k V2 L2 ✓ · los demás esperan y reintentan.", "Qué decir: \"El ejemplo de FIUBA es un tweet muy popular: todos aciertan en la caché y la base está bien protegida. Se edita el tweet, se borra la clave y miles de servidores fallan a la vez y van a la base por el mismo dato. Remedios, de más a menos coordinación: que solo uno cargue (el lease, o un candado en Redis con NX); agrupar dentro del proceso con sync = true, que solo sirve dentro de una JVM; o servir el valor viejo mientras uno recarga. Dos historias: el profesor tumbó una base en Twitter invalidando de 1 % en 1 %, porque no pensó en las hot keys. Y Facebook se cayó unas dos horas y media en 2010 por un ciclo parecido en una caché de configuración.\"\n\nPreguntas para el grupo:\n\n\"Con tres réplicas de cuentas y sync = true, ¿cuántas consultas llegan a la base?\" (tres).\n\n\"¿Qué clave de Mexi Banco sería caliente en quincena?\" (la configuración o el catálogo que lee cada transferencia).\n\nPrecisiones:\n\nEl paper pone el énfasis en las escrituras repetidas sobre una clave caliente, no en un solo borrado (§3.2.1).\n\nLo de Facebook en 2010 no fue mcsqueal. Un sistema revisaba valores de configuración en la caché y, si los veía inválidos, los recargaba de la base; un valor nuevo se leyó como inválido y la base recibió \"cientos de miles de consultas por segundo\". Hubo que apagar el sitio (Johnson, 2010).\n\nNo repetir que Twitter no dejaba editar tweets \"para optimizar cachés\": es una opinión del profesor sin fuente.\n\nPara quien pregunte: XFetch recalcula antes de que expire, con una probabilidad que crece al acercarse el vencimiento (Vattani et al., PVLDB 2015). Los flags del meta protocol son N, W, Z y X.\n\nTransición: \"Hasta aquí el DEL lo manda la app. ¿Y si se le olvida, o se cae justo después del commit?\"\n\nFuentes:\n\nFIUBA 1:15:58 (thundering herd) y 1:19:23 (leases), con los fotogramas t011640.jpg (FE contra MC) y t013346.jpg (1 000 FE, \"HOT KEY: clave muy leída\", GET(k) → (MISS, LEASE), 64 bit y (MISS, 'RETRY')).\n\nFIUBA 1:33:42 (la anécdota de Twitter).\n\nJohnson, More Details on Today's Outage, Facebook Engineering, 23-sep-2010.\n\nDocs de Spring (sync = true) y Chhabra, 2019.\n\n[VERIFICAR: dar al TTL un poco de azar (jitter) para que muchas claves no venzan juntas · es práctica común, pero no hay fuente primaria; no ponerlo como remedio con nombre.]\n\nQuitado de la lámina (dilo si sirve): Todos van a la base al mismo tiempo, por el mismo dato. · ✗ solo dentro de una JVM: con 3 réplicas, 3 consultas · memcached: meta protocol · AWS: TTL suave y duro · El porcentaje de claves no mide la carga. · 23 de septiembre de 2010 · Una caché de configuración: si la base fallaba, los clientes borraban la clave y volvían a consultar.", "Qué decir: \"En Facebook, el DEL importante no lo manda la app: lo manda mcsqueal, un demonio pegado al commit log de cada base. Ve lo que se confirmó, deduce qué claves borrar y manda los DEL, en lote y con la posibilidad de reenviarlos. El profesor de FIUBA le pone el nombre de hoy: CDC, y en la industria se arma con Debezium y Kafka. En Mexi Banco ya tenemos las piezas: transferencias guarda el evento en el outbox dentro de su transacción, el relay lo publica en movimientos, y un consumidor hace DEL cuenta:{clabe}. O Debezium lee el WAL directamente. Como la entrega es at-least-once, el mismo evento puede llegar dos veces: un DEL repetido no hace daño, pero un SET repetido deja la caché en 1 500.\"\n\nPreguntas para el grupo:\n\n\"¿Qué pasa si el consumidor recibe dos veces el mismo evento?\"\n\n\"¿Y si en vez de DEL hiciera SET con el saldo del evento?\" (depende del orden; FIUBA: \"si hacen los updates pueden tener una race condition\").\n\nPara quien pregunte:\n\n¿Cómo sabe mcsqueal qué clave borrar? Las sentencias SQL llevaban las claves: Facebook extendió la gramática de MySQL con MEMCACHE_DIRTY (Sobel, 2008). El profesor supone que iban en un comentario, y la idea de fondo es correcta.\n\nKleppmann explica por qué no conviene que la app escriba en dos almacenes: pueden quedar \"inconsistentes para siempre\".\n\nPrecisión: el paper dibuja el commit log de MySQL, que en MySQL es el binlog; WAL es el nombre de Postgres. Para el concepto da igual.\n\nTransición: \"mcsqueal tiene otra razón de ser: Facebook tiene varias regiones, y ahí el DEL de la app no alcanza.\"\n\nFuentes:\n\nFIUBA 0:56:13, 0:58:21 (mcsqueal) y 1:01:24 (CDC con Debezium y Kafka); fotogramas t005938.jpg (dos regiones, MC SQUEAL, WAL) y t013210.jpg (con \"CDC DEBEZIUM\" y el UPDATE ... -- KEYS ['users:123']).\n\nNishtala et al., 2013, §4.1 (18 veces más borrados por paquete) y §5.\n\nKleppmann, Using logs to build a solid data infrastructure, 2015, y DDIA, cap. 11.\n\nfuentes/03-cache.md, §5.\n\nQuitado de la lámina (dilo si sirve): El DEL sale solo de lo confirmado, va en lote y se puede reenviar si se pierde. · grupo propio · ✓ el log solo trae lo confirmado: el DEL llega después del commit", "Qué decir: \"Un usuario escribe desde la región réplica. Su escritura viaja al master de la otra región y su DEL solo toca la caché local. Un lector de su misma región falla, va a la réplica local, que todavía no recibe el cambio, y rellena la caché con el valor viejo. Facebook pone primero una marca, r_k: aquí puede estar viejo. Quien la encuentre lee del master, más lejos pero fresco. Cuando el cambio llega por replicación, mcsqueal borra la marca.\"\n\nPregunta para el grupo: \"¿Por qué no leer siempre del master?\" (latencia entre regiones: en la escala de Dean, años).\n\nPrecisión: el paper avisa que el mecanismo \"puede revelar información vieja durante modificaciones concurrentes de la misma clave\", y que una marca no es caché: borrar una entrada de caché siempre es seguro, pero perder una marca sí rompe la garantía.\n\nTransición: \"Con todo esto, ¿qué decide Mexi Banco que nunca sale de una copia?\"\n\nFuentes:\n\nFIUBA 1:08:17 (carrera 2), 1:11:15 (remote markers) y 1:14:40 (mcsqueal borra la marca).\n\nFotogramas t011434.jpg (FE SET(RK), ① UPDATE_MASTER, ② DELETE(K) y el lector GET(RK) → HIT), t013302.jpg (\"REDIRIGE AL PRIMARY\") y t013146.jpg (dos regiones con DELAY).\n\nNishtala et al., 2013, §5.\n\nQuitado de la lámina (dilo si sirve): Con réplicas asíncronas, un lector puede rellenar la caché desde una réplica atrasada. · con k y r_k en el SQL · lejos, pero fresco", "Qué decir: \"Regresamos a la pregunta del principio: el saldo que ve el cliente, ¿sale siempre de la base? No: el saldo para mostrar puede salir de caché, con TTL corto, DEL al transferir y la hora del dato a la vista. Pero el saldo para autorizar una transferencia nunca: se lee y se descuenta en la base en una sola sentencia, que es una operación linealizable. Las claves de idempotencia y las sesiones no son caché: si Redis las desaloja, se pierde la garantía. Y lo de Steam: en Navidad de 2015, durante un ataque, una regla de caché guardó por error páginas de usuarios autenticados; entre las 11:50 y las 13:20, hora del Pacífico, unos 34 000 usuarios pudieron ver datos de otros. Antes de preguntar cuánto dura una copia, hay que preguntar de quién es.\"\n\nPreguntas para el grupo (una por equipo, sin nombres):\n\nPaquetería con rastreo: \"¿Cacheas el estado del paquete? ¿Con qué TTL, y quién lo invalida cuando el repartidor escanea?\"\n\nJuez en línea: \"¿El veredicto de un envío se cachea? ¿Y la tabla de posiciones del concurso?\"\n\nStreaming de música: \"¿Qué va en la CDN y qué nunca, como la sesión o la lista privada?\"\n\nMascotas extraviadas: \"¿Cacheas la búsqueda por zona? ¿Qué pasa si alguien ve como perdida una mascota que ya apareció?\"\n\nOtra fila para quien pregunte: los límites diarios y los contadores antifraude van en la base, o con mucho cuidado, porque deciden, no solo muestran.\n\nTransición al bloque 6: \"En todo este bloque hubo un dueño de la verdad, la base, y alguien que invalida las copias. ¿Y si no hay un dueño de la verdad que pueda invalidar las copias? Si todos guardan una copia del libro mayor y nadie manda, necesitamos otra cosa.\"\n\nFuentes:\n\nfuentes/03-cache.md, §5 (tabla) y §7 (Steam).\n\nComunicado de Valve sobre el 25 de diciembre de 2015.\n\nRFC 9111.\n\nAjuste de composición según Dudas, punto 8: el rótulo opcional «linealizable» queda solo en notas. Se conserva la fila del catálogo SPEI.\n\nQuitado de la lámina (dilo si sirve): POR QUÉ · Decide dinero: se lee y se descuenta en la base, en una sola sentencia. · Es un read model: puede ir atrás. Muestra la hora del dato. · El historial no cambia; lo nuevo entra arriba. · Cambia poco y lo lee todo el mundo. · Si se desalojan, se pierde la garantía. · Movimientos · Páginas viejas con TTL largo; la primera, DEL con cada movimiento · 25-dic-2015", "Qué decir: \"Antes de hablar de blockchain hay que nombrar lo que un blockchain guarda: un libro mayor. Es la lista de todos los movimientos, en orden, y solo se le agrega al final. El saldo no es la verdad: es lo que sale de sumar el libro. Esto ya lo vieron con Kreps en la S09: un log más el estado que se deriva de él. En Mexi Banco la tabla de movimientos es la verdad y el saldo es una copia derivada, como todo lo que vimos hoy. La pregunta del resto del bloque es una sola: ¿quién decide en qué orden entran los movimientos?\"\n\nPreguntas para el grupo:\n\n\"Si se borra la columna de saldos, ¿se pierde algo?\" (no: se recalcula sumando el libro).\n\n\"Si se borra una fila del libro, ¿se puede recuperar?\" (no: el libro es la verdad).\n\nTransición: \"Mexi Banco tiene un dueño que ordena el libro. Empecemos por ahí, con algo que ya conocen: Raft.\"\n\nFuentes: Kreps, The Log (2013), lectura de la S09: tabla y log como dualidad. FIUBA TA050 clase 13, 0:13:31: \"estado materializado del sistema\" junto al log (fotograma t001328.jpg).", "Qué decir: \"Hagamos un libro mayor distribuido con lo que ya saben. Cinco nodos con Raft. Ada manda T1, $500 a Beto. El líder lo anota, lo replica a la mayoría y el saldo de Ada queda en $500. Ahora Ada intenta la trampa: manda T2, $600 a Caro, por otro nodo, esperando que no se entere. No importa por dónde entre: el seguidor se lo reenvía al líder, y el líder ya tiene anotado T1. Lo rechaza. Con Raft, un libro mayor es casi trivial: el líder ordena, y al ordenar evita el doble gasto. Quédense con esa idea: el problema es el orden. Ahora vamos a quitarle a Raft sus supuestos uno por uno.\"\n\nPreguntas para el grupo:\n\n\"¿Y si T2 entra por un seguidor? ¿No se salta al líder?\" (no: el seguidor lo reenvía; en Raft solo el líder escribe en el log).\n\n\"¿Qué supuestos de Raft hacen que esto funcione?\" (un dueño que controla las cinco máquinas, nodos que se caen pero no mienten y un censo fijo).\n\nTransición: \"¿Y si no puede haber un dueño de las cinco máquinas?\"\n\nFuentes: FIUBA TA050 clase 13, 0:13:31 a 0:17:27: \"el líder ordena las transferencias y, al ordenar las transferencias, evita el double spend\" (fotogramas t001328.jpg, t001622.jpg, t001724.jpg). La pregunta del alumno sobre el seguidor está en el 0:14:56. Ongaro y Ousterhout (2014).", "Qué decir: \"Hoy hace 18 años, el 31 de octubre de 2008, Satoshi Nakamoto mandó a una lista de correo un paper de nueve páginas. Su punto de partida es el §1: los pagos por internet dependen de un tercero de confianza, el banco, y eso tiene costos. Hay que confiar en él, puede revertir pagos y, agregaba el invitado de FIUBA, puede cerrarte la cuenta de un día para otro. La propuesta es un libro mayor sin dueño, con tres requisitos: que cualquiera pueda entrar, que nadie pueda censurar y que nadie pueda reescribir la historia. Pero fíjense en lo que acabamos de quitar: el dueño era el que ordenaba. Todo lo que sigue es cómo recuperar el orden sin él.\"\n\nPreguntas para el grupo:\n\n\"¿Mexi Banco necesita esto?\" (no para su core: ahí el dueño es justamente el banco, y la ley lo pide).\n\n\"¿Qué pierden las tres propiedades si vuelve a haber un dueño?\" (las tres dependen de que nadie controle la red).\n\nTransición: \"Si cualquiera puede entrar, no podemos suponer que todos son honestos.\"\n\nFuentes: Nakamoto (2008), §1 (confianza, costos y reversibilidad). La censura y los tres requisitos (sin permisos, descentralizado, tamper-proof) vienen de FIUBA TA050 clase 13, 0:08:06 y 0:11:29 (fotograma t001036.jpg). El paper se publicó el 31-oct-2008; el bloque génesis es del 3-ene-2009.\n\nCuidado: la censura no está en el paper; es el aporte del invitado.", "Qué decir: \"Raft se diseñó para máquinas que controlamos: un nodo falla callándose, nunca mintiendo. Si un nodo de Raft empieza a mentir, por ejemplo diciendo que es el líder y anotando que Ada tiene un millón, el sistema se rompe muy rápido; ni siquiera hace falta que sean mayoría. Sin dueño, cualquiera puede correr un nodo, así que hay que suponer que algunos mienten. Eso se llama falla bizantina, por el problema de los generales bizantinos de Lamport, Shostak y Pease, de 1982. Y hay un segundo hueco: Raft cuenta votos sobre un censo fijo de 5. Aquí nadie sabe cuántos son.\"\n\nPreguntas para el grupo:\n\n\"¿Cuál es la diferencia entre un nodo caído y uno que miente?\" (al caído se le espera o se le ignora; al que miente hay que poder descubrirlo).\n\nTransición: \"Primer supuesto perdido: ya no hay login de la empresa. ¿Cómo sabemos que un pago lo autorizó Ada?\"\n\nFuentes: Lamport, Shostak y Pease (1982), The Byzantine Generals Problem. FIUBA TA050 clase 13, 0:17:46 y 0:18:44: \"en Raft, si empezás a generar nodos deshonestos, rompés el sistema muy rápido; no hace falta llegar a la mayoría\" (fotograma t001744.jpg).\n\nCuidado: el invitado le atribuye el problema a Dijkstra, pero es de Lamport, Shostak y Pease. No lo repitas.", "Qué decir: \"Sin un dueño no hay login: nadie te da usuario y contraseña. La identidad pasa a ser un par de llaves. La privada solo la tiene Ada y con ella firma. La pública la conoce todo el mundo y con ella cualquiera verifica. Tómenlo como una caja negra con dos funciones, firmar y verificar. Si alguien cambia un solo dígito del mensaje, la firma ya no corresponde. Así, una transacción dice de quién, para quién, cuánto y la firma. Nadie necesita preguntarle a un banco quién es Ada: su cuenta es su llave pública.\"\n\nPreguntas para el grupo:\n\n\"Si pierdo la llave privada, ¿quién me la restablece?\" (nadie: no hay un \"olvidé mi contraseña\").\n\n\"¿La firma impide que Ada pague dos veces?\" (no: prueba quién autorizó, no en qué orden).\n\nTransición: \"Que la firma sea válida no basta. ¿Qué pasa si Beto reenvía el mismo pago firmado?\"\n\nFuentes: Nakamoto (2008), §2: una moneda es una cadena de firmas digitales. FIUBA TA050 clase 13, 0:19:11 a 0:20:30 (fotograma t001944.jpg). 3Blue1Brown, But how does bitcoin actually work? (2017), que explica las firmas.\n\nPrecisión: Bitcoin firma con ECDSA sobre secp256k1 y, desde Taproot (2021), también con Schnorr (BIP 340). La dirección se deriva de la llave pública; no es la llave tal cual. La firma 3045…a1c9 es ilustrativa.", "Qué decir: \"La firma prueba que Ada autorizó $500 a Beto. Pero una firma es solo datos: Beto puede copiar la transacción y mandarla otra vez. La firma sigue siendo válida y Ada pierde el doble. El arreglo es que cada pago diga qué dinero gasta, por ejemplo el depósito número 1. La segunda copia intenta gastar algo que ya se gastó y se rechaza. Es la misma idea que la Idempotency-Key de la S03: un identificador único que hace que repetir no cueste dos veces.\"\n\nPreguntas para el grupo:\n\n\"¿Por qué no basta con agregar la fecha al pago?\" (Beto copia también la fecha; lo que no se puede copiar es gastar dos veces la misma entrada).\n\nTransición: \"Para apuntar a 'lo que gasto' hace falta un nombre único e infalsificable para cada transacción. Ese nombre es su hash.\"\n\nFuentes: FIUBA TA050 clase 13, 0:21:49 (el ataque de repetición, fotograma t002524.jpg) y 1:15:17, donde el invitado corrige: lo que se referencia son las entradas (inputs), no solo \"la transacción anterior\". Nakamoto (2008), §2 y §9.\n\nSi se salta esta válvula: di en una frase que \"cada pago dice qué dinero gasta, y gastarlo dos veces se nota\". El modelo completo (UTXO) llega en la S12.", "Qué decir: \"Un hash es una función que convierte cualquier dato, un mensaje, un archivo o un bloque entero, en una huella de tamaño fijo. SHA-256 da 256 bits, 64 caracteres hexadecimales. Tiene tres propiedades. El mismo dato siempre da la misma huella. Un cambio mínimo, un 6 en lugar de un 5 o un punto al final, da una huella completamente distinta, sin parecido. Y de la huella no se puede regresar al dato. Estos valores son reales; pueden comprobarlos en su terminal. Así, cada transacción tiene un nombre único que nadie puede falsificar: su hash.\"\n\nComando para comprobarlo en vivo: printf 'Ada paga $500 a Beto' | shasum -a 256. En Linux también funciona sha256sum. En Git Bash, sha256sum.\n\nPreguntas para el grupo:\n\n\"¿Dónde ya usaron un hash sin darse cuenta?\" (los commits de Git, las contraseñas guardadas y la verificación de una descarga).\n\n\"¿El hash impide que alguien cambie el dato?\" (no: lo delata).\n\nTransición: \"Si cada pago tiene huella, podemos encadenar los pagos de modo que cambiar uno viejo se note.\"\n\nFuentes: FIUBA TA050 clase 13, 0:23:06. NIST FIPS 180-4 (SHA-256). Valores calculados el 30-oct-2026 con shasum -a 256.", "Qué decir: \"Ahora juntamos las piezas. Los pagos se agrupan en bloques, y cada bloque guarda la huella del anterior. Si alguien cambia en el bloque 101 el pago de Ada de $500 a $5,000, cambia el hash del 101, y el bloque 102, que guardaba el hash viejo, ya no coincide. Cualquiera lo detecta recalculando. Es un log, como el de Kafka, pero con integridad: cada bloque es posterior al anterior, sin importar a qué hora exacta. Ojo: recalcular hashes es barato. Quien altera puede recalcular el 101, el 102 y todos los siguientes. Por eso esto da evidencia, no imposibilidad. Lo que hace caro recalcular es la prueba de trabajo, y la vemos la próxima clase.\"\n\nPreguntas para el grupo:\n\n\"¿Puede quien altera recalcular todos los hashes?\" (sí, y es barato; falta algo que lo haga caro).\n\n\"Git también encadena por hash. ¿Por qué no es un blockchain?\" (no hay consenso: la rama principal la decide quien administra el repo).\n\nTransición: \"Ya sabemos quién firmó y si alguien alteró algo. Falta una pieza: Raft tenía un líder que ordenaba. Quitémoslo.\"\n\nFuentes: Nakamoto (2008), §3 (servidor de timestamps) y §4. FIUBA TA050 clase 13, 0:25:14 a 0:26:56: \"no importa exactamente en qué momento, lo que importa es que es posterior\" (fotograma t002528.jpg).\n\nQuitado del diseño anterior (dilo si sirve): el árbol de Merkle resume todas las transacciones de un bloque en un solo hash de 32 bytes (§7), y el encabezado de un bloque mide 80 bytes. Los hashes de los bloques son ilustrativos.", "Qué decir: \"Quitemos al último que quedaba: el líder. Sin líder, cada nodo le pasa lo que recibe a sus vecinos; eso se llama gossip, es chisme. Mandarle todo a todos sería impagable con miles de nodos. Ada hace la trampa: manda T1 a un lado de la red y T2 al otro. Cada mitad acepta el primero que le llegó y rechaza el otro. Las firmas son válidas, los hashes cuadran, y aun así hay dos historias: Ada gastó $1,100 teniendo $1,000. El invitado de FIUBA lo dice así: 'la identidad, todo bien; el tamper proofing, todo bien; el problema es la consistencia en la partición de la red'. Perdimos el orden. Nakamoto lo dice en el §2: para saber que una transacción no existe hay que conocerlas todas. Cómo se recupera el orden sin dueño es la prueba de trabajo, y la vemos la próxima clase.\"\n\nPreguntas para el grupo:\n\n\"¿Por qué no ordenar por la hora de cada pago?\" (cada nodo tiene su reloj, como en la S10, y Ada puede poner la hora que quiera).\n\n\"¿Y si votamos: una IP, un voto?\" (es la primera idea de la S12, y falla: cualquiera levanta millones de nodos).\n\nTransición al cierre: \"Cerremos la clase con todas las copias que vimos hoy en un solo dibujo.\"\n\nFuentes: FIUBA TA050 clase 13, 0:27:47 a 0:31:33 (fotogramas t002750.jpg, t003152.jpg). Nakamoto (2008), §2: \"la única forma de confirmar la ausencia de una transacción es estar al tanto de todas\". 3Blue1Brown 0:11:15: \"las mismas transacciones, en el mismo orden: ese es el corazón del problema\".\n\nCuidado: el invitado dice que el ancho de banda crece \"exponencialmente\" si se manda todo a todos. Crece con el número de nodos (O(n) por mensaje), no de forma exponencial.", "Qué decir: \"Esta es la clase en un dibujo. Hay un solo lugar donde el dato es verdad: la base de registro, que solo cambia su propio servicio con transacciones. Todo lo demás son copias, y cada copia necesita a alguien a cargo de su frescura. La caché se permite estar vieja: la limpian el TTL y el DEL después del commit. Los índices y los grafos son derivados: los reconstruye quien consume los eventos, por Outbox o por CDC. Y cuando no hay dueño, como en el blockchain, nadie invalida: todos verifican; cómo acuerdan el orden lo terminamos la próxima clase. La pregunta de la portada era dónde vive cada dato y qué pasa cuando vive en más de un lugar. La respuesta cabe en una frase: por cada copia, decide quién la invalida.\"\n\nPreguntas para el grupo:\n\n\"En su proyecto, ¿cuál es la verdad y cuáles son las copias? ¿Quién invalida cada una?\".\n\n\"Boletos con reserva que expira: si la reserva solo existe en Redis con TTL, ¿es verdad o copia?\" (si es la única, Redis se volvió la verdad sin querer).\n\n\"Menús de delivery: si el menú se copia a la caché, ¿quién la borra cuando se acaba un platillo?\".\n\nTransición al lab: \"En el lab lo hacen con sus manos sobre Mexi Banco: PostgreSQL como verdad, MongoDB y Redis como copias, y ustedes deciden quién invalida cada una.\"\n\nFuentes: contexto-clase.md (el hilo de la clase); fuentes/02-familias-de-bd.md §4 (Mexi Banco políglota: verdad o derivado y cómo se sincroniza cada uno); fuentes/03-cache.md (DEL después del commit, invalidar con eventos y CDC); Nishtala et al. (2013), §2: \"memcache no es la fuente autorizada de los datos\".\n\nQuitado de la lámina (dilo si sirve): Rótulos de las flechas: a la caché, «DEL tras commit»; a índices y grafos, «consumen el evento»; al blockchain, «su raíz, cada hora»."]);
function resize(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1600,innerHeight/900))}function show(n){current=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle('active',i===current));history.replaceState(null,'','#'+current);document.querySelector('#nt').textContent='Notas · '+String(current).padStart(2,'0');document.querySelector('#nb').innerText=scripts[current];document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1}function toggle(){notes.hidden=!notes.hidden}document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#note').onclick=toggle;document.querySelector('#close').onclick=toggle;document.querySelector('#print').onclick=()=>window.print();document.addEventListener('keydown',e=>{if(e.key==='Escape'){notes.hidden=true;return}if(e.key.toLowerCase()==='n'){toggle();return}if(!notes.hidden)return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});document.querySelector('#stage').addEventListener('click',e=>{if(e.target.closest('button')||!notes.hidden)return;const r=document.querySelector('#stage').getBoundingClientRect();show(current+(e.clientX<r.left+r.width*.18?-1:1))});window.addEventListener('resize',resize);window.addEventListener('hashchange',()=>show(Number(location.hash.slice(1))||0));resize();show(Number(location.hash.slice(1))||0);
</script></html>
