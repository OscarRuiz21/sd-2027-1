<circle cx="106" cy="818" r="22" fill="#fbefd7" stroke="#fbefd7" stroke-width="2" />

<text x="144" y="829" style="font-size:32px;fill:#202b33;" font-weight="700" text-anchor="start">Todo reloj local miente un poco, y si nadie lo corrige, miente más cada día.</text>

<section aria-label="Lámina 04: Pared y monotónico"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title04 desc04" style="background:#f7f6f1;font-family:Arial,Helvetica,sans-serif"><title id="title04">Pared y monotónico</title><desc id="desc04">¿Qué reloj leo para qué?</desc><defs>
<marker id="aink04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#202b33" /></marker>
<marker id="ablue04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#165bb5" /></marker>
<marker id="aviolet04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7546b3" /></marker>
<marker id="amuted04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#59666c" /></marker>
<marker id="aamber04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#986008" /></marker>
<marker id="agreen04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#217448" /></marker>
<marker id="ared04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#bc3433" /></marker>
</defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#f7f6f1" stroke="#f7f6f1" stroke-width="0" />
<text x="64" y="57" style="font-size:22px;fill:#202b33;" font-weight="400" text-anchor="start" class="small">04 / RELOJES FÍSICOS</text>
<path d="M64 82 H1536" fill="none" stroke="#d6dbd8" stroke-width="2" />
<text x="64" y="170" style="font-size:78px;fill:#202b33;" font-weight="700" text-anchor="start" letter-spacing="-3">Pared y monotónico</text>
<text x="66" y="218" style="font-size:36px;fill:#59666c;" font-weight="400" text-anchor="start">¿Qué reloj leo para qué?</text>
<text x="66" y="258" style="font-size:28px;fill:#202b33;" font-weight="400" text-anchor="start" class="body">El reloj de pared da la fecha y hora (UTC) y puede saltar hacia atrás.</text>
<text x="66" y="294" style="font-size:28px;fill:#202b33;" font-weight="400" text-anchor="start" class="body">El monotónico solo avanza: sirve para medir duraciones, no para comparar máquinas.</text>
<path d="M800 330 V665" fill="none" stroke="#d6dbd8" stroke-width="2" />
<g transform="translate(94 354) scale(1)" fill="none" stroke="#202b33" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="-21" y="-18" width="42" height="37" rx="3" /><path d="M-21 -7 H21 M-11 -24 V-13 M11 -24 V-13 M-12 2 H-7 M0 2 H5 M10 2 H15 M-12 11 H-7 M0 11 H5" /></g>
<text x="134" y="365" style="font-size:32px;fill:#202b33;" font-weight="700" text-anchor="start">Reloj de pared</text>
<g transform="translate(858 354) scale(1)" fill="none" stroke="#202b33" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cy="3" r="17" /><path d="M0 -14 V-23 M-7 -23 H7 M0 -8 V3 L8 8 M14 -13 L20 -19" /></g>
<text x="898" y="365" style="font-size:32px;fill:#202b33;" font-weight="700" text-anchor="start">Reloj monotónico</text>
<rect x="80" y="385" width="324" height="34" rx="6" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2" />
<text x="91" y="408" style="font-size:20px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">System.currentTimeMillis()</text>
<rect x="418" y="385" width="206" height="34" rx="6" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2" />
<text x="429" y="408" style="font-size:20px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">CLOCK_REALTIME</text>
<rect x="845" y="385" width="222" height="34" rx="6" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2" />
<text x="856" y="408" style="font-size:20px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">System.nanoTime()</text>
<rect x="1082" y="385" width="222" height="34" rx="6" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2" />
<text x="1093" y="408" style="font-size:20px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">CLOCK_MONOTONIC</text>
<path d="M100 557 H740 M100 557 V439" fill="none" stroke="#d6dbd8" stroke-width="2" />
<path d="M100 545 L395 455" fill="none" stroke="#202b33" stroke-width="3" />
<path d="M395 455 V529" fill="none" stroke="#bc3433" stroke-width="4" />
<path d="M395 529 L740 469" fill="none" stroke="#202b33" stroke-width="3" />
<text x="418" y="549" style="font-size:20px;fill:#bc3433;" font-weight="400" text-anchor="start">NTP corrige: salto hacia atrás</text>
<path d="M855 557 H1510 M855 557 V439" fill="none" stroke="#d6dbd8" stroke-width="2" />
<path d="M855 545 L1160 486 L1510 438" fill="none" stroke="#217448" stroke-width="3" />
<text x="1010" y="549" style="font-size:20px;fill:#217448;" font-weight="400" text-anchor="start">NTP solo cambia su ritmo</text>
<text x="80" y="601" style="font-size:22px;fill:#217448;" font-weight="400" text-anchor="start">✓ Fecha y hora: logs, vencimientos, agenda</text>
<text x="80" y="637" style="font-size:22px;fill:#bc3433;" font-weight="400" text-anchor="start">✗ Puede ir hacia atrás</text>
<text x="845" y="601" style="font-size:22px;fill:#217448;" font-weight="400" text-anchor="start">✓ Duraciones y timeouts</text>
<text x="845" y="634" style="font-size:22px;fill:#bc3433;" font-weight="400" text-anchor="start">✗ Su valor solo no significa nada:</text>
<text x="845" y="660" style="font-size:22px;fill:#bc3433;" font-weight="400" text-anchor="start">no se compara entre máquinas</text>
<rect x="66" y="685" width="1468" height="82" rx="10" fill="#fceceb" stroke="#d6dbd8" stroke-width="2" />
<text x="84" y="710" style="font-size:22px;fill:#202b33;" font-weight="400" text-anchor="start">Medir una duración con el reloj de pared:</text>
<text x="645" y="710" style="font-size:22px;fill:#bc3433;" font-weight="400" text-anchor="start">NTP salta 2 s atrás</text>
<text x="1153" y="710" style="font-size:22px;fill:#217448;" font-weight="400" text-anchor="start">✓ con nanoTime(): 0.5 s</text>
<rect x="84" y="723" width="274" height="34" rx="6" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2" />
<text x="95" y="746" style="font-size:20px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">inicio = 10:05:08.000</text>
<text x="371" y="749" style="font-size:24px;fill:#bc3433;" font-weight="400" text-anchor="start">→</text>
<rect x="408" y="723" width="250" height="34" rx="6" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2" />
<text x="419" y="746" style="font-size:20px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">fin = 10:05:06.500</text>
<rect x="681" y="723" width="290" height="34" rx="6" fill="#fceceb" stroke="#bc3433" stroke-width="2" />
<text x="692" y="746" style="font-size:20px;fill:#bc3433;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">fin - inicio = -1.5 s</text>
<path d="M1107 697 V754" fill="none" stroke="#d6dbd8" stroke-width="2" />
<rect x="64" y="786" width="1472" height="64" rx="12" fill="#ffffff" stroke="#d6dbd8" stroke-width="2" />
<circle cx="106" cy="818" r="22" fill="#e6f2e9" stroke="#e6f2e9" stroke-width="2" />
<g transform="translate(106 818) scale(0.65)" fill="none" stroke="#217448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cy="3" r="17" /><path d="M0 -14 V-23 M-7 -23 H7 M0 -8 V3 L8 8 M14 -13 L20 -19" /></g>
<text x="144" y="829" style="font-size:32px;fill:#202b33;" font-weight="700" text-anchor="start">Para medir cuánto tardó, el monotónico; para decir cuándo pasó, el de pared.</text>
<text x="66" y="880" style="font-size:20px;fill:#59666c;" font-weight="400" text-anchor="start">SISTEMAS DISTRIBUIDOS · FI-UNAM</text>
</svg></section>

<section aria-label="Lámina 05: Desfase"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title05 desc05" style="background:#f7f6f1;font-family:Arial,Helvetica,sans-serif"><title id="title05">Desfase</title><desc id="desc05">¿Puedo ordenar eventos de dos máquinas por su hora?</desc><defs>
<marker id="aink05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#202b33" /></marker>
<marker id="ablue05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#165bb5" /></marker>
<marker id="aviolet05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7546b3" /></marker>
<marker id="amuted05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#59666c" /></marker>
<marker id="aamber05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#986008" /></marker>
<marker id="agreen05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#217448" /></marker>
<marker id="ared05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#bc3433" /></marker>
</defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#f7f6f1" stroke="#f7f6f1" stroke-width="0" />
<text x="64" y="57" style="font-size:22px;fill:#202b33;" font-weight="400" text-anchor="start" class="small">05 / RELOJES FÍSICOS</text>
<path d="M64 82 H1536" fill="none" stroke="#d6dbd8" stroke-width="2" />
<text x="64" y="170" style="font-size:78px;fill:#202b33;" font-weight="700" text-anchor="start" letter-spacing="-3">Desfase</text>
<text x="66" y="218" style="font-size:36px;fill:#59666c;" font-weight="400" text-anchor="start">¿Puedo ordenar eventos de dos máquinas por su hora?</text>
<text x="66" y="258" style="font-size:28px;fill:#202b33;" font-weight="400" text-anchor="start" class="body">Desfase (clock skew, ε): la diferencia entre lo que marcan dos relojes en el mismo instante.</text>
<text x="66" y="294" style="font-size:28px;fill:#202b33;" font-weight="400" text-anchor="start" class="body">Si lo conociera exacto, lo restaría; el problema es que no se puede medir exacto.</text>
<path d="M110 372 V739" fill="none" stroke="#217448" stroke-width="2" marker-end="url(#agreen05)" />
<text x="84" y="560" style="font-size:20px;fill:#217448;" font-weight="400" text-anchor="middle" transform="rotate(-90 84 560)">tiempo real (modo Dios)</text>
<rect x="220.0" y="330" width="120" height="46" rx="12" fill="#ffffff" stroke="#d6dbd8" stroke-width="2" />
<text x="280" y="361" style="font-size:24px;fill:#202b33;" font-weight="700" text-anchor="middle" class="node">P1</text>
<path d="M280 376 V740" fill="none" stroke="#59666c" stroke-width="2" />
<rect x="520.0" y="330" width="120" height="46" rx="12" fill="#ffffff" stroke="#d6dbd8" stroke-width="2" />
<text x="580" y="361" style="font-size:24px;fill:#202b33;" font-weight="700" text-anchor="middle" class="node">P2</text>
<path d="M580 376 V740" fill="none" stroke="#59666c" stroke-width="2" />
<rect x="157" y="387" width="258" height="34" rx="6" fill="#eeedf5" stroke="#986008" stroke-width="2" />
<text x="168" y="410" style="font-size:20px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">va 5 min adelantado</text>
<path d="M280 450 H580" fill="none" stroke="#217448" stroke-width="2" stroke-dasharray="7 6" />
<circle cx="280" cy="450" r="9" fill="#202b33" stroke="#202b33" stroke-width="2" />
<circle cx="580" cy="640" r="9" fill="#202b33" stroke="#202b33" stroke-width="2" />
<text x="238" y="458" style="font-size:24px;fill:#202b33;" font-weight="700" text-anchor="end">E1</text>
<rect x="300" y="461" width="100" height="38" rx="6" fill="#eeedf5" stroke="#986008" stroke-width="2" />
<text x="311" y="488" style="font-size:24px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">10:03</text>
<text x="540" y="648" style="font-size:24px;fill:#202b33;" font-weight="700" text-anchor="end">E2</text>
<rect x="599" y="622" width="100" height="38" rx="6" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2" />
<text x="610" y="649" style="font-size:24px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">10:00</text>
<text x="310" y="555" style="font-size:20px;fill:#217448;" font-weight="400" text-anchor="start">E1 ocurrió primero</text>
<path d="M740 528 H830" fill="none" stroke="#59666c" stroke-width="5" marker-end="url(#amuted05)" />
<text x="785" y="428" style="font-size:20px;fill:#59666c;" font-weight="400" text-anchor="middle">un tercero</text>
<text x="785" y="455" style="font-size:20px;fill:#59666c;" font-weight="400" text-anchor="middle">ordena</text>
<text x="785" y="482" style="font-size:20px;fill:#59666c;" font-weight="400" text-anchor="middle">por hora</text>
<rect x="850" y="350" width="684" height="170" rx="12" fill="#ffffff" stroke="#d6dbd8" stroke-width="2" />
<text x="874" y="386" style="font-size:22px;fill:#59666c;" font-weight="400" text-anchor="start">ORDEN POR HORA</text>
<text x="874" y="430" style="font-size:24px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">1.  10:00  E2</text>
<text x="874" y="464" style="font-size:24px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">2.  10:03  E1</text>
<text x="1160" y="489" style="font-size:24px;fill:#bc3433;" font-weight="400" text-anchor="start">✗ Orden invertido</text>
<rect x="850" y="540" width="684" height="113" rx="12" fill="#fbefd7" stroke="#986008" stroke-width="2" />
<text x="874" y="571" style="font-size:24px;fill:#202b33;" font-weight="700" text-anchor="start">Si conozco ε, lo resto</text>
<rect x="874" y="590" width="274" height="34" rx="6" fill="#eeedf5" stroke="#986008" stroke-width="2" />
<text x="885" y="613" style="font-size:20px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">10:03 - 5 min = 9:58</text>
<text x="1170" y="618" style="font-size:22px;fill:#217448;" font-weight="400" text-anchor="start">✓ 9:58 &lt; 10:00: E1 primero</text>
<rect x="850" y="670" width="684" height="80" rx="12" fill="#fceceb" stroke="#bc3433" stroke-width="2" />
<text x="874" y="701" style="font-size:24px;fill:#bc3433;" font-weight="700" text-anchor="start">Pero ε no se mide exacto.</text>
<text x="874" y="732" style="font-size:20px;fill:#202b33;" font-weight="400" text-anchor="start">Para conocerlo hay que preguntar, y preguntar tarda.</text>
<rect x="64" y="786" width="1472" height="64" rx="12" fill="#ffffff" stroke="#d6dbd8" stroke-width="2" />
<circle cx="106" cy="818" r="22" fill="#fbefd7" stroke="#fbefd7" stroke-width="2" />
<g transform="translate(106 818) scale(0.65)" fill="none" stroke="#986008" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="-5" cy="-5" r="15" /><path d="M6 6 L22 22" /></g>
<text x="144" y="829" style="font-size:32px;fill:#202b33;" font-weight="700" text-anchor="start">Ordenar por hora solo funciona si sabes cuánto miente cada reloj.</text>
<text x="66" y="880" style="font-size:20px;fill:#59666c;" font-weight="400" text-anchor="start">SISTEMAS DISTRIBUIDOS · FI-UNAM</text>
</svg></section>

<section aria-label="Lámina 06: Cristian"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title06 desc06" style="background:#f7f6f1;font-family:Arial,Helvetica,sans-serif"><title id="title06">Cristian</title><desc id="desc06">¿Cómo sé qué hora es en la otra máquina?</desc><defs>

<rect x="0" y="0" width="1600" height="900" rx="0" fill="#f7f6f1" stroke="#f7f6f1" stroke-width="0" />
<text x="64" y="57" style="font-size:22px;fill:#202b33;" font-weight="400" text-anchor="start" class="small">06 / RELOJES FÍSICOS · VÁLVULA</text>
<path d="M64 82 H1536" fill="none" stroke="#d6dbd8" stroke-width="2" />
<text x="64" y="170" style="font-size:78px;fill:#202b33;" font-weight="700" text-anchor="start" letter-spacing="-3">Cristian</text>
<text x="66" y="218" style="font-size:36px;fill:#59666c;" font-weight="400" text-anchor="start">¿Cómo sé qué hora es en la otra máquina?</text>
<text x="66" y="258" style="font-size:28px;fill:#202b33;" font-weight="400" text-anchor="start" class="body">Pregunto la hora, mido la ida y vuelta (RTT) y supongo que me la leyeron a la mitad:</text>
<text x="66" y="294" style="font-size:28px;fill:#202b33;" font-weight="400" text-anchor="start" class="body">hora estimada = T_servidor + RTT / 2. El error queda dentro de ± RTT / 2.</text>
<rect x="175.0" y="328" width="170" height="46" rx="12" fill="#ffffff" stroke="#d6dbd8" stroke-width="2" />
<text x="260" y="359" style="font-size:24px;fill:#202b33;" font-weight="700" text-anchor="middle" class="node">Cliente</text>

<rect x="565.0" y="328" width="270" height="46" rx="12" fill="#ffffff" stroke="#d6dbd8" stroke-width="2" />
<text x="700" y="359" style="font-size:24px;fill:#202b33;" font-weight="700" text-anchor="middle" class="node">Servidor de tiempo</text>
<path d="M700 374 V750" fill="none" stroke="#59666c" stroke-width="2" />
<path d="M260 400 L700 560" fill="none" stroke="#165bb5" stroke-width="3" marker-end="url(#ablue06)" class="wire" style="stroke:#165bb5;stroke-width:3;marker-end:url(#ablue06)" />
<path d="M700 560 L260 720" fill="none" stroke="#59666c" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#amuted06)" class="return" style="stroke:#59666c;stroke-width:2;marker-end:url(#amuted06)" />
<path d="M260 560 H700" fill="none" stroke="#986008" stroke-width="2" stroke-dasharray="7 6" />
<circle cx="260" cy="400" r="9" fill="#165bb5" stroke="#165bb5" stroke-width="2" />
<circle cx="700" cy="560" r="9" fill="#165bb5" stroke="#165bb5" stroke-width="2" />
<circle cx="260" cy="720" r="9" fill="#59666c" stroke="#59666c" stroke-width="2" />
<rect x="275" y="384" width="150" height="36" rx="6" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2" />
<text x="286" y="409" style="font-size:22px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">T_A = 100</text>
<rect x="275" y="718" width="150" height="36" rx="6" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2" />
<text x="286" y="743" style="font-size:22px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">T_B = 140</text>
<rect x="590" y="584" width="215" height="34" rx="6" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2" />
<text x="601" y="607" style="font-size:20px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">T_servidor = 160</text>
<rect x="431" y="437" width="140" height="36" rx="6" fill="#eeedf5" stroke="#165bb5" stroke-width="2" />
<text x="442" y="462" style="font-size:22px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">get_time</text>
<rect x="432" y="653" width="127" height="36" rx="6" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2" />
<text x="443" y="678" style="font-size:22px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">ok(160)</text>
<path d="M205 400 H190 V720 H205" fill="none" stroke="#986008" stroke-width="2" />
<text x="163" y="560" style="font-size:22px;fill:#986008;" font-weight="400" text-anchor="middle" transform="rotate(-90 163 560)">RTT = 40 ms</text>
<text x="300" y="520" style="font-size:20px;fill:#986008;" font-weight="400" text-anchor="start">supongo que la leyó aquí,</text>
<text x="300" y="545" style="font-size:20px;fill:#986008;" font-weight="400" text-anchor="start">a la mitad</text>
<rect x="870" y="340" width="664" height="180" rx="14" fill="#ffffff" stroke="#165bb5" stroke-width="2" />
<circle cx="897" cy="368" r="20" fill="#165bb5" stroke="#165bb5" stroke-width="2" />
<text x="897" y="376" style="font-size:22px;fill:#ffffff;" font-weight="700" text-anchor="middle">1</text>
<g transform="translate(949 371) scale(0.8)" fill="none" stroke="#165bb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle r="18" /><path d="M0 -12 V0 L10 6" /></g>
<text x="983" y="378" style="font-size:24px;fill:#202b33;" font-weight="700" text-anchor="start">HORA ESTIMADA</text>
<text x="893" y="424" style="font-size:28px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">hora = T_servidor + RTT / 2</text>
<text x="893" y="465" style="font-size:24px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">= 160 + 40 / 2 = 180</text>
<text x="893" y="501" style="font-size:22px;fill:#202b33;" font-weight="400" text-anchor="start">Mi reloj marcaba 140: voy 40 ms atrasado.</text>
<rect x="870" y="545" width="324" height="177" rx="12" fill="#ffffff" stroke="#986008" stroke-width="2" />
<circle cx="897" cy="572" r="20" fill="#986008" stroke="#986008" stroke-width="2" />
<text x="897" y="580" style="font-size:22px;fill:#ffffff;" font-weight="700" text-anchor="middle">2</text>
<text x="927" y="579" style="font-size:20px;fill:#202b33;" font-weight="700" text-anchor="start">Ida 35 ms, vuelta 5 ms</text>

<path d="M925 605 L1136 655" fill="none" stroke="#165bb5" stroke-width="2" marker-end="url(#ablue06)" />
<path d="M1136 655 L925 671" fill="none" stroke="#59666c" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#amuted06)" />
<text x="1032" y="707" style="font-size:22px;fill:#986008;" font-weight="400" text-anchor="middle">desfase real: 25 ms</text>
<rect x="1210" y="545" width="324" height="177" rx="12" fill="#ffffff" stroke="#986008" stroke-width="2" />
<circle cx="1237" cy="572" r="20" fill="#986008" stroke="#986008" stroke-width="2" />
<text x="1237" y="580" style="font-size:22px;fill:#ffffff;" font-weight="700" text-anchor="middle">3</text>
<text x="1267" y="579" style="font-size:20px;fill:#202b33;" font-weight="700" text-anchor="start">Ida 5 ms, vuelta 35 ms</text>
<path d="M1265 600 V680 M1476 600 V680" fill="none" stroke="#59666c" stroke-width="2" />
<path d="M1265 605 L1476 616" fill="none" stroke="#165bb5" stroke-width="2" marker-end="url(#ablue06)" />
<path d="M1476 616 L1265 671" fill="none" stroke="#59666c" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#amuted06)" />
<text x="1372" y="707" style="font-size:22px;fill:#986008;" font-weight="400" text-anchor="middle">desfase real: 55 ms</text>
<text x="1202" y="747" style="font-size:22px;fill:#986008;" font-weight="700" text-anchor="middle">Mismo RTT, Cristian dice 40 en los dos:</text>
<text x="1202" y="773" style="font-size:22px;fill:#986008;" font-weight="700" text-anchor="middle">error ± 20 ms</text>
<rect x="64" y="786" width="1472" height="64" rx="12" fill="#ffffff" stroke="#d6dbd8" stroke-width="2" />
<circle cx="106" cy="818" r="22" fill="#fbefd7" stroke="#fbefd7" stroke-width="2" />
<g transform="translate(106 818) scale(0.65)" fill="none" stroke="#986008" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 -21 H14 M-14 21 H14 M-11 -21 Q-11 -6 0 0 Q11 6 11 21 M11 -21 Q11 -6 0 0 Q-11 6 -11 21" /></g>
<text x="144" y="829" style="font-size:32px;fill:#202b33;" font-weight="700" text-anchor="start">Puedo estimar la hora del otro, pero me equivoco hasta la mitad del viaje.</text>
<text x="66" y="880" style="font-size:20px;fill:#59666c;" font-weight="400" text-anchor="start">SISTEMAS DISTRIBUIDOS · FI-UNAM</text>
</svg></section>

<text x="1018" y="575" style="font-size:22px;fill:#ffffff;" font-weight="700" text-anchor="middle">3</text>
<g transform="translate(1064 567) scale(0.65)" fill="none" stroke="#217448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-25 0 Q-12 -27 0 0 T25 0" /></g>
<text x="1100" y="574" style="font-size:24px;fill:#202b33;" font-weight="700" text-anchor="start">Slew, no salto</text>
<text x="1001" y="610" style="font-size:20px;fill:#202b33;" font-weight="400" text-anchor="start">Acelera o frena el reloj poco</text>
<text x="1001" y="635" style="font-size:20px;fill:#202b33;" font-weight="400" text-anchor="start">a poco (hasta 500 ppm).</text>
<path d="M1000 644 H1534" fill="none" stroke="#d6dbd8" stroke-width="2" />
<path d="M1390 582 H1530" fill="none" stroke="#217448" stroke-width="1" stroke-dasharray="7 6" />
<path d="M1390 634 C1435 634 1450 585 1530 583" fill="none" stroke="#217448" stroke-width="2" />
<circle cx="1018" cy="672" r="20" fill="#bc3433" stroke="#bc3433" stroke-width="2" />
<text x="1018" y="680" style="font-size:22px;fill:#ffffff;" font-weight="700" text-anchor="middle">4</text>
<g transform="translate(1064 672) scale(0.65)" fill="none" stroke="#bc3433" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -21 L23 19 H-23 Z M0 -10 V5 M0 11 V13" /></g>
<text x="1100" y="679" style="font-size:24px;fill:#202b33;" font-weight="700" text-anchor="start">Step si el desfase es grande</text>
<text x="1001" y="715" style="font-size:20px;fill:#202b33;" font-weight="400" text-anchor="start">En ntpd, más de 128 ms: salta,</text>
<text x="1001" y="740" style="font-size:20px;fill:#202b33;" font-weight="400" text-anchor="start">y el reloj de pared puede ir atrás.</text>
<path d="M1000 749 H1534" fill="none" stroke="#d6dbd8" stroke-width="2" />
<path d="M1410 738 L1455 714 V740 L1530 703" fill="none" stroke="#bc3433" stroke-width="3" />
<rect x="64" y="786" width="1472" height="64" rx="12" fill="#ffffff" stroke="#d6dbd8" stroke-width="2" />
<circle cx="106" cy="818" r="22" fill="#e6f2e9" stroke="#e6f2e9" stroke-width="2" />
<g transform="translate(106 818) scale(0.65)" fill="none" stroke="#217448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-8 -8 H8 V8 H-8 Z M-12 -5 L-24 -17 L-15 -26 L-3 -14 M12 5 L24 17 L15 26 L3 14 M-4 12 L-15 23 M10 -12 Q24 -12 24 2 M10 -20 Q32 -20 32 2" /></g>
<text x="144" y="829" style="font-size:32px;fill:#202b33;" font-weight="700" text-anchor="start">NTP no pone la hora una vez: la mide y la corrige todo el tiempo.</text>
<text x="66" y="880" style="font-size:20px;fill:#59666c;" font-weight="400" text-anchor="start">SISTEMAS DISTRIBUIDOS · FI-UNAM</text>
</svg></section>

<section aria-label="Lámina 08: Cuatro marcas"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title08 desc08" style="background:#f7f6f1;font-family:Arial,Helvetica,sans-serif"><title id="title08">Cuatro marcas</title><desc id="desc08">¿Cómo calcula NTP el desfase si el mensaje tarda?</desc><defs>
<marker id="aink08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#202b33" /></marker>
<marker id="ablue08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#165bb5" /></marker>
<marker id="aviolet08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7546b3" /></marker>
<marker id="amuted08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#59666c" /></marker>
<marker id="aamber08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#986008" /></marker>
<marker id="agreen08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#217448" /></marker>
<marker id="ared08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#bc3433" /></marker>
</defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#f7f6f1" stroke="#f7f6f1" stroke-width="0" />
<text x="64" y="57" style="font-size:22px;fill:#202b33;" font-weight="400" text-anchor="start" class="small">08 / RELOJES FÍSICOS</text>
<path d="M64 82 H1536" fill="none" stroke="#d6dbd8" stroke-width="2" />
<text x="64" y="170" style="font-size:78px;fill:#202b33;" font-weight="700" text-anchor="start" letter-spacing="-3">Cuatro marcas</text>
<text x="66" y="218" style="font-size:36px;fill:#59666c;" font-weight="400" text-anchor="start">¿Cómo calcula NTP el desfase si el mensaje tarda?</text>
<text x="66" y="258" style="font-size:28px;fill:#202b33;" font-weight="400" text-anchor="start" class="body">En cada sondeo se anotan cuatro marcas: T1 y T4 con el reloj del cliente, T2 y T3 con el del servidor.</text>
<text x="66" y="294" style="font-size:28px;fill:#202b33;" font-weight="400" text-anchor="start" class="body">Con ellas salen el desfase θ y el retardo δ, sin contar lo que tardó el servidor.</text>
<rect x="85.0" y="326" width="270" height="46" rx="12" fill="#ffffff" stroke="#d6dbd8" stroke-width="2" />
<text x="220" y="357" style="font-size:24px;fill:#202b33;" font-weight="700" text-anchor="middle" class="node">Cliente · Mexi Banco</text>
<path d="M220 372 V710" fill="none" stroke="#59666c" stroke-width="2" />
<rect x="530.0" y="326" width="220" height="46" rx="12" fill="#ffffff" stroke="#d6dbd8" stroke-width="2" />
<text x="640" y="357" style="font-size:24px;fill:#202b33;" font-weight="700" text-anchor="middle" class="node">Servidor NTP</text>
<path d="M640 372 V710" fill="none" stroke="#59666c" stroke-width="2" />
<path d="M75 392 V693" fill="none" stroke="#59666c" stroke-width="2" marker-end="url(#amuted08)" />
<text x="56" y="546" style="font-size:20px;fill:#59666c;" font-weight="400" text-anchor="middle" transform="rotate(-90 56 546)">tiempo</text>
<path d="M220 400 L640 520" fill="none" stroke="#165bb5" stroke-width="3" marker-end="url(#ablue08)" class="wire" style="stroke:#165bb5;stroke-width:3;marker-end:url(#ablue08)" />
<path d="M640 548 L220 668" fill="none" stroke="#59666c" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#amuted08)" class="return" style="stroke:#59666c;stroke-width:2;marker-end:url(#amuted08)" />
<path d="M640 520 V548" fill="none" stroke="#986008" stroke-width="10" />
<circle cx="220" cy="400" r="7" fill="#165bb5" stroke="#165bb5" stroke-width="2" />
<circle cx="640" cy="520" r="7" fill="#165bb5" stroke="#165bb5" stroke-width="2" />
<circle cx="640" cy="548" r="7" fill="#986008" stroke="#986008" stroke-width="2" />
<circle cx="220" cy="668" r="7" fill="#59666c" stroke="#59666c" stroke-width="2" />
<rect x="235" y="379" width="145" height="36" rx="6" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2" />
<text x="246" y="404" style="font-size:22px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">T1 = 100</text>
<rect x="490" y="471" width="145" height="36" rx="6" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2" />
<text x="501" y="496" style="font-size:22px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">T2 = 160</text>
<rect x="490" y="562" width="145" height="36" rx="6" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2" />
<text x="501" y="587" style="font-size:22px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">T3 = 161</text>
<rect x="235" y="672" width="145" height="36" rx="6" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2" />
<text x="246" y="697" style="font-size:22px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">T4 = 141</text>
<text x="390" y="429" style="font-size:20px;fill:#165bb5;" font-weight="400" text-anchor="start">petición</text>
<text x="320" y="662" style="font-size:20px;fill:#59666c;" font-weight="400" text-anchor="start">respuesta (trae T2 y T3)</text>
<path d="M178 400 H162 V668 H178" fill="none" stroke="#202b33" stroke-width="2" />
<text x="139" y="541" style="font-size:20px;fill:#202b33;" font-weight="400" text-anchor="middle" transform="rotate(-90 139 541)">T4 - T1 = 41</text>
<path d="M666 520 H680 V548 H666" fill="none" stroke="#986008" stroke-width="2" />
<text x="687" y="539" style="font-size:20px;fill:#986008;" font-weight="400" text-anchor="start">procesa</text>
<text x="594" y="620" style="font-size:20px;fill:#986008;" font-weight="400" text-anchor="start">T3 - T2 = 1</text>
<text x="90" y="739" style="font-size:20px;fill:#59666c;" font-weight="400" text-anchor="start">valores en ms; T1 y T4 en el reloj del cliente,</text>
<text x="90" y="764" style="font-size:20px;fill:#59666c;" font-weight="400" text-anchor="start">T2 y T3 en el del servidor</text>
<rect x="800" y="330" width="734" height="190" rx="14" fill="#ffffff" stroke="#986008" stroke-width="2" />
<circle cx="827" cy="358" r="20" fill="#986008" stroke="#986008" stroke-width="2" />
<text x="827" y="366" style="font-size:22px;fill:#ffffff;" font-weight="700" text-anchor="middle">1</text>
<g transform="translate(879 361) scale(0.8)" fill="none" stroke="#986008" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle r="18" /><path d="M0 -12 V0 L10 6" /></g>
<text x="913" y="368" style="font-size:24px;fill:#202b33;" font-weight="700" text-anchor="start">Desfase θ</text>
<text x="823" y="405" style="font-size:28px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">θ = ((T2 - T1) + (T3 - T4)) / 2</text>
<text x="823" y="441" style="font-size:24px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">= ((160 - 100) + (161 - 141)) / 2</text>
<text x="823" y="474" style="font-size:24px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">= (60 + 20) / 2 = 40 ms</text>
<text x="823" y="505" style="font-size:22px;fill:#202b33;" font-weight="400" text-anchor="start">El cliente va 40 ms atrasado: hay que adelantarlo.</text>
<rect x="800" y="535" width="734" height="131" rx="14" fill="#ffffff" stroke="#165bb5" stroke-width="2" />
<circle cx="827" cy="563" r="20" fill="#165bb5" stroke="#165bb5" stroke-width="2" />
<text x="827" y="571" style="font-size:22px;fill:#ffffff;" font-weight="700" text-anchor="middle">2</text>
<g transform="translate(879 566) scale(0.8)" fill="none" stroke="#165bb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cy="3" r="17" /><path d="M0 -14 V-23 M-7 -23 H7 M0 -8 V3 L8 8 M14 -13 L20 -19" /></g>
<text x="913" y="573" style="font-size:24px;fill:#202b33;" font-weight="700" text-anchor="start">Retardo δ</text>
<text x="823" y="606" style="font-size:26px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">δ = (T4 - T1) - (T3 - T2)</text>
<text x="1230" y="606" style="font-size:22px;fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;" font-weight="400" text-anchor="start">= 41 - 1 = 40 ms</text>
<text x="823" y="649" style="font-size:22px;fill:#202b33;" font-weight="400" text-anchor="start">Tiempo en la red, ida y vuelta, sin contar al servidor.</text>
<rect x="800" y="683" width="734" height="77" rx="10" fill="#fbefd7" stroke="#986008" stroke-width="2" />
<g transform="translate(827 718) scale(0.65)" fill="none" stroke="#986008" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -21 L23 19 H-23 Z M0 -10 V5 M0 11 V13" /></g>
<text x="861" y="711" style="font-size:22px;fill:#202b33;" font-weight="700" text-anchor="start">Supone que la ida y la vuelta tardan lo mismo.</text>
<text x="861" y="742" style="font-size:22px;fill:#202b33;" font-weight="400" text-anchor="start">Si no, el error llega hasta ± δ / 2 = ± 20 ms.</text>
<rect x="64" y="786" width="1472" height="64" rx="12" fill="#ffffff" stroke="#d6dbd8" stroke-width="2" />
<circle cx="106" cy="818" r="22" fill="#fbefd7" stroke="#fbefd7" stroke-width="2" />
<g transform="translate(106 818) scale(0.65)" fill="none" stroke="#986008" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle r="18" /><path d="M0 -12 V0 L10 6" /></g>
<text x="144" y="829" style="font-size:32px;fill:#202b33;" font-weight="700" text-anchor="start">Cuatro marcas cancelan el viaje si es simétrico; si no, queda un error de hasta δ / 2.</text>
<text x="66" y="880" style="font-size:20px;fill:#59666c;" font-weight="400" text-anchor="start">SISTEMAS DISTRIBUIDOS · FI-UNAM</text>
</svg></section>

<section aria-label="Lámina 09: Incertidumbre"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title09 desc09" style="background:#f7f6f1;font-family:Arial,Helvetica,sans-serif"><title id="title09">Incertidumbre</title><desc id="desc09">¿Por qué ni con NTP los relojes coinciden?</desc><defs>
<marker id="aink09" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#202b33" /></marker>
<marker id="ablue09" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#165bb5" /></marker>
<marker id="aviolet09" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7546b3" /></marker>
<marker id="amuted09" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#59666c" /></marker>
<marker id="aamber09" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#986008" /></marker>
<marker id="agreen09" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#217448" /></marker>
<marker id="ared09" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#bc3433" /></marker>
</defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#f7f6f1" stroke="#f7f6f1" stroke-width="0" />
<text x="64" y="57" style="font-size:22px;fill:#202b33;" font-weight="400" text-anchor="start" class="small">09 / RELOJES FÍSICOS</text>
<path d="M64 82 H1536" fill="none" stroke="#d6dbd8" stroke-width="2" />
<text x="64" y="170" style="font-size:78px;fill:#202b33;" font-weight="700" text-anchor="start" letter-spacing="-3">Incertidumbre</text>
<text x="66" y="218" style="font-size:36px;fill:#59666c;" font-weight="400" text-anchor="start">¿Por qué ni con NTP los relojes coinciden?</text>
<text x="66" y="258" style="font-size:28px;fill:#202b33;" font-weight="400" text-anchor="start" class="body">Tres cosas impiden la sincronía perfecta: el cuarzo sigue derivando,</text>
<text x="66" y="294" style="font-size:28px;fill:#202b33;" font-weight="400" text-anchor="start" class="body">la red no tarda lo mismo de ida que de vuelta, y a UTC a veces le agregan un segundo.</text>
<path d="M290 470 L311 352 A120 120 0 0 1 382 393 Z" fill="#fbefd7" stroke="#986008" stroke-width="2" />
<circle cx="290" cy="470" r="120" fill="none" stroke="#202b33" stroke-width="6" />
<path d="M290.0 367.0 L290.0 356.0" fill="none" stroke="#202b33" stroke-width="3" />
<path d="M341.5 380.8 L347.0 371.3" fill="none" stroke="#202b33" stroke-width="3" />
<path d="M379.2 418.5 L388.7 413.0" fill="none" stroke="#202b33" stroke-width="3" />
<path d="M393.0 470.0 L404.0 470.0" fill="none" stroke="#202b33" stroke-width="3" />
<path d="M379.2 521.5 L388.7 527.0" fill="none" stroke="#202b33" stroke-width="3" />
<path d="M341.5 559.2 L347.0 568.7" fill="none" stroke="#202b33" stroke-width="3" />
<path d="M290.0 573.0 L290.0 584.0" fill="none" stroke="#202b33" stroke-width="3" />
<path d="M238.5 559.2 L233.0 568.7" fill="none" stroke="#202b33" stroke-width="3" />
<path d="M200.8 521.5 L191.3 527.0" fill="none" stroke="#202b33" stroke-width="3" />
<path d="M187.0 470.0 L176.0 470.0" fill="none" stroke="#202b33" stroke-width="3" />
<path d="M200.8 418.5 L191.3 413.0" fill="none" stroke="#202b33" stroke-width="3" />
<path d="M238.5 380.8 L233.0 371.3" fill="none" stroke="#202b33" stroke-width="3" />
<path d="M290 470 L309 362 M290 470 L230 450" fill="none" stroke="#202b33" stroke-width="5" />
<path d="M172 407 A138 138 0 0 0 205 578" fill="none" stroke="#986008" stroke-width="3" marker-end="url(#aamber09)" />
<path d="M409 534 A138 138 0 0 0 373 361" fill="none" stroke="#986008" stroke-width="3" marker-end="url(#aamber09)" />
<text x="290" y="625" style="font-size:24px;fill:#202b33;" font-weight="700" text-anchor="middle">Ventana de incertidumbre</text>
<text x="290" y="654" style="font-size:24px;fill:#986008;" font-weight="400" text-anchor="middle">± ε</text>
<rect x="80" y="677" width="420" height="82" rx="12" fill="#fceceb" stroke="#bc3433" stroke-width="2" />
<g transform="translate(110 708) scale(0.65)" fill="none" stroke="#bc3433" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -21 L23 19 H-23 Z M0 -10 V5 M0 11 V13" /></g>
<text x="146" y="704" style="font-size:22px;fill:#bc3433;" font-weight="700" text-anchor="start">Falla en silencio:</text>
<text x="146" y="730" style="font-size:20px;fill:#bc3433;" font-weight="400" text-anchor="start">no hay error de reloj,</text>
<text x="146" y="753" style="font-size:20px;fill:#bc3433;" font-weight="400" text-anchor="start">hay resultados equivocados.</text>
<rect x="560" y="330" width="620" height="115" rx="14" fill="#fbefd7" stroke="#986008" stroke-width="2" />
<circle cx="587" cy="358" r="20" fill="#986008" stroke="#986008" stroke-width="2" />
<text x="587" y="366" style="font-size:22px;fill:#ffffff;" font-weight="700" text-anchor="middle">1</text>
<g transform="translate(639 361) scale(0.8)" fill="none" stroke="#986008" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-21 15 A25 25 0 1 1 21 15 M0 6 L12 -9" /><circle cy="6" r="3" /></g>
<text x="673" y="368" style="font-size:24px;fill:#202b33;" font-weight="700" text-anchor="start">DERIVA</text>
<text x="584" y="402" style="font-size:20px;fill:#202b33;" font-weight="400" text-anchor="start">Entre un sondeo y otro, el cuarzo</text>
<text x="584" y="427" style="font-size:20px;fill:#202b33;" font-weight="400" text-anchor="start">se vuelve a separar.</text>
<rect x="700" y="475" width="620" height="115" rx="14" fill="#eee7f7" stroke="#7546b3" stroke-width="2" />
<circle cx="727" cy="503" r="20" fill="#7546b3" stroke="#7546b3" stroke-width="2" />
<text x="727" y="511" style="font-size:22px;fill:#ffffff;" font-weight="700" text-anchor="middle">2</text>
<text x="813" y="513" style="font-size:24px;fill:#202b33;" font-weight="700" text-anchor="start">LATENCIA VARIABLE</text>
<text x="724" y="547" style="font-size:20px;fill:#202b33;" font-weight="400" text-anchor="start">La ida y la vuelta no tardan lo mismo, y eso no</text>
<text x="724" y="572" style="font-size:20px;fill:#202b33;" font-weight="400" text-anchor="start">se mide desde los extremos: error hasta ± δ / 2.</text>
<rect x="840" y="620" width="620" height="115" rx="14" fill="#fceceb" stroke="#bc3433" stroke-width="2" />
<circle cx="867" cy="648" r="20" fill="#bc3433" stroke="#bc3433" stroke-width="2" />
<text x="867" y="656" style="font-size:22px;fill:#ffffff;" font-weight="700" text-anchor="middle">3</text>
<g transform="translate(919 651) scale(0.8)" fill="none" stroke="#bc3433" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="-21" y="-18" width="42" height="37" rx="3" /><path d="M-21 -7 H21 M-11 -24 V-13 M11 -24 V-13 M-12 2 H-7 M0 2 H5 M10 2 H15 M-12 11 H-7 M0 11 H5" /></g>
<text x="953" y="658" style="font-size:24px;fill:#202b33;" font-weight="700" text-anchor="start">SEGUNDO INTERCALAR</text>

<text x="66" y="218" style="font-size:36px;fill:#59666c;" font-weight="400" text-anchor="start">Si todos usan NTP, ¿ya resolvimos el orden?</text>
<text x="66" y="258" style="font-size:28px;fill:#202b33;" font-weight="400" text-anchor="start" class="body">Con NTP el log de Mexi Banco pasa de 5 s al revés a 3 ms al revés: mejor, pero sigue al revés.</text>
<text x="66" y="294" style="font-size:28px;fill:#202b33;" font-weight="400" text-anchor="start" class="body">Dos eventos más cercanos que el error no tienen orden seguro por hora.</text>

<text x="66" y="218" text-anchor="start" font-size="36" style="font-size:36px;fill:#59666c;">¿Y si dejamos de preguntar qué hora es y preguntamos qué pasó primero?</text>

<section aria-label="Lámina 14: Concurrente"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title14 desc14"><title id="title14">Concurrente</title><desc id="desc14">Concurrente significa que no hay camino causal, aunque los eventos se dibujen lejos en el tiempo real. A y H son concurrentes; D pudo influir en E. En Mexi Banco, a precede causalmente a c, pero las reglas no prueban que la transferencia causara el cambio de contraseña.</desc><defs>

<text x="66" y="258" text-anchor="start" font-size="30" style="font-size:30px;fill:#202b33;" class="body">Concurrentes: no hay camino entre ellos, así que ninguno pudo influir en el otro.</text>

<section aria-label="Lámina 15: Orden parcial"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title15 desc15"><title id="title15">Orden parcial</title><desc id="desc15">Comparación entre el orden total de los números naturales y el orden parcial de ocho eventos. El grafo conserva siete relaciones directas y señala A concurrente con D y G concurrente con H. Nueve de los veintiocho pares son concurrentes. Queda abierta la asignación de un número a cada evento.</desc><defs>

<section aria-label="Lámina 21: Consistente, no caracteriza"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title21 desc21"><title id="title21">Consistente, no caracteriza</title><desc id="desc21">Lamport es consistente con la causalidad, pero no la caracteriza. Si LC(A) &lt; LC(B), puede ser A → B o A concurrente con B.</desc><defs>

<marker id="Cgreen21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#217448"/></marker>

<path d="M64 82 L1536 82" fill="none" stroke="#d6dbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="64" y="170" font-size="78" style="font-size:78px;fill:#202b33;font-family:Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">Consistente, no caracteriza</text>
<text x="66" y="218" font-size="36" style="font-size:36px;fill:#59666c;font-family:Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">¿En qué sentido vale la flecha?</text>
<text x="66" y="258" font-size="30" style="font-size:30px;fill:#202b33;font-family:Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" class="body">Consistente: si hay causa, el número sube. Caracteriza: si el número sube, hay causa.</text>
<text x="66" y="294" font-size="30" style="font-size:30px;fill:#202b33;font-family:Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" class="body">Lamport cumple la primera, no la segunda.</text>
<rect x="66" y="330" width="714" height="260" rx="14" fill="#ffffff" stroke="#217448" stroke-width="3"/>
<rect x="820" y="330" width="714" height="260" rx="14" fill="#ffffff" stroke="#bc3433" stroke-width="3"/>
<text x="92" y="373" font-size="22" style="font-size:22px;fill:#217448;font-family:Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">CONSISTENTE CON LA CAUSALIDAD</text>
<text x="846" y="373" font-size="22" style="font-size:22px;fill:#bc3433;font-family:Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">CARACTERIZA LA CAUSALIDAD</text>
<text x="92" y="443" font-size="40" style="font-size:40px;fill:#202b33;font-family:Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">A → B  ⇒  LC(A) &lt; LC(B)</text>
<text x="846" y="443" font-size="40" style="font-size:40px;fill:#202b33;font-family:Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">LC(A) &lt; LC(B)</text>
<text x="1164" y="443" font-size="40" style="font-size:40px;fill:#202b33;font-family:Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">⇒</text>

<text x="1230" y="443" font-size="40" style="font-size:40px;fill:#165bb5;font-family:Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">A → B</text>
<circle cx="710" cy="506" r="28" fill="#217448" stroke="#202b33" stroke-width="0"/>
<text x="710" y="518" font-size="36" style="font-size:36px;fill:#ffffff;font-family:Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">✓</text>
<text x="92" y="516" font-size="28" style="font-size:28px;fill:#217448;font-family:Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">Lamport sí la cumple</text>
<circle cx="1464" cy="506" r="28" fill="#bc3433" stroke="#202b33" stroke-width="0"/>

<text x="846" y="516" font-size="28" style="font-size:28px;fill:#bc3433;font-family:Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">Lamport no la cumple</text>
<text x="92" y="562" font-size="22" style="font-size:22px;fill:#59666c;font-family:Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Ej.: el envío 3 y la recepción 4 de la cadena.</text>
<text xml:space="preserve" x="846" y="562" font-size="22" style="font-size:22px;fill:#59666c;font-family:Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Ej.: el contraejemplo, 1 &lt; 5 y A </text>

<rect x="690" y="700" width="140" height="46" rx="6" fill="#f8e7bf" stroke="#d6dbd8" stroke-width="1.5"/>
<text xml:space="preserve" x="720.859375" y="732.1" font-size="26" style="font-size:26px;fill:#986008;font-family:Menlo, Consolas, 'Courier New', monospace" font-weight="400" text-anchor="start">A </text>
<path d="M757.6515625 711.82 L757.6515625 734.1800000000001" fill="none" stroke="#986008" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M763.13125 711.82 L763.13125 734.1800000000001" fill="none" stroke="#986008" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<text xml:space="preserve" x="767.828125" y="732.1" font-size="26" style="font-size:26px;fill:#986008;font-family:Menlo, Consolas, 'Courier New', monospace" font-weight="400" text-anchor="start"> B</text>
<text x="850" y="647" font-size="22" style="font-size:22px;fill:#59666c;font-family:Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">A pudo influir en B</text>
<text x="850" y="732" font-size="22" style="font-size:22px;fill:#59666c;font-family:Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">concurrentes</text>
<path d="M1070 619 H1084 V665 Q1084 680 1100 680 Q1084 680 1084 695 V740 H1070" fill="none" stroke="#59666c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="1125" y="653" font-size="26" style="font-size:26px;fill:#202b33;font-family:Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">Con un solo número</text>
<text x="1125" y="687" font-size="26" style="font-size:26px;fill:#202b33;font-family:Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">no hay forma</text>

<text x="144" y="829" font-size="32" style="font-size:32px;fill:#202b33;font-family:Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">Lamport es consistente con la causalidad, pero no la caracteriza.</text>

<section aria-label="Lámina 22: Descartar y ordenar"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title22 desc22"><title id="title22">Descartar y ordenar</title><desc id="desc22">Dos usos de Lamport: descartar causas mediante la contrapositiva y ordenar por (LC, proceso). Los diez eventos del contraejemplo se ordenan con tres desempates por ID.</desc><defs>
<marker id="Cink22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#202b33"/></marker>
<marker id="Cmuted22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#59666c"/></marker>
<marker id="Cviolet22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7546b3"/></marker>
<marker id="Cblue22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#165bb5"/></marker>
<marker id="Cgreen22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#217448"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#f7f6f1" stroke="none" stroke-width="0"/>
<text x="64" y="57" font-size="22" style="font-size:22px;fill:#202b33;font-family:Arial, Helvetica, sans-serif;letter-spacing:1.6px" font-weight="400" text-anchor="start" class="small">22 / LAMPORT</text>
<path d="M64 82 L1536 82" fill="none" stroke="#d6dbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="64" y="170" font-size="78" style="font-size:78px;fill:#202b33;font-family:Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">Descartar y ordenar</text>
<text x="66" y="218" font-size="36" style="font-size:36px;fill:#59666c;font-family:Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Si no caracterizan, ¿para qué sirven?</text>
<text x="66" y="258" font-size="30" style="font-size:30px;fill:#202b33;font-family:Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" class="body">Dos usos que cuestan un solo número por mensaje:</text>
<text x="66" y="294" font-size="30" style="font-size:30px;fill:#202b33;font-family:Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" class="body">descartar causas y fabricar un orden total que respeta la causalidad.</text>

<text x="860" y="374" font-size="26" style="font-size:26px;fill:#202b33;font-family:Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">Orden total</text>

<path d="M-6 12 L17 12" fill="none" stroke="#7546b3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</g>

<section aria-label="Lámina 35: Lamport en Java"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title35 desc35"><title id="title35">Lamport en Java</title><desc id="desc35">Un AtomicLong implementa tick y recibir. A envía con marca 2; B recibe y calcula 3. La marca viaja dentro del evento de Kafka.</desc><defs>
<marker id="arrowblue35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#165bb5"/></marker>

<marker id="arrowmuted35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#59666c"/></marker>
<marker id="arrowgreen35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#217448"/></marker>
<marker id="arrowamber35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#986008"/></marker>
<marker id="arrowred35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#bc3433"/></marker>
</defs>
<rect width="1600" height="900" fill="#f7f6f1"/>
<text x="64" y="57" style="fill:#202b33;font-size:22px;" class="small">35 / CIERRE</text>
<path d="M64 82 L1536 82" fill="none" stroke="#d6dbd8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="170" style="fill:#202b33;font-size:78px;" font-weight="700" letter-spacing="-3">Lamport en Java</text>
<text x="66" y="218" style="fill:#59666c;font-size:36px;" >¿Cuánto código es un reloj de Lamport?</text>
<text x="66" y="258" style="fill:#202b33;font-size:30px;" >Un contador atómico: sube en cada evento y en cada envío.</text>
<text x="66" y="294" style="fill:#202b33;font-size:30px;" >Al recibir, toma el máximo entre el suyo y el del mensaje, y suma uno.</text>
<rect x="66" y="320" width="754" height="405" rx="14" fill="#202b33" stroke="#202b33" stroke-width="2"/>
<text x="90" y="350" style="fill:#f7f6f1;font-size:21px;font-family:Menlo, Consolas, 'Courier New', monospace;" xml:space="preserve">public class LamportClock {</text>
<text x="90" y="377" style="fill:#f7f6f1;font-size:21px;font-family:Menlo, Consolas, 'Courier New', monospace;" xml:space="preserve">    private final AtomicLong reloj = new AtomicLong(0);</text>
<text x="90" y="404" style="fill:#f7f6f1;font-size:21px;font-family:Menlo, Consolas, 'Courier New', monospace;" xml:space="preserve"></text>
<text x="90" y="431" style="fill:#a9b4ba;font-size:21px;font-family:Menlo, Consolas, 'Courier New', monospace;" xml:space="preserve">    // evento local o envío</text>
<text x="90" y="458" style="fill:#f7f6f1;font-size:21px;font-family:Menlo, Consolas, 'Courier New', monospace;" xml:space="preserve">    public long tick() {</text>
<text x="90" y="485" style="fill:#f7f6f1;font-size:21px;font-family:Menlo, Consolas, 'Courier New', monospace;" xml:space="preserve">        return reloj.<tspan fill="#9cc3f5">incrementAndGet</tspan>();</text>
<text x="90" y="512" style="fill:#f7f6f1;font-size:21px;font-family:Menlo, Consolas, 'Courier New', monospace;" xml:space="preserve">    }</text>
<text x="90" y="539" style="fill:#f7f6f1;font-size:21px;font-family:Menlo, Consolas, 'Courier New', monospace;" xml:space="preserve"></text>
<text x="90" y="566" style="fill:#a9b4ba;font-size:21px;font-family:Menlo, Consolas, 'Courier New', monospace;" xml:space="preserve">    // recepción de un mensaje con su marca</text>
<text x="90" y="593" style="fill:#f7f6f1;font-size:21px;font-family:Menlo, Consolas, 'Courier New', monospace;" xml:space="preserve">    public long recibir(long remota) {</text>
<text x="90" y="620" style="fill:#f7f6f1;font-size:21px;font-family:Menlo, Consolas, 'Courier New', monospace;" xml:space="preserve">        return reloj.updateAndGet(</text>
<text x="90" y="647" style="fill:#f7f6f1;font-size:21px;font-family:Menlo, Consolas, 'Courier New', monospace;" xml:space="preserve">            local -&gt; <tspan fill="#9cc3f5">Math.max(local, remota) + 1</tspan>);</text>
<text x="90" y="674" style="fill:#f7f6f1;font-size:21px;font-family:Menlo, Consolas, 'Courier New', monospace;" xml:space="preserve">    }</text>
<text x="90" y="701" style="fill:#f7f6f1;font-size:21px;font-family:Menlo, Consolas, 'Courier New', monospace;" xml:space="preserve">}</text>
<text x="1030" y="345" style="fill:#202b33;font-size:24px;" font-weight="700" text-anchor="middle" >servidor A</text>
<path d="M1030 360 L1030 555" fill="none" stroke="#59666c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowmuted35)"/>

<section aria-label="Lámina 40: Antes, después, concurrentes"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title40 desc40"><title id="title40">Antes, después, concurrentes</title><desc id="desc40">Tres relojes: físicos para la hora aproximada, Lamport para una condición necesaria de causalidad, vectores para comparar antes, después y concurrencia. Banda verde con la idea clave de la clase.</desc><defs>

<text x="64" y="170" style="fill:#202b33;font-size:78px;" font-weight="700" letter-spacing="-3">Antes, después, concurrentes</text>
<text x="66" y="218" style="fill:#59666c;font-size:36px;" >¿Cómo sabemos qué pasó primero sin un reloj compartido?</text>
<text x="66" y="269" style="fill:#202b33;font-size:30px;" >Tres relojes, tres preguntas: cada uno sabe un poco más que el anterior.</text>

<circle cx="608" cy="356" r="22" fill="#165bb5"/>
<text x="608" y="364" style="fill:white;font-size:24px;" font-weight="700" text-anchor="middle" >2</text>
<text x="642" y="366" style="fill:#202b33;font-size:28px;" font-weight="700" >Lamport</text>

<text x="980.4" y="365.6" style="fill:#165bb5;font-size:20px;" font-weight="700" text-anchor="middle" >42</text>
<text x="596" y="410" style="fill:#165bb5;font-size:24px;" font-weight="700" >¿Pudo A causar B?</text>
<text x="596" y="545" style="fill:#202b33;font-size:22px;" >Si A → B, entonces LC(A) &lt; LC(B).</text>
<text x="596" y="575" style="fill:#202b33;font-size:22px;" >Al revés no se cumple.</text>

<circle cx="1114" cy="356" r="22" fill="#7546b3"/>

<text x="200" y="678" style="fill:#202b33;font-size:32px;" font-weight="700" >No siempre necesitamos saber qué hora es; necesitamos saber</text>
<text x="200" y="722" style="font-size:32px;fill:#202b33" font-weight="700"><tspan style="fill:#165bb5">qué pasó antes</tspan>, <tspan style="fill:#165bb5">qué pasó después</tspan> y qué eventos son <tspan style="fill:#7546b3">concurrentes</tspan>.</text>

</g>
<text x="144" y="829" style="fill:#202b33;font-size:32px;" font-weight="700" >El orden se construye; no se lee del reloj.</text>

<section aria-label="Lámina 41: Su propia historia"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title41 desc41"><title id="title41">Su propia historia</title><desc id="desc41">Tres ideas: ya viene construido, las garantías no son lo mismo, y hay que saber qué ofrece cada tecnología. Un sistema distribuido puede razonar correctamente sobre su propia historia.</desc><defs>

<rect width="1600" height="900" fill="#f7f6f1"/>
<text x="64" y="57" style="fill:#202b33;font-size:22px;" class="small">41 / CIERRE</text>

<text x="64" y="170" style="fill:#202b33;font-size:78px;" font-weight="700" letter-spacing="-3">Su propia historia</text>
<text x="66" y="218" style="fill:#59666c;font-size:36px;" >¿Para qué estudiar relojes si las bases de datos ya los traen?</text>

<circle cx="102" cy="296" r="22" fill="#165bb5"/>

<text x="136" y="306" style="fill:#202b33;font-size:28px;" font-weight="700" >Ya viene construido</text>
<g transform="translate(444 278) scale(1.07)" stroke="#165bb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
<ellipse cx="26" cy="10" rx="21" ry="8"/><path d="M5 10 V42 C5 53 47 53 47 42 V10 M5 26 C5 37 47 37 47 26"/>
</g>
<text x="94" y="370" style="fill:#202b33;font-size:24px;" >Muchas herramientas ya</text>
<text x="94" y="406" style="fill:#202b33;font-size:24px;" >implementan estos relojes</text>
<text x="94" y="442" style="fill:#202b33;font-size:24px;" >por dentro.</text>

<circle cx="608" cy="296" r="22" fill="#986008"/>
<text x="608" y="304" style="fill:white;font-size:24px;" font-weight="700" text-anchor="middle" >2</text>
<text x="642" y="306" style="fill:#202b33;font-size:28px;" font-weight="700" >No son lo mismo</text>

<path d="M26 3 V46 M10 49 H42 M4 13 H48 M10 13 L2 31 H18Z M42 13 L34 31 H50Z"/>
</g>
<text x="600" y="370" style="fill:#202b33;font-size:24px;" >Orden de mensajes, causalidad</text>
<text x="600" y="406" style="fill:#202b33;font-size:24px;" >y linealizabilidad son</text>
<text x="600" y="442" style="fill:#202b33;font-size:24px;" >garantías distintas.</text>
<rect x="600" y="471" width="94" height="34" rx="14" fill="#eee7f7" stroke="#7546b3" stroke-width="2"/>
<text x="647.0" y="495.0" style="fill:#7546b3;font-size:20px;" font-weight="700" text-anchor="middle" >orden</text>
<rect x="707" y="471" width="94" height="34" rx="14" fill="#e8eff9" stroke="#165bb5" stroke-width="2"/>
<text x="754.0" y="495.0" style="fill:#165bb5;font-size:20px;" font-weight="700" text-anchor="middle" >causal</text>
<rect x="814" y="471" width="183" height="34" rx="14" fill="#e3f1e8" stroke="#217448" stroke-width="2"/>
<text x="905.5" y="495.0" style="fill:#217448;font-size:20px;" font-weight="700" text-anchor="middle" >linealizable</text>
<rect x="1078" y="260" width="456" height="270" rx="12" fill="white" stroke="#7546b3" stroke-width="2"/>
<circle cx="1114" cy="296" r="22" fill="#7546b3"/>
<text x="1114" y="304" style="fill:white;font-size:24px;" font-weight="700" text-anchor="middle" >3</text>
<text x="1148" y="306" style="fill:#202b33;font-size:28px;" font-weight="700" >Saber qué te dan</text>
<g transform="translate(1456 278)" fill="none" stroke="#7546b3" stroke-width="2.5"><circle cx="23" cy="23" r="18"/><path d="M36 36 L52 52"/></g>
<text x="1106" y="370" style="fill:#202b33;font-size:24px;" >Entender qué garantiza</text>
<text x="1106" y="406" style="fill:#202b33;font-size:24px;" >tu tecnología y qué le toca</text>
<text x="1106" y="442" style="fill:#202b33;font-size:24px;" >a tu aplicación.</text>
<path d="M530 395 L564 395" fill="none" stroke="#59666c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowmuted41)"/>
<path d="M1036 395 L1070 395" fill="none" stroke="#59666c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowmuted41)"/>
<rect x="66" y="560" width="1468" height="200" rx="16" fill="#e3f1e8" stroke="#217448" stroke-width="2"/>
<g transform="translate(100 612)" fill="none" stroke="#217448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="48" r="31"/><path d="M47 28 V48 L64 58 M7 26 A46 46 0 1 1 3 63 M7 8 V26 H25"/></g>
<text x="230" y="630" style="fill:#202b33;font-size:36px;" font-weight="700" xml:space="preserve"><tspan fill="#202b33">Un sistema distribuido no tiene </tspan><tspan fill="#986008">un único reloj perfecto</tspan><tspan fill="#202b33">,</tspan></text>
<text x="230" y="680" style="fill:#202b33;font-size:36px;" font-weight="700" >pero puede tener mecanismos que le permiten</text>
<text x="230" y="730" style="fill:#202b33;font-size:36px;" font-weight="700" xml:space="preserve"><tspan fill="#202b33">razonar correctamente sobre </tspan><tspan fill="#217448">su propia historia</tspan><tspan fill="#202b33">.</tspan></text>
