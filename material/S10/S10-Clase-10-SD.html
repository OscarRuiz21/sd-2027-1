scripts.push(...["Hoy la clase gira alrededor de una sola pregunta: si dos computadoras no comparten un reloj perfecto, ¿cómo sabemos qué pasó primero? En la figura, seis servidores de Mexi Banco en el mismo instante y seis horas distintas; el reloj del centro, UTC, existe, pero nadie lo lee directo: cada máquina lee el suyo. Fíjense en CDMX y Monterrey: van 5 segundos aparte, y en la siguiente lámina eso rompe un log. El recorrido de hoy: primero intentamos arreglar los relojes físicos, después cambiamos la pregunta (causalidad), construimos relojes lógicos (Lamport y vectores) y cerramos con el orden de entrega.\n\nPregunta para el grupo: ¿alguien ha visto en un log algo que pasó 'antes' de su causa?\n\nTransición: veamos ese log. Fuente de la composición: portada del episodio 40 de Systemic Stack (reloj central con servidores que tienen su propio reloj). Las ciudades y horas de los nodos son ilustrativas.", "Este es el problema de hoy en su forma más concreta. CDMX manda una transferencia a Monterrey; cada servidor la anota con su propia hora. Si un auditor o antifraude junta los dos logs y los ordena por hora, el dinero llega cinco segundos antes de salir. Nadie lanzó una excepción: el sistema funcionó y el log miente. Puede ser exactamente el evento TransferenciaRealizada de la S09 viajando por el broker.\n\nPreguntas para el grupo: ¿quién tiene la hora correcta, CDMX o Monterrey? ¿Cómo lo sabrían? (Respuesta: no lo sabemos; solo sabemos que el envío fue antes que la recepción.)\n\nTransición: esto no es solo un log feo; cuando un sistema decide algo con esas horas, decide mal.\n\nFuente: el caso viene de la propuesta de Codex para esta clase; los 'logs imposibles' (una respuesta registrada antes que la petición) también los lista Systemic Stack ep. 40, 'Where Systems Break', 16:22. Las horas son ilustrativas.", "El ejemplo de Systemic Stack: la final del Mundial 2026, la última butaca, un aficionado en Nueva York y una en Londres. El reloj del servidor de Londres va 120 ms adelantado. Londres hace clic primero y su servidor la marca 10:00:00.120; Nueva York hace clic 100 ms después y su servidor, que va bien, la marca 10:00:00.100. Si la regla es 'gana la marca menor', gana Nueva York.\n\nPreguntas para el grupo: ¿qué le contestan a la aficionada de Londres cuando reclame? ¿Con cuánto desfase deja de pasar esto? (Con ninguno mayor a cero hay una ventana donde pasa.) Matiz: la figura original muestra la butaca vendida dos veces; eso es sobre todo falta de coordinación entre los dos servidores (cada uno vende en su libro), no del reloj. El reloj importa cuando el orden se decide por marca de tiempo, como aquí.\n\nTransición: ¿por qué los relojes de dos servidores no marcan lo mismo, si los pusimos en hora?\n\nFuente: Systemic Stack ep. 40, figura de 1:44 ('Situation'), con 10:00:00.000 contra 10:00:00.120, y la precisión del reporte sobre la carrera de transacciones. Los 100 ms entre clics y la regla 'gana la marca menor' son míos, ilustrativos.", "La raíz del problema está en el hardware: el reloj de la computadora es un cristal de cuarzo que vibra, y el sistema cuenta vibraciones. No hay dos cristales iguales, y la temperatura, la humedad y la edad cambian su ritmo. A eso se le llama deriva (drift). ppm quiere decir partes por millón: 1 ppm es un microsegundo por segundo, unos 86 ms al día. Kleppmann cuenta que Google supone 200 ppm en sus servidores: 6 ms si lo corriges cada 30 segundos, 17 segundos si lo corriges una vez al día. Por eso hace falta corregir todo el tiempo, que es lo que hará NTP.\n\nPreguntas para el grupo: ¿su laptop y su celular marcan el mismo segundo? ¿Qué pasa con un servidor en un rack caliente? Distinción que vamos a usar: deriva es el ritmo (qué tan rápido se separan), desfase es la distancia en un instante.\n\nTransición: antes de corregir el reloj, ¿qué reloj estamos leyendo? Porque hay dos.\n\nFuentes: Systemic Stack ep. 40, 'The Root Problem', 4:38 (cuarzo, temperatura, humedad, edad); cifras de ppm de las precisiones del reporte, que las toman de Kleppmann, DDIA, capítulo de los problemas de los sistemas distribuidos [VERIFICAR: número de capítulo, 8 en la 1.ª edición; y la cifra de 200 ppm en la edición que use Oscar]. No usar las cifras del video (1 ms por hora y 3 minutos al día): se contradicen entre sí.", "Toda máquina tiene al menos dos relojes. El de pared responde '¿qué hora es?' según UTC; NTP lo corrige y a veces lo hace saltar, incluso hacia atrás. El monotónico responde '¿cuánto tiempo pasó?': solo avanza; NTP puede acelerarlo o frenarlo, nunca hacerlo saltar. Su valor absoluto no significa nada (puede ser el tiempo desde que arrancó la máquina), así que comparar el monotónico de CDMX con el de Monterrey no tiene sentido. El bug de la franja es real: si mides una duración con el de pared y NTP salta, te da negativa. Conexión: los timeouts de la S03 se miden con el monotónico.\n\nPreguntas para el grupo: ¿con cuál miden hoy la latencia en Mexi Banco? ¿Con cuál firmarían un token que vence en 15 minutos?\n\nTransición: para comparar eventos de dos máquinas solo nos queda el de pared; ¿qué tan lejos están dos relojes de pared?\n\nFuentes: precisiones del reporte de Systemic Stack ep. 40 (pared contra monotónico, CLOCK_REALTIME, System.nanoTime()), que remiten a Kleppmann, DDIA, y a Kuper, CSE138 lección 2. El video no hace la distinción; la motiva al decir que un salto puede tumbar una aplicación. Los valores del bug son ilustrativos.", "Este es el ejemplo de la clase de FIUBA. Lo vemos en modo Dios, desde afuera: E1 fue primero. Pero el reloj de P1 va 5 minutos adelantado, así que E1 queda marcado 10:03 y E2 10:00; quien ordene por hora dirá que E2 fue primero. Si supiera que P1 va 5 minutos adelantado, le resto 5 minutos y listo. El problema: para saber cuánto va adelantado P1 hay que preguntarle la hora, y la respuesta tarda en llegar. No confundir: la deriva es el ritmo al que se separan; el desfase es cuánto están separados ahora. La deriva hace crecer el desfase.\n\nPreguntas para el grupo: ¿cómo medirían el desfase entre su laptop y la mía? ¿Qué número les daría desconfianza?\n\nTransición: preguntemos la hora y veamos qué tan bien la podemos estimar.\n\nFuente: FIUBA TA050 clase 10, sección 3 (0:33:40 a 0:36:50), ejemplo de E1 a las 10:03 y E2 a las 10:00. El 9:58 resulta de suponer que P2 va bien.", "VÁLVULA: si vamos atrasados, salta a NTP y di en una frase que NTP usa la misma idea del punto medio. Es lo que el profesor de FIUBA dibuja como get_time: no sé cuánto tardó la ida y cuánto la vuelta, así que supongo que la hora se leyó a la mitad del viaje. Con ida y vuelta de 40 ms, el error puede ser hasta 20 ms para cualquier lado: si la ida fue de 35 y la vuelta de 5, el desfase real era 25; si fue al revés, 55. Desde los extremos no se puede distinguir. Truco práctico: repetir la pregunta varias veces y quedarse con la del RTT más corto, que es la de menor error.\n\nPreguntas para el grupo: ¿qué pasa con el error si el servidor de tiempo está en otro continente? ¿Y si la red está congestionada solo de ida?\n\nTransición: esto es para dos máquinas; ¿cómo le hacen millones?\n\nFuentes: FIUBA TA050 clase 10, sección 3 (punto medio (T_A + T_B) / 2); precisiones de Systemic Stack ep. 40 (algoritmo de Cristian, error ± RTT / 2, quedarse con el RTT menor) [VERIFICAR: fecha del artículo de Cristian, 1989]. Los números 100, 140 y 160 son los mismos del ejemplo de NTP de la lámina 08, a propósito.", "NTP es lo que hace Cristian, pero a escala y sin parar. Arriba, el estrato 0: relojes atómicos y receptores GPS, que no están en la red. El estrato 1 son servidores conectados directo a ellos; cada nivel hacia abajo suma uno, hasta el 15, y el 16 significa 'no sincronizado'. Un servidor típico, como los de Mexi Banco, vive en el estrato 2 o 3. Lo importante para la aplicación es cómo corrige: si va 40 ms atrasado, NTP no salta 40 ms de golpe; acelera el reloj un poco hasta alcanzar (slew). Solo si el desfase es grande hace un salto (step), y ahí es donde el reloj de pared regresa, como vimos hace dos láminas. Chrony no es el sucesor de NTP: es otra implementación del mismo protocolo, la que viene por defecto en varias distribuciones de Linux.\n\nPreguntas para el grupo: ¿por qué no conectar cada servidor directo al estrato 0? ¿Qué preferirían en una base de datos, un reloj que salta o uno que tarda en llegar?\n\nTransición: ¿cómo calcula NTP el desfase si el mensaje tarda? Con cuatro marcas.\n\nFuentes: Systemic Stack ep. 40, figura de 6:46 ('NTP and Chrony: The Guardians of Accuracy'); precisiones del reporte para estratos 15 y 16, Chrony como implementación y los umbrales de ntpd [VERIFICAR: 500 ppm de slew máximo y 128 ms de umbral de step en ntpd; en Chrony el umbral se configura con makestep]. Las cajas de Mexi Banco son ilustrativas.", "Esta es la fórmula que el video de Systemic nombra pero no da. La intuición: si no hubiera desfase, T2 - T1 sería solo la ida y T4 - T3 solo la vuelta. El desfase se suma en el primer tramo y se resta en el segundo; al promediar, si la ida y la vuelta duran lo mismo, el viaje se cancela y queda el desfase puro. El retardo es la ida y vuelta completa, 41 ms, menos lo que el servidor tardó en contestar, 1 ms. Fíjense que es el mismo ejemplo de Cristian, ahora con el milisegundo que tarda el servidor: otra vez 40 ms atrasado y otra vez un error de hasta 20 ms. Comprobación en vivo, si da tiempo, en el pizarrón: con ida de 20 y vuelta de 20 y desfase real 40, T2 = 100 + 20 + 40 = 160 y T4 = 161 - 40 + 20 = 141. NTP hace muchas mediciones y se queda con las de menor δ.\n\nPreguntas para el grupo: ¿qué medición le creen más, una con δ = 40 o una con δ = 4? ¿Por qué la asimetría no se puede medir desde los extremos?\n\nTransición: ya tenemos el mejor protocolo que hay; ¿por qué sigue sin ser perfecto?\n\nFuentes: precisiones del reporte de FIUBA TA050 clase 10 (fórmulas con T1 a T4) y del reporte de Systemic Stack ep. 40 (mismo ejercicio con t0 a t3: 100, 160, 161 y 141 ms, δ = 40, θ = 40, error ± 20).", "La sincronización perfecta es un mito por tres razones. Uno, la deriva no se detiene: entre un sondeo y el siguiente, el reloj se vuelve a separar. Dos, la latencia: la fórmula de la lámina anterior supone ida y vuelta iguales, y cuando no lo son el error puede llegar a la mitad del retardo, sin forma de medirlo desde los extremos. Tres, el segundo intercalar: la Tierra no gira perfectamente regular y a UTC se le han agregado 27 segundos desde 1972, el último el 31 de diciembre de 2016; en la hora POSIX ese segundo hace que 23:59:59 se repita, y en 2012 un error del kernel de Linux puso servidores de varias empresas al 100 % de CPU. Por eso Google y AWS reparten el segundo a lo largo de 24 horas. En 2022 se decidió dejar de agregarlos hacia 2035. Y lo peor: cuando esto falla no hay mensaje de error; hay logs imposibles, tokens válidos rechazados porque 'vienen del futuro', actualizaciones que desaparecen.\n\nPreguntas para el grupo: ¿un token que vence en 15 minutos aguanta 2 segundos de desfase? ¿Y uno de 1 segundo?\n\nTransición: aun así, supongamos que todos usan NTP y el error es de milisegundos. ¿Ya podemos ordenar?\n\nFuentes: Systemic Stack ep. 40, figura de 7:50 ('Drift, Latency, and the Leap Second') y figura de 16:22 ('Where Systems Break'); precisiones del reporte para los 27 segundos, 2016, 2012, 2035 y el smearing de 24 h [VERIFICAR: smearing de Google y AWS de mediodía a mediodía, y la decisión de 2022 de la Conferencia General de Pesas y Medidas]. No usar en la lámina el ejemplo de 5 a 15 ms del video: la narración dice 'rango de 10 ms' y la figura '±10 ms', que no son lo mismo.", "Volvemos al log imposible. Con NTP, el desfase entre CDMX y Monterrey bajó de 5 segundos a unos milisegundos, pero el error de cada marca sigue siendo de ± 20 ms y estos dos eventos están a 3 ms. Por hora, no hay orden seguro: el log sigue diciendo que se recibió antes de enviarse. Y sin embargo hay algo que sí sabemos sin mirar ningún reloj: el mensaje salió de CDMX y llegó a Monterrey, así que el envío fue primero. Esa información no viene de la hora, viene de la flecha. Pregunta para el grupo, y es la pregunta del bloque: si todos usan NTP, ¿ya resolvimos el orden? Dejen que contesten antes de pasar. Segunda pregunta: ¿qué evidencia usaron para decir que el envío fue primero? (La flecha del mensaje, no el reloj.) Hay quien sí persigue la hora con hardware, como Google con TrueTime; lo vemos al final de la clase.\n\nTransición: dejemos de preguntar qué hora es y preguntemos qué pudo influir en qué.\n\nFuentes: Systemic Stack ep. 40, 'The Shift to Logical Time', 8:55 ('¿qué hora es?' contra '¿qué pasó primero?'); FIUBA TA050 clase 10, sección 4 ('lo que importa son números que reflejen el orden, no el tiempo real'). Las horas .412 y .409 y el error de ± 20 ms (el de la lámina 08) son ilustrativos.", "Qué decir: \"La pregunta con la que cerramos fue: si todos usan NTP, ¿ya resolvimos el orden? No. NTP achica el desfase pero no lo vuelve cero, y ε se estima, nunca se conoce. El profesor de FIUBA lo dice así: aunque estén un nanosegundo desfasados, si no sabemos si es para adelante o para atrás, ya no nos podemos fiar de eso para un algoritmo. Y casi nunca nos interesa la hora: del log imposible de Mexi Banco lo que importa es que la transferencia se envió antes de recibirse. FIUBA lo resume en que rara vez es interesante el problema del tiempo real; lo que importa son números que reflejen el orden.\"\n\nAparte opcional: Lamport sacó la idea de la relatividad, porque la información tarda en llegar de un reloj a otro. En una red la causa son los routers saturados y no la velocidad de la luz, \"pero la idea es la misma\".\n\nPreguntas para el grupo: \"Del log de Mexi Banco, ¿qué necesitamos saber de verdad: la hora de cada línea, o que el envío fue antes que la recepción?\" y \"Si dos eventos quedan dentro de ε, ¿hay forma de ordenarlos con el reloj?\"\n\nTransición: \"Si no es con el reloj, ¿con qué decimos que algo pasó antes? Con tres reglas de Lamport.\"\n\nFuentes: FIUBA TA050 clase 10, sección 3 (0:33:40 a 0:41:59, ε y la analogía de la relatividad) y sección 4 (0:41:59, \"lo que importa son números que reflejen el orden\"); Systemic Stack ep. 40, figura de 8:56 (img/t000856.jpg, \"Lose wall-clock time · Gain reliable ordering\").\n\nAjuste de Claude aplicado: la lámina 10 ya dibuja la ventana ε. Aquí quedan el reloj y las dos marcas rojas. El secuenciador centralizado de FIUBA (sección 4: un servidor que reparte números, como GFS, con punto único de falla) no está en el índice; queda solo como respuesta si alguien lo propone.", "Qué decir: \"Regla 1: dentro de un proceso no hay discusión; como dice FIUBA, un proceso secuencial suma y después multiplica. Regla 2: si alguien recibe un mensaje es porque antes alguien lo envió; es la única regla que conecta dos máquinas. Regla 3: se encadenan, y así se arman caminitos de causalidad. La regla 2 ya declara imposible el log de Mexi Banco: 'transferencia enviada' en CDMX pasa antes que 'transferencia recibida' en Monterrey, digan lo que digan sus relojes.\"\n\nOtro ejemplo para decir en voz: Systemic usa uno de correo. Mandas un correo (A) y tu amigo responde (B). A pasa antes que B, y el retraso de la red no cambia eso.\n\nPreguntas para el grupo (antes de mostrar las tarjetas, como hace Kuper): \"¿Cuándo pueden asegurar que un evento pasó antes que otro sin ver ningún reloj?\" Después: \"¿Por qué la tercera tarjeta tiene dos dibujos?\" (el camino puede empezar por un mensaje o por el mismo proceso).\n\nTransición: \"Con estas tres reglas, decidir si A → B es buscar un camino. Probémoslo en un diagrama con ocho eventos.\"\n\nFuentes: Kuper CSE138 L3, sección 2 (0:01:52 a 0:04:27, img/t000412.jpg); FIUBA TA050 clase 10, sección 5 (0:45:33, img/t005046.jpg); Systemic Stack ep. 40, figura de 9:56 (img/t000956.jpg).\n\nOjo con la figura 1 del paper de Lamport: si se muestra, ahí el tiempo corre hacia arriba; en todo nuestro deck corre hacia abajo.", "Qué decir: \"Kuper lo resume en una regla operativa: si puedes llegar a B desde A siguiendo las líneas, A → B. Desde A bajas por M0 hasta G, o cruzas a B, bajas a E y F y vuelves a G. Para llegar a D tendrías que caminar contra la flecha D→E, y eso no se vale. Desde D tampoco llegas a A. Ninguno pudo influir en el otro: A y D son concurrentes.\"\n\nPreguntas para el grupo, en este orden: \"¿A y E están relacionados?\" (A → E); \"¿D y A?\" (A ∥ D). Si va bien: \"¿C y G?\" (C → G, por C, D, E, F, G); \"¿G y H?\" (G ∥ H); \"¿B y C?\" (B ∥ C).\n\nRespuestas completas por si alguien pregunta:\n\nAlcanzables: desde A, B, E, F y G; desde B, E, F y G; desde C, D, E, F, G y H; desde D, E, F, G y H; desde E, F y G; desde F, G. G y H no alcanzan a nadie.\n\nPares concurrentes (9 de 28): A∥C, A∥D, A∥H, B∥C, B∥D, B∥H, E∥H, F∥H y G∥H.\n\nFIUBA hace lo mismo sobre la figura 1 del paper de Lamport: el caminito p1 → q2 → q4 → r3 → r4, y p1 ∥ r2.\n\nAviso para el bloque 4: Kuper no calcula relojes en este diagrama.\n\nTransición: \"A está hasta arriba y H hasta abajo. ¿Eso quiere decir que A pasó 'antes'?\"\n\nFuentes: Kuper CSE138 L3, sección 3 (0:04:27 a 0:07:17, img/t000658.jpg) y sección 10, \"El truco: seguir las flechas\" (0:55:01); FIUBA TA050 clase 10, sección 5 (img/t005302.jpg).", "Qué decir: \"Esta vez vemos el diagrama en modo Dios, como dice FIUBA: desde afuera, con el tiempo real de arriba hacia abajo. A está hasta arriba y H hasta abajo, y aun así son concurrentes, porque entre ellos no hay camino. D y E están casi a la par y uno pudo influir en el otro. Concurrente habla de causa, no de reloj. Del otro lado, la flecha es generosa: a → c porque c ocurre en Monterrey después de recibir la transferencia, pero el cambio de contraseña no tuvo nada que ver. Por eso se dice causalidad potencial: A → B quiere decir que A pudo haber causado B.\"\n\nPor qué importa: Systemic dice que distinguir lo causal de lo concurrente es \"una señal enorme\", porque no todo necesita un orden global estricto. Su ejemplo: dos tuits de Alice y Bob sin relación, cuyo orden puede no importar.\n\nPreguntas para el grupo: \"A está hasta arriba y H hasta abajo: ¿quién pudo influir en quién?\"; \"¿B y C, que están casi a la misma altura?\" (B ∥ C); \"¿El cambio de contraseña lo causó la transferencia? ¿Lo pueden saber las reglas?\"\n\nPregunta de una alumna en FIUBA (0:50:41), por si sale: ¿cuándo no se puede saber cuál fue primero? Cuando con las tres reglas no se arma un camino. Pasa también entre un evento aislado y otro de un proceso que sí se comunicó, pero cuyo mensaje llegó después.\n\nTransición: \"Entonces hay pares que no se pueden ordenar. ¿Qué tipo de orden es este, que deja pares afuera?\" Si se salta la válvula, decir aquí la pregunta puente: \"¿Cómo le pongo un número a cada evento que respete las flechas?\"\n\nFuentes: FIUBA TA050 clase 10, sección 5 (0:48:38, \"concurrente no significa al mismo tiempo\"; 0:50:41); Kuper CSE138 L3, sección 11 (0:56:56, \"potential\" agregado en la pizarra); Systemic Stack ep. 40, sección 10 y figura de 9:56 (parada 3, \"No link = concurrent\").\n\nEl ejemplo de a, b y c en CDMX y Monterrey es ilustrativo, no viene de las fuentes. Se eligió para mostrar causalidad potencial en el caso hilo.", "Qué decir: \"En los naturales cualquier par se compara: van en línea recta. Con happens-before no. Hay pares con camino y pares sin camino, y en este diagrama 9 de los 28 pares no se pueden comparar. Kuper lo dice así: en una ejecución distribuida no hay un orden total de los eventos, a menos que hagas algo más para imponerlo. Ese algo más es ponerle un número a cada evento, y no cualquier número: uno que respete todas las flechas.\"\n\nPrecisión para quien sepa matemáticas: un orden parcial pide reflexividad, antisimetría y transitividad. Happens-before no es reflexiva (\"¿G pasa antes que G? No sé qué querría decir eso\"), así que es un orden parcial irreflexivo (o estricto). En inglés, a un conjunto parcialmente ordenado se le dice poset. El ejemplo de Kuper de un orden parcial de verdad es la inclusión de subconjuntos de {a, b, c}: {a} y {b} no se comparan, igual que dos eventos concurrentes.\n\nConexión con la S09: los offsets de una partición de Kafka son un orden total, pero solo dentro de la partición y porque un solo broker los asigna. Entre particiones no hay fila única.\n\nPreguntas para el grupo: \"¿Qué par del diagrama no se puede comparar?\"; \"Los offsets de una partición de Kafka, ¿son un orden total o parcial? ¿Y entre dos particiones?\"; \"¿{a} o {b}, cuál va primero?\"\n\nVálvula: si el bloque va tarde, saltar esta lámina y decir al final de la anterior: \"happens-before no ordena a todos; ¿cómo le pongo un número a cada evento que respete las flechas?\"\n\nTransición: \"Lamport respondió eso en 1978 con un contador por proceso.\"\n\nFuentes: Kuper CSE138 L3, secciones 4 a 6 (0:07:17 a 0:32:36; img/t002946.jpg, img/t003028.jpg, img/t003212.jpg) y la respuesta en el descanso (1:16:02, \"todo orden total es un orden parcial\"); FIUBA TA050 clase 10, sección 8 (1:01:56, img/t010508.jpg, \"todos se comparan con todos\" contra \"solo algunos pares (a, b) son comparables\").\n\nVerificado por alcanzabilidad del grafo A a H: 9 de 28 pares son concurrentes. La lista está en las notas de \"Seguir las flechas\". No adelantar aquí el orden total con desempate por ID: es del bloque 4.", "Qué decir: \"Dejamos los relojes físicos: este reloj no dice la hora, solo ordena. Kuper lo resume como el reloj lógico más simple que conoce: cada evento recibe un número natural. Los pasos 1 a 3 salen solos. El 4 es el que importa: si el mensaje trae un número, quien recibe tiene que hacer algo con él.\"\n\nPregunta para el grupo, antes de mostrar la tarjeta 4 (si el deck admite pasos, que aparezca al final): \"Si llega un mensaje con un número, ¿qué debería hacer quien lo recibe con su contador?\". Kuper la hace igual, con la pista \"empieza con when receiving a message\".\n\nTransición: \"Corramos el algoritmo en un diagrama de tres máquinas.\"\n\nFuentes: Kuper CSE138 L3, sección 9 (0:37:29), fotograma t004644.jpg. FIUBA TA050 clase 10, sección 6 (0:52:14): el profesor escribe max(C + 1, T + 1), que es lo mismo que max(C, T) + 1; usamos la forma de Kuper. La variante sin + 1 está en Kuper, 0:46:01.", "Qué decir: \"M0 arranca en 0, su primer evento es un envío y vale 1; el mensaje lleva ese 1. M1 recibe: el máximo entre su 0 y el 1 es 1, más uno, 2. Así sigue la vuelta, hasta que M0 recibe un 5 teniendo un 1: cinco le gana a uno y queda en 6. Ojo: aquí cada número menor sí pasó antes, pero es porque todo es una sola cadena; guarden esa sospecha.\"\n\nPreguntas para el grupo: \"¿Cuánto vale la recepción en M2?\" (4). \"Antes de ver la fila 6: M0 va en 1 y le llega un 5, ¿cuánto vale?\" (6).\n\nTransición: \"Aquí el mensaje siempre ganó. Veamos un diagrama donde la regla del máximo hace la diferencia, y uno donde gana el local.\"\n\nFuente: Kuper CSE138 L3, sección 9, ejemplo 4 (0:41:33), fotograma t004644.jpg. En la pizarra escribe LC = 1, LC = 3 y LC = 5 sobre las flechas, y los contadores arriba de cada línea.\n\nPrecisión para quien pregunte: el número no es \"cuántos eventos ocurrieron\", sino la longitud de la cadena causal más larga que termina en ese evento.", "Qué decir: \"El profesor de FIUBA primero anotó un 3 en r3 y tuvo que corregir: con 3, r3 quedaría por debajo del 4 que le mandó q4, y estaríamos rompiendo justo lo que queremos lograr. Con el máximo, 5 queda arriba de las dos cosas que pasaron antes: su propio r2 y el q4 que le llegó. En q7 es al revés: Q ya iba en 6 y el mensaje trae un 2, así que gana el local.\"\n\nPregunta para el grupo, antes de mostrar la tarjeta de abajo (FIUBA la hace por el chat): \"q7 va en 6 y le llega un 2, ¿cuánto vale?\" (7).\n\nTransición: \"Ya vimos dos veces que el número sube a lo largo de las flechas. Pongámosle nombre a esa garantía.\"\n\nFuentes: FIUBA TA050 clase 10, sección 6 (0:55:49 a 0:58:21), fotogramas t005754.jpg (el 3) y t010024.jpg (el 5 y el 7). Lamport, Time, Clocks, and the Ordering of Events in a Distributed System, 1978, figura 1.\n\n[VERIFICAR: la figura original tiene el tiempo hacia arriba y más mensajes (q1 a P, q5 a P y uno que llega a r4) · los omití porque no cambian ningún valor de esta lámina; un envío suma 1 igual que un evento interno. No alcanzo a leer en el fotograma si la flecha a r4 sale de q1 o de q2.]", "Qué decir: \"Esta es la promesa del algoritmo, y Kuper la resume diciendo que los relojes de Lamport son consistentes con la causalidad. Se cumple porque cada regla de happens-before tiene un paso del algoritmo que la cubre: en el mismo proceso, el + 1; en un mensaje, el máximo + 1; y la transitividad se encadena sola. Es menor estricto, nunca igual.\"\n\nPregunta para el grupo: \"¿Y al revés? Si LC(A) < LC(B), ¿A pasó antes que B?\". Déjala abierta: en la cadena parece que sí.\n\nTransición: \"Kuper dice que es un poco una pregunta trampa. Veamos por qué.\"\n\nFuentes: Kuper CSE138 L3, sección 8 (0:34:35), fotograma t003706.jpg, y la verificación sobre la cadena (t004644.jpg: \"1 < 6\" en M0 y \"3 < 4\" por el mensaje). FIUBA TA050 clase 10, sección 6 (0:57:21), fotograma t010426.jpg.", "Qué decir: \"Para saber si A pasó antes que B hay que seguir las flechas: desde A solo se baja por M0, y M0 nunca envía nada. A B se llega desde otros eventos, pero no desde A. Aun así, 1 < 5. La cadena de antes nos engañó porque era una sola cadena, sin pares concurrentes. La versión de dos procesos es la misma idea en chico: el 1 de P2 es menor que el 4 de P1 y no tienen nada que ver.\"\n\nPreguntas para el grupo:\n\n\"¿Cuánto vale A, que es un evento interno?\" (1). A Kuper se le olvidó a la mitad del ejemplo: \"los eventos internos también cuentan\".\n\n\"¿Hay forma de llegar de A a B siguiendo flechas?\"\n\nTransición: \"Entonces la flecha vale en un solo sentido. Pongámosle nombre a cada sentido.\"\n\nFuentes:\n\nKuper CSE138 L3, sección 10 (0:48:43), fotogramas t005358.jpg (a medio resolver) y t005850.jpg (completo). En su pizarra el contador de M0 arriba de la línea se queda en 5 y el de M2 en 3; los valores en los eventos son los correctos, y son los de esta lámina.\n\nKuper CSE138 L4, sección 2 (0:03:54), fotograma t000650.jpg. Ella llama M1 y M2 a los procesos; aquí son P1 y P2 para no confundirlos con el diagrama grande.\n\nDato para el bloque de vectores: con vectores, A = [1,0,0] y B = [0,2,3] no son comparables (cálculo del reporte de Kuper L3, no de la clase).", "Qué decir: \"Es la frase de la clase de Kuper. En su pizarra pone una carita feliz junto a la primera propiedad y una triste junto a la segunda: el algoritmo es muy fácil de correr y sería muy bueno tener las dos direcciones, pero no. El profesor de FIUBA dice lo mismo: si un reloj es menor que otro, pueden pasar dos cosas, que uno haya causado al otro o que sean concurrentes. Para ser precisos, es causalidad potencial: A → B quiere decir que A pudo influir en B.\"\n\nPregunta para el grupo: \"¿Por qué en la cadena de 1 a 6 sí parecía que caracterizaba?\" Respuesta: es una sola cadena, sin pares concurrentes con los que fallar.\n\nTransición: \"Alguien le preguntó a Kuper: entonces, ¿para qué sirven? Ella dijo que era una muy buena pregunta.\"\n\nFuentes: Kuper CSE138 L3, sección 12 (0:58:38), fotograma t010128.jpg, y sección 11 (causalidad potencial). FIUBA TA050 clase 10, sección 7 (0:59:22), fotograma t010118.jpg.\n\nPara quien pregunte: lo que aquí llamamos \"caracteriza\", Schwarz y Mattern (1994) lo llaman strongly consistent.", "Qué decir: \"Primer uso: la contrapositiva. Si el número de A no es menor que el de B, A no pudo causar B; no sabemos si fue al revés o si son concurrentes, pero ya descartamos una causa. Segundo uso, el que Lamport le dio en 1978: ordenar todos los eventos por (reloj, proceso), desempatando por el ID. Muchas comparaciones de esa fila no significan nada, pero todo par que sí estaba relacionado queda en el orden correcto. Y todo esto cuesta un número por mensaje. Kuper lo dice así: en sistemas distribuidos todo es un trade-off; si quieres saber más, tienes que mandar más información.\"\n\nPreguntas para el grupo:\n\n\"¿Por qué (5,M0) va antes que (5,M1)?\" (por el ID).\n\n\"¿Puede quedar un evento antes de otro que lo causó?\" (no, por la clock condition).\n\nTransición, con dos opciones:\n\nCon tiempo: \"Veamos el orden total en algo concreto: un chat sin servidor.\"\n\nSi se salta la válvula, cierra con la pregunta que abre los vectoriales: \"Lamport nos da un orden que todos comparten, pero no nos dice si dos eventos fueron concurrentes. ¿Y si quiero saber cuándo dos eventos son concurrentes?\"\n\nFuentes:\n\nKuper CSE138 L3, sección 13 (1:01:51), fotograma t010504.jpg, y sus Precisiones (el orden total por (LC, id) no está en la clase; el ejemplo 5 lo motiva con el empate en 5).\n\nFIUBA TA050 clase 10, sección 8 (1:01:56), fotograma t010508.jpg, \"orden total sintético\".\n\nLamport (1978) lo usa para la exclusión mutua distribuida. El profesor de FIUBA admite que no lo explica: \"la verdad que no lo entendí\".\n\n[VERIFICAR: \"esa es una pregunta jodidamente buena\" es la cita literal de Kuper (\"damn good question\") · decide si la dices así frente al grupo.] [VERIFICAR: los números de propuesta de Paxos se construyen como (ronda, id) con desempate por ID · viene de las Precisiones de FIUBA; mencionarlo solo si alguien pregunta.]\n\nAjuste de composición autorizado, Dudas 10: se retiró de la lámina el renglón gris. Toda implicación trae su contrapositiva: si P ⇒ Q, entonces ¬Q ⇒ ¬P.", "Qué decir: \"Un chat tipo WhatsApp sin servidor: cada quien manda sus mensajes a todos y la red anda medio rara. Si cada uno muestra al llegar, C ve '¡Qué calor!', 'Yo voy' y después '¿Quién viene a comer?': la respuesta antes que la pregunta. El truco es adjuntar el reloj y ordenar por (reloj, proceso) en vez de por llegada. Todos obtienen la misma fila: (1A, m1), (1C, m3), (4B, m2). m1 y m3 empatan en 1 porque son concurrentes, y el ID decide.\"\n\nPreguntas para el grupo:\n\n\"Si C muestra cada mensaje al llegar, ¿qué ve?\"\n\n\"¿Por qué (1A, m1) va antes que (1C, m3) si los dos dicen 1?\"\n\n\"¿Podría alguien ver 'Yo voy' antes que '¡Qué calor!'?\" No: B ya había recibido m3 cuando escribió m2, así que m3 → m2.\n\nPrecisiones para no decir de más:\n\nEn este dibujo, B recibe \"¡Qué calor!\" (3) antes de mandar \"Yo voy\" (4), así que m3 → m2. Lo único concurrente es m1 con m3.\n\nEl profesor dice que ABC, CAB y ACB son válidos; en su dibujo, ABC violaría m3 → m2 [VERIFICAR: es un descuido de la fuente; la lámina no lo repite].\n\nOrdenar al llegar obliga a reacomodar la pantalla: C recibe (4B, m2) antes que (1A, m1). Para no reacomodar hay que retener cada mensaje hasta saber que no llegará otro con marca menor; eso es el totally ordered multicast, que hoy no vemos.\n\nLos chats reales suelen usar un secuenciador central (lo dice el profesor de FIUBA).\n\nTransición al bloque de vectores: \"Lamport nos dio un orden que todos comparten, pero mira (1C, m3) y (4B, m2): el número no dice si hubo causa o no. ¿Y si quiero saber cuándo dos eventos son concurrentes? Para eso, en vez de un número, mandamos un vector.\"\n\nFuentes: FIUBA TA050 clase 10, sección 9 (1:05:28 a 1:14:38), fotogramas t010552.jpg (diagrama, colas y orden total), t011018.jpg (lo que ven todos) y t011436.jpg (órdenes válidos), y la Precisión del reporte sobre retener mensajes.\n\nAjuste de composición autorizado, Dudas 10: se omitió la tarjeta de pantalla. El historial ordenado es: ¿Quién viene a comer?; ¡Qué calor!; Yo voy. Se conservan los tres chips del orden compartido.", "Venimos de Lamport: consistente con la causalidad, pero no la caracteriza. Un 5 solo dice que hay una cadena de 5 eventos que termina aquí; no dice dónde ocurrieron. Las dos historias dan el mismo 5, pero el vector cuenta por proceso: [5,0,0] es un mundo en el que solo Alice ha hecho algo, y [2,2,1] es uno en el que la noticia viajó de Carol a Bob y de Bob a Alice. Esa información extra es justo la que hace falta para caracterizar la causalidad. Recuerden el contraejemplo del bloque anterior, LC(A)=1 y LC(B)=5 con A ∥ B: con vectores habrían sido [1,0,0] y [0,2,3], y ahí se nota a simple vista que ninguno contiene al otro.\n\nPreguntas para el grupo: si un reloj de Lamport es un entero, ¿qué será un reloj vectorial? ¿De qué tamaño? ¿Qué le falta al 5 para darse cuenta de que dos eventos son concurrentes?\n\nTransición: ¿cómo se mantiene ese vector al día? Con los mismos cuatro pasos de Lamport, cambiando una sola cosa.\n\nFuente: Kuper CSE138 L3, sección 15, Ejemplo 8 (1:32:00), fotograma t013504; el contraejemplo es de la L3, sección 10, con los vectores calculados en el reporte. La Historia 2 es construcción mía: son los cinco primeros eventos de la corrida de Alice, Bob y Carol (c1, b1, b2, a1 y a2), con Lamport 1, 2, 3, 4 y 5 y vector final [2,2,1]. Precisión: 'cinco eventos' simplifica; LC(e) es la longitud de la cadena causal más larga que termina en e, y una posición del vector cuenta los eventos de ese proceso que hay en el pasado causal de e. En estas dos historias las dos lecturas coinciden.", "Son los cuatro pasos de Lamport con dos cambios. El +1 va solo en tu posición, porque solo tú cuentas tus eventos. Al recibir, el max se toma posición por posición: de cada proceso te quedas con lo más que sabe cualquiera de los dos. Ojo con el +1 'que no está': en Lamport se hacía max + 1; aquí el +1 de la recepción ya va en tu propia posición, y no hay otro. Errores que conviene anticipar: tomar el max como si fuera de números sueltos (elegir el vector 'más grande'), mandar el vector antes de incrementar, y olvidar que hay que acordar qué posición es de quién, lo que supone un conjunto de procesos fijo y conocido.\n\nPreguntas para el grupo: ¿cuál es el max de [1,12,4] y [7,0,2]? (preguntarlo antes de mostrar el resultado). ¿Qué pasa al recibir con vectores?\n\nTransición: ya con las reglas, corramos un ejemplo completo con tres procesos.\n\nFuentes: Kuper CSE138 L3, sección 15, 'El algoritmo' (1:21:28) y Ejemplo 7 (1:30:59), fotogramas t013504 y t013150; L4, sección 3, 'El algoritmo, en sus palabras' (0:15:19) y 'El más uno que no está'. Nota mía: Kuper escribe en la L3 'max y luego +1', y en la L4 escribe el intermedio '+1 y luego max'. Dan lo mismo, porque el vector recibido nunca sabe más de tus eventos que tú (recibido[i] ≤ local[i]). La lámina usa el orden de la L4 porque es el de los intermedios del ejemplo. Los minidiagramas son eventos de la corrida de la siguiente lámina (b1 → b2 en Bob y a1 en Alice).", "Kuper dibuja primero las líneas y los mensajes y luego llena los relojes pidiéndole cada valor al grupo. Háganlo igual, en este orden: c1, b1, b2, a1, b3, c2, a2, b4, c3, a3, b5, c4, c5, a4. Los valores entre paréntesis son intermedios: el reloj después del +1 propio y antes de combinar con lo que llegó. En la práctica es un solo paso; se escriben para razonar mejor. El vector se lee como 'lo que el proceso sabe': en [0,1,1], Bob conoce un evento suyo y uno de Carol. Fíjense en a3: Alice tenía [2,2,1], suma 1 y queda (3,2,1); llega [0,3,3] de Carol, y el máximo da [3,3,3]. Preguntas para el grupo, evento por evento: ¿qué reloj tiene Bob aquí? ¿Por qué b3 vale [0,3,1] si Bob ya recibió algo de Carol? (porque enviar no combina nada: solo suma 1 en su posición).\n\nTransición: ya tenemos 14 vectores; ¿cómo los usamos para saber qué pasó antes? Comparándolos.\n\nFuente: Kuper CSE138 L4, sección 3 (0:06:40 a 0:20:11), fotogramas t001508 (a medio llenar) y t002010 (completo); el diagrama viene del artículo de Wikipedia sobre relojes vectoriales. Verifiqué los 14 vectores corriendo el algoritmo y coinciden con la tabla del reporte. Los únicos intermedios que Kuper escribe en la hoja son (0,1,0), (0,0,2) y (3,2,1); por eso son los únicos que aparecen.", "Esta es la recompensa de los vectores: la relación vale en los dos sentidos. Si VC(A) < VC(B), A pasó antes que B, y si A pasó antes que B, sus vectores lo dicen; con Lamport solo valía el segundo sentido. Para comparar no hace falta pensar en grafos ni en alcanzabilidad; como dice Kuper, a las computadoras se les da muy bien comparar vectores de números. La definición estricta: ≤ en todas las posiciones y distinto en al menos una. Kuper solo dice 'menor o igual en cada posición'; la parte de 'al menos una distinta' es la que separa 'antes' de 'el mismo evento'.\n\nPreguntas para el grupo: ¿qué relación hay entre [3,3,3] y [2,4,1]? ¿Puedo sumar las posiciones y comparar las sumas? (No: [3,3,3] suma 9 y [2,4,1] suma 7, pero son concurrentes. La suma se porta como un reloj de Lamport: respeta la causalidad pero no la caracteriza.)\n\nTransición: si comparamos A contra los otros 13 eventos, el diagrama se parte solo en tres colores.\n\nFuentes: Kuper CSE138 L3, sección 15, fotograma t012140 (el 'si y solo si'); L4, sección 3, 'Historia causal' (0:20:11) y la Precisión sobre la comparación de vectores. Los ejemplos azul (pasado) y verde (futuro) son míos, tomados de la tabla; el ámbar ([3,3,3] contra [2,4,1]) es el que Kuper escribe en la hoja. Que dos eventos distintos nunca tengan el mismo vector es razonamiento mío: en un mismo proceso difieren en la posición propia, y en procesos distintos, vectores iguales implicarían que cada uno conoce al otro.", "Kuper elige A, la recepción de Bob del mensaje de Alice, y arma la historia causal en este orden. Primero lo anterior en la línea de Bob; luego a2, el envío que corresponde a la recepción A; después a1 y c1, por transitividad. Pregunta qué notan en los vectores azules: todos son más chicos. Con el futuro se le escapó un evento y un alumno se lo corrigió por el chat: buen momento para decir que conviene revisar con los vectores y no a ojo. El caso más interesante es c2 = [0,3,2]. Carol ya sabe de Bob (tiene un 3 en la posición de Bob), pero Bob no sabe de esa recepción de Carol. Siguiendo las flechas, desde c2 no se llega a A, y el vector lo dice solo: Carol 2 > 1. Son 6 + 4 + 3 eventos, más A, en total 14.\n\nPreguntas para el grupo: ¿qué notan en los vectores azules? ¿Por qué [0,3,2] es concurrente con A si Carol ya recibió algo de Bob? ¿Desde c2 puedo llegar a A siguiendo flechas?\n\nTransición: esto lo hicieron 14 vectores de tres números cada uno; ¿cuánto nos cuesta frente a Lamport?\n\nFuente: Kuper CSE138 L4, sección 3, 'Historia causal, futuro causal y concurrentes' (0:20:11), fotograma t002810. Kuper usa rojo, verde y azul; esta lámina aplica el código acordado por Claude: pasado azul (#165bb5), futuro verde (#217448) y concurrentes ámbar (#986008) y dice 'futuro causal, o algo así'. Verifiqué los 14 contra [2,4,1] posición por posición.", "Los dos siguen los mismos cuatro pasos; la diferencia es cuánto guardan y cuánto mandan. Lamport manda un número y solo sirve en un sentido: por la contrapositiva, si LC(A) no es menor que LC(B), A no pudo causar B. El vector manda N números y a cambio dice exactamente qué pudo causar qué, incluido cuándo dos eventos son concurrentes. En la misma corrida de Alice, Bob y Carol, la recepción de Carol que vale [0,3,2] tiene Lamport 5 y A tiene 6: 5 < 6 parece decir 'antes', y no lo es. También c3 = [0,3,3] tiene Lamport 6, igual que A, siendo concurrentes; ahí Lamport necesita el desempate por id para dar un orden total. El costo crece con el número de procesos y supone que todos acuerdan de antemano qué posición es de quién. Por eso Lamport sigue vivo: es barato.\n\nPreguntas para el grupo: ¿cuál es el principal cuello de botella si el sistema tiene muchos clientes? (el tamaño del vector, que viaja en cada mensaje). ¿Cuándo me alcanza con Lamport?\n\nTransición: los vectores ya nos dicen qué pasó antes. Pero la red puede entregar un mensaje antes que el mensaje que lo causó; para eso hay que separar recibir de entregar, y es el siguiente bloque.\n\nFuentes: Kuper CSE138 L3, sección 'Comparación: Lamport contra vectorial', sección 13 (contrapositiva y trade-off) y Precisiones (costo de N números, procesos fijos, Fidge y Mattern, 1988); la pregunta del cuello de botella es la del cierre de Systemic Stack ep. 40. Los valores de Lamport sobre el diagrama de Alice, Bob y Carol son cálculo mío: c1 1, b1 2, b2 3, a1 4, b3 4, c2 5, a2 5, b4 = A 6, c3 6, a3 7, b5 7, c4 8, c5 9 y a4 10.", "Kuper separa tres verbos: enviar es algo que haces, recibir es algo que te pasa (los mensajes llegan o no llegan) y entregar es algo que decides hacer con un mensaje que ya recibiste. El protocolo puede meter lo recibido a una cola y entregarlo después, en el orden que le convenga. Ya lo han visto dos veces sin nombrarlo: TCP recibe segmentos fuera de orden y solo le entrega a tu programa los bytes en orden; y en la S09 el consumidor idempotente recibe el duplicado del at-least-once y decide no aplicarlo. En esta parte de la clase cada envío, cada recepción y cada entrega es de un solo mensaje.\n\nPregunta para el grupo (la de Kuper): ¿por qué querrías encolar un mensaje que ya recibiste y no entregarlo todavía? (Respuesta esperada: porque puede llegar otro que debe ir antes.)\n\nTransición: ¿con qué regla decide la cola qué entregar? Empecemos por la más simple: el orden en que los mandó el emisor.\n\nFuente: Kuper CSE138 L4, sección 5, de 0:38:10 a 0:42:08, fotograma t004216; Precisiones del reporte (TCP como ejemplo de recibir contra entregar).", "FIFO es first in, first out: un canal tipo cola entre dos procesos. Si Bob entrega m2 en cuanto lo recibe, viola FIFO; con números de secuencia, Bob ve que llegó el 2 cuando esperaba el 1, lo encola, y al llegar el 1 entrega los dos en orden. Es exactamente lo que hace TCP (su especificación lo llama ordered delivery), por eso casi nunca lo programarán ustedes; con UDP sí. Ojo con el detalle: TCP ordena dentro de una conexión; si el cliente se reconecta o abre varias, no hay orden entre ellas.\n\nPreguntas para el grupo: ¿cómo sabe Bob que m1 se envió antes que m2? (alguien dirá 'con el reloj vectorial': funciona, pero sobra, basta un contador); y si el 1 se pierde, ¿qué pasa con el 2? (se queda en la cola para siempre: los números de secuencia necesitan entrega confiable, y TCP tiene las dos). Dato para quien pregunte: tirar todos los mensajes también cumple FIFO, de forma vacua. Guárdense esta idea de 'un número que crece por emisor': en un rato la vemos en Kafka con otro nombre, offset.\n\nTransición: FIFO solo mira a un emisor; ¿qué pasa cuando platican tres?\n\nFuente: Kuper CSE138 L4, secciones 5 y 6, de 0:42:08 a 0:57:12, fotogramas t004736 y t005130; Precisiones del reporte ('TCP da FIFO' vale dentro de una conexión).", "Alice le manda 'Bob smells' a Bob y a Carol. Bob lo lee y responde '¡Oye!' a las dos. A Carol le llega primero la respuesta y luego el mensaje original: lee un '¡Oye!' sin contexto. No viola FIFO, porque Carol nunca recibe dos mensajes del mismo emisor; sí viola causal, porque Bob escribió m2 después de recibir m1, así que el envío de m1 está en la historia causal del envío de m2 (el lazo rojo). TCP no te salva: m1 viaja por la conexión Alice a Carol y m2 por la de Bob a Carol, y TCP no ordena entre conexiones. Con relojes vectoriales, Carol ve que m2 trae un 1 en la entrada de Alice y ella lleva 0: le falta algo del pasado de m2, lo retiene hasta entregar m1. No damos el algoritmo completo (es la clase siguiente de Kuper).\n\nPregunta para el grupo, con un minuto para pensar (como Kuper): ¿esto viola FIFO? El error típico es decir que sí. Remate de Kuper: todas las violaciones interesantes de entrega causal necesitan tres o más procesos; y toda violación de FIFO es también violación causal (la de la lámina anterior). Si sobra un minuto, en Mexi Banco: Antifraude publica 'TransferenciaRevertida' por una 'TransferenciaRealizada'; si Notificaciones entrega la reversa antes que la transferencia, el cliente lee 'te devolvimos $500' de algo que nunca vio (ejemplo ilustrativo, no viene de las fuentes). Ojo: aquí los vectores cuentan solo mensajes enviados, no todos los eventos como en el algoritmo que vimos; es el ajuste que hace la entrega causal [VERIFICAR: convención de 'solo envíos' contra el video de la L5 de Kuper · el reporte la da como resumen, no del video].\n\nTransición: hasta aquí ordenamos sin preguntarle la hora a nadie; Google tomó el camino contrario: comprar un reloj mejor.\n\nFuente: Kuper CSE138 L4, sección 8, de 1:16:50 a 1:26:40, fotograma t012612; Precisiones del reporte (ejemplo de causal broadcast sobre 'Bob smells'). La grosería original del video ('FUA') se cambió por '¡Oye!'.", "Hoy vimos cuatro ideas: hora física, orden de mensajes, tiempo lógico y vectores. En la práctica casi nunca las programamos: vienen dentro de las herramientas. Ojo con la última columna: no todas usan el mismo mecanismo ni prometen el mismo orden. Kafka ordena por partición, MongoDB sigue causas, Spanner respeta el tiempo real. Demo opcional de 1 minuto si hay un Linux a la mano: chronyc tracking muestra System time (el desfase estimado contra NTP), Last offset, Frequency en ppm (la deriva) y Root dispersion (la incertidumbre); chronyc sources -v lista las fuentes. Son los conceptos del bloque 2 convertidos en métricas de operación. Pregunta para el grupo: ¿cuáles de estas herramientas ya usaron en el curso? (Kafka en la S09; el reloj monotónico cada vez que midieron un timeout). Transición: empecemos por las dos que más se comparan, Spanner y Kafka. Fuente: chat de ChatGPT que compartió Oscar (mapa de la teoría a las tecnologías).", "Dos filosofías con el mismo objetivo, ordenar a gran escala. Google le apuesta al hardware: relojes atómicos y receptores GPS en cada centro de datos, y aun así no dice 'son las 10:00', dice 'son entre las 10:00:00.001 y las 10:00:00.007'. Para no equivocarse, Spanner espera a que pase esa ventana antes de confirmar, y así lo que se confirme después tendrá una marca mayor: pagas el orden con hardware caro y con espera. Kafka, que crearon en LinkedIn, no sincroniza nada: cada mensaje recibe un offset que crece, y quien lea una partición la ve en el mismo orden. Es el número de secuencia de FIFO de hace rato, ahora por partición; lo vieron en la S09 con la llave que elige la partición.\n\nPregunta para el grupo: en Mexi Banco, si la llave es el número de cuenta, ¿qué orden garantiza Kafka? (el de los eventos de una misma cuenta; entre dos cuentas, ninguno). Otra: ¿cuál conviene? 'Depende de tu presupuesto y de cuánta consistencia necesitas' (Systemic). Para quien pregunte: en el paper de Spanner la incertidumbre va de 1 a 7 ms y la espera dura del orden del doble de esa incertidumbre; los valores de la lámina son ilustrativos. Kafka sí guarda una marca de tiempo física en cada mensaje (para retención y búsqueda por tiempo), pero no la usa para ordenar; y el exactly-once no sale de los offsets.\n\nTransición: Kafka ordena sin preguntar la hora. ¿Y si queremos llevar nosotros el orden causal en los eventos que mandamos por Kafka? Son veinte líneas de Java.\n\nFuente: Systemic Stack ep. 40, secciones 14 y 15, figuras t001404 y t001512; Precisiones del reporte (TrueTime y Kafka).", "Esto es todo el algoritmo del bloque 4 en Java: un AtomicLong para que dos hilos no se pisen, tick() en cada evento local o envío, y al recibir, el máximo más uno. Corrida: A hace un evento (1), luego envía (2); mientras, B hizo un evento (1); cuando le llega el mensaje con 2, B calcula max(1, 2) + 1 = 3. No usamos Instant.now() en ningún lado. En un sistema con mensajería como el de la S09, la marca viaja como un campo más del evento (o en un header de Kafka) y el consumidor llama a recibir() antes de procesar. Dos cuidados: si el servicio reinicia y el contador vuelve a 0, rompe la clock condition, así que hay que persistirlo o arrancar desde el máximo conocido; y como vimos con el contraejemplo, este número no te dice si dos eventos son concurrentes: para eso necesitas el vector. Pregunta para el grupo: ¿en qué microservicio de Mexi Banco pondrían el tick() del envío? (justo antes de publicar el evento, en el mismo lugar del Outbox). Transición: casi nunca escribimos esto a mano; MongoDB, por ejemplo, ya lleva un tiempo lógico en cada sesión. Fuente: chat de ChatGPT que compartió Oscar (sección 9, LamportClock en Java), adaptado a Mexi Banco.", "Este es el ejemplo más directo de lo de hoy. Cambias tu nombre a Ana y en la siguiente consulta ves María: tu lectura cayó en una réplica atrasada (replicación asíncrona, S06). Con una sesión causalmente consistente, el driver guarda la marca lógica de tu última operación (operationTime, y el $clusterTime del clúster) y la manda en la lectura; la réplica que te atiende espera a haber aplicado hasta esa marca antes de responder. No hay hora de pared en ningún lado. Las garantías de la sesión: lees lo que escribiste, tus lecturas no retroceden, tus escrituras se aplican en orden y las escrituras siguen a las lecturas. Para que valgan las garantías documentadas hay que usar readConcern y writeConcern majority, y usar la misma sesión (o pasar su contexto causal a otra). Los valores 103 y 105 son ilustrativos: en MongoDB la marca real es un Timestamp de (segundos, incremento). Pregunta para el grupo: ¿qué pasa si abro una sesión nueva para la lectura? (pierdo la marca y puedo volver a ver María). Transición: esa marca de MongoDB, por cierto, no es un Lamport puro: mezcla la hora física con un contador. Fuente: chat de ChatGPT que compartió Oscar (sección 3, MongoDB) y la documentación de causal consistency de MongoDB.", "Válvula: si el tiempo aprieta, se dice en un minuto desde la tabla. Ya vimos que la hora física se desfasa y que Lamport no se parece a la hora. El reloj híbrido junta las dos: el primer número sigue de cerca la hora física; el segundo es un contador que sube cuando la hora no avanza o cuando llega un mensaje con una marca más adelantada. En la corrida, B va atrasado (998), recibe (1000, 2) y no retrocede ni ignora el mensaje: queda en (1000, 3). Igual que Lamport, cumple que si A → B, la marca de A es menor; e igual que Lamport, al revés no: no detecta concurrentes. CockroachDB asigna con HLC las marcas de sus transacciones; MongoDB usa un reloj híbrido para su $clusterTime (es la marca de la lámina anterior); YugabyteDB también. Ninguno se vuelve linealizable solo por el HLC: lo combinan con replicación y control de concurrencia. Pregunta para el grupo: ¿qué gano frente a Lamport? (puedo buscar 'lo que pasó a las 10:00' y las marcas se parecen a la hora real). Valores de la tabla: ilustrativos del chat. Transición: hay otra herramienta que reconstruye causas, pero no para ordenar escrituras sino para depurar. Fuente: chat de ChatGPT que compartió Oscar (sección 6, CockroachDB); Kulkarni y otros, 2014, para el algoritmo de recepción.", "Válvula. Cuando una transferencia tarda, ¿dónde se fue el tiempo? OpenTelemetry pasa un contexto en cada llamada (el encabezado traceparent): todas las operaciones de la misma petición comparten traceId y cada una tiene su spanId y el de su padre. Con eso el colector dibuja la cascada: el Gateway llamó a Transferencia, que llamó a Cuenta y a SPEI, y la Notificación salió por la cola. Es happens-before hecho visible: la relación padre-hijo es la flecha de envío y recepción. Pero ojo: OpenTelemetry no garantiza el orden de las escrituras ni ninguna consistencia; sirve para observar y depurar. Las barras se dibujan con la hora de cada servidor, así que con desfase pueden verse un hijo empezando antes que su padre: la relación padre-hijo es la que manda. El valor del traceparent es el ejemplo de la especificación del W3C. Pregunta para el grupo: si un hijo aparece antes que su padre en la cascada, ¿qué pasó? (desfase de relojes entre los dos servidores, el bloque 2). Transición: volvamos a la diferencia que más confunde, causal contra linealizable. Fuente: chat de ChatGPT que compartió Oscar (sección 8, OpenTelemetry); especificación W3C Trace Context.", "No confundan las dos palabras. La causalidad es una relación entre eventos: ¿A pudo influir en B? La linealizabilidad, que vimos en la S06, es una garantía del sistema: se comporta como una sola copia y respeta el tiempo real; cuando alguien ya vio el valor nuevo, nadie que empiece después ve el viejo. Saldo de $100: A lo cambia a $200 y le confirman; un segundo después B lee en otra réplica, a la que la copia todavía no llega. Con consistencia causal, B puede leer $100, porque su lectura no depende de la escritura de A; con linealizabilidad debe leer $200. Los relojes lógicos dan orden causal sin coordinarse, pero no hacen linealizable a nadie: para eso hace falta un líder o consenso, como Raft en la S06, y se paga esperando a la mayoría. La sesión causal de MongoDB de hace rato es justo esto: tú ves tus escrituras, pero otro cliente sin tu sesión puede leer el valor viejo. Matiz importante: si A le avisa a B por el propio sistema ('ya te deposité') y B lee después, ahora sí hay causalidad y la consistencia causal también exige $200. Es el ejemplo social: Ana publica '¡Aprobé el examen!', Luis comenta '¡Felicidades!'; si María ve el comentario, también debe ver la publicación. Es 'Bob smells' con otra ropa.\n\nPreguntas para el grupo: ¿en qué parte de Mexi Banco aceptarías que B vea $100 un segundo después? ¿En cuál no? (un estado de cuenta o una notificación aguantan; un retiro que no puede dejar saldo negativo, no). Si sale el tema: el orden de los mensajes es consistencia causal, no la C de CAP.\n\nTransición: con esto ya tenemos todas las piezas de la clase; juntémoslas.\n\nFuente: chat de ChatGPT que compartió Oscar (resumen en contexto-clase.md); S06, lámina de linealizabilidad.", "Volvemos a la pregunta del principio. El reloj físico contesta '¿qué hora es?', pero solo aproximado: NTP acerca los relojes y la deriva y la latencia nunca dejan que coincidan (10:03 contra 10:00). Lamport contesta '¿pudo A causar B?' solo en un sentido: si LC(A) es mayor o igual que LC(B), A no causó B; con 1 contra 5 no sabemos. Los vectores contestan las tres: antes, después o concurrentes, comparando entrada por entrada ([2,4,1] y [3,3,3] son concurrentes). Y con eso decidimos cuándo entregar: un contador para FIFO, un vector para causal. Lo que perdemos es la hora legible para humanos; lo que ganamos es un orden en el que todos los servidores pueden confiar.\n\nPregunta para el grupo (la del cierre de Systemic): ¿cuál es el cuello de botella de los relojes vectoriales? (crecen con el número de procesos y viajan en cada mensaje).\n\nTransición: y una última idea para llevarse.\n\nFuente: Systemic Stack ep. 40, sección 18, figuras t001828 y t001916; valores de los bloques 2, 4 y 5 (10:03 contra 10:00 de FIUBA; LC(A)=1 y LC(B)=5 de Kuper L4; [2,4,1] y [3,3,3] de Kuper L4).", "Tres ideas para llevarse. Primera: no siempre vamos a construir estos mecanismos; Kafka, MongoDB, CockroachDB o Spanner ya los traen por dentro. Segunda: un orden de mensajes, una relación causal y un orden linealizable son garantías diferentes; Kafka da la primera por partición, una sesión de MongoDB la segunda, Spanner la tercera, y confundirlas es como se meten los bugs. Tercera: estudiar relojes sirve para leer la documentación de una tecnología y saber qué te garantiza y qué tienes que resolver tú en tu aplicación. Y la frase con la que cerramos: un sistema distribuido no tiene un único reloj perfecto, pero puede tener mecanismos que le permiten razonar correctamente sobre su propia historia. Regresen a la pregunta de la portada: ¿cómo sabemos qué pasó primero? Ya no preguntándole la hora a cada servidor, sino siguiendo las causas. Lectura: Lamport 1978, 'Time, Clocks, and the Ordering of Events in a Distributed System'. [VERIFICAR: tema que anuncia Oscar para la S11]. Fuente: chat de ChatGPT que compartió Oscar (cierre de la última respuesta)."]);
function resize(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1600,innerHeight/900))}function show(n){current=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle('active',i===current));history.replaceState(null,'','#'+current);document.querySelector('#nt').textContent='Notas · '+String(current).padStart(2,'0');document.querySelector('#nb').innerText=scripts[current];document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1}function toggle(){notes.hidden=!notes.hidden}document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#note').onclick=toggle;document.querySelector('#close').onclick=toggle;document.querySelector('#print').onclick=()=>window.print();document.addEventListener('keydown',e=>{if(e.key==='Escape'){notes.hidden=true;return}if(e.key.toLowerCase()==='n'){toggle();return}if(!notes.hidden)return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});document.querySelector('#stage').addEventListener('click',e=>{if(e.target.closest('button')||!notes.hidden)return;const r=document.querySelector('#stage').getBoundingClientRect();show(current+(e.clientX<r.left+r.width*.18?-1:1))});window.addEventListener('resize',resize);window.addEventListener('hashchange',()=>show(Number(location.hash.slice(1))||0));resize();show(Number(location.hash.slice(1))||0);
</script></html>
