o, ahora llena. Cada propiedad tiene un mecanismo que vimos hoy, y cada mecanismo cobra algo: la puerta abierta trae a Sybil, la prueba de trabajo trae diez minutos y energía, la disponibilidad trae una finalidad que nunca es total, y la integridad es evidencia, no imposibilidad. La fila de abajo no es una propiedad: es lo que sostiene a las demás. Si nadie cobrara por minar, nadie minaría, y sin mineros no hay prueba de trabajo.\"\n\nCitas:\n\nFIUBA 0:11:28: \"Obviamente esto tiene un costo, es más lento\", \"a cambio de un feature gigante\" (0:11:35).\n\nNakamoto §6: \"más rentable jugar con las reglas\".\n\nTexto completo del contexto (léelo si hace falta):\n\nMecanismo:\n\n1. Identidad = llave pública; cualquiera corre un nodo.\n\n2. Cualquiera mina; el pago espera en la mempool.\n\n3. Prueba de trabajo elige quién propone; gana la cadena con más trabajo.\n\n4. Se vota con cómputo, no con identidades.\n\n5. Acepta el primer bloque y reorganiza después.\n\n6. Firma digital.\n\n7. Cada pago gasta salidas concretas (UTXO).\n\n8. Hash y bloques encadenados.\n\nCosto:\n\n1. Abre la puerta a Sybil.\n\n2. Con comisión baja, espera más.\n\n3. Un bloque cada 10 min y mucha energía.\n\n4. Cae si un atacante tiene más de la mitad del cómputo.\n\n5. La finalidad es probabilística: hay que esperar confirmaciones.\n\n6. Perder la llave privada es perder el dinero.\n\n7. Hay que guardar las salidas sin gastar.\n\n8. Es evidencia, no imposibilidad.\n\nIncentivo: recompensa y comisiones pagan por operar, y la dificultad se ajusta para mantener un bloque cada 10 min.\n\nPreguntas para el grupo:\n\n\"Si cierro la puerta y quito la propiedad 1, ¿qué costos desaparecen?\" (Sybil, y con él la necesidad de pagar con cómputo: basta votar con un censo, que es Raft o PBFT. Es la 35).\n\n\"¿Cuál de estos costos no aceptaría Mexi Banco?\" (la finalidad probabilística y los 10 min; se ve en la 37).\n\nTransición: \"Si cerramos la puerta, la mitad de los costos desaparece. ¿Y cómo se compara con Raft?\"\n\nReferencias: Nakamoto (2008), §4 (prueba de trabajo), §6 (incentivo) y §11 (cálculos). FIUBA TA050 clase 13, 0:11:28 y 0:50:52. Dificultad cada 2,016 bloques (Bitcoin Developer Docs, en el dossier 04-blockchain.md §2.7).\n\nQuitado de la lámina (dilo si sirve): la recompensa vigente es de 3.125 BTC desde el bloque 840,000, y el tope es de 21 millones (lámina 24).", "Qué decir: «Con el contrato lleno, pongamos a Nakamoto junto a los dos que ya conocen. Los tres hacen lo mismo: ordenar un log replicado. Lo que cambia es lo que suponen. Raft supone nodos que se caen pero no mienten, y sabe cuáles son; FIUBA lo dijo: \"si empezás a generar nodos deshonestos, rompés el sistema muy rápido; no hace falta llegar a la mayoría\" (0:18:44). PBFT tolera mentirosos, pero necesita un censo fijo y conocer las llaves de todos para contar votos. Nakamoto no sabe ni quiénes ni cuántos son, así que no cuenta votos: pesa trabajo. Y lo paga en finalidad y en rendimiento: Raft y PBFT finalizan de forma determinista; Bitcoin, como dijo FIUBA, \"nunca se terminan de finalizar los bloques\" (0:54:16), y procesa unas 7 transacciones por segundo, del orden de 600 mil al día para todo el mundo.»\n\nOjo con el tercio: «un tercio» es la cota de los protocolos con votos como PBFT (3f + 1). A Bitcoin lo rompe un atacante con más de la mitad del cómputo. FIUBA los mezcla en el 0:48:07; no lo repitas.\n\nPreguntas para el grupo:\n\n«¿Por qué no usar Raft para Bitcoin?» (supone nodos conocidos que no mienten).\n\n«¿Y por qué no PBFT?» (necesita conocer a todos; con Sybil, el atacante infla el censo).\n\n«¿Por qué uno pide 2f + 1 y el otro 3f + 1?» (con mentirosos, dos mayorías deben coincidir en al menos un nodo honesto; el argumento completo va en la S14).\n\n«¿Dónde cae Ethereum con prueba de participación?» (en medio: tiene censo de validadores y finaliza con dos tercios del stake).\n\nPrecisiones:\n\nLa latencia no tiene fila. Raft confirma en una ida y vuelta a la mayoría, PBFT en tres fases de mensajes y Bitcoin en unos 10 min por bloque (cerca de 1 h con 6 confirmaciones).\n\nRaft no tiene una cifra canónica de rendimiento: depende del disco y de la red del líder.\n\nPBFT: el sistema de archivos replicado de Castro y Liskov (BFS) quedó solo 3 % más lento que NFS sin replicar. Su costo son O(n²) mensajes, por eso llega a decenas de nodos.\n\nCon selfish mining, un minero con menos de la mitad saca ventaja injusta, aunque no reescribe la cadena a voluntad (Eyal y Sirer, 2014). [VERIFICAR: umbral de 1/4 o 1/3 según los supuestos · no releído]\n\nLa frase del pie es del libro, cap. 12, §6.2, acortada. La completa: «PBFT cuenta votos porque sabe quiénes votan; Bitcoin no sabe quiénes votan, así que pesa trabajo.»\n\nQuitado de la lámina (dilo si sirve): la fila de latencia y la de dónde se usa cada uno (etcd y Kafka con KRaft usan Raft; Fabric 3.0 trae un orderer BFT; Bitcoin es Nakamoto).\n\nTransición: «Si Nakamoto paga tanto por no saber quién vota, ¿vale la pena usarlo como base de datos?»\n\nReferencias: el dossier 04-blockchain.md §3.1. Castro y Liskov (1999). Ongaro y Ousterhout (2014). Wüst y Gervais (2018), que dan unas 7 tx/s citando a Croman et al. (2016). FIUBA 0:18:44 y 0:54:16.", "Qué decir: «Pensémoslo como una base más del sistema. Da cosas que ninguna otra da: solo se le agrega, cualquier cambio se nota, cualquiera la verifica sin confiar en quien la opera y todos ven la misma historia. Pero le falta casi todo lo que le pedimos a una base. No hay índices ni joins; si la indexas afuera para consultarla, esa copia ya no tiene la garantía. No se puede borrar, y eso choca con los derechos ARCO. Es pública: FIUBA lo dice directo, \"estos logs son todos públicos; si alguien te doxea\", sabe \"todas tus transacciones\" (1:24:27). Y hace unas 7 transacciones por segundo. Lo más importante va en el pie: garantiza que nadie cambió el dato, no que el dato fuera cierto. Basura que entra firmada es basura para siempre.»\n\nPreguntas para el grupo:\n\n«Si copio la cadena a un buscador para consultarla, ¿esa copia sigue siendo verificable?» (no: es una copia derivada; hay que poder reconstruirla y validarla contra la cadena).\n\n«¿Qué prueba el hash de un contrato guardado en la cadena?» (que el contrato existía en esa fecha y no cambió; no que sea válido).\n\n«Ada le pide a Mexi Banco que cancele sus datos. Si estuvieran en una cadena pública, ¿cómo los borras?» (no se puede; por eso los datos personales no van en la cadena). [VERIFICAR: si un hash con sal de un dato personal sigue siendo dato personal según la LFPDPPP 2025 · es interpretación legal]\n\nPrecisiones:\n\nARCO son los derechos de Acceso, Rectificación, Cancelación y Oposición (LFPDPPP, DOF 20-mar-2025); en Europa, el GDPR, art. 17.\n\nLas cadenas permisionadas son más rápidas (Fabric reporta más de 3,500 tx/s; Androulaki et al., 2018), pero siguen detrás de una base con Raft.\n\nQuitado de la lámina (dilo si sirve): los tres patrones reales.\n\nAnclaje: la bitácora vive en tu base y solo su hash se publica; es el §3 del paper, «publicar el hash como en un periódico». OpenTimestamps lo hace sobre Bitcoin.\n\nConsorcio permisionado: varios escritores conocidos que no confían entre sí.\n\nLog verificable sin consenso: Certificate Transparency y las tablas ledger de SQL Server. Amazon QLDB era de esta familia y llegó a fin de soporte el 31-jul-2025, así que la evidencia tiene que poder salir del proveedor.\n\nTransición: «Entonces, ¿cuándo sí conviene? Wüst y Gervais lo redujeron a unas cuantas preguntas.»\n\nReferencias: el dossier 04-blockchain.md §4.1 a §4.3. Nakamoto §3 y §10. FIUBA 1:24:08 a 1:24:47. Microsoft Learn, Ledger overview. InfoQ (26-jul-2024), fin de QLDB.", "Qué decir:\n\n«Wüst y Gervais hicieron la pregunta incómoda: ¿de verdad necesitas un blockchain? Sigan el árbol. Si escribe uno solo, base de datos. Si hay un tercero confiable siempre en línea, que escriba él. Si conoces a todos y confían entre sí, una base compartida. Solo cuando hay varios escritores que no confían y no hay tercero llegamos a un blockchain: sin permisos si no los conoces y permisionado si los conoces. Casi todas las salidas son una base de datos.»\n\n«En Mexi Banco, el core de cuentas sale en la 1: un solo escritor, milisegundos y reversos por orden judicial. Va en PostgreSQL replicado. El SPEI sale en la 2: Banxico ya es el tercero siempre en línea y emite el CEP con sello digital y validador público. Lo que sí suma es anclar la bitácora de auditoría: el log sigue siendo nuestro, y cada hora solo su hash va a Bitcoin con OpenTimestamps. Así ni un DBA del banco reescribe la bitácora sin que se note. Y un consorcio entre bancos que no confían entre sí, para conciliar remesas, sale en la 4: permisionada.»\n\nCierre de la clase: «La pregunta de hoy era cómo llevar un libro mayor de dinero si nadie puede ser el dueño. La respuesta: firmas para saber quién paga, hashes encadenados para notar cambios, prueba de trabajo para elegir quién propone y la cadena con más trabajo para acordar el orden. Todo eso cuesta: sin dueño, el orden se paga con trabajo y la certeza con espera.»\n\nPreguntas para el grupo:\n\n«La bitácora sale en la 1. ¿Por qué entonces está en el SÍ?» (no se usa el blockchain como base, sino como ancla: un testigo público que no controlamos).\n\n«Paquetería con rastreo: la paquetería, la tienda y la aduana escriben. ¿Confían entre sí? ¿Hay un tercero?»\n\n«Su proyecto: ¿algún dato pasa de la pregunta 1?»\n\nPrecisiones:\n\nEl árbol original tiene seis preguntas. Se quitaron «¿Necesitas guardar estado?», al inicio, y «¿Se necesita verificación pública?», al final, que parte la hoja permisionada en pública y privada.\n\nSi el tercero no está siempre en línea, puede funcionar como autoridad certificadora; de ahí sale «conoces a los escritores».\n\nEl paper analiza los pagos interbancarios: en una sola moneda sí hay tercero, el banco central.\n\nEl validador público del CEP de Banxico existe desde el 16-mar-2018.\n\nEl anclaje no detecta lo que nunca entró a la bitácora, y tarda del orden de una hora.\n\nTransición: fin de la teoría; pasa al cierre de 10 min.\n\nReferencias: Wüst y Gervais (2018), Do you need a blockchain?, fig. 1 (IACR ePrint 2017/375). el dossier 04-blockchain.md §4.4 y §5. Todd (2016), OpenTimestamps. Banxico, validador de CEP.\n\nQuitado de la lámina (dilo si sirve): OpenTimestamps es el servicio citado para anclar la bitácora; su nombre se conserva aquí para aligerar la tarjeta SÍ."]);
function resize(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1600,innerHeight/900))}function show(n){current=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle('active',i===current));history.replaceState(null,'','#'+current);document.querySelector('#nt').textContent='Notas · '+String(current).padStart(2,'0');document.querySelector('#nb').innerText=scripts[current];document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1}function toggle(){notes.hidden=!notes.hidden}document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#note').onclick=toggle;document.querySelector('#close').onclick=toggle;document.querySelector('#print').onclick=()=>window.print();document.addEventListener('keydown',e=>{if(e.key==='Escape'){notes.hidden=true;return}if(e.key.toLowerCase()==='n'){toggle();return}if(!notes.hidden)return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});document.querySelector('#stage').addEventListener('click',e=>{if(e.target.closest('button')||!notes.hidden)return;const r=document.querySelector('#stage').getBoundingClientRect();show(current+(e.clientX<r.left+r.width*.18?-1:1))});window.addEventListener('resize',resize);window.addEventListener('hashchange',()=>show(Number(location.hash.slice(1))||0));resize();show(Number(location.hash.slice(1))||0);
</script></html>
