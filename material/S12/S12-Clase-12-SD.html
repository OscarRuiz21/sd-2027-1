const scripts=[];
scripts.push(...["Qué decir: \"Hoy toda la sesión es una sola pregunta: ¿cómo se lleva un libro mayor de dinero si nadie puede ser el dueño? Vamos a construir Bitcoin pieza por pieza, siguiendo la clase invitada de Tomás Arjovsky en FIUBA (TA050, clase 13): partimos de un libro mayor sobre Raft, le quitamos supuestos uno por uno y, cada vez que algo se rompe, agregamos la pieza que lo arregla. No vamos a hablar de precios ni de inversión: lo vemos como lo que es, un sistema distribuido. Ya leyeron a Nakamoto, §1 a 6: hoy lo vamos a desarmar.\"\n\nPreguntas para el grupo:\n\n\"Antes de ver nada: si nadie es el dueño del libro, ¿qué es lo primero que se rompe?\" (casi siempre responden \"alguien hace trampa\"; guárdalo para la 02 y la 03).\n\n\"¿Quién terminó el paper de Nakamoto? ¿Qué sección se les hizo más difícil?\" (si dicen el §11, se ve en la 21).\n\nLogística: la teoría A va de la 00 a la 20 (unos 85 min). El descanso de 30 min va después de la 20.\n\nTransición: \"Empecemos por nombrar lo que un blockchain guarda: un libro mayor.\"\n\nReferencias: FIUBA TA050, clase 13, \"Bitcoin\" (Arjovsky). Nakamoto (2008), Bitcoin: A Peer-to-Peer Electronic Cash System. Los hashes de los bloques son ilustrativos y coinciden con los de la lámina 09.", "Qué decir: \"Antes de hablar de blockchain hay que nombrar lo que un blockchain guarda: un libro mayor. Es la lista de todos los movimientos, en orden, y solo se le agrega al final. El saldo no es la verdad: es lo que sale de sumar el libro. Esto ya lo vieron con Kreps en la S09: un log más el estado que se deriva de él. En Mexi Banco la tabla de movimientos es la verdad y el saldo es una copia derivada, como la caché que vimos la clase pasada. La pregunta de toda la clase es una sola: ¿quién decide en qué orden entran los movimientos?\"\n\nPreguntas para el grupo:\n\n\"Si se borra la columna de saldos, ¿se pierde algo?\" (no: se recalcula sumando el libro).\n\n\"Si se borra una fila del libro, ¿se puede recuperar?\" (no: el libro es la verdad).\n\nTransición: \"Mexi Banco tiene un dueño que ordena el libro. ¿Y si nadie pudiera serlo?\"\n\nReferencias: Kreps, The Log (2013), lectura de la S09: tabla y log como dualidad. FIUBA TA050 clase 13, 0:13:31: \"estado materializado del sistema\" junto al log (fotograma t001328.jpg).", "Qué decir: \"Hace una semana se cumplieron 18 años: el 31 de octubre de 2008 Satoshi Nakamoto mandó a una lista de correo un paper de nueve páginas. Su punto de partida es el §1: los pagos por internet dependen de un tercero de confianza, el banco, y eso tiene costos. Hay que confiar en él, puede revertir pagos y, agregaba el invitado de FIUBA, puede cerrarte la cuenta de un día para otro. La propuesta es un libro mayor sin dueño, con tres requisitos: que cualquiera pueda entrar, que nadie pueda censurar y que nadie pueda reescribir la historia. Pero fíjense en lo que acabamos de quitar: el dueño era el que ordenaba. Todo lo que sigue es cómo recuperar el orden sin él.\"\n\nPreguntas para el grupo:\n\n\"¿Mexi Banco necesita esto?\" (no para su core: ahí el dueño es justamente el banco, y la ley lo pide).\n\n\"¿Qué pierden las tres propiedades si vuelve a haber un dueño?\" (las tres dependen de que nadie controle la red).\n\nTransición: \"Antes de construir nada, fijemos qué tiene que cumplir ese libro mayor: el contrato.\"\n\nReferencias: Nakamoto (2008), §1 (confianza, costos y reversibilidad). La censura y los tres requisitos (sin permisos, descentralizado, tamper-proof) vienen de FIUBA TA050 clase 13, 0:08:06 y 0:11:29 (fotograma t001036.jpg). El paper se publicó el 31-oct-2008; el bloque génesis es del 3-ene-2009.\n\nCuidado: la censura no está en el paper; es el aporte del invitado.", "Qué decir: \"Antes de construir nada, fijemos el contrato. Los tres requisitos de FIUBA son muy generales; los abrimos en ocho propiedades con número, y el número no cambia en toda la clase: cuando una lámina diga 'propiedad 3', es esta fila. Fíjense en la 3 y la 5: un solo orden y seguir aceptando pagos con la red partida chocan entre sí; es CAP, y lo vemos en la 17. La columna de mecanismo está vacía a propósito: cada pieza de hoy llena una fila, y al final la volvemos a ver llena, con lo que cuesta cada una.\"\n\nCitas de FIUBA:\n\n0:11:52: \"que cualquiera pueda unirse a la red… en Raft controlamos todos los nodos\".\n\n0:12:27: \"no existe una persona o una entidad o una empresa que pueda decir: no, esta transferencia es válida, pero igual no te la apruebo\".\n\n0:13:12: \"Ese es todo el objetivo de Bitcoin, es evitar los double spends\".\n\nTexto completo de \"Qué exige\" (léelo si alguien pregunta):\n\n1. Cualquiera entra sin pedir permiso.\n\n2. Nadie puede vetar un pago válido.\n\n3. Todos acaban con el mismo orden de pagos.\n\n4. Funciona aunque algunos nodos mientan.\n\n5. Sigue aceptando pagos aunque la red se parta.\n\n6. Solo quien tiene el dinero lo gasta.\n\n7. Un pago se cobra una sola vez.\n\n8. El pasado no cambia sin que se note.\n\nPreguntas para el grupo:\n\n\"¿Cuál de las ocho les parece la más difícil sin dueño?\" (la 3, el orden: es justo lo que hacía el dueño).\n\n\"¿Cuáles cumple hoy Mexi Banco?\" (casi todas dentro de su casa, pero no la 1 ni la 2: el banco decide quién entra y puede bloquear un pago).\n\nTransición: \"Ocho propiedades y ningún mecanismo. Volvamos a algo que ya conocen, Raft: ¿cuántas de estas cumple?\" (Para la 04: en un club cerrado, Raft da el orden y, con un login, la autenticidad, pero no la 1, la 2, la 4 ni la 5. La 04 muestra el orden mediante líder y mayoría; la 05 explicita el censo fijo y el supuesto de nodos que no mienten. El login sería una función de la aplicación, no de Raft.)\n\nReferencias: FIUBA TA050 clase 13, de 0:11:29 a 0:13:15 (fotograma t001036.jpg, \"Features que queremos\"). Nakamoto (2008), §1.\n\nQuitado de la lámina (dilo si sirve): los nombres en inglés de FIUBA son permissionless, descentralizado y tamper-proof.", "Qué decir: \"Hagamos un libro mayor distribuido con lo que ya saben. Cinco nodos con Raft. Ada manda T1, $500 a Beto. El líder lo anota, lo replica a la mayoría y el saldo de Ada queda en $500. Ahora Ada intenta la trampa: manda T2, $600 a Caro, por otro nodo, esperando que no se entere. No importa por dónde entre: el seguidor se lo reenvía al líder, y el líder ya tiene anotado T1. Lo rechaza. Con Raft, un libro mayor es casi trivial: el líder ordena, y al ordenar evita el doble gasto. Quédense con esa idea: el problema es el orden. Ahora vamos a quitarle a Raft sus supuestos uno por uno.\"\n\nPreguntas para el grupo:\n\n\"¿Y si T2 entra por un seguidor? ¿No se salta al líder?\" (no: el seguidor lo reenvía; en Raft solo el líder escribe en el log).\n\n\"¿Qué supuestos de Raft hacen que esto funcione?\" (un dueño que controla las cinco máquinas, nodos que se caen pero no mienten y un censo fijo).\n\nTransición: \"¿Y si no puede haber un dueño de las cinco máquinas?\"\n\nReferencias: FIUBA TA050 clase 13, 0:13:31 a 0:17:27: \"el líder ordena las transferencias y, al ordenar las transferencias, evita el double spend\" (fotogramas t001328.jpg, t001622.jpg, t001724.jpg). La pregunta del alumno sobre el seguidor está en el 0:14:56. Ongaro y Ousterhout (2014).", "Qué decir: \"Raft se diseñó para máquinas que controlamos: un nodo falla callándose, nunca mintiendo. Si un nodo de Raft empieza a mentir, por ejemplo diciendo que es el líder y anotando que Ada tiene un millón, el sistema se rompe muy rápido; ni siquiera hace falta que sean mayoría. Sin dueño, cualquiera puede correr un nodo, así que hay que suponer que algunos mienten. Eso se llama falla bizantina, por el problema de los generales bizantinos de Lamport, Shostak y Pease, de 1982. Y hay un segundo hueco: Raft cuenta votos sobre un censo fijo de 5. Aquí nadie sabe cuántos son.\"\n\nPreguntas para el grupo:\n\n\"¿Cuál es la diferencia entre un nodo caído y uno que miente?\" (al caído se le espera o se le ignora; al que miente hay que poder descubrirlo).\n\nTransición: \"Primer supuesto perdido: ya no hay login de la empresa. ¿Cómo sabemos que un pago lo autorizó Ada?\"\n\nReferencias: Lamport, Shostak y Pease (1982), The Byzantine Generals Problem. FIUBA TA050 clase 13, 0:17:46 y 0:18:44: \"en Raft, si empezás a generar nodos deshonestos, rompés el sistema muy rápido; no hace falta llegar a la mayoría\" (fotograma t001744.jpg).\n\nCuidado: el invitado le atribuye el problema a Dijkstra, pero es de Lamport, Shostak y Pease. No lo repitas.", "Qué decir: \"Sin un dueño no hay login: nadie te da usuario y contraseña. La identidad pasa a ser un par de llaves. La privada solo la tiene Ada y con ella firma. La pública la conoce todo el mundo y con ella cualquiera verifica. Tómenlo como una caja negra con dos funciones, firmar y verificar. Si alguien cambia un solo dígito del mensaje, la firma ya no corresponde. Así, una transacción dice de quién, para quién, cuánto y la firma. Nadie necesita preguntarle a un banco quién es Ada: su cuenta es su llave pública.\"\n\nPreguntas para el grupo:\n\n\"Si pierdo la llave privada, ¿quién me la restablece?\" (nadie: no hay un \"olvidé mi contraseña\").\n\n\"¿La firma impide que Ada pague dos veces?\" (no: prueba quién autorizó, no en qué orden).\n\nTransición: \"Que la firma sea válida no basta. ¿Qué pasa si Beto reenvía el mismo pago firmado?\"\n\nReferencias: Nakamoto (2008), §2: una moneda es una cadena de firmas digitales. FIUBA TA050 clase 13, 0:19:11 a 0:20:30 (fotograma t001944.jpg). 3Blue1Brown, But how does bitcoin actually work? (2017), que explica las firmas.\n\nPrecisión: Bitcoin firma con ECDSA sobre secp256k1 y, desde Taproot (2021), también con Schnorr (BIP 340). La dirección se deriva de la llave pública; no es la llave tal cual. La firma 3045…a1c9 es ilustrativa.", "Qué decir: \"La firma prueba que Ada autorizó $500 a Beto. Pero una firma es solo datos: Beto puede copiar la transacción y mandarla otra vez. La firma sigue siendo válida y Ada pierde el doble. El arreglo es que cada pago diga qué dinero gasta, por ejemplo el depósito número 1. La segunda copia intenta gastar algo que ya se gastó y se rechaza. Es la misma idea que la Idempotency-Key de la S03: un identificador único que hace que repetir no cueste dos veces.\"\n\nPreguntas para el grupo:\n\n\"¿Por qué no basta con agregar la fecha al pago?\" (Beto copia también la fecha; lo que no se puede copiar es gastar dos veces la misma entrada).\n\nTransición: \"Para apuntar a 'lo que gasto' hace falta un nombre único e infalsificable para cada transacción. Ese nombre es su hash.\"\n\nReferencias: FIUBA TA050 clase 13, 0:21:49 (el ataque de repetición, fotograma t002524.jpg) y 1:15:17, donde el invitado corrige: lo que se referencia son las entradas (inputs), no solo \"la transacción anterior\". Nakamoto (2008), §2 y §9.\n\nEl modelo completo (UTXO) llega más adelante en esta clase.", "Qué decir: \"Un hash es una función que convierte cualquier dato, un mensaje, un archivo o un bloque entero, en una huella de tamaño fijo. SHA-256 da 256 bits, 64 caracteres hexadecimales. Tiene tres propiedades. El mismo dato siempre da la misma huella. Un cambio mínimo, un 6 en lugar de un 5 o un punto al final, da una huella completamente distinta, sin parecido. Y de la huella no se puede regresar al dato. Estos valores son reales; pueden comprobarlos en su terminal. Así, cada transacción tiene un nombre único que nadie puede falsificar: su hash.\"\n\nComando para comprobarlo en vivo: printf 'Ada paga $500 a Beto' | shasum -a 256. En Linux también funciona sha256sum. En Git Bash, sha256sum.\n\nPreguntas para el grupo:\n\n\"¿Dónde ya usaron un hash sin darse cuenta?\" (los commits de Git, las contraseñas guardadas y la verificación de una descarga).\n\n\"¿El hash impide que alguien cambie el dato?\" (no: lo delata).\n\nTransición: \"Si cada pago tiene huella, podemos encadenar los pagos de modo que cambiar uno viejo se note.\"\n\nReferencias: FIUBA TA050 clase 13, 0:23:06. NIST FIPS 180-4 (SHA-256). Valores calculados el 30-oct-2026 con shasum -a 256.", "Qué decir: \"Ahora juntamos las piezas. Los pagos se agrupan en bloques, y cada bloque guarda la huella del anterior. Si alguien cambia en el bloque 101 el pago de Ada de $500 a $5,000, cambia el hash del 101, y el bloque 102, que guardaba el hash viejo, ya no coincide. Cualquiera lo detecta recalculando. Es un log, como el de Kafka, pero con integridad: cada bloque es posterior al anterior, sin importar a qué hora exacta. Ojo: recalcular hashes es barato. Quien altera puede recalcular el 101, el 102 y todos los siguientes. Por eso esto da evidencia, no imposibilidad. Lo que hace caro recalcular es la prueba de trabajo, y la vemos en unos minutos.\"\n\nPreguntas para el grupo:\n\n\"¿Puede quien altera recalcular todos los hashes?\" (sí, y es barato; falta algo que lo haga caro).\n\n\"Git también encadena por hash. ¿Por qué no es un blockchain?\" (no hay consenso: la rama principal la decide quien administra el repo).\n\nTransición: \"Ya sabemos quién firmó y si alguien alteró algo. Falta una pieza: Raft tenía un líder que ordenaba. Quitémoslo.\"\n\nReferencias: Nakamoto (2008), §3 (servidor de timestamps) y §4. FIUBA TA050 clase 13, 0:25:14 a 0:26:56: \"no importa exactamente en qué momento, lo que importa es que es posterior\" (fotograma t002528.jpg).\n\nQuitado del diseño anterior (dilo si sirve): el árbol de Merkle resume todas las transacciones de un bloque en un solo hash de 32 bytes (§7), y el encabezado de un bloque mide 80 bytes. Los hashes de los bloques son ilustrativos.", "Qué decir: \"Quitemos al último que quedaba: el líder. Sin líder, cada nodo le pasa lo que recibe a sus vecinos; eso se llama gossip, es chisme. Mandarle todo a todos sería impagable con miles de nodos. Ada hace la trampa: manda T1 a un lado de la red y T2 al otro. Cada mitad acepta el primero que le llegó y rechaza el otro. Las firmas son válidas, los hashes cuadran, y aun así hay dos historias: Ada gastó $1,100 teniendo $1,000. El invitado de FIUBA lo dice así: 'la identidad, todo bien; el tamper proofing, todo bien; el problema es la consistencia en la partición de la red'. Perdimos el orden. Nakamoto lo dice en el §2: para saber que una transacción no existe hay que conocerlas todas. Cómo se recupera el orden sin dueño es la prueba de trabajo, y es lo que sigue.\"\n\nPreguntas para el grupo:\n\n\"¿Por qué no ordenar por la hora de cada pago?\" (cada nodo tiene su reloj, como en la S10, y Ada puede poner la hora que quiera).\n\n\"¿Y si votamos: una IP, un voto?\" (es la idea de la lámina siguiente, y falla: cualquiera levanta millones de nodos).\n\nTransición: \"Primera idea para recuperar el orden sin dueño: votemos. Una IP, un voto.\"\n\nReferencias: FIUBA TA050 clase 13, 0:27:47 a 0:31:33 (fotogramas t002750.jpg, t003152.jpg). Nakamoto (2008), §2: \"la única forma de confirmar la ausencia de una transacción es estar al tanto de todas\". 3Blue1Brown 0:11:15: \"las mismas transacciones, en el mismo orden: ese es el corazón del problema\".\n\nCuidado: el invitado dice que el ancho de banda crece \"exponencialmente\" si se manda todo a todos. Crece con el número de nodos (O(n) por mensaje), no de forma exponencial.", "Qué decir: \"Nos quedamos en que sin líder vuelve el doble gasto: falta el orden. La primera idea que se le ocurre a todo el mundo es votar. Que los nodos voten qué pago va primero: una IP, un voto, o una llave, un voto. El invitado de FIUBA lo plantea así: 'hacer una votación entre nodos… una IP es un voto' (0:32:09), y lo tumba enseguida: 'yo agarro y levanto el programa 70 millones de veces en mi computadora' (0:32:23), porque 'crear claves públicas es muy barato' (0:32:39). En Raft esto no pasaba: había un censo de cinco máquinas conocidas. Aquí la propiedad 1 dice que cualquiera entra sin pedir permiso, y una identidad cuesta lo que cuesta generar una llave: nada. Ada vota por T2 con 70 millones de llaves y gana. Ese ataque tiene nombre: Sybil, por Douceur (2002). FIUBA no lo nombra. Es el costo de ser abierto.\"\n\nSi preguntan por las IP: FIUBA (0:32:46): \"un IP de un voto es un poquito más difícil, pero también es muy fácil que haya gente que pueda acceder a generar muchas IPs, si sabes un poquito de networking\". Nakamoto (§4) lo dice casi igual: \"si la mayoría se basara en una IP, un voto, la podría subvertir cualquiera capaz de asignar muchas IPs\".\n\nPreguntas para el grupo:\n\n\"¿Por qué en Raft no existe este problema?\" (hay un censo fijo: la configuración dice quiénes son los cinco y un extraño no vota).\n\n\"¿Y si pedimos INE o CURP para votar?\" (vuelve un dueño que emite y revoca identidades, y se pierde la propiedad 1).\n\n\"¿Qué es más barato fabricar, una IP o una llave?\" (una llave: es un número al azar; las IP se rentan por miles).\n\nTransición: \"Si no podemos impedir que Ada fabrique identidades, hagamos que votar cueste algo que no se fabrica gratis.\"\n\nReferencias:\n\nFIUBA TA050 clase 13, 0:31:51 a 0:33:26. No tiene fotograma propio. Los minutos son del .srt de Whisper.\n\nDouceur (2002), *The Sybil Attack*, IPTPS. Su resultado: sin una autoridad central de confianza, el ataque Sybil siempre es posible, salvo con supuestos poco realistas.\n\nNakamoto (2008), §4.\n\nOjo: la red de 5 nodos que vota T1 es ilustrativa. En la lámina 10 la red quedó partida en dos mitades.\n\nQuitado de la lámina (dilo si sirve):\n\n\"crear una llave es gratis\" como rótulo bajo los clones (la definición ya lo dice);\n\nel nombre \"Sybil\" viene de un libro de 1973 sobre una mujer con múltiples personalidades.\n\nConvención aplicada: el chip ámbar Propiedad 1 · su costo señala el costo de ser abierto. Los clones conservan la apariencia de nodo de red y se distinguen por el rótulo de Ada y las conexiones rojas.", "Qué decir: \"La salida viene de 1992 y no tiene nada que ver con dinero: es el correo. Mandar un correo no cuesta nada, así que mandar un millón de spams tampoco. Cynthia Dwork y Moni Naor propusieron que, para mandar un correo, la computadora del remitente resolviera un problema que tarda, y el receptor tira cualquier correo que no traiga la solución. El invitado de FIUBA lo llama 'un spam filter primitivo' (0:35:13). La idea que rescata Bitcoin: 'no podemos evitar que alguien genere infinitas identidades' (0:35:31), pero cada voto cuesta cómputo. Las 70 millones de llaves de Ada corren en la misma laptop: pesan lo que pesa un CPU. Los cinco nodos honestos pesan cinco. FIUBA: 'es como un CPU, un voto' (0:36:03), que es la frase de Nakamoto en el §4.\"\n\nCómo se liga con la propiedad 4: resiste mentirosos mientras los honestos tengan más cómputo que el atacante. Si Ada compra más cómputo que toda la red junta, gana; lo vemos en la lámina 18. No decir \"un tercio\": es más de la mitad del cómputo.\n\nPrecisiones, por si preguntan:\n\nNo son CPUs literalmente. El voto es proporcional al poder de cómputo, que es continuo. FIUBA lo explica con \"un Ryzen 5 contra un Intel i7\" (0:36:03 y siguientes). Hoy se mina con ASIC.\n\nNakamoto no cita a Dwork y Naor: cita a Hashcash (Adam Back, 2002), que es de donde sale la condición \"hash bajo un objetivo\". La referencia de FIUBA a Dwork y Naor es correcta como antecedente.\n\nNo repetir lo de la \"trapdoor como relajación\" de FIUBA. En Dwork y Naor, el atajo sirve para que una autoridad calcule barato.\n\nPreguntas para el grupo:\n\n\"¿Qué tendría que hacer Ada para ganar ahora?\" (tener más cómputo que todos los honestos juntos).\n\n\"¿Por qué el acertijo frena al spammer y no al usuario normal?\" (al usuario le cuesta un segundo por correo; al spammer, un segundo por cada uno de sus millones de correos).\n\n\"Si el cómputo cuesta luz, ¿quién lo paga y por qué?\" (adelanto de incentivos: recompensa y comisiones).\n\nTransición: \"¿Qué problema es caro de resolver y barato de comprobar? Un hash que empiece con ceros.\"\n\nReferencias:\n\nDwork y Naor (1992), *Pricing via Processing or Combatting Junk Mail*, CRYPTO '92.\n\nBack (2002), *Hashcash: A Denial of Service Counter-Measure*.\n\nNakamoto (2008), §4: \"la prueba de trabajo es esencialmente un CPU, un voto\".\n\nFIUBA TA050 clase 13, 0:33:40 a 0:36:10, fotograma t003336.jpg (\"Proof of Work: 1 CPU = 1 voto\").\n\nQuitado de la lámina (dilo si sirve): la frase completa de FIUBA (0:35:28): \"en un entorno de desconfianza, y donde cualquiera puede, de forma barata, generar identidades, [queremos] tener un poco de control de acceso a ese recurso\".\n\nQuitado de la lámina (dilo si sirve): la frase de la tarjeta de 1992, Para mandar un correo, resuelve un acertijo., se condensó en Un acertijo por correo. para mantener 70 palabras visibles.", "Qué decir: \"¿Qué problema es caro de resolver y barato de comprobar? Un hash. El bloque trae el hash del anterior, sus pagos y un campo nuevo, el nonce, que es solo un número. La regla es hashear el bloque completo y que el resultado quede por debajo de un objetivo, que es lo mismo que decir que empiece con cierta cantidad de ceros. Aquí pedí cuatro ceros hexadecimales. No hay atajo: pruebo el nonce 0, el 1, el 2… El ganador fue el 98646, al intento 98,647. Y cualquiera lo comprueba con un solo hash. FIUBA: 'generar la prueba es difícil, es lento' (0:37:30) y 'verificar esa prueba es muy fácil… yo simplemente hago el hash y verifico que son cero' (0:38:05). Esto es lo que faltaba: recalcular hashes era barato y ahora rehacer un bloque cuesta trabajo de verdad.\"\n\nLo que se hasheó (exacto, ASCII, sin salto de línea al final): bloque 103 | anterior 0000c412 | Ada paga 500 a Beto | nonce N, con N en decimal sin comas.\n\nComando para buscarlo en vivo (unos 0.06 s en una laptop):\n\n    python3 -c \"import hashlib; [print(n, hashlib.sha256(f'bloque 103 | anterior 0000c412 | Ada paga 500 a Beto | nonce {n}'.encode()).hexdigest()) for n in range(0,200000)]\" | grep -m1 ' 0000'\n\nComando para verificarlo con un hash:\n\n    printf 'bloque 103 | anterior 0000c412 | Ada paga 500 a Beto | nonce 98646' | shasum -a 256\n\n    (en Linux y Git Bash, sha256sum).\n\nHashes completos (calculados el 2026-11-06 con hashlib y comprobados con shasum -a 256):\n\nnonce 0: f4886e09f8ab824e2e1174ad3ff31306e7f137af667ede2c9f37fdd15100606b\n\nnonce 1: b00570f845f95371f75bba59fa5c64d70b7222ed67b1531abd6317ee75590542\n\nnonce 2: 1da9f2cb738f04a26084e6959637cd49490337169a346676a9107d62583a149b\n\nnonce 2154, el primero con 000: 00017ad7deba8d8671476424d2a040ab8cc5891c8e526165caffc04348930383. Sirve como \"casi\": tiene tres ceros y no cuenta.\n\nnonce 98646, el primero con 0000: 0000b551defafd015b558e00241bce04d817761d13a85fa96cf75ef283b486c9. Es el único con 0000 entre 0 y 98646.\n\nLa lotería:\n\nCuatro ceros hexadecimales son 16 bits, así que en promedio hacen falta 16⁴ = 65,536 intentos. A mí me tocaron 98,647: es suerte. 3Blue1Brown: \"cada bloque es como una lotería en miniatura\" (0:18:41).\n\nCada cero hexadecimal más multiplica el trabajo por 16, y cada bit, por 2. FIUBA lo cuenta en 0:55:25.\n\nBitcoin hoy pide del orden de 2⁷⁹ intentos por bloque, unos 19 ceros hexadecimales. [VERIFICAR: cálculo propio con la dificultad de 1.406 × 10¹⁴ del 30-oct-2026 · cambia cada 2,016 bloques].\n\nPrecisión, por si preguntan:\n\nEl Bitcoin real hashea un encabezado de 80 bytes (versión, hash anterior, raíz de Merkle, hora, objetivo y nonce) con SHA-256 doble, y compara el resultado como número contra el objetivo. Aquí simplifiqué el bloque a una cadena de texto.\n\nEl nonce real es de 32 bits y se acaba rápido. Los mineros también cambian otros campos.\n\nNakamoto, §4: \"implementamos la prueba de trabajo incrementando un nonce en el bloque hasta encontrar un valor que dé al hash del bloque los bits en cero requeridos\".\n\nPreguntas para el grupo:\n\n\"¿Hay un atajo para encontrar el nonce?\" (no se conoce: hay que probar).\n\n\"Beto quiere revisar el bloque. ¿Cuántos hashes calcula?\" (uno).\n\n\"Si alguien cambia en este bloque $500 por $5,000, ¿le sirve el nonce 98646?\" (no: cambia el hash y hay que volver a buscar, y también en todos los bloques siguientes).\n\n\"¿Cuánto más difícil es con cinco ceros?\" (16 veces).\n\nTransición: \"Ya tenemos un acertijo caro. ¿Quién propone el siguiente bloque? El primero que lo resuelve.\"\n\nReferencias:\n\nFIUBA TA050 clase 13, 0:36:29 a 0:39:01, fotograma t003554.jpg. Citas: \"encontrar un X tal que el hash de X es igual a cero… es prácticamente imposible\" (0:36:49); \"que si yo lo hasheo me dé menor a esto\" (0:37:23); \"agregamos un campo que se llama nonce\" (0:38:43).\n\nNakamoto (2008), §4.\n\n3Blue1Brown (2017), 0:14:18 a 0:18:41.\n\nNo repetir: la \"relajación con trapdoor\" que FIUBA atribuye a Dwork y Naor. La condición \"hash menor que un objetivo\" viene de Hashcash y de Bitcoin.", "Qué decir: \"En Raft el líder se elige: un candidato pide votos en su término y gana con la mayoría de un censo que todos conocen. Aquí no hay censo, así que no hay votación ni turnos. Todos buscan al mismo tiempo el nonce del siguiente bloque, y el que lo encuentra primero lo propaga. Los demás lo verifican con un hash, revisan sus pagos, tiran lo que estaban haciendo y se ponen a construir encima. El invitado de FIUBA: 'el líder no se elige, el líder aparece' (0:39:23); 'no es que hay una elección, no es que hay votos… el primero que llega a encontrar un nonce que cumpla con el proof of work manda el bloque, y los otros inmediatamente lo aceptan' (0:39:48 a 0:40:07). Y fíjense qué ganamos: el bloque 103 trae T1. Con T1 adentro, Ada queda en $500 y T2 ya no alcanza. El orden lo puso quien ganó la lotería, sin dueño y sin votos.\"\n\nTurnos: FIUBA explica por qué no se puede turnar el liderazgo: \"acá no existe eso de turnarse, porque alguien puede decir 'yo no te respeto nada, ahora mi turno de nuevo'\" (0:33:26).\n\nPrecisiones:\n\n\"Lo aceptan\" quiere decir que lo aceptan después de verificar la prueba y cada pago. Un bloque inválido se ignora; eso es la lámina 25.\n\nEl líder solo lo es por un bloque. El del 104 todavía no existe: aparece cuando alguien resuelve.\n\nNakamoto, §5: \"los nodos expresan que aceptan un bloque trabajando en el siguiente, usando su hash como hash anterior\".\n\nNo repetir la descripción de Raft que hace FIUBA (\"el que tiene el ID mayor es el líder\", 0:32:53). Raft funciona por términos: un candidato pide votos y gana con mayoría de 3 de 5 (S06).\n\nFIUBA llama a la regla \"Longest Chain\" (0:40:19). Aquí no se nombra todavía; en la lámina 16 se dice bien: la cadena con más trabajo.\n\nPreguntas para el grupo:\n\n\"¿Puede el ganador meter un pago falso a su favor?\" (no: los demás validan y nadie construye encima; el trabajo se pierde).\n\n\"¿Qué hace un nodo que iba en el nonce 50,000 de su propio bloque 103 cuando le llega este?\" (lo tira y empieza el 104 encima: 'me olvido de lo que estoy trabajando', 0:40:19).\n\n\"¿Y si el ganador hubiera recibido T2 primero?\" (su bloque traería T2 y T1 sería el que no alcanza: el orden lo decide quien resuelve, no quién pagó primero).\n\nTransición: \"¿Y si dos resuelven casi al mismo tiempo?\"\n\nReferencias:\n\nFIUBA TA050 clase 13, 0:39:01 a 0:40:50, fotograma t003920.jpg (\"El líder no se elige, aparece\").\n\nNakamoto (2008), §5.\n\nOngaro y Ousterhout (2014), *In Search of an Understandable Consensus Algorithm* (Raft).\n\n3Blue1Brown (2017), 0:18:41.\n\nQuitado de la lámina (dilo si sirve): FIUBA dice que con esto ya está \"la primera parte del consenso, la elección de líder\", y que la segunda es qué hacer con los forks (0:40:50). Es el puente a la 15.\n\nConvención aplicada: todos los nodos llevan relleno #d6dbd8 y borde #202b33 de 2 px. El ganador se reconoce por la corona, la marca ✓ y las flechas verdes.\n\nQuitado de la lámina (dilo si sirve): la banda de contraste se condensó a Raft: votación por término y Bitcoin: propone quien resuelve. La explicación completa y el vínculo con S06 permanecen en estas notas. El rótulo sobre el bloque 102 se abrevia sobre 102.", "Qué decir:\n\n\"El líder aparece, pero con miles de mineros buscando nonces, a veces aparecen dos casi al mismo tiempo: 102A y 102B, los dos válidos.\n\nCada nodo hace lo más simple: sigue trabajando sobre el primero que le llegó.\n\nComo los bloques tardan en propagarse, a dos tercios de la red les llega uno y a un tercio el otro. Por un rato hay dos estados, y nadie se detiene a votar. Por eso esta lámina es la propiedad 5: la red sigue disponible.\"\n\nCitas de FIUBA:\n\n\"yo siempre voy a tratar de construir un bloque nuevo, sobre el último bloque que tengo\" (0:40:25).\n\n\"Los forks son lo que ocurre cuando yo recibo dos bloques en lugar de uno… esta es la crisis\" (0:41:19).\n\n\"existe la posibilidad de que dos nodos manden una solución prácticamente al mismo tiempo\" (0:41:43).\n\n\"el primero que me llegó es el correcto\" (0:42:15). Su lámina dice \"Elijo el primero que me llegó para trabajar\" (fotograma t004140.jpg).\n\n\"eso significa que hay dos estados en este momento\" (0:42:33).\n\n\"le va a llegar a dos tercios de los nodos, y el bloque que mandé yo… a un tercio\" (0:43:11).\n\nPreguntas para el grupo:\n\n\"¿Por qué no esperan todos a ponerse de acuerdo antes de seguir?\" (no hay censo para contar votos, y esperar es dejar de estar disponible).\n\n\"¿Qué pasaría si los bloques salieran cada 10 segundos en vez de cada 10 minutos?\" (habría más empates, porque un bloque tardaría casi lo mismo en propagarse que en minarse).\n\nTransición: \"Dos estados no pueden durar para siempre. ¿Cómo se rompe el empate?\"\n\nReferencias:\n\nFIUBA TA050, clase 13, de 0:40:13 a 0:43:31 (fotograma t004140.jpg).\n\nNakamoto (2008), §5: \"si dos nodos difunden a la vez versiones distintas del siguiente bloque, algunos reciben una primero y otros la otra; trabajan sobre la primera que recibieron, pero guardan la otra rama\".\n\nCuidado: en la lámina de FIUBA los dos bloques dicen \"2A\"; en el audio corrige y el segundo es \"2B\" (0:42:45). El 2/3 contra 1/3 es su ejemplo, no una medición.\n\nQuitado de la lámina (dilo si sirve): los nodos que minan se llaman mineros (FIUBA 0:40:39, \"un nombre medio legacy\").", "Qué decir:\n\n\"El empate dura hasta el siguiente bloque. Como dos tercios trabajaban sobre 102A, lo más probable es que el 103 salga ahí.\n\nNingún nodo había tirado el otro bloque: lo guardó. Cuando llega el 103, el tercio que estaba en 102B compara y se cambia a la rama con más trabajo. Eso se llama fork choice.\n\nOjo con la palabra: no gana la de más bloques, gana la de más trabajo acumulado. Si contaran bloques, alguien podría fabricar una cadena larga de bloques fáciles.\n\nCon esta regla todos terminan con el mismo orden de pagos, y por eso es la propiedad 3.\"\n\nCitas de FIUBA:\n\n\"hay muchas más probabilidades de que el siguiente bloque aparezca sobre esta cadena de arriba\" (0:43:26).\n\n\"acá es donde entra el algoritmo de Longest Chain, que es la segunda parte del consenso distribuido de Bitcoin\" (0:43:38).\n\n\"mi log, a diferencia de Raft, ya no es más una cadena lineal, ahora tiene ramificaciones\" (0:43:52).\n\n\"fork choice, es la elección de la rama correcta\" (0:44:06).\n\n\"pero yo igual el otro me lo guardé, no es que lo elimino\" (0:44:18).\n\nCuidado: FIUBA dice \"este es de altura mayor… altura es el número de bloque\" (0:44:26) y en su lámina \"Si llega uno a altura más alta ahora ese es mi estado\" (t005118.jpg). No se repite.\n\nNakamoto §4: la cadena válida es \"la más larga, la que tiene el mayor esfuerzo de prueba de trabajo invertido\".\n\n3Blue1Brown (0:19:14) lo dice bien: \"the one with the most work put into it\".\n\nLos nodos suman el trabajo esperado de cada bloque según su dificultad. Con dificultad igual, más bloques es más trabajo; cuando la dificultad cambia, no.\n\nPreguntas para el grupo:\n\n\"¿Por qué no gana la que tiene más bloques?\" (porque los bloques fáciles se fabrican; el trabajo no se finge).\n\n\"¿Qué hizo el nodo con 102B mientras tanto?\" (lo guardó, por si su rama crecía).\n\n\"¿En qué se parece a Raft y en qué no?\" (los dos terminan con un solo log; Raft vota con un censo y aquí se pesa trabajo).\n\nTransición: \"Cambiarse de rama tiene un costo: lo que 102B había aceptado se deshace.\"\n\nReferencias: FIUBA TA050, clase 13, de 0:43:26 a 0:44:43 (fotograma t005118.jpg). Nakamoto (2008), §4 y §5. 3Blue1Brown, But how does bitcoin actually work? (2017), 0:19:14.", "Qué decir:\n\n\"Pongámosle pagos al empate. Ada manda T1 a un lado de la red y T2 al otro. Los 2/3 meten T1 en 102A y el 1/3 mete T2 en 102B. Durante la partición, los dos lados siguen aceptando: en CAP, Bitcoin elige disponibilidad.\n\nAl reconectarse, el tercio de abajo se cambia a la rama con más trabajo. Tiene que deshacer 102B y aplicar 102A y 103: eso es una reorganización.\n\nLos pagos de 102B regresan a la mempool. T2 ya no cabe porque T1 ya gastó ese dinero, así que se descarta. Caro vio su pago en un bloque y después desapareció: ese es el precio.\n\nRaft, en la S06, elegía lo contrario: el lado sin mayoría deja de confirmar.\"\n\nCitas de FIUBA:\n\n\"esto en términos de CAP… lo que estamos haciendo es priorizar availability sobre consistencia\" (0:44:44 a 0:44:49).\n\n\"de alguna forma yo estoy generando un error de consistencia\" (0:44:55).\n\n\"en este intervalo cortito de tiempo, puede haber un double spend, porque tuve que ir para atrás en mi estado, y después ir para adelante\" (0:45:08 a 0:45:13).\n\nSu lámina: \"CAP: availability over consistency. Reorg es cambio de historia reciente.\" (t005118.jpg).\n\nPrecisiones:\n\nEn la 15 la \"partición\" es solo un retraso de propagación; aquí se generaliza a una partición real, en la que los dos lados siguen minando y, al reconectarse, gana la rama con más trabajo (04-blockchain.md §3.4).\n\nBitcoin Core intenta regresar a la mempool los pagos de los bloques que desconecta. Los que chocan con la cadena nueva, como T2, que gasta lo mismo que T1, se descartan.\n\nEl resultado es consistencia eventual con finalidad probabilística. Garay, Kiayias y Leonardos (2015) lo llaman prefijo común: los honestos coinciden salvo en los últimos k bloques.\n\nPreguntas para el grupo:\n\n\"¿Qué habría hecho Raft con el lado de 1/3?\" (dejar de confirmar: sin mayoría no compromete; elige consistencia).\n\n\"¿Quién pierde con la reorganización?\" (Caro, si entregó algo al ver T2 en un bloque; por eso se esperan confirmaciones, como se ve en la lámina 21).\n\n\"¿Esto ya lo habían visto con otro nombre?\" (sí: consistencia eventual).\n\nTransición: \"Esto pasa por accidente. ¿Se puede provocar a propósito? Ada tiene una idea.\"\n\nReferencias:\n\nFIUBA TA050, clase 13, de 0:44:43 a 0:45:17 (fotograma t005118.jpg).\n\nBrewer, CAP, visto en la S06.\n\n04-blockchain.md, §2.6 y §3.4.\n\nGaray, Kiayias y Leonardos, The Bitcoin Backbone Protocol (2015).\n\nQuitado de la lámina (dilo si sirve): FIUBA (0:51:16) llama a esto \"reorganización\" y dice que \"ahí se borra una transacción del pasado\". Que sea raro y cada vez más difícil hacia atrás es tema de la lámina 21; no se da frecuencia aquí.\n\nQuitado de la lámina (dilo si sirve): «tuve que ir para atrás en mi estado / y después ir para adelante». Se conserva en notas para aligerar la lámina.", "Qué decir:\n\n\"Si la red se reorganiza por accidente, ¿Ada puede provocarlo? Ada pagó 3 BTC por un departamento, ya tiene las llaves y ahora quiere desconocer el pago.\n\nNo puede borrar el bloque 101: rompería los hashes de todos los que siguen. Tiene que construir otra cadena sin ese pago y resolver la prueba de trabajo de cada bloque.\n\nMientras tanto, la red sigue minando la cadena de arriba. Para que todos se cambien a la suya, su cadena tiene que acumular más trabajo, es decir, producir bloques más rápido que el resto de la red junta. Eso es tener más de la mitad del cómputo.\n\nPor eso el sistema resiste mentirosos: no importa cuántos nodos mientan, sino cuánto cómputo tienen.\"\n\nCitas de FIUBA:\n\n\"Soy el malo de la película\" (0:45:28).\n\n\"Imagínense que me compré un departamento, eso 3 BTC… ya me entregué la llave del departamento, ya estoy mudado, listo, mi plan ahora es desconocer eso\" (0:45:58).\n\n\"tengo que empezar a construir otra cadena… donde yo no le hice esa transacción\" (0:46:08 a 0:46:19).\n\n\"para generar una cadena que es válida, tengo que resolver proof of work, para cada uno de los bloques\" (0:46:25).\n\n\"salvo que tenga… una cantidad mayoritaria del poder de cómputo de toda la red\" (0:46:54).\n\n\"hoy tendría que comprarme fábricas y fábricas y fábricas\" (0:47:05).\n\n\"mi velocidad de producción de bloques tiene que ser mayor a la de todo el resto de la red\" (0:47:48).\n\nSu lámina (t004524.jpg): \"Necesito controlar la mayoría del poder de cómputo de la red\".\n\nCuidado: en 0:48:06 FIUBA dice \"tengo que juntar aproximadamente más de un tercio de la red\". No se repite.\n\nEl tercio es la cota de los protocolos con votos (3f + 1, PBFT).\n\nEl supuesto de Nakamoto (§1) es que los honestos tengan más cómputo que cualquier grupo atacante.\n\nMatiz real: con selfish mining (Eyal y Sirer, 2014), alrededor de un tercio da ventaja injusta en recompensas, pero no reescribe la historia a voluntad.\n\nPreguntas para el grupo:\n\n\"¿Por qué Ada no borra solo el bloque 101?\" (el 102 guarda su hash; hay que rehacer todos con prueba de trabajo).\n\n\"Si Ada tuviera el 51 %, ¿podría quitarle dinero a Beto?\" (no: solo deshacer sus propios pagos y censurar; no puede firmar por otros ni crear monedas fuera de las reglas).\n\n\"¿Y con el 10 %?\" (puede tener suerte por uno o dos bloques, y la probabilidad cae muy rápido con cada bloque de ventaja; eso lo vemos en la lámina 21).\n\nTransición: \"Ada no pudo borrar su pago. Al revés: ¿alguien puede impedir que un pago entre?\"\n\nReferencias:\n\nFIUBA TA050, clase 13, de 0:45:18 a 0:48:25 (fotograma t004524.jpg).\n\nNakamoto (2008), §1 y §11.\n\n3Blue1Brown (2017), 0:19:45 a 0:21:18: \"salvo que tenga cerca del 50 % de los recursos de cómputo\".\n\n04-blockchain.md, §8 (\"¿Qué hace quien tenga el 51 %?\").\n\nQuitado de la lámina (dilo si sirve): con la dificultad de hoy, cada bloque cuesta del orden de 2^79 intentos de hash [VERIFICAR: cálculo propio en 04-blockchain.md §2.4 con la dificultad del 30-oct-2026]. FIUBA llama a esto long range attack (0:47:31).", "Qué decir:\n\n\"Falta la otra cara: ¿qué pasa con un pago que un minero no quiere meter? El pago de Ada se difunde por la red y cada nodo lo guarda en su fila de pendientes, la mempool. Ahí todavía no sucedió.\n\nEl minero 1 arma el bloque 105 sin él. No pasa nada grave: el pago sigue en la fila de todos, y el siguiente minero honesto lo incluye en el 106.\n\nLas comisiones ayudan: el minero cobra la comisión de cada pago que mete, así que le conviene incluirlos. Quien paga más entra antes.\"\n\nCitas de FIUBA:\n\nLa pregunta del alumno: \"si a mí nunca me eligen, esas transacciones nunca entran a la red\" (0:48:50 a 0:48:59).\n\n\"Cada nodo se va a guardar transacciones que le llegaron en un buffer local\" (0:49:15).\n\n\"Esa transacción todavía formalmente no sucedió, no fue incluida en el log, está como pendiente\" (0:49:22).\n\n\"Es lo que en Ethereum a veces llamamos mempool\" (0:49:28).\n\n\"más temprano que tarde, si los nodos son honestos, alguno la va a incluir en un bloque\" (0:49:53).\n\n\"hay fees y alguien puede pagar para que se incluya más rápido una transacción\" (0:50:05).\n\nPrecisiones:\n\nEn Bitcoin también se le dice mempool (Bitcoin Core); no es solo de Ethereum.\n\nUn minero solo retrasa. Para vetar de verdad necesitaría más de la mitad del cómputo y negarse a construir sobre cualquier bloque que traiga el pago, que es el ataque de la lámina 18 usado para censurar.\n\nLa censura como requisito es un aporte de FIUBA (0:08:06); no está en el paper.\n\nLa comisión es la diferencia entre lo que entra y lo que sale de un pago, y se la queda el minero (Nakamoto §6).\n\nPreguntas para el grupo:\n\n\"¿Qué tendría que hacer un minero para vetar el pago de Ada para siempre?\" (tener más de la mitad del cómputo y huerfanar los bloques que lo incluyan).\n\n\"¿Y si Ada paga comisión cero?\" (puede esperar mucho: ese es el costo de esta propiedad).\n\n\"¿Mexi Banco puede vetar un pago?\" (sí: tiene dueño, y la ley a veces se lo exige).\n\nTransición: \"Ya tenemos todas las piezas contra el doble gasto. ¿Qué piezas llevamos?\"\n\nReferencias: FIUBA TA050, clase 13, de 0:48:27 a 0:50:10. Nakamoto (2008), §5 y §6. 3Blue1Brown (2017), 0:21:49: las comisiones incentivan al minero a incluir tu pago.\n\nQuitado de la lámina (dilo si sirve): el tamaño del bloque es limitado (4 millones de unidades de peso, BIP 141); por eso hay fila y la comisión decide el orden.", "Qué decir: \"Hagamos la pausa que hace el invitado de FIUBA. Para evitar el doble gasto armamos tres cosas: identidades, que son las llaves, las firmas y los hashes; una elección de líder, que es la prueba de trabajo; y una regla para elegir rama, que es la cadena con más trabajo. Fíjense en la propiedad 3: aparece en dos piezas, porque la prueba de trabajo decide quién propone y la regla de la rama decide qué historia queda; sin las dos no hay un solo orden. Y quedan dos huecos: si la historia se puede reorganizar, ¿cuándo puede Beto dar por cobrado? Y si la prueba de trabajo cuesta máquinas y luz, ¿quién la paga?\"\n\nCita de FIUBA (0:50:52 a 0:51:06): \"para evitar el double spend, lo primero que tuvimos que generar es identidades, lo segundo que tuvimos que generar es elección de líder, para lo cual hicimos proof of work. Lo tercero que tenemos que generar es un mecanismo para elegir cuál fork es el real.\"\n\nPreguntas para el grupo:\n\n\"Si quito el fork choice y cada nodo se queda con el primer bloque que le llegó, ¿qué propiedad se rompe?\" (la 3: la red queda partida para siempre, como en la 10).\n\n\"¿Por qué la 3 aparece en dos tarjetas?\" (una elige quién escribe y la otra qué versión queda).\n\nAquí termina la teoría A: es la lámina antes del descanso de 30 min. Deja las dos preguntas en pantalla.\n\nTransición: \"Vamos al descanso con estas dos preguntas. Al volver empezamos por la de la derecha: ¿cuándo es definitivo un pago?\" (Lámina 21; la de \"quién paga el trabajo\" se responde en la 23.)\n\nReferencias: FIUBA TA050 clase 13, 0:50:52. Nakamoto (2008), §4 (prueba de trabajo y cadena con más trabajo) y §5 (red).\n\nQuitado de la lámina (dilo si sirve): FIUBA nombra solo identidades. Los hashes (propiedad 8) y la referencia a lo que se gasta (propiedad 7) van en la tarjeta 1 porque los vimos en el mismo tramo de su clase (0:21:49 a 0:26:56).\n\nQuitado de la lámina (dilo si sirve): llaves, firmas y hashes / gana la cadena con más trabajo. Se conserva en notas para aligerar la lámina.", "Qué decir: \"Ya vimos que una reorganización borra pagos de la rama que pierde. La buena noticia es que cuanto más atrás queda el pago, más difícil es deshacerlo: cada bloque encima es trabajo que un atacante tendría que rehacer y alcanzar. El invitado de FIUBA lo resume así: 'cuanto más atrás está mi transacción, más difícil es que se me reorganice o que se me deshaga' (0:53:21). Por eso el que cobra elige cuánto esperar: por un café basta con que el pago entre a un bloque ('con un bloque me alcanza', 0:53:57); por un departamento 'no me la voy a jugar' y se esperan unas 6 confirmaciones, como una hora. La tabla del §11 de Nakamoto lo cuantifica: con un atacante del 10 % del cómputo, 1 bloque encima deja 0.2046 de probabilidad de revertir, 5 bloques dejan 0.0009137 (menos de 0.1 %) y 6 dejan 0.0002428.\"\n\nCómo cuadran 5 y 6: \"6 confirmaciones\" cuenta el bloque que trae el pago más 5 encima, que es el +5 de la lámina. Es justo el \"esperemos a que pasen 5 bloques\" de FIUBA (0:53:50) y la fila de Nakamoto donde el riesgo baja de 0.1 % (z = 5). En el §11, z cuenta los bloques después del que trae el pago.\n\nPrecisiones, por si preguntan:\n\nQue se reorganice un bloque pasa, pero hoy en Bitcoin es raro; dos seguidos es muchísimo más raro. [VERIFICAR: frecuencia actual de bloques huérfanos · dato primario en github.com/bitcoin-data/stale-blocks]\n\nLas \"6 confirmaciones\" no están en el paper. Son una convención que supone un atacante con menos del 10 % y un riesgo aceptable menor a 0.1 % (Bitcoin Wiki, *Confirmation*).\n\nPreguntas para el grupo:\n\n\"¿Cuántas confirmaciones esperarías para vender un coche?\" (más que por un café; depende de cuánto pierdes si se revierte).\n\n\"¿Y si el atacante tuviera el 30 % y no el 10 %?\" (con z = 6 la probabilidad sube a 0.1321; harían falta 24 bloques para bajar de 0.1 %).\n\nTransición: \"Fíjense en las barras: se hacen chiquitas, pero nunca llegan a cero. En Raft eso no pasa.\"\n\nReferencias:\n\nFIUBA TA050 clase 13:\n\n0:51:18: \"eso se llama reorganización… y ahí se borra una transacción del pasado\".\n\nDe 0:51:18 a 0:53:35: \"las reorganizaciones son más difíciles cuanto más atrás vaya\".\n\nDe 0:53:50 a 0:54:05: café y departamento.\n\nFotograma img/t004524.jpg, \"Cuanto más viejo más difícil de reorganizar\".\n\nNakamoto (2008), §11. La tabla está recalculada en el dossier 04-blockchain.md §2.6 y otra vez para este diseño: z = 2 da 0.0509779, z = 3 da 0.0131722 y z = 4 da 0.0034552.\n\nCuidado:\n\nEl invitado dice que reorganizar un bloque \"ocurre un par de veces por día\" (0:51:42). No lo repitas: hoy es raro.\n\nEn el audio sus números se enciman: dice \"esperemos a que pasen 5 bloques\" en el ejemplo del café y \"que pasen 2 horas\" en el del departamento. Usa la versión de la lámina.\n\nQuitado de la lámina (dilo si sirve): la fila q = 0.30 (z = 1 da 0.6277, z = 5 da 0.1774, z = 6 da 0.1321; harían falta 24 bloques) y los valores de z = 2 a 4.\n\nRepresentación: las barras de +5 y +6 conservan 2 px de alto mínimo para hacer visible el riesgo no nulo. Seis confirmaciones son el bloque del pago más cinco encima.", "Qué decir: \"En Raft, una entrada que la mayoría ya replicó queda comprometida y ningún líder futuro la pierde: la finalidad es un evento y tiene fecha. Así lo dice el invitado: 'Raft finaliza de forma determinística: una vez que la cantidad de commits es suficiente, se declara que esa entrada de log ya está finalizada' (0:54:10). En Bitcoin no existe ese momento: 'acá nunca se terminan de finalizar los bloques; teóricamente uno podría reorganizar hasta el primer bloque de génesis' (0:54:25). Solo baja el riesgo, y para alcanzarlo hay que tener la mayoría del cómputo: 'volvemos al escenario bizantino clásico' (0:54:54).\"\n\nEl nombre técnico: el invitado lo resume como \"todo esto es eventual consistency\" (1:12:59; antes, en 1:12:39: \"todo esto tiene eventual consistency de una manera o de la otra\"). Garay, Kiayias y Leonardos (2015) lo formalizan como prefijo común: los nodos honestos coinciden en toda la cadena salvo en los últimos k bloques, con una probabilidad que tiende a 1 exponencialmente en k.\n\nEl costo en el contrato: esta es la fila de la propiedad 5. Bitcoin eligió disponibilidad (sigue aceptando bloques aunque la red se parta, lámina 17) y la paga con una finalidad probabilística.\n\nPreguntas para el grupo:\n\n\"¿Qué gana Bitcoin a cambio de no finalizar nunca?\" (seguir disponible sin censo ni votos; Raft, si pierde la mayoría, deja de comprometer).\n\n\"Para el core de Mexi Banco, ¿cuál de las dos finalidades quieren?\" (la determinista: un SPEI no puede quedar en \"probablemente\").\n\nTransición: \"Llevamos toda la clase diciendo 'un bloque cada 10 minutos'. ¿Quién decide ese ritmo si no hay dueño?\"\n\nReferencias:\n\nFIUBA TA050 clase 13, de 0:53:53 a 0:54:54 (minutos del Whisper) y de 1:12:39 a 1:12:59.\n\nOngaro y Ousterhout (2014), §5.4: lo comprometido aparece en el log de todo líder futuro.\n\nGaray, Kiayias y Leonardos, *The Bitcoin Backbone Protocol* (EUROCRYPT 2015).\n\nel dossier 04-blockchain.md §3.4.\n\nQuitado de la lámina (dilo si sirve): la lámina 29 muestra una cadena que sí finaliza (Ethereum, con dos tercios del stake).\n\nRepresentación: las curvas son esquemáticas. Los cinco nodos usan el gris y borde comunes; tres palomitas verdes identifican la mayoría. La garantía de Raft supone su modelo de fallas y el cumplimiento de sus reglas de compromiso.", "Válvula. Si se salta, una frase: \"La dificultad se recalcula sola cada 2,016 bloques para que salga un bloque cada 10 minutos, haya el hardware que haya; sube con el cómputo, no con los pagos.\"\n\nQué decir: \"¿Quién decide cuántos ceros? Nadie se reúne a votarlo: 'es un parámetro de la red' (0:50:48). Cada cero (cada bit) más en el objetivo duplica el trabajo esperado; el invitado lo dice como que 'la dificultad aumenta exponencialmente' (0:55:25). Cada 2,016 bloques, unas dos semanas, todos los nodos hacen la misma cuenta con los tiempos de los bloques: si tardaron menos de 10 minutos en promedio, sube la dificultad, y si tardaron más, baja; es 'una función determinista, en función de los timestamps de los bloques' (0:56:27). Así la red siguió el paso del hardware, 'antes se usaba CPU, después GPU y hoy hardware dedicado' (0:57:45), y el ritmo no cambió.\"\n\nPrecisiones, por si preguntan:\n\nEn cada ajuste la dificultad sube como mucho al cuádruple o baja a la cuarta parte (topes de 300 % y 75 %, Bitcoin Developer Docs).\n\nLa congestión la regulan el tamaño máximo del bloque (4 millones de unidades de peso, BIP 141) y las comisiones: los pagos esperan en la mempool (lámina 19).\n\nUna sola línea sobre energía: ese cómputo es la energía que se le critica a Bitcoin; el debate no es de hoy.\n\n[VERIFICAR: regla del timestamp (mediana de los últimos 11 y máximo +2 h) · citada de memoria en el dossier 04-blockchain.md]\n\nPreguntas para el grupo:\n\n\"Si mañana se duplican los mineros, ¿qué pasa?\" (salen bloques cada unos 5 min hasta el siguiente ajuste; luego la dificultad se duplica y vuelve a 10).\n\n\"Si mañana se duplican los pagos, ¿sube la dificultad?\" (no: se llenan los bloques, suben las comisiones y los pagos esperan en la mempool).\n\nTransición: \"Ese cómputo cuesta luz y máquinas. ¿Por qué alguien lo pagaría?\"\n\nReferencias:\n\nFIUBA TA050 clase 13, de 0:55:06 a 0:57:59 (minutos del Whisper).\n\nBitcoin Developer Docs (ajuste cada 2,016 bloques, topes).\n\nBIP 141.\n\nel dossier 04-blockchain.md §2.7.\n\nCuidado: en 0:55:56 el invitado dice que es \"un control de congestión parecido al de TCP: si estamos recibiendo muchas transacciones, aumentamos la dificultad\". Es incorrecto. No lo repitas ni lo corrijas en voz alta como error suyo: basta con decir que sube con el cómputo.\n\nQuitado de la lámina (dilo si sirve):\n\n\"Cada bit en cero duplica el trabajo\".\n\nLas dos semanas por periodo.\n\nLas curvas son un modelo ilustrativo; los valores de cómputo y dificultad no son reales.\n\nQuitado de la lámina (dilo si sirve): «No es control de congestión: la suben más mineros, no más pagos». El diseño prohíbe esa expresión en pantalla; el chip conserva la idea con «La dificultad sube con el cómputo, no con los pagos».", "Válvula. Si se salta, una frase: \"La primera transacción de cada bloque le paga al minero 3.125 BTC nuevos; la cifra se parte a la mitad cada 210,000 bloques hasta un tope de 21 millones.\"\n\nQué decir: \"Sin banco central, ¿de dónde sale la moneda? Quien mina el bloque mete como primera transacción la coinbase, que le paga moneda nueva: 'esa plata se genera en ese momento' (0:59:00). Sirve 'tanto como incentivo para que el minero quiera minar' como 'para ir generando y distribuyendo monedas en la red' (0:59:30), y Nakamoto lo dice así en el §6: al que tiene mucho cómputo le resulta 'más rentable jugar con las reglas' que atacar. Empezó en 50 BTC y se parte a la mitad cada 210,000 bloques; desde el bloque 840,000, el 20-abr-2024, es de 3.125, y la serie suma 21 millones, que se terminan de emitir hacia 2140. Después quedan solo las comisiones.\"\n\nPrecisiones, por si preguntan:\n\n50 × 210,000 × 2 = 21 millones (serie geométrica). Por el redondeo a satoshis el total queda un poco abajo, unos 20,999,999.98. [VERIFICAR: cifra exacta del tope con redondeo]\n\nEl último subsidio cae hacia el bloque 6,930,000, que a 10 min por bloque es hacia 2140.\n\nFechas de los halvings: 28-nov-2012 (210,000), 9-jul-2016 (420,000), 11-may-2020 (630,000) y 20-abr-2024 (840,000). El siguiente es en el 1,050,000, hacia 2028. [VERIFICAR: fechas de 2012 a 2020 · de memoria; la de 2024 está en las referencias]\n\nUn minero no puede gastar su coinbase sino hasta 100 bloques después, justo por las reorganizaciones de la 21.\n\nLos \"cada 4 años\" son consecuencia de 210,000 bloques a 10 min, no la regla.\n\nPreguntas para el grupo:\n\n\"¿Qué impide que un minero se pague 50 en vez de 3.125?\" (los demás revisan la coinbase e ignoran su bloque: la siguiente lámina).\n\n\"¿Qué pasa cuando la recompensa llegue a cero?\" (los mineros viven de las comisiones; si alcanzan para la seguridad es un debate abierto).\n\nTransición: \"Ganar la lotería da derecho a proponer, no a escribir lo que uno quiera. ¿Qué pasa si el ganador hace trampa?\"\n\nReferencias:\n\nFIUBA TA050 clase 13, de 0:58:29 a 1:01:03, y el fotograma img/t005850.jpg (\"Cómo aparece BTC en la red\": coinbase, halving, \"quedarán solo fees para los mineros\").\n\nNakamoto (2008), §6.\n\nel dossier 04-blockchain.md §2.7.\n\nCuidado: el invitado dice que el halving es \"cada 4 años\" y que va \"en función del timestamp de los bloques\" (1:01:34). No lo repitas: va por altura de bloque, cada 210,000.\n\nQuitado de la lámina (dilo si sirve): \"incentivo y emisión a la vez\" (lo dice el pie), los años de cada halving y \"quedarán solo comisiones\".", "Qué decir: \"Ganar la prueba de trabajo da derecho a proponer, no a escribir lo que uno quiera. Cada nodo revisa el bloque completo: el hash anterior, la prueba, que cada pago sea válido y que la coinbase traiga justo lo que toca. Aquí el minero se pagó 6.25 cuando tocaba 3.125. Nadie lo combate ni lo vota en contra: 'simplemente ignoramos el bloque' (1:01:48), 'nuestra forma de descartar bloques es simplemente ignorarlos y no construir cadenas sobre esos bloques' (1:02:03). El tramposo pierde todo el trabajo que gastó, y Nakamoto lo dice en el §12: los nodos votan con su cómputo, extendiendo los bloques válidos y negándose a trabajar sobre los inválidos.\"\n\nPor qué es la propiedad 4: en Raft un seguidor acepta lo que le manda el líder (supone que nadie miente); aquí cada nodo verifica todo. Por eso ni con mayoría del cómputo se puede crear dinero de la nada ni tomar el de otro: \"los nodos honestos nunca aceptarán un bloque que la contenga\" (§11). Lo que sí puede la mayoría es revertir sus propios pagos recientes (lámina 18).\n\nPreguntas para el grupo:\n\n\"Si el tramposo tiene el 30 % del cómputo y sigue minando sobre su bloque, ¿gana?\" (no: aunque su rama tuviera más trabajo, un nodo completo rechaza una cadena con un bloque inválido).\n\n\"¿Qué pierde el minero que hizo trampa?\" (la luz y el tiempo gastados, y la recompensa legítima que se habría llevado).\n\nTransición, que deja la pregunta para la 26: \"Para revisar 'pagos válidos', un nodo tiene que saber si el dinero que se gasta existe y no se ha gastado. ¿Y cómo sabe un nodo que Ada todavía tiene ese dinero?\"\n\nReferencias:\n\nFIUBA TA050 clase 13, de 1:01:34 a 1:02:04 (minutos del Whisper): \"vamos a ignorar un bloque cuando la recompensa está mal o cuando alguna de las transacciones está mal o cuando la proof of work no es válida o cuando el hash no se corresponde con ningún bloque que yo tenga\".\n\nNakamoto (2008), §11 y §12.\n\nel dossier 04-blockchain.md §2.5.\n\nCuidado: en la misma frase el invitado vuelve a decir que el halving va \"en función del timestamp\" (1:01:34). No lo repitas.\n\nEl ejemplo compara el subsidio autorizado con uno excesivo; se omiten las comisiones para simplificar. La coinbase puede cobrar como máximo el subsidio más las comisiones del bloque.\n\nQuitado de la lámina (dilo si sirve): la cita «simplemente ignorarlos y no construir cadenas sobre esos bloques» · FIUBA. Se conserva en las notas para respetar el máximo de 70 palabras visibles.", "Qué decir: \"Les debo una corrección al dibujo del principio. Bitcoin no guarda una tabla de saldos. FIUBA lo dice así: hasta aquí 'veníamos haciendo de cuenta' que había 'una hoja de Excel' con identidad y monto (1:02:35), pero 'Bitcoin hace algo distinto' (1:03:06). Lo que hay son salidas. El depósito de Ada creó una salida, la #1, de $1,000. Para pagarle $500 a Beto, T1 no resta nada: gasta la #1 completa, porque una salida no se parte, y crea dos salidas nuevas, $500 para Beto y $500 de cambio para Ada. Luca preguntó lo mismo en FIUBA, y la respuesta fue: 'como pagar en el kiosco con cinco y que te den cambio… acá el que te da el cambio es la criptografía' (1:06:37 a 1:07:20). Entonces, ¿cómo sabe un nodo si Ada todavía tiene ese dinero? No consulta un saldo: revisa si la salida que se quiere gastar sigue sin gastar. Cada salida es un interruptor: gastada o no gastada, 'esos son los únicos estados posibles' (1:08:43). Por eso reorganizar es fácil: 'hago un switch binario' (1:04:39).\"\n\nEl \"mentí\" de FIUBA (1:14:53 a 1:15:17), dilo así: \"Al principio dijimos que cada pago apuntaba a 'la transacción anterior'. El invitado lo confiesa: 'mentí temporalmente'. 'Lo que incluye son los hash de los inputs', es decir, las entradas: cada entrada nombra la salida exacta que gasta (hash de la transacción más el número de salida). La firma de Ada cubre esas entradas y también las salidas. Como una salida se gasta una sola vez, una copia de T1 intenta gastar la #1 otra vez y se rechaza: 'UTXO evita replay attacks'. Es lo que mostraba la lámina 07 con 'gasta: depósito #1'.\"\n\nPreguntas para el grupo:\n\n\"Después de T1, Ada intenta T2: $600 a Caro. ¿Qué salidas puede usar?\" (solo la #3, de $500, porque la #1 ya está gastada; no alcanza y T2 se rechaza. Si intenta gastar otra vez la #1, también se rechaza: es la propiedad 7).\n\n\"¿Por qué no partir la salida #1 en dos?\" (las salidas son registros inmutables; solo se gastan enteras y se crean nuevas).\n\n\"Si la suma de las entradas es mayor que la de las salidas, ¿adónde va la diferencia?\" (es la comisión del minero; en la realidad Ada se daría, digamos, $498 de cambio y dejaría $2 de comisión).\n\nTransición: \"Fíjense que en el dibujo escribí 'Ada' y 'Beto'. En el libro real no hay nombres. ¿Entonces a nombre de quién están esas salidas?\"\n\nReferencias: FIUBA TA050 clase 13, 1:02:21 a 1:15:17 (fotogramas t010230.jpg, el de Alice, Bob, Fred y Charles, y t011444.jpg, \"BTC no guarda estado global\"). Nakamoto (2008), §9, \"Combinar y dividir valor\": \"normalmente habrá una sola entrada de una transacción previa más grande, o varias entradas que combinan montos más pequeños, y como mucho dos salidas: una para el pago y otra que devuelve el cambio, si lo hay, al emisor\". La versión de FIUBA: Alice tiene salidas de 2 y 3 BTC, le paga 4 a Bob y se da 1 de cambio.\n\nCuidado:\n\nFIUBA dice que la transacción trae una \"prueba autocontenida\" (1:10:18). Referencia las salidas que gasta, pero para saber que siguen sin gastar el nodo necesita el conjunto de salidas sin gastar (el conjunto UTXO). Ese es el costo de la propiedad 7 que aparece en la lámina 34: \"hay que guardar las salidas sin gastar\".\n\nLos montos reales van en BTC (o en satoshis); los $ son de la historia de Ada.\n\nQuitado de la lámina (dilo si sirve): UTXO es unspent transaction outputs. FIUBA agrega que se puede paralelizar (1:05:09): como las salidas son independientes, varios pagos se validan a la vez sin calcular saldos en orden.\n\nQuitado de la lámina (dilo si sirve): «Acá el que te da el cambio es la criptografía» FIUBA. La frase clave pasa a notas para respetar el límite de texto visible.", "Qué decir: \"Donde la lámina anterior decía 'Ada', el libro real dice una dirección. El paper pide, 'como cortafuegos adicional', usar un nuevo par de llaves para cada transacción, para que no se puedan ligar a un mismo dueño (Nakamoto §10). La wallet de Ada genera todas esas llaves a partir de una sola semilla. Así, el depósito llegó a 7f3a, el cambio de T1 a x8eh y el siguiente cambio a k2dw. Nadie ve nombres. Pero el log es público y no se borra: las flechas, es decir, qué salida se gastó en qué pago, están ahí para siempre. Si un día alguien sabe que 7f3a es de Ada, sigue las flechas. FIUBA: 'estos logs son todos públicos; si alguien te doxea… empiezan a saber de ahí en adelante todas tus transacciones' (1:24:27).\"\n\nCómo se ligan las direcciones (por si preguntan): el cambio sale del mismo pago que gastó la dirección conocida, y un pago con varias entradas \"necesariamente revela que sus entradas eran del mismo dueño\" (Nakamoto §10). El paper admite el riesgo: \"si se revela el dueño de una llave, el ligado podría revelar otras transacciones del mismo dueño\".\n\nPreguntas para el grupo:\n\n\"¿Cómo podrían identificar a Ada en la vida real?\" (una casa de cambio que le pidió su INE, una tienda que le mandó un paquete, una dirección publicada para recibir donaciones).\n\n\"¿Mexi Banco podría poner sus movimientos en una cadena pública?\" (no: lo que entra no se borra y cualquiera lo lee, y choca con el secreto bancario y con los datos personales; lo retoma la lámina 36).\n\nTransición: \"Para seguir sus propias salidas, ¿Ada necesita guardar toda la cadena en su celular?\"\n\nReferencias: Nakamoto (2008), §10 (privacidad). BIP 32 (wallets jerárquicas deterministas: muchas llaves a partir de una semilla). FIUBA TA050 clase 13, 1:24:08 a 1:24:47 (logs públicos y pruebas de conocimiento cero como línea de trabajo).\n\nCuidado: en 1:08:13 FIUBA dice que las direcciones distintas \"en el fondo son todas la misma clave pública\". No es así: cada dirección sale de un par de llaves distinto, derivado de la semilla. No lo repitas.\n\nSi se salta esta válvula, di en una frase: \"En el libro no hay nombres, hay direcciones; pero el libro es público, y quien te identifica una vez ve todo tu historial.\"", "Qué decir: \"Ada no quiere bajar toda la cadena a su celular. Nakamoto lo previó en 2008. Cada encabezado mide unos 80 bytes; con un bloque cada 10 minutos, 80 × 6 × 24 × 365 da unos 4.2 MB al año (§7). Dentro del encabezado no van los pagos: va un solo hash, la raíz de un árbol de Merkle que los resume a todos. Para comprobar que su pago a Beto está en el bloque 101, el celular le pide a un nodo completo la rama: aquí, H2 y H34. Calcula H1 con su propio pago, luego H12 y luego la raíz. Si coincide con la del encabezado que ya tenía, el pago está en ese bloque. Con 4 pagos son 2 hashes; con 4,096 pagos serían 12, unos 384 bytes. El invitado de FIUBA lo cuenta sin el árbol: 'supónganse que yo no quiero tener todo el estado de la red… a mí solo me interesa ver mis transacciones' (1:10:18).\"\n\nEl costo (dilo): FIUBA: \"no voy a participar activamente de la verificación… no voy a agregarle seguridad a la red\" (1:11:19). Y Nakamoto (§8): la verificación \"es confiable mientras los nodos honestos controlen la red, pero es más vulnerable si un atacante la domina\". El cliente ligero confía en la cadena con más trabajo; no revisa cada regla.\n\nPreguntas para el grupo:\n\n\"¿Qué prueba la rama de Merkle y qué no prueba?\" (prueba que el pago está en ese bloque; no prueba que el pago sea válido ni que el bloque vaya a quedar: para eso se esperan confirmaciones).\n\n\"¿Por qué no basta con que el nodo completo le diga 'sí, está'?\" (le estaría creyendo; con la rama, lo verifica contra un encabezado que tiene prueba de trabajo).\n\nTransición: \"Todo esto en Bitcoin sigue siendo probabilístico; FIUBA lo resume como 'todo esto es eventual consistency' (1:12:33). Y enseguida cuenta que Ethereum lo resolvió de otra forma.\"\n\nReferencias: Nakamoto (2008), §7 (árbol de Merkle; 80 bytes; 4.2 MB al año) y §8 (verificación simplificada de pagos: \"basta guardar los encabezados de la cadena con más prueba de trabajo y obtener la rama de Merkle que liga la transacción con su bloque\"). FIUBA TA050 clase 13, 1:10:38 a 1:11:50 y 1:13:52 (\"muy visionario… en el 2008, antes siquiera de que exista Raft\").\n\nPrecisiones: Bitcoin calcula los hashes del árbol con doble SHA-256 y, si un nivel tiene un número impar de nodos, duplica el último. H1 es ilustrativo; si alguien pregunta, sha256(\"Ada paga $500 a Beto\") empieza con 5f7bb680, el mismo valor de la lámina 08. Los clientes ligeros de hoy usan filtros de bloque compactos (BIP 157 y 158) [VERIFICAR: si vale la pena nombrarlos · el filtro de Bloom de BIP 37 tenía problemas de privacidad].\n\nSi se salta esta válvula, di en una frase: \"Un celular guarda solo encabezados de 80 bytes y comprueba su pago con unos pocos hashes, la rama de Merkle.\"", "Qué decir: \"FIUBA contrasta así: en Bitcoin 'todo esto es eventual consistency'; 'Ethereum maneja las cosas de otra manera… sí hay voto' (1:12:51). Desde el 15 de septiembre de 2022, Ethereum usa prueba de participación. Recuerden que votar no servía sin censo, porque las identidades son gratis. Aquí sí hay censo: para votar hay que depositar ETH, y 'hay una noción de cuántos validadores hay' (1:13:13). El voto pesa por el dinero depositado, no por las llaves. El tiempo va en ranuras de 12 s, y 32 ranuras forman una época de 6.4 min. Al inicio de cada época hay un punto de control. Si dos tercios del stake votan por C1, C1 queda justificado; si en la época siguiente otra vez dos tercios votan encima, C1 queda finalizado. Son dos rondas, unos 12.8 min. A diferencia de Bitcoin, aquí lo finalizado no se reorganiza solo por esperar.\"\n\nLo que FIUBA dice mal (no lo repitas): lo llama \"two stage commit\" y dice que, ya finalizado, \"es imposible que se vuelva a reorganizar\" (1:13:22).\n\nNo es el 2PC de la S08. El 2PC confirma de forma atómica una transacción entre varios participantes con un coordinador. Aquí son dos rondas de votos sobre el mismo punto de control (justificar y finalizar), más parecidas a las fases de votos de PBFT (lámina 35).\n\nNo es imposible: revertir algo finalizado exige que validadores con al menos un tercio del stake firmen votos contradictorios, y ese stake se quema (slashing).\n\nAquí sí aplica el \"tercio\": es la cota de los protocolos con votos y censo (3f + 1). Quien controle más de un tercio del stake puede impedir que se finalice, pero no reescribir sin perder su depósito.\n\nPreguntas para el grupo:\n\n\"¿Por qué aquí sí funciona votar, si 'una llave, un voto' no servía?\" (porque el voto pesa por ETH depositado, y el ETH cuesta: se cambia cómputo por dinero en juego).\n\n\"¿Qué se parece más a Raft, Bitcoin o Ethereum?\" (Ethereum: censo conocido y finalidad determinista; pero tolera mentirosos y el censo cambia).\n\nTransición: \"Ethereum no solo cambió cómo se vota. Lo que guarda tampoco es un libro de pagos: guarda programas.\"\n\nReferencias: FIUBA TA050 clase 13, 1:12:51 a 1:13:51. ethereum.org, The Merge (15-sep-2022) y Proof-of-stake (finalidad con 2/3 en unas dos épocas, ~12.8 min). Buterin y Griffith (2017), Casper the Friendly Finality Gadget (justificar y finalizar puntos de control; accountable safety). En una línea, si preguntan por energía: ethereum.org reporta que el cambio a PoS bajó el consumo alrededor de 99.95 %.\n\n[VERIFICAR: depósito mínimo de 32 ETH y saldo efectivo máximo de 2,048 ETH tras Pectra (2025) · cambió con la actualización]\n\n[VERIFICAR: cuánto se quema por un voto doble aislado · la penalización es parcial y crece con la fracción castigada a la vez; solo con un tercio o más se pierde casi todo. Por eso la lámina dice \"le quema ETH\" y no \"lo pierde todo\"]\n\n[VERIFICAR: número de validadores activos · cambia cada día; mejor no darlo]\n\nSi se salta esta válvula, di en una frase: \"Ethereum sí sabe quién vota, porque para votar hay que depositar ETH; con dos tercios del stake en dos rondas, unos 12.8 min, el bloque queda final.\"", "Qué decir: \"FIUBA lo cuenta así: Ethereum, 'en vez de tener un ledger', tiene 'una máquina virtual de uso general distribuida'; 'se llaman smart contracts, pero en verdad son programas de uso general' (1:18:59). Su ejemplo es la reventa de boletos (1:20:07): no sabes si el vendedor tiene la entrada ni si te la va a mandar. El arreglo es un escrow: 'dos personas ponen recursos adentro y se liberan cuando los dos lo pusieron' (1:21:01). Aquí Ada deposita $500 y Beto deposita el boleto. El contrato los retiene y, cuando están los dos, hace el cambio. Si Beto nunca deposita, al vencer el plazo le devuelve a Ada su dinero. No hay que confiar en Beto ni en una página de reventa: 'es un programa en el cual confiamos porque leemos el código y sabemos exactamente qué va a ejecutar' (1:21:07). Y la frase de FIUBA: 'hicimos ese intercambio sin conocernos, sin depender de una página centralizada' (1:21:32).\"\n\nPreguntas para el grupo:\n\n\"¿Podría el contrato verificar que Beto entregó un boleto de papel?\" (no: solo ve lo que está en la cadena. Funciona porque el boleto es un token, un NFT, que FIUBA llama \"certificado de propiedad\" (1:19:32). Para hechos de afuera hace falta un oráculo, que vuelve a ser alguien en quien confiar).\n\n\"¿Y si el código tiene un error?\" (se ejecuta igual, con el error: The DAO, en 2016, terminó en un hard fork, y la cadena original sigue como Ethereum Classic).\n\nTransición: \"Si todos los nodos ejecutan el mismo programa, hay dos trabajos distintos: acordar en qué orden entran los pagos y aplicar ese orden. ¿Quién ordena y quién ejecuta?\"\n\nReferencias: FIUBA TA050 clase 13, 1:18:59 a 1:21:42 (no hay fotograma: es la sesión de preguntas). el dossier 04-blockchain.md §8: un smart contract es un programa determinista replicado, no un contrato legal.\n\nCuidado:\n\nCada ejecución cuesta una comisión (gas), y los montos reales van en ETH, no en pesos.\n\nBitcoin también permite escrows sencillos con su lenguaje de scripts, que es limitado (FIUBA 1:15:55); Ethereum es de uso general.\n\nSi preguntan en qué se programa: Solidity, que según su documentación está influido por C++, Python y JavaScript. FIUBA dice \"Solidity es Java\" (1:30:00) y no es cierto.\n\nSi se salta esta válvula, di en una frase: \"Ethereum guarda programas, no solo pagos; un contrato puede retener el dinero de Ada y soltarlo cuando Beto cumpla, sin que se conozcan.\"", "Qué decir: «El escrow nos dejó una pregunta: ¿quién ordena y quién ejecuta? Son dos trabajos distintos. El consenso decide qué pagos entran y en qué orden; en Bitcoin eso es la prueba de trabajo más la regla de la cadena con más trabajo. La ejecución toma ese log y lo aplica a un estado: saldos, salidas sin gastar o las variables de un contrato. Es exactamente el par de Raft: un log replicado y una máquina de estados que lo consume. El invitado de FIUBA lo cuenta desde adentro porque programó los dos lados: \"hoy vimos dos partes en Bitcoin: consenso y ejecución… la máquina de estado que uno está representando. Ethereum esto lo tiene separado\" (1:22:49). En Bitcoin un mismo programa hace las dos. En Ethereum son dos programas que se hablan: un cliente de consenso y uno de ejecución; él trabaja hoy en uno de ejecución, ethrex (1:23:20).»\n\nIdea clave para decir en voz alta: cada nodo ejecuta todo el log. Si la ejecución es determinista, mismo log y mismo orden dan el mismo estado en cada nodo. Por eso el contrato del escrow no puede usar la hora local ni un número aleatorio propio.\n\nPreguntas para el grupo:\n\n«Si dos nodos aplican el mismo log en el mismo orden, ¿por qué llegan al mismo saldo?» (porque la ejecución es determinista).\n\n«¿Qué pasaría si el contrato de escrow leyera el reloj de cada máquina?» (cada nodo llegaría a otro estado y el consenso no serviría de nada).\n\n«En Raft, ¿quién era el consenso y quién la ejecución?» (el log que replica el líder; la máquina de estados de cada nodo, por ejemplo el almacén clave-valor de etcd).\n\nPrecisiones:\n\nEn Ethereum, el fork choice del cliente de consenso es LMD-GHOST, que FIUBA llama «GHOST» (1:23:05), con finalidad de Casper FFG.\n\nDesde el 15-sep-2022 (The Merge), los dos clientes se hablan por la Engine API. [VERIFICAR: nombre y alcance de la Engine API · de memoria; consultar ethereum.org, «Node architecture»]\n\nClientes de consenso: Lighthouse, Prysm y Teku. Clientes de ejecución: Geth, Nethermind, Besu, Reth y ethrex.\n\nFIUBA dice «longest chain»; aquí se dice «la cadena con más trabajo».\n\nQuitado de la lámina (dilo si sirve): el rótulo «Engine API» entre las dos bandas de Ethereum.\n\nTransición: «Todo nodo ejecuta todo. Pero díganme: ¿alguien correría un nodo completo en su celular para pagar un café? Casi nadie lo hace. Entonces, ¿con quién habla su wallet?»\n\nReferencias: FIUBA TA050, clase 13, 1:22:33 a 1:23:20 (reporte, §13). Ongaro y Ousterhout (2014): log replicado y máquina de estados. Schneider (1990), Implementing fault-tolerant services using the state machine approach. el dossier 04-blockchain.md §3.2.", "Qué decir: «La red de Ethereum no tiene dueño. Pero casi nadie le habla a la red directamente. Una wallet es un programita que firma tu transacción y la manda a un nodo que elige por ti. FIUBA lo dice así: MetaMask \"usa un gateway que se llama Infura… una empresa que provee una API… y elige a cuál de sus nodos propios le manda, y eso centraliza un poco la red\" (1:28:11). Y agrega, con honestidad: \"es poco probable que tengan su nodo levantado en su casa\" (1:28:42). Es la misma figura del API gateway: una puerta única para muchos clientes. El protocolo sigue sin dueño; la entrada no.»\n\nQué puede hacer la puerta: ver tu IP y tus direcciones, negarte el paso, caerse o mostrarte un estado viejo. Lo que no puede hacer es falsificar tu firma ni gastar tu dinero.\n\nPreguntas para el grupo:\n\n«Si Infura se cae, ¿se cae Ethereum?» (no; la red sigue, pero se quedan sin servicio los que dependían de esa puerta).\n\n«¿Qué propiedad del contrato se debilita con la puerta?» (la de sin censura: el protocolo no veta tu pago, pero la puerta puede no dejarlo pasar; y también la privacidad).\n\n«¿Cómo se quita la puerta?» (con tu propio nodo, o con un cliente ligero que verifique por su cuenta).\n\nPrecisiones y casos:\n\n[VERIFICAR: caída de Infura del 11-nov-2020 · Infura corría una versión vieja de Geth que se separó de la red, y varias wallets y casas de cambio pausaron operaciones; confirmar fecha y alcance]\n\n[VERIFICAR: en marzo de 2022 Infura bloqueó por error el acceso desde Venezuela al aplicar sanciones · confirmar con el comunicado de Consensys]\n\n[VERIFICAR: que MetaMask siga usando Infura por defecto en 2026 · las dos son de Consensys, y MetaMask permite cambiar el RPC]\n\nFIUBA dice que Infura «tiene 70 millones de nodos» y habla de «una API REST»: no se repite. Es una API JSON-RPC, y él mismo se corrige.\n\nTransición: «Si la puerta tiene dueño, ¿y el código? Un alumno de FIUBA preguntó justo eso: ¿quién es el dueño del repo de Bitcoin?»\n\nReferencias: FIUBA TA050, clase 13, 1:27:41 a 1:28:42 (reporte, §13). el dossier 04-blockchain.md §9 («Es descentralizado por definición»).", "Qué decir: «Un alumno de FIUBA encontró el repo de Bitcoin en GitHub y preguntó quién es el dueño (1:30:45). La respuesta: \"Bitcoin es un protocolo, en verdad no es un programa, de la forma que TCP/IP es un protocolo: vos no tenés una implementación, tenés un montón, y siempre y cuando las implementaciones cumplan el protocolo, andan\" (1:31:16). Cualquiera puede escribir su nodo en su lenguaje favorito y conectarse; si verifica bloques según las reglas, ya está en la red (1:31:46). ¿Y quién cambia las reglas? \"Es política… no en el sentido de política partidaria\": pesan los que implementan los nodos más usados (1:34:35). Su remate: \"no hay un protocolo criptográfico que te pueda reemplazar todo tipo de interacción humana\" (1:34:49). Si no hay acuerdo, unos nodos siguen las reglas nuevas, otros las viejas, y la red se parte: un fork es un acuerdo social, no criptográfico.»\n\nPreguntas para el grupo:\n\n«Si mañana los mantenedores de Bitcoin Core publican una versión que imprime monedas, ¿qué pasa?» (los nodos que no actualicen rechazan esos bloques: el código no manda, mandan quienes lo corren).\n\n«¿Quién cambia el esquema de una base de datos que no tiene dueño?» (nadie por decreto; hay que convencer a quienes corren nodos).\n\n«¿Por qué conviene que haya varias implementaciones?» (un bug en una no tumba a todas; aunque si dos implementaciones discrepan, la red se puede partir).\n\nPrecisiones:\n\nUn soft fork endurece las reglas, y los nodos viejos siguen aceptando los bloques nuevos. Un hard fork las afloja o cambia, y los nodos viejos rechazan los bloques nuevos; si no todos actualizan, quedan dos cadenas.\n\nEjemplo verificado en las referencias: el hard fork de The DAO (2016); la cadena original sigue como Ethereum Classic (el dossier 04-blockchain.md §8). [VERIFICAR: fecha exacta, 20-jul-2016]\n\nOtro ejemplo: Bitcoin Cash se separó por el tamaño de bloque. [VERIFICAR: 1-ago-2017]\n\nEn Ethereum, la Ethereum Foundation «no decide, pero sí junta gente y financia gente» (1:35:20).\n\n[VERIFICAR: que Bitcoin Core corra la gran mayoría de los nodos alcanzables · dato de sitios como bitnodes; no lo pongas como cifra]\n\n[VERIFICAR: que bcoin siga mantenido · si no, cambia la tarjeta C por «Libbitcoin · C++»]\n\nEl libro para escribir tu propio nodo es Programming Bitcoin, de Jimmy Song (O'Reilly, 2019); FIUBA lo recomienda en el 1:31:16.\n\nSi se salta esta válvula, dilo en una frase: «Bitcoin es un protocolo, como TCP: hay varias implementaciones, y cambiar las reglas es convencer a quienes corren nodos; si no hay acuerdo, la red se parte.»\n\nTransición a la 34: «Ya tenemos todas las piezas, y también lo que la criptografía no resuelve. Volvamos al contrato del inicio: ¿cumplimos las ocho propiedades?»\n\nReferencias: FIUBA TA050, clase 13, 1:30:45 a 1:35:51 (reporte, §13). Song (2019).", "Qué decir: \"Es la misma tabla del principi
