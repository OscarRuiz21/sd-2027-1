<script>
const slides=[...document.querySelectorAll('section')], notes=document.querySelector('#notes');let current=0;
const scripts=[`Caso didáctico de Mexi Banco. La transferencia envía $500 y después llama por RPC, en serie, a Notificaciones, Antifraude y Contabilidad. Cada paso debe responder antes del siguiente. Si el primero falla y el error se propaga, falla la solicitud; esto no implica que se haya revertido el movimiento de dinero. Las líneas 2 y 3 muestran llamadas previstas, pendientes en el estado de falla ilustrado.\n\nPregunta guía: cómo dejar de conocer a todos los interesados. Todavía no introducir el broker ni prometer que la mensajería elimina las fallas.\n\nFuentes indicadas por el profesor: FIUBA TA050, clase 15, Sistemas de Mensajería; Kleppmann, Designing Data-Intensive Applications, 2.ª edición, capítulo 12. Caso Mexi Banco y secuencia definidos en el encargo.`, `Caso didáctico de polling, no descripción verificada de la arquitectura actual del NASDAQ. Los tres bancos y el intervalo de un segundo son ilustrativos. Las magnitudes generales provienen del encargo, sin cifras exactas verificadas.\n\nRecorrer: 1. Petición azul y respuesta discontinua sin novedades. Vacía significa sin cambio útil, no necesariamente un cuerpo HTTP vacío. 2. Entre 0 y 1 segundos cambia el precio: el banco conserva el anterior hasta su próxima consulta. 3. Reducir el intervalo acorta la espera, pero multiplica las consultas por banco y por símbolo. La saturación es un riesgo según la capacidad, no una consecuencia inevitable.\n\nEl predominio de respuestas sin cambio corresponde al escenario planteado; depende del símbolo y de la frecuencia de consulta. El polling sigue siendo útil cuando el emisor no puede avisar o el retraso es aceptable.\n\nFuentes indicadas por el profesor: FIUBA TA050, clase 15, Sistemas de Mensajería; Kleppmann, Designing Data-Intensive Applications, 2.ª edición, capítulo 12. Referencias pendientes de cotejo bibliográfico; no se atribuyen citas textuales.\n\nTransición: quien tiene el dato conoce el cambio. ¿Cómo puede avisarlo sin conocer a cada interesado?`, "Invertir la comunicación resuelve los tres costos del polling. Pregunta al grupo qué pasa cuando un banco se da de alta o se cae. Acoplamiento en espacio: el emisor guarda direcciones; acoplamiento en tiempo: si el banco no está vivo en ese instante, el aviso se pierde. Transición: pongamos algo en medio que conozca a los interesados por nosotros. Fuente: clase 15 de FIUBA TA050, sección 1.", "Así funcionaban los MOM de los noventa, por ejemplo TIBCO (sobre UDP). La palabra middleware viene de 1968, pero se volvió término de mercado en los noventa. Para Mexi Banco: la transferencia publica `TransferenciaRealizada` y notificaciones, antifraude y contabilidad se suscriben. Ojo: hablar con el MOM sigue siendo un RPC (enviar es un RPC al MOM; recibir también); eso se retoma en la lámina de vocabulario. Transición: ¿qué es exactamente lo que viaja? Un mensaje. Fuente: clase 15 de FIUBA TA050, secciones 1 y 2."];
scripts.push(...["La lectura es del profesor de FIUBA: de esta lista solo el RPC es una técnica de fondo; lo demás son términos de mercado, aunque la idea de mensajería sigue muy viva. 'Middleware' existe desde 1968, pero se volvió palabra de venta en los noventa [VERIFICAR: origen del término en la conferencia de ingeniería de software de la OTAN de 1968 · lo dice la clase, no lo confirmé]. TIBCO es el ejemplo que da la clase de MOM de los noventa sobre UDP [VERIFICAR: fecha y transporte de TIBCO Rendezvous · viene solo de la clase]. Transición: volvamos a la caja. ¿Qué es exactamente lo que viaja por ella? Fuente: clase 15 de FIUBA TA050, sección 2.", "En la lámina 03 el NASDAQ hacía push(\"stocks.nasdaq.googl\", 101.50): el canal va en el encabezado y el 101.50 es el cuerpo. El broker enruta leyendo solo el encabezado; el cuerpo para él son bytes opacos. Autocontenido importa porque si el mensaje solo trae un id, cada consumidor vuelve a llamar por RPC al productor y regresamos al acoplamiento de la lámina 00. En el video de RabbitMQ se ve literal: Buffer.from(JSON.stringify(message)), porque el broker no recibe objetos, recibe bytes. Los nombres de los campos del encabezado son ilustrativos; un estándar real es CloudEvents, con id, source, type y time [VERIFICAR: atributos obligatorios de CloudEvents 1.0 · lo cito de memoria]. No dar un tamaño máximo en clase [VERIFICAR: límite de mensaje de SQS, 256 KiB o 1 MiB · creo que AWS lo subió en 2025]. Transición: este mensaje cuenta algo que ya pasó, pero no todos los mensajes son así. Fuente: Kleppmann, DDIA 2.ª ed., cap. 12 (evento como objeto pequeño, autocontenido e inmutable); video RabbitMQ introducción de Del Código a la Arquitectura, sección 5.", "Los dos viajan como mensajes por el mismo broker; la diferencia es de intención y de acoplamiento. Con un comando el emisor todavía sabe quién hace el trabajo; con un evento ni eso, y por eso el evento desacopla más. Conexión con la S08: la saga por orquestación manda comandos; la coreografía, que quedó pendiente, reacciona a eventos. La convención de nombrar eventos en pasado es práctica común, no una regla de ningún producto. Transición: ya sabemos qué viaja; ahora, quién lo manda, quién lo recibe y por dónde pasa. Fuente: Kleppmann, DDIA 2.ª ed., cap. 12 (definición de evento); el contraste evento contra comando es síntesis propia, no viene de la clase de FIUBA.", "Cuatro palabras que usaremos el resto del día. La cola reparte el trabajo entre réplicas iguales del mismo servicio (balanceo); el tópico copia el mensaje a servicios distintos (fan-out). Fíjense en que el comando va a una cola y el evento a un tópico: no es obligatorio, pero es lo natural, porque un comando tiene un destinatario y un evento no. Ojo con el vocabulario: en Kafka 'topic' es un log que no se borra al leer; lo veremos en el bloque de event streaming. Los dos canales de esta lámina anticipan los modelos productor-consumidor y publisher-subscriber. Transición: el productor publica y se olvida, ¿de verdad se olvida? Fuente: Kleppmann, DDIA 2.ª ed., cap. 12, figura 12-1 (load balancing contra fan-out); clase 15 de FIUBA TA050, secciones 4 y 5.", "Es el dilema del timeout de la S03, ahora entre el productor y el broker: con el ok perdido, Transferencias no distingue entre 'no llegó', 'llegó y se guardó' y 'va lento'. Las dos salidas son las del capítulo 4: reintentar es at-least-once (posibles duplicados) y no reintentar es at-most-once (posibles pérdidas); lo retomamos a fondo en productor-consumidor, con idempotencia. En RabbitMQ ese ok son los publisher confirms (waitForConfirms()); en SQS es la respuesta de SendMessage. Y si el broker está caído, la transferencia también falla: el acoplamiento en tiempo se movió del consumidor al broker, no desapareció. Transición: si el broker es una pieza más que puede fallar, ¿por qué no hablar directo? Fuente: clase 15 de FIUBA TA050, sección 3 ('hablar con la cola sigue siendo un RPC'); capítulo 4, Message delivery and processing; precisiones del reporte del video RabbitMQ introducción.", "La 'cola' que dibujamos es una abstracción y se implementa de dos formas. ZeroMQ tiene una API parecida a la de sockets y no necesita servidor; un webhook es una URL que el receptor registra y a la que el emisor hace un POST cuando algo pasa. Funcionan bien cuando la latencia importa y se tolera perder algún mensaje, o cuando el emisor reintenta mientras siga vivo; si el emisor se cae, lo que tenía pendiente se pierde. Kleppmann pone como ejemplo de mensajería directa los feeds de precios de la bolsa por UDP multicast, que conecta con el NASDAQ [VERIFICAR: que los feeds de NASDAQ, por ejemplo ITCH, se distribuyan por multicast · no lo confirmé en documentación de NASDAQ; mencionarlo solo como ejemplo de Kleppmann]. Transición: el broker guarda los mensajes; eso suena mucho a una base de datos. Fuente: clase 15 de FIUBA TA050, sección 6; Kleppmann, DDIA 2.ª ed., cap. 12 (mensajería directa).", "La moraleja de la clase de FIUBA: los brokers son un caso particular de storage, con bases de datos mucho más simples que un Postgres. La fila 'Si el dato cambia' es la lámina 01 al revés: con una base de datos hacíamos polling; el broker nos avisa. 'Colas cortas' es una suposición de diseño: si los consumidores se atrasan y la cola crece, el broker puede volverse lento, y por eso más adelante hablamos de la cola llena. Que sobreviva a un reinicio no es gratis: en RabbitMQ hacen falta las dos cosas, cola durable y mensaje persistente; una sola no basta. Esta comparación también explica por qué más adelante podremos construir una cola sobre Postgres. Transición, cierre del bloque: ya sabemos qué es la caja. ¿Qué ganamos exactamente al ponerla en medio? Tres desacoples. Fuente: clase 15 de FIUBA TA050, secciones 6 y 14; Kleppmann, DDIA 2.ª ed., cap. 12 (brokers comparados con bases de datos); video RabbitMQ introducción, sección 5.", "Este desacople ya lo vimos con el MOM y el NASDAQ; aquí lo pasamos a Mexi Banco y le agregamos la parte social. Si Transferencia llamara por RPC a cada interesado, cada equipo que quiera enterarse tendría que hablar con el equipo de Transferencia, que tendría que hacerse un hueco en su calendario para agregar una llamada más. Con el broker, Puntos se suscribe y Transferencia ni se entera. El producto de ejemplo para este desacople es SNS, de AWS, que vemos a fondo en el bloque de publisher-subscriber. Transición: ya no necesito saber dónde está el receptor; ¿y si está apagado justo cuando aviso? Fuente: clase 15 de FIUBA TA050, sección 3, de 0:15:22 a 0:17:00. [VERIFICAR: la clasificación en espacio, tiempo y sincronía parece venir de Eugster et al., 'The Many Faces of Publish/Subscribe' (ACM Computing Surveys, 2003) · el profesor solo dice 'este autor' sin nombrarlo]. Las direcciones notif:8081 y demás son ilustrativas.", "Con RPC puedes reintentar tres o cuatro veces, pero si el otro servicio sigue caído te quedas con un error y el aviso se pierde. Los brokers que se usan hoy suelen ser persistentes: el mensaje se queda guardado y el receptor lo recoge cuando vuelve. El video de RabbitMQ lo muestra en vivo: la orden deja un mensaje en order_queue, el panel marca 1 mensaje listo, y el servicio de correo, que arranca después, lo procesa sin que nadie lo reenvíe; productor y consumidor nunca estuvieron vivos al mismo tiempo. Ojo: esto depende de que el broker guarde el mensaje (en RabbitMQ, cola durable y mensaje persistent). El producto de ejemplo es SQS, que vemos en el bloque de productor-consumidor; SNS no sirve igual aquí porque reintenta y descarta, y eso nos llevará al patrón fan-out + buffer. Transición: el receptor ya puede llegar tarde; ¿y yo, el emisor, tengo que quedarme esperando su respuesta? Referencias: clase 15 de FIUBA TA050, sección 3, de 0:17:00 a 0:18:01; video de Del Código a la Arquitectura sobre RabbitMQ, secciones 1, 7 y 9. [VERIFICAR: SQS guarda un mensaje 4 días por defecto y hasta 14 · no viene en las referencias de la clase; no ponerlo en la lámina]. Los 5 minutos de caída son ilustrativos.", "Casi por definición, un RPC es una llamada síncrona: mandas y te quedas esperando la respuesta. En el ejemplo del video, si el correo tarda 4 segundos y las analíticas otros 4, el cliente espera casi 10 segundos una respuesta que debería ser inmediata; y si uno falla, la orden no se completa por un proceso secundario. Con el broker, Transferencia solo espera a que el broker diga 'guardado' y responde. Lo crítico se queda síncrono: el video conserva la llamada a inventario porque sin inventario no hay orden; en Mexi Banco, mover el dinero no se delega a un mensaje. Tiempo y sincronía están relacionados pero no son lo mismo: el tiempo habla de si el receptor está vivo, la sincronía de si yo espero. Transición: espacio, tiempo y sincronía suenan a pura ganancia; ¿qué pagamos a cambio? Referencias: clase 15 de FIUBA TA050, sección 3, de 0:18:01 a 0:19:12; video de Del Código a la Arquitectura sobre RabbitMQ, secciones 3, 4 y 6 (minuto 1:43 para los 4 s + 4 s).", "El profesor de FIUBA lo advierte así: 'la gente se entusiasma, lo usa y después lo lamenta'. Con RPC el receptor revisa y te devuelve el error en la misma llamada; con mensajería el cliente ya recibió su 201 y el error aparece minutos después en otro servicio, así que hace falta otra vía para enterarse: reintentos, una cola de mensajes muertos y monitoreo, que veremos en el bloque de la cola. El broker es una pieza más que alguien configura, mantiene, monitorea y escala. Y el acoplamiento temporal no desaparece, se muda: si el broker está caído, Transferencia no puede publicar. Hay un cuarto costo que ya conocemos de la S08: guardar el movimiento y publicar el evento son dos escrituras sin transacción común; lo resolvemos al final con el Outbox. Transición: ya aceptamos poner un broker; falta decidir qué forma tiene el canal: ¿el mensaje lo recibe uno, lo reciben todos, o se queda guardado? Referencias: clase 15 de FIUBA TA050, sección 3, de 0:17:30 a 0:18:38; video de Del Código a la Arquitectura sobre RabbitMQ, sección 10 y sus precisiones (el acoplamiento temporal se mueve al broker; la doble escritura y el outbox). Los tiempos t = 0 y t = 5 min son ilustrativos.", "En una empresa grande, cuando un equipo quiere que otro le avise de sus cambios en lugar de consultarlo por RPC, termina en alguno de estos tres. Productor-consumidor reparte: cada mensaje lo procesa uno solo y después se borra, lo que da balanceo de carga. Publisher-subscriber copia: cada suscriptor recibe el suyo, y es un fan-out. Event streaming escribe en un log que no se borra al leer, así que cada lector lleva su propia posición y puede volver atrás. Matiz para quien pregunte: en Kafka, dentro de un mismo grupo de consumo cada partición la lee un solo consumidor, así que combina los dos primeros modelos; lo vemos en su bloque. En SNS 'se borra al entregarse' incluye reintentos según el protocolo. Al final de la clase decidimos con esta tabla: las notificaciones de Mexi Banco, ¿cola o log? Transición: empezamos por el más viejo y el más simple, la cola; ¿qué problema resuelve? Referencias: clase 15 de FIUBA TA050, sección 4 (0:19:12 a 0:22:32) y la tabla comparativa final; Kleppmann, DDIA 2.ª ed., cap. 12, figura 12-1 (balanceo contra fan-out).", "(2 min) El día de corte Mexi Banco tiene que generar el estado de cuenta de cada cuenta: es trabajo pesado, no una consulta de milisegundos. Si dimensionamos los servidores para el pico, pagamos máquinas que no hacen nada 29 días; si los dimensionamos para el promedio, el día de corte todo da timeout y los reintentos empeoran la carga. FIUBA usa el mismo problema con video: el usuario sube un archivo y alguien tiene que transcodificarlo con FFmpeg, y en el Mundial todos suben a la vez; el profesor dice que podría ser pregunta de entrevista. La gráfica es cualitativa: no tiene números a propósito, el volumen de Mexi Banco es ilustrativo. Transición: ¿y si en lugar de hacer el trabajo en el momento lo dejamos formado en una fila, y que lo saquen trabajadores a su ritmo? Fuente: clase 15 de FIUBA TA050, sección 8; caso Mexi Banco del curso.", "(3 min) El cierre de mes ya no genera PDF: solo encola un mensaje chico por cuenta y termina. Los generadores son copias del mismo programa (consumidores homogéneos) y da igual cuál tome cada cuenta. Si la cola crece, se monitorea y se agregan generadores; el productor ni se entera. El mensaje lleva la referencia (cuenta y periodo), no el archivo, igual que en FIUBA el mensaje lleva la ruta del video en S3. Ojo con el dibujo: parece una fila ordenada, pero muchas colas solo intentan entregar primero lo más viejo, sin garantía. Para el profesor de FIUBA este es el segundo patrón distribuido más común, después de 'un servidor web con una base de datos'. Transición: ¿cómo se entera un generador de que hay algo en la cola? Fuente: clase 15 de FIUBA TA050, secciones 5 y 8; Kleppmann, DDIA 2.ª ed., cap. 12, figura 12-1 (load balancing).", "(2.5 min) Del lado del productor casi siempre es push: el productor manda a la cola. Del lado del consumidor hay cuatro maneras. Bloqueante: el hilo se queda dormido hasta que hay algo. Polling: pregunto, me dicen 'nada', pregunto otra vez; es lo que vimos al inicio de la clase con el NASDAQ, ahora entre consumidor y cola. Long polling: pregunto una vez y la cola se queda con mi petición abierta hasta que llega algo o se cumplen 20 s; en SQS basta pasar WaitTimeSeconds mayor que 0, y AWS recomienda 20 en la mayoría de los casos. Push o notify: la cola empuja el mensaje (RabbitMQ con consume) o solo avisa y el consumidor va por él. Dato para la válvula: con short polling SQS consulta solo una muestra de sus servidores y puede regresar vacío aunque haya mensajes; long polling consulta todos (lo dice la documentación de AWS). Lapsus del video de FIUBA: hacia el minuto 27 dice 'push es cuando la cola le pullea'; quiso decir que la cola empuja. Transición: ya sabemos cómo pedir; veamos la API completa. Fuente: clase 15 de FIUBA TA050, sección 5, y sus precisiones (long polling hasta 20 s); documentación de Amazon SQS, 'Setting-up long polling'.", "(3 min) SQS es Simple Queue Service y la API de verdad es simple. SendMessage recibe la cola (en la práctica su URL) y el cuerpo, y devuelve un MessageId; esa respuesta es la confirmación para el productor. ReceiveMessage devuelve hasta 10 mensajes, cada uno con su Body y un ReceiptHandle. DeleteMessage es lo que otros brokers llaman ack, y no recibe el MessageId sino el ReceiptHandle: eso parece raro y lo explica la válvula. El orden del bucle importa: procesar y después borrar; en dos láminas vemos qué pasa si lo invertimos. procesar(m) es nuestra función; la vemos completa en la lámina de idempotencia. Transición: entre el receive y el delete, ¿dónde está el mensaje? ¿y si el generador muere a la mitad? Fuente: clase 15 de FIUBA TA050, sección 7 (tabla de la API y bucle del consumidor) y precisiones (hasta 10 mensajes por receive).", "(3 min) El profesor de FIUBA lo llama de los mecanismos de tolerancia a fallas más simples que hemos visto. Al recibir, SQS esconde el mensaje; nadie más lo ve mientras corre el reloj. Si el consumidor termina, lo borra; si muere, el reloj vence y otro lo toma, con un ReceiptHandle nuevo. El valor por defecto es 30 s (el ejemplo de FIUBA usa 60); va de 0 s a 12 h y se puede extender por mensaje con ChangeMessageVisibility, el 'pedir más tiempo' de la clase. RabbitMQ no tiene este reloj: allá el mensaje regresa cuando se cierra el canal del consumidor; lo vemos al final del bloque. Ahora vean la barra fantasma: si el generador 1 no estaba muerto, solo lento, en el segundo 31 el generador 2 toma la misma cuenta. Dos PDF y dos abonos de cashback. Transición: ¿por qué SQS no sabe si el generador murió o va lento? Fuente: clase 15 de FIUBA TA050, sección 7 (visibility timeout) y precisiones; documentación de Amazon SQS, ChangeMessageVisibility (30 s por defecto, mínimo 0, máximo 12 h).", "(3 min) Esto es el capítulo 4 y es el mismo dilema del timeout de la S03. El emisor solo ve su estado local: antes de enviar hay certeza; después de enviar y antes de la respuesta, incertidumbre; con la respuesta, certeza otra vez. Aquí el emisor es SQS, que entregó la cuenta 101 y espera el DeleteMessage. En los casos 1 y 2 el trabajo no se hizo; en el 3 y el 4 ya se hizo; en el 5 se está haciendo. Para SQS los cinco son idénticos. Y TCP no salva: el kernel confirma cuando los bytes llegan a su buffer, no cuando la aplicación procesó. Los timeouts son testigos fiables en un sistema síncrono, pero aquí dan falsos positivos: el caso 5 es exactamente el generador lento de la lámina anterior. El productor tiene el mismo problema con SendMessage (lo vimos en 'Sigue siendo RPC'): si reintenta, el mensaje puede quedar dos veces en la cola. Transición: con esta ceguera, ¿qué puede hacer SQS? Solo dos cosas. Fuente: capítulo 4, Message delivery and processing (el emisor incierto y los cinco casos, TCP, timeouts).", "(3 min) Primero una distinción del capítulo 4: entrega es que la red presente el mensaje; procesamiento es producir el efecto. Lo que nos importa es el procesamiento. Hay tres semánticas: at-most-once (0 o 1), at-least-once (1 o más) y exactly-once (1). Los dos intentos 'ingenuos' de lograr exactamente una vez fallan: si anoto (borro) y luego proceso, una caída en medio deja el trabajo sin hacer; si proceso y luego anoto, una caída en medio lo hace dos veces. Por eso procesar exactamente una vez es imposible, y SQS estándar escoge el lado que no pierde: at-least-once, y su documentación insiste en que puede haber duplicados. Para un estado de cuenta, perderlo es peor que repetirlo; para otros casos (una métrica, un aviso de baja prioridad) at-most-once puede bastar. Si preguntan por las colas FIFO de SQS: deduplican envíos repetidos del productor dentro de una ventana [VERIFICAR: ventana de deduplicación de 5 minutos · lo cito de memoria], pero no salvan al consumidor que cae entre procesar y borrar. Transición: si vamos a repetir, que repetir no haga daño. Fuente: capítulo 4, Message delivery and processing (entrega contra procesamiento, las tres semánticas, los dos intentos fallidos); clase 15 de FIUBA TA050, sección 7 ('los duplicados son tu problema').", "(4 min) Ya lo hicimos en la S03 con Idempotency-Key y un INSERT con UNIQUE; aquí es lo mismo del lado del consumidor. Hay efectos idempotentes de natural, como guardar el PDF siempre en la misma ruta: repetirlo deja el mismo archivo. Y hay efectos que no, como abonar dinero, el equivalente a cobrar una tarjeta del capítulo 4. Para esos: una llave que sea igual en todos los reintentos; aquí usamos cuenta y periodo, que además sobrevive a que el productor reenvíe el mensaje (un UUID nuevo por envío no sobreviviría). Se registra la llave y se hace el abono en la misma transacción; si la llave ya existe, la base rechaza el INSERT, no se abona otra vez y el bucle borra el mensaje igual. Eso es exactly-once processing semantics: el resultado de procesar varias veces es equivalente al de procesar una, y 'equivalente' lo define la aplicación (dos PDF idénticos nos dan igual). Requiere at-least-once debajo y es de extremo a extremo. Límite honesto: si el efecto vive fuera de la base (mandar un correo), no entra en la transacción y vuelve el dilema. db.insert y db.abonar son pseudocódigo; el cashback es un ejemplo del curso. Transición: ¿y si el mensaje no falla por azar, sino siempre? Fuente: capítulo 4, Message delivery and processing (idempotencia natural y no natural, llave de idempotencia, registrar y procesar en una transacción, exactly-once semantics); clase 15 de FIUBA TA050, sección 7.", "(3 min) Si la cuenta 104 trae un dato que siempre tumba al generador, el mensaje vuelve después de cada timeout y va matando generadores sin fin: un poison pill. Reintentar sirve para fallas pasajeras, no para un error de código o de datos. La defensa es contar entregas: en SQS se configura una redrive policy con maxReceiveCount, y cuando el contador lo excede, SQS mueve el mensaje a la DLQ. Hay dos salidas, descartar o desviar; descartar pierde la información, desviar la guarda para analizarla. El ciclo del video: aislar, analizar, reparar y reinyectar; en SQS, reinyectar es un redrive con StartMessageMoveTask. Casi siempre la causa es un bug del consumidor. Dato fino: en colas estándar con maxReceiveCount mayor que 3, SQS manda al final de la cola los mensajes que llevan 3 o más recepciones sin borrar. El 3 de la lámina es ilustrativo (FIUBA pone 4); AWS recomienda no ponerlo tan bajo que una falla pasajera mande mensajes buenos a la DLQ. Transición: otra manera de romperse, ahora la cola misma. Fuente: clase 15 de FIUBA TA050, sección 8 (poison pill y DLQ); video 'Dead Letter Queues' de Del Código a la Arquitectura, secciones 3, 4 y 13; documentación de Amazon SQS, 'Using dead-letter queues' y StartMessageMoveTask.", "(1.5 min) Son las tres opciones de Kleppmann cuando el productor va más rápido que el consumidor: descartar, encolar o frenar al productor (backpressure). Una cola física tiene memoria y disco finitos: rechaza, tira mensajes o frena al productor, y decidir qué hacer es responsabilidad de quien envía. En RabbitMQ, con un largo máximo configurado, lo de fábrica es tirar los más viejos y se puede cambiar a rechazar [VERIFICAR: overflow drop-head por defecto y reject-publish como opción · de memoria]; sin límite, las alarmas de memoria o disco frenan a los publicadores. SQS no limita cuántos mensajes guardas: escala y te cobra. Pero sí borra lo que rebasa la retención (4 días por defecto, configurable hasta 14), así que un atraso largo pierde mensajes en silencio; y limita los mensajes en proceso a unos 120 000 en colas estándar. Por eso se monitorea: cuántos esperan, qué tan viejo es el más viejo y cuántos están en vuelo; con eso se escalan consumidores. Transición: si hay tiempo, abrimos SQS por dentro (válvula); si no, vamos directo al mismo patrón en RabbitMQ. Fuente: clase 15 de FIUBA TA050, sección 8 ('¿y si se llena la cola?'); Kleppmann, DDIA 2.ª ed., cap. 12 (descartar, encolar o backpressure); documentación de Amazon SQS (retención de 4 días por defecto y 14 como máximo; unos 120 000 mensajes en vuelo; métricas de CloudWatch).", "(5 min) No sabemos cómo está hecho SQS por dentro; FIUBA lo reconstruye por pasos 'para que no quede como propaganda de Amazon', y esto es una reconstrucción hipotética, no documentación de AWS. Primer intento: una tabla. Enviar es un INSERT visible desde ya. Recibir es un UPDATE que toma el primer mensaje visible y lo esconde 30 s moviendo su fecha al futuro: eso es todo el visibility timeout. FOR UPDATE bloquea el renglón elegido y SKIP LOCKED hace que otro consumidor que llega al mismo tiempo se salte los renglones bloqueados en vez de esperar: así compiten sin pelearse. ORDER BY id da un 'casi FIFO'. Borrar es un DELETE por id. El broker no guarda estado, así que si se cae no pasa nada; si se cae Postgres, adiós cola, y una sola base no escala. Ojo, que esta idea 'terriblemente mala' tiene una ventaja que retomamos con el Outbox: si la cola es una tabla en la misma base que los datos, guardar y encolar van en una sola transacción local. El profesor de FIUBA recomienda el libro Just Use Postgres! (Manning), que trae un capítulo de Postgres como cola. Transición: ¿cómo escala? Partiendo en shards. Fuente: clase 15 de FIUBA TA050, sección 12, opción 1 y 'la cola como tabla'.", "(5 min) Como el orden no importa ('una gran bolsa de mensajes'), el sharding es trivial: no hace falta particionar por llave, se escribe en un shard al azar y se lee de uno al azar. El problema aparece al borrar: si el delete va a otro shard al azar, no encuentra el mensaje. Solución: que lo que entrega el receive diga de qué shard salió, y que el cliente lo regrese en el delete. Para no exponer la estructura interna, va cifrado y es opaco. Eso es el ReceiptHandle, y por eso cambia en cada recepción del mismo mensaje. Segundo efecto: si el receive cae en un shard vacío, regresa vacío aunque en otro sí haya. La documentación de AWS lo confirma a su manera: el short polling consulta solo una muestra de servidores y puede dar 'falsos vacíos'; el long polling consulta todos. Escala, pero todavía no tolera fallas: si se cae el Postgres del shard 2, se pierden sus mensajes. Transición: hay que replicar. Fuente: clase 15 de FIUBA TA050, sección 12, opción 2 (reconstrucción hipotética del profesor); documentación de Amazon SQS, short y long polling.", "(5 min) Se podría usar Raft como en la S06, pero el problema es más simple. Opción 3: al escribir, el nodo copia el mensaje a otros dos, y cada copia guarda la lista de hosts que lo tienen, para poder borrarlo en todos. Si cualquiera de las tres réplicas entrega, dos lectores pueden recibir el mismo mensaje. Opción 3.1, la de la lámina: solo el primario entrega; el frontend pregunta a nodos al azar hasta dar con un primario. Los nodos se vigilan con gossip, y si el primario muere el secundario empieza a responder. Pero el visibility timeout vivía solo en el primario, sin replicar: el secundario no sabe que la cuenta 101 ya se había entregado y la entrega otra vez. Otra fuente de duplicados, y es aceptada, porque la alternativa es perder mensajes o pagar consenso en cada recepción. Según el profesor de FIUBA, así funcionaba SQS hace unos 20 años, con miles de grupos de 6 nodos; hoy no se sabe. Moraleja de la clase: un sistema de mensajería es un caso particular de storage. Transición: regresemos al patrón; ¿cómo se ve todo esto fuera de AWS? Fuente: clase 15 de FIUBA TA050, sección 12, opciones 3 y 3.1, y la moraleja de la sección 14 (reconstrucción hipotética, no documentación de AWS).", "(2 min) Todo lo del bloque existe en RabbitMQ con otros nombres. El productor publica a un exchange (con el default exchange, directo a la cola por su nombre). El consumidor no pide: RabbitMQ le empuja mensajes, y conviene limitar con prefetch cuántos puede tener sin confirmar, o se los empuja todos. Confirma con ack. No hay visibility timeout: un mensaje sin ack queda como Unacked y vuelve a la cola cuando se cierra el canal o la conexión del consumidor; si el ack tarda demasiado, el broker cierra el canal por consumer_timeout, 30 minutos por defecto según el reporte del video. La garantía también es at-least-once: si el consumidor procesa y cae antes del ack, se reentrega (marcado redelivered); hace falta la misma idempotencia. Para el poison pill: nack(msg, false, false) no reencola y, si la cola tiene un dead letter exchange, el mensaje va a la DLQ; ojo, así se va al primer fallo, sin reintentos (las colas quorum cuentan entregas con un delivery-limit [VERIFICAR: 20 por defecto en RabbitMQ 4.x · el reporte lo marca por verificar]). Para no perder mensajes en el broker hacen falta las tres: cola durable, mensaje persistent y publisher confirms; una cola clásica en un solo nodo sobrevive a un reinicio, no a perder el nodo. Y el recuadro de abajo es la portada: la transferencia necesita avisar a tres servicios distintos, y una cola se lo da solo a uno. Transición: necesitamos un canal que copie en vez de repartir. Fuente: video 'RabbitMQ: El Maestro de los Mensajes' de Del Código a la Arquitectura, secciones 4, 5 y 8 y precisiones; video 'Dead Letter Queues', secciones 6 a 8 y precisiones; clase 15 de FIUBA TA050, sección 7 (SQS no sirve para consumidores heterogéneos).", "En el bloque anterior la cola era perfecta porque los consumidores eran copias del mismo programa: da igual qué instancia genere el PDF. Aquí los consumidores son distintos (otros equipos, otros servicios, a veces otras empresas) y cada uno necesita ver todos los eventos. Si ponemos una cola, el primero que toma el mensaje se lo queda y los demás nunca se enteran. Mismo caso con 'se dio de baja un usuario': lo necesitan notificaciones, facturación y el CRM. Transición: necesitamos un canal que, en vez de repartir, copie. Fuente: clase 15 de FIUBA TA050, sección 9; Kleppmann, DDIA 2.ª ed., cap. 12, figura 12-1 (load balancing contra fan-out).", "Esto es pub/sub: el publicador manda al tópico y el tópico copia a cada suscriptor. La transferencia ya no sabe cuántos escuchan; agregar Puntos de lealtad es una suscripción más, sin tocar su código. Es el MOM de la lámina 03 con un producto real: Amazon SNS. Dejar sembrada la radio: si no tenías el radio prendido cuando pasó la noticia, no la oíste; las dos láminas que vienen son justo eso. Transición: ¿cómo se ve esto en código? Fuente: clase 15 de FIUBA TA050, sección 9 (pizarra t010430).", "Dos llamadas: subscribe se hace una vez, al configurar; publish se hace en cada evento. No hay receive, a diferencia de SQS: SNS llama al suscriptor (un webhook, una Lambda, una cola). Los suscriptores pueden ser sistemas (app-to-app) o personas (app-to-person: email, SMS, notificación en el celular); para Mexi Banco, el aviso 'recibiste $500' podría ir directo por SMS. Un detalle real: una suscripción https queda pendiente hasta que el endpoint confirma (SNS le manda un mensaje de confirmación). Código en Python con boto3 porque es el más corto; en Java es lo mismo con el SDK v2 y builders. Transición: si SNS empuja, ¿qué pasa cuando el endpoint está caído? Fuente: clase 15 de FIUBA TA050, sección 9 (lámina t010744); documentación de Amazon SNS.", "SNS no guarda los mensajes esperando a que vuelvas: los empuja, reintenta un rato y se rinde. Antifraude sí lo recibió; el cliente de Mexi Banco nunca recibe el aviso de su transferencia. Es la radio otra vez. Precisión que no va en la lámina: hoy SNS admite una dead letter queue por suscripción (redrive policy), así que en vez de descartar puede mandar el mensaje a una cola SQS para revisarlo; en la clase de FIUBA se simplifica como 'reintenta y descarta'. [VERIFICAR: número de reintentos y tiempos por protocolo · la política por defecto cambia según el protocolo (http/https contra sqs y lambda) y no la tengo confirmada; por eso la lámina no pone números]. Transición: ¿y si ponemos algo que guarde el mensaje mientras el suscriptor no está? Fuente: clase 15 de FIUBA TA050, sección 9 (pizarra t010720) y Precisiones del reporte.", "Por eso casi nunca se conecta SNS directo a una aplicación: se pone una SQS por suscriptor. SQS es muy disponible, así que si Notificaciones se cae los mensajes se acumulan y los procesa al volver. De paso combinamos los dos modelos: entre servicios hay fan-out (cada uno su copia) y dentro de cada servicio hay balanceo (sus instancias compiten por su cola, como en el bloque anterior). Ojo: SNS y SQS entregan at-least-once, así que Contabilidad sigue necesitando idempotencia. Google Pub/Sub trae esto integrado: cada suscripción guarda sus mensajes; en AWS lo armas tú (la cola necesita un permiso para que SNS le escriba). Transición: si hay tiempo, válvula sobre cómo se construye SNS; si no, el mismo patrón en RabbitMQ. Fuente: clase 15 de FIUBA TA050, sección 11 (pizarra t011822); Kleppmann, DDIA 2.ª ed., cap. 12.", "Esta es la reconstrucción del profesor de FIUBA, que él mismo aclaró que es hipotética. Lo interesante es que el fan-out se construye con un productor-consumidor: el frontend encola tópico y mensaje, una flota de workers compite por esa cola (balanceo), cada worker busca los suscriptores del tópico y los llama. Subscribe es solo un INSERT en la base de suscripciones. Si un suscriptor falla, el mensaje no se reencola en la cola principal (la llenaría de mensajes trabados): va a una segunda cola de lentos que atiende un subconjunto de workers, y la ruta rápida no se entera. El diseño supone que un worker alcanza para todos los suscriptores de un tópico (del orden de cien); con muchos más habría que partir el trabajo. [VERIFICAR: límite de suscripciones por tópico estándar de SNS · recuerdo una cifra de millones pero no la confirmé; no ponerla en la lámina]. Transición: volvemos a la cadena con el mismo patrón en RabbitMQ. Fuente: clase 15 de FIUBA TA050, sección 10 (pizarra t011916) y Precisiones del reporte.", "Mismo patrón con otras piezas: exchange en vez de tópico, binding en vez de suscripción. Lo importante: la suscripción la arma el consumidor. Antifraude declara el exchange (si no existe lo crea, así no importa quién arranca primero), declara su propia cola y la enlaza. El emisor solo conoce el nombre del exchange; un servicio nuevo crea su cola, la enlaza y empieza a recibir sin tocar a Transferencia. Y como cada servicio tiene su cola, aquí no hace falta el truco de SNS + SQS. Precisiones: en fanout la clave de ruteo se ignora (por eso va vacía); si un mensaje no coincide con ningún binding, el exchange lo descarta en silencio (para enterarse existe la bandera mandatory o un alternate exchange); además de fanout, direct y topic existe headers, y el default exchange es el que usa sendToQueue. En Spring AMQP lo mismo se declara con beans FanoutExchange, Queue y Binding. Transición: fanout manda todo a todos; ¿y si Contabilidad solo quiere algunas? Fuente: Del Código a la Arquitectura, 'RabbitMQ: los tres exchanges', secciones 2, 6 y 8, y sus Precisiones.", "Fanout manda todo a todos; direct compara la clave exacta (y varias colas pueden enlazarse con la misma clave, no es uno a uno); topic compara contra patrones. Recorrer la tabla por columnas: Antifraude quiere toda transferencia, Contabilidad solo las realizadas, Conciliación todo lo que pase por SPEI, Notificaciones todo (un binding con # solo es un fanout). Señalar la trampa del recuadro: `*` vale exactamente una palabra, así que `transferencia.*` no atrapa claves de tres palabras. Topic generaliza a los otros dos: sin comodines se comporta como direct y con # solo como fanout. En SNS lo parecido son las filter policies por suscripción. Transición: ya sabemos repartir a quien le interesa; falta un problema que ni SNS ni RabbitMQ resuelven. Fuente: Del Código a la Arquitectura, 'RabbitMQ: los tres exchanges', secciones 9 a 13 y Precisiones (claves de Mexi Banco propias, no del video).", "Mexi Banco lanza Puntos de lealtad y quiere premiar las transferencias del año. Con SNS se suscribe hoy y recibe de hoy en adelante; lo de antes ya se entregó a los demás y se borró. Con RabbitMQ pasa igual: una cola nueva enlazada hoy empieza vacía. El mismo problema aparece si Contabilidad tuvo un bug el martes y quiere reprocesar esa semana. Para eso hace falta que leer no borre: un log que guarda los mensajes y que cada quien lee desde donde quiera. Precisión que no va en la lámina: hoy los tópicos FIFO de SNS pueden archivar mensajes y reenviarlos a un suscriptor (replay), y Google Pub/Sub permite regresar una suscripción en el tiempo; son agregados posteriores al modelo pub/sub básico. [VERIFICAR: archivo y replay en tópicos FIFO de SNS y retención a nivel de tópico en Google Pub/Sub · lo recuerdo de anuncios de 2021 a 2023, no lo confirmé en la documentación]. Transición: event streaming con Kafka. Fuente: clase 15 de FIUBA TA050, sección 9 (al suscribirte recibes desde ese momento) y tabla comparativa; Kleppmann, DDIA 2.ª ed., cap. 12 (log-based brokers).", "Venimos del fan-out + buffer: para cada consumidor nuevo hay que crear y suscribir una SQS, y esa cola nueva arranca vacía, sin el pasado. Para un aviso eso basta, pero un movimiento bancario, una pista de auditoría o un clic son historia: alguien los va a querer releer en orden. FIUBA lo pone con clics y likes que alimentan recomendaciones; aquí son los movimientos de cada cuenta. Transición: ¿qué estructura guarda eventos en orden y deja leerlos sin borrarlos? Un log. Fuente: clase 15 de FIUBA TA050, sección 13 (antes SNS + SQS por consumidor, después un topic); Kleppmann, DDIA 2.ª ed., cap. 12. Tiempo: 2.5 min.", "Es la misma estructura que el log de replicación de la S06: el offset de un consumidor es como la posición de una réplica en el log del líder. Como leer no borra, el fan-out sale gratis: tres lectores en tres posiciones distintas, sin copiar el mensaje tres veces, y un lector nuevo puede empezar desde el principio. La escritura siempre va al final, en orden. Transición: un solo log en una sola máquina no aguanta todo; hay que partirlo sin perder el orden que importa. Fuente: Kleppmann, DDIA 2.ª ed., cap. 12 (log-based brokers); video Del Código a la Arquitectura sobre Kafka, secciones 1, 2 y 4; clase 15 de FIUBA, sección 13 (figura del log con C1, C2 y C3). Tiempo: 3 min.", "Cada partición puede vivir en un broker distinto: así escala horizontalmente. La garantía es FIFO por partición, y con cuentaId como key todo lo de una cuenta queda junto y en orden, que es lo que importa para el saldo. Si no mandas key, el cliente reparte los mensajes entre particiones y pierdes ese control; si una cuenta concentra muchísimo tráfico, su partición se calienta. Ojo con cambiar N después: hash(key) % N cambia y la cuenta se muda de partición. Transición: ¿cómo se ve esto en código? Fuente: clase 15 de FIUBA, sección 13 (topics, particiones y keys); Kleppmann, DDIA 2.ª ed., cap. 12 (partition key, orden total solo dentro de la partición); precisiones del reporte de Kafka (sin key no hay control de partición). [VERIFICAR: el cliente de Java reparte los mensajes sin key con el particionador 'sticky' por lotes, no estrictamente round robin · el comportamiento cambió entre versiones del cliente]. Tiempo: 3.5 min.", "Compárenlo con SQS: allá era ReceiveMessage y DeleteMessage; aquí el equivalente del delete es el commit, pero no borra nada, solo guarda la posición del grupo. El commit es por partición y acumulativo: decir 6 significa que todo antes del 6 ya está procesado. Las props también llevan bootstrap.servers, los deserializadores y enable.auto.commit=false; si se deja el autocommit, el cliente confirma solo cada cierto tiempo y ustedes ya no controlan en qué momento. Transición: ¿qué significa exactamente el group.id? Fuente: clase 15 de FIUBA, sección 13 (send(topic, key, payload)); video Del Código a la Arquitectura sobre Kafka, secciones 9 a 11 (el consumidor necesita groupId, el productor no); documentación del cliente Java de Kafka. [VERIFICAR: auto.commit.interval.ms vale 5000 ms por defecto · lo recuerdo de la documentación, no lo cotejé en esta sesión]. Tiempo: 3 min.", "Como leer no borra, dos consumidores del mismo grupo leyendo la misma partición procesarían todo dos veces; por eso la regla es una partición, un consumidor del grupo. Un consumidor sí puede leer varias particiones, como A1. Kleppmann lo resume así: los grupos de Kafka combinan balanceo y fan-out. Si C2 cae, el coordinador rebalancea y su partición pasa a otro; mientras dura el rebalanceo, esas particiones no avanzan, y producir es fácil pero coordinar a los consumidores es la parte difícil. Antes la asignación se hacía con ZooKeeper; desde Kafka 4.0 el clúster corre en KRaft y el coordinador es un broker. Transición: cada grupo lleva su posición; ¿cómo sé si va al día? Fuente: clase 15 de FIUBA, sección 13 (cómo se consume, coordinador); Kleppmann, DDIA 2.ª ed., cap. 12 y figura 12-1; precisiones del reporte de Kafka (techo de paralelismo, KRaft desde 4.0). Tiempo: 3.5 min.", "En la demo del video, después de leer los offsets 0 y 1 el grupo marca current 2: es el siguiente, no el último. El lag es la métrica que se vigila en producción: si crece sin parar, el grupo procesa más lento de lo que llega. A diferencia de una cola llena, un consumidor lento no presiona al broker ni a los demás grupos; solo se queda atrás, siempre que no lo alcance la retención, que es la lámina de después. Transición: si cada grupo es solo un número, ¿qué pasa si lo regreso? Fuente: video Del Código a la Arquitectura sobre Kafka, sección 17 (current offset, end offset, lag), y su precisión sobre current offset; Kleppmann, DDIA 2.ª ed., cap. 12 (un consumidor atrasado solo se afecta a sí mismo). Tiempo: 2.5 min.", "Dos casos de uso: reconstruir una base que se rompió leyendo todos los movimientos desde el inicio, o reprocesar después de corregir un bug. Ojo: auto.offset.reset solo actúa si el grupo no tiene offset guardado; con un grupo que ya existe no hace nada, y en el cliente de Java el valor por defecto es latest, así que un grupo nuevo sin esa opción empieza al final y no ve el pasado. En el video, el reset con el grupo activo falla con 'Group's offsets can be reset only if group is inactive'. También se puede resetear a una fecha y hora. Transición: si nada se borra al leer, ¿el log crece para siempre? Fuente: video Del Código a la Arquitectura sobre Kafka, secciones 7, 16 y 18, y la precisión sobre fromBeginning; clase 15 de FIUBA, sección 13 (replay para reconstruir una base); Kleppmann, DDIA 2.ª ed., cap. 12 (replay moviendo el offset). Tiempo: 2.5 min.", "Por defecto el broker guarda 7 días; en la demo del video el topic se creó con 12 horas y 10 GB. El límite por tamaño se aplica a cada partición, no al topic. El riesgo nuevo: si un grupo se atrasa más que la ventana de retención, cuando vuelva sus eventos ya no estarán; por eso el lag se vigila. La cuenta de Kleppmann para dimensionar: un disco de 20 TB escrito a 250 MB/s se llena en unas 22 horas, y esa es la ventana que da. La compactación sirve cuando solo importa el estado más reciente por key, por ejemplo el saldo vigente de cada cuenta. Transición: ya tenemos orden, replay y lectores independientes; ¿qué pasa cuando un consumidor se cae a la mitad? Fuente: precisiones del reporte de Kafka (retention.ms 7 días por defecto en el broker, retention.bytes por partición) y sección 14 del mismo reporte (cleanup policy); Kleppmann, DDIA 2.ª ed., cap. 12 (segmentos, buffer circular, 20 TB a 250 MB/s). [VERIFICAR: el tamaño de segmento por defecto es 1 GB (segment.bytes) · no lo puse en la lámina porque no lo cotejé]. Tiempo: 2.5 min.", "Es el capítulo 4 otra vez, con otros nombres: si hago commit y luego proceso, una caída en medio pierde el mensaje (at-most-once); si proceso y luego hago commit, una caída en medio lo repite (at-least-once). Kafka no cambia la física, solo cambia dónde vive la marca: ya no es un ack por mensaje sino un offset por partición, y por eso puede repetirse un lote entero. La salida es la de siempre: idempotencia con una llave única, o guardar el resultado y el offset en la misma transacción de la base. Transición: con los tres modelos sobre la mesa, toca decidir cuándo usar cada uno. Fuente: Kleppmann, DDIA 2.ª ed., cap. 12 (tras una caída se reprocesa desde el último offset registrado); material del capítulo 4 (los dos intentos fallidos, at-least-once e idempotencia); S03 (INSERT con UNIQUE). [VERIFICAR: Kafka ofrece transacciones y 'exactly-once semantics' para leer y escribir entre topics de Kafka, pero no cubren una base externa · si un alumno pregunta, conviene tener la referencia exacta antes de afirmarlo]. Tiempo: 2 min.", "Esta lámina junta lo que vimos en los tres bloques; léanla por filas, no por columnas. Las dos filas que más deciden son la primera (¿a uno o a todos?) y la del pasado (¿necesito releer?). Kafka hace las dos cosas a la vez: entre grupos es fan-out y dentro de un grupo es balanceo. Precisiones para decir en voz si preguntan: SQS tiene colas FIFO (desde 2016) y SNS tiene tópicos FIFO, pero la versión básica de los dos no garantiza orden [VERIFICAR: año de los tópicos FIFO de SNS · no lo traen las referencias, solo lo recuerdo]; SNS admite una DLQ por suscripción, así que 'no lo guarda' es la simplificación de FIUBA. Fíjense en que el caso de Notificaciones no está en la tabla: es la decisión del día. Transición: los tres modelos asumen que el evento llegó al broker; ¿y si el servicio cae antes de publicarlo? Fuente: clase 15 de FIUBA TA050, tabla comparativa y precisiones; Kleppmann, DDIA 2.ª ed., cap. 12.", "En la S08 le pusimos nombre a esto y solo alcanzamos a decir que los brokers no entran en la transacción; hoy lo cerramos. El orden no salva: si guardas primero, puedes perder el aviso; si publicas primero, puedes avisar de algo que no pasó. Es el mismo emisor incierto del capítulo 4: entre las dos escrituras hay una ventana, y en esa ventana el proceso puede morir. 2PC (XA) existe, pero bloquea si el coordinador cae, y RabbitMQ no soporta XA y las transacciones de Kafka no son XA; IBM MQ y ActiveMQ sí hablan XA, pero con el costo de 2PC que vimos en la S08. En la S08 el ejemplo era la tienda; aquí es la transferencia de Mexi Banco. Transición: si no podemos unir la base y el broker, metamos el aviso en la base. Fuente: Del Código a la Arquitectura, Transactional Outbox, secciones 1 y 2 y precisiones; bitácora de la S08, lámina 27.", "La base pasa a ser la única fuente de verdad del dato y del aviso: o se guardan las dos filas o ninguna, así que desaparece la ventana de la lámina anterior. Publicar ya no es parte de la petición; lo hace el relay en segundo plano y, si el broker está caído, la fila espera y el relay reintenta. Es justo el truco de la clase 15 de FIUBA: la cola como una tabla en la misma base, 'una transacción distribuida sin hacer una transacción distribuida'. Ojo: Outbox no es saga; solo garantiza que el evento salga, no qué hacen los consumidores con él. El precio es consistencia eventual: el aviso llega, pero no en el mismo instante que el COMMIT. Transición: veamos cómo se ve esa transacción en SQL. Fuente: Del Código a la Arquitectura, Transactional Outbox, secciones 3 a 5; clase 15 de FIUBA TA050, sección 12 ('el truco: la cola como tabla') y precisiones.", "Lo importante no es el SQL, es que las dos filas comparten un solo COMMIT: el evento ya no viaja por la red dentro de la petición, solo se escribe una fila más. La columna `publicado` arranca en `false` por defecto; es la que usa el relay para saber qué falta. El `id` del evento (`e-81`) viaja en el mensaje: es la llave de idempotencia que va a usar el consumidor en la lámina siguiente. En Mexi Banco real también va el `UPDATE` del saldo dentro de la misma transacción, y los ids serían UUID; aquí se omiten para que quepa. En Spring esto es un método con `@Transactional` que guarda la transferencia y el evento con el mismo repositorio de la base. Transición: ya está en la tabla; ¿qué puede salir mal al sacarlo? Fuente: Del Código a la Arquitectura, Transactional Outbox, secciones 7 y 8 (allá con SQLite y TypeScript; aquí adaptado a Postgres).", "Es el segundo intento fallido del capítulo 4: procesar y luego anotar; si cae en medio, se procesa dos veces. Outbox es at-least-once, igual que la cola y el log, y la respuesta es la misma de la S03: idempotencia con una llave; aquí la llave es el id del evento, por eso viaja en el mensaje. Marcar después de publicar solo es seguro si `publicar` espera la confirmación del broker (publisher confirms en RabbitMQ). Con varias instancias del relay, `SKIP LOCKED` hace que cada una tome filas distintas sin pelearse, la misma cláusula que vimos en la cola sobre Postgres; el costo es que entre relays ya no hay orden global. CDC, como Debezium, lee el log de transacciones (en Postgres, el WAL) y publica sin consultar la tabla ni necesitar la columna `publicado`; Richardson describe las dos variantes. Detalle del ejemplo: este relay mantiene las filas bloqueadas mientras publica; con un broker lento conviene lotes chicos. Transición: con broker, Outbox e idempotencia ya podemos armar la saga que quedó pendiente. Fuente: Del Código a la Arquitectura, Transactional Outbox, secciones 9, 13 y 15 y precisiones; capítulo 4, los dos intentos fallidos; clase 15 de FIUBA TA050, sección 12.", "En la S08 vimos las dos formas de la saga y programamos la orquestación; la coreografía quedó en el pizarrón porque nos faltaba con qué mandar los eventos. Ya lo tenemos: cada flecha violeta es un evento en el broker, cada servicio lo publica con su propio Outbox (el estado y el evento en un COMMIT) y cada consumidor es idempotente, porque todo llega al menos una vez. Los eventos se nombran en pasado porque son hechos, no órdenes (evento contra comando, del vocabulario del inicio). `cuentas` también escucha `TransferenciaRealizada` para convertir la reserva en cargo; no se dibuja para que la cadena se lea. El riesgo es el que dijimos en la S08: con muchos pasos el flujo queda implícito y se vuelve espagueti de eventos; para dos a cuatro servicios, la coreografía funciona. Esto se programa en la S12 sobre Mexi Banco. Transición: cerremos con lo que hay que llevarse. Fuente: Richardson, Pattern: Saga (microservices.io); bitácora y grabación de la S08 ([154:30] a [161:24]); `mexi-banco-evolucion.md`, v12.", "Las tres frases resumen los tres bloques grandes: el modelo, la entrega y el Outbox.\n\nTransición: ahora elijan y defiendan la decisión del día. Fuente: plan de la S09 (bloque de cierre).", "Para la decisión, que defiendan una elección con su porqué y lo que sacrifican. Argumentos esperados: con cola (RabbitMQ o SQS), cada aviso lo manda un worker, se borra al enviarse y hay reintentos y DLQ de serie; se sacrifica el historial y el replay. Con log (Kafka), orden por cliente usando la key, replay para reenviar avisos perdidos y otros consumidores pueden leer el mismo tópico; se sacrifica simplicidad (operar Kafka, offsets, grupos) y los reintentos y la DLQ se arman aparte. Las dos respuestas son defendibles; lo que se califica es el porqué. No lo digas antes de que respondan: en Mexi Banco, `notificaciones` consume de una cola de RabbitMQ en la v10 y `antifraude` lee de Kafka en la v11. Fuente: plan de la S09 (bloque de cierre); `mexi-banco-evolucion.md`, v10 y v11; reporte de Kafka de Del Código a la Arquitectura."]);
function resize(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1600,innerHeight/900))}function show(n){current=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle('active',i===current));history.replaceState(null,'','#'+current);document.querySelector('#nt').textContent='Notas · '+String(current).padStart(2,'0');document.querySelector('#nb').innerText=scripts[current];document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1}function toggle(){notes.hidden=!notes.hidden}document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#note').onclick=toggle;document.querySelector('#close').onclick=toggle;document.querySelector('#print').onclick=()=>window.print();document.addEventListener('keydown',e=>{if(e.key==='Escape'){notes.hidden=true;return}if(e.key.toLowerCase()==='n'){toggle();return}if(!notes.hidden)return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});document.querySelector('#stage').addEventListener('click',e=>{if(e.target.closest('button')||!notes.hidden)return;const r=document.querySelector('#stage').getBoundingClientRect();show(current+(e.clientX<r.left+r.width*.18?-1:1))});window.addEventListener('resize',resize);window.addEventListener('hashchange',()=>show(Number(location.hash.slice(1))||0));resize();show(Number(location.hash.slice(1))||0);
</script></html>
