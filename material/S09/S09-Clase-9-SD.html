<section aria-label="Lámina 01: El costo del polling">
<svg viewBox="0 0 1600 900" role="img" aria-labelledby="title1 desc1"><title id="title1">Polling. ¿Ya cambió? ¿Y ahora?</title><desc id="desc1">Tres bancos preguntan por GOOGL al NASDAQ cada segundo. Las consultas sin cambios desperdician trabajo. Un cambio entre consultas se descubre tarde. Consultar más seguido multiplica la carga.</desc><defs><marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#165bb5"/></marker><marker id="back1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#59666c"/></marker></defs>

<text x="64" y="170" font-size="78" font-weight="700" letter-spacing="-3">Polling</text>

<section aria-label="Lámina 02: Push"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title2 desc2"><title id="title2">Push. ¿Y si el NASDAQ avisa?</title><desc id="desc2">NASDAQ avisa a tres bancos. El emisor debe mantener la lista de direcciones y protocolos de todos los interesados.</desc><defs><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#165bb5"/></marker><marker id="async2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7546b3"/></marker><marker id="back2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#59666c"/></marker></defs><text x="64" y="57" font-size="22" class="small">02 / EL PROBLEMA</text>

<section aria-label="Lámina 03: MOM"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title3 desc3"><title id="title3">MOM. ¿Y si ponemos una caja en medio?</title><desc id="desc3">NASDAQ publica al MOM; tres bancos se suscriben y reciben mensajes. Una tabla relaciona canales y suscriptores.</desc><defs><marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#165bb5"/></marker><marker id="async3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7546b3"/></marker><marker id="back3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#59666c"/></marker></defs><text x="64" y="57" font-size="22" class="small">03 / LA SOLUCIÓN</text>
<line x1="64" y1="82" x2="1536" y2="82" stroke="#d6dbd8"/><text x="64" y="170" font-size="78" font-weight="700" letter-spacing="-3">MOM</text>
<text x="66" y="218" font-size="36" class="muted">¿Y si ponemos una caja en medio?</text>
<text x="66" y="265" font-size="30" >Message Oriented Middleware: un intermediario que recibe los mensajes de quien los produce</text>
<text x="66" y="304" font-size="30" >y los entrega a quien se interesó en ellos. Emisor y receptores solo conocen al MOM.</text>

<section aria-label="Lámina 29: SQS y RabbitMQ"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title29 desc29"><title id="title29">SQS y RabbitMQ</title><desc id="desc29">¿Y si no estás en AWS? El patrón es el mismo con otros nombres. RabbitMQ empuja al consumidor y confirma con ack; no tiene reloj por mensaje.</desc><defs>

<section aria-label="Lámina 32: Publish y subscribe"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title32 desc32"><title id="title32">Publish y subscribe</title><desc id="desc32">El suscriptor se registra una vez con protocolo y endpoint. El publicador solo dice tópico y mensaje; SNS entrega.</desc><defs>

<marker id="violet32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7546b3"/></marker>

<text x="64" y="57" font-size="22" style="fill:#202b33;">32 / PUBLISHER-SUBSCRIBER</text>

<text x="64" y="170" font-size="78" style="fill:#202b33;" font-weight="700">Publish y subscribe</text>
<text x="66" y="218" font-size="36" style="fill:#59666c;">¿Cómo se usa? ¿Y dónde está el receive?</text>
<text x="66" y="269" font-size="30" style="fill:#202b33;">El suscriptor se registra una vez con protocolo y endpoint. El publicador solo dice</text>
<text x="66" y="305" font-size="30" style="fill:#202b33;">tópico y mensaje; SNS entrega.</text>
<path d="M64 777 H1536" fill="none" stroke="#d6dbd8" stroke-width="3"/>
<text x="66" y="828" font-size="34" style="fill:#202b33;" font-weight="700">Nadie pide mensajes: SNS los empuja a cada endpoint.</text>
<text x="66" y="869" font-size="21" style="fill:#59666c;">SISTEMAS DISTRIBUIDOS · FI-UNAM</text>
<rect x="66" y="329" width="718" height="270" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<rect x="840" y="329" width="694" height="270" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<text x="86" y="360" font-size="22" style="fill:#59666c;">SUSCRIPTOR · UNA SOLA VEZ</text>
<text x="860" y="360" font-size="22" style="fill:#59666c;">PUBLICADOR · CADA TRANSFERENCIA</text>
<text x="86" y="398" font-size="22" style="fill:#59666c;font-family:Menlo,Consolas,'Courier New',monospace;"># Antifraude, al desplegarse</text>
<text x="86" y="427" font-size="22" style="fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;">sns.subscribe(</text>
<text x="86" y="456" font-size="22" style="fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;">    TopicArn=transferencias_arn,</text>
<text x="86" y="485" font-size="22" style="fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;">    Protocol=&quot;https&quot;,</text>
<text x="86" y="514" font-size="22" style="fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;">    Endpoint=</text>
<text x="86" y="543" font-size="22" style="fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;">        &quot;https://antifraude.mexi.example/eventos&quot;,</text>
<text x="86" y="572" font-size="22" style="fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;">)</text>
<text x="860" y="398" font-size="22" style="fill:#59666c;font-family:Menlo,Consolas,'Courier New',monospace;"># Transferencia, cada vez que ocurre</text>
<text x="860" y="427" font-size="22" style="fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;">sns.publish(</text>
<text x="860" y="456" font-size="22" style="fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;">    TopicArn=transferencias_arn,</text>
<text x="860" y="485" font-size="22" style="fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;">    Message=json.dumps(evento),</text>
<text x="860" y="514" font-size="22" style="fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;">)</text>
<path d="M790 467 H832" fill="none" stroke="#59666c" stroke-width="3" marker-end="url(#muted32)"/>
<text x="810" y="430" font-size="20" style="fill:#59666c;" text-anchor="middle">después</text>
<rect x="850" y="612" width="144.78" height="36" rx="8" fill="#eeedf5" stroke="#bc3433" stroke-width="2"/>
<text x="862" y="637" font-size="22" style="fill:#bc3433;font-family:Menlo,Consolas,'Courier New',monospace;">receive()</text>
<path d="M858 637 L984 617" fill="none" stroke="#bc3433" stroke-width="3"/>

<text x="90" y="694" font-size="27" style="fill:#202b33;" font-weight="700">⚙ App-to-app</text>

<text x="382" y="695" font-size="22" style="fill:#7546b3;font-family:Menlo,Consolas,'Courier New',monospace;">sqs</text>

<section aria-label="Lámina 42: API de Kafka"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title42 desc42"><title id="title42">API de Kafka</title><desc id="desc42">El productor envía (topic, key, valor). El consumidor se une a un grupo, pide lotes con poll y registra hasta dónde llegó con commit.</desc><defs>

<text x="66" y="218" font-size="36" text-anchor="start" style="fill:#59666c;">¿Qué escribe cada lado?</text>

<text x="86" y="365" font-size="20" text-anchor="start" style="fill:#59666c;">PRODUCTOR · Transferencias</text>
<text x="86" y="450" font-size="20" text-anchor="start" style="fill:#59666c;">CONSUMIDOR · grupo auditoria</text>
<rect x="204.8" y="379" width="52.8" height="30" rx="5" fill="#f8e7bf" stroke="#f8e7bf" stroke-width="2" />
<text x="86" y="403" font-size="22" text-anchor="start" style="fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;">producer.send(new ProducerRecord&lt;&gt;("movimientos", cuentaId, json));</text>
<rect x="231.2" y="463" width="105.6" height="30" rx="5" fill="#eee7f7" stroke="#eee7f7" stroke-width="2" />
<text x="86" y="487" font-size="22" text-anchor="start" style="fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;">props.put("group.id", "auditoria");</text>
<text x="86" y="521" font-size="22" text-anchor="start" style="fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;">var consumer = new KafkaConsumer&lt;String, String&gt;(props);</text>
<rect x="204.8" y="531" width="118.8" height="30" rx="5" fill="#eee7f7" stroke="#eee7f7" stroke-width="2" />
<text x="86" y="555" font-size="22" text-anchor="start" style="fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;">consumer.subscribe(List.of("movimientos"));</text>
<text x="86" y="589" font-size="22" text-anchor="start" style="fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;">while (true) {</text>
<rect x="402.79999999999995" y="599" width="52.8" height="30" rx="5" fill="#e5eefb" stroke="#e5eefb" stroke-width="2" />
<text x="86" y="623" font-size="22" text-anchor="start" style="fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;">  for (var r : consumer.poll(Duration.ofMillis(500))) procesar(r);</text>
<rect x="231.2" y="633" width="132.0" height="30" rx="5" fill="#e6f2e9" stroke="#e6f2e9" stroke-width="2" />
<text x="86" y="657" font-size="22" text-anchor="start" style="fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;">  consumer.commitSync();</text>
<text x="86" y="691" font-size="22" text-anchor="start" style="fill:#59666c;font-family:Menlo,Consolas,'Courier New',monospace;">}</text>

<section aria-label="Lámina 46: Retención"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title46 desc46"><title id="title46">Retención</title><desc id="desc46">Kafka borra por tiempo o por tamaño, nunca por lectura. La partición se guarda en segmentos y se tira el segmento más viejo completo.</desc><defs>

<text x="326" y="732" font-size="24" text-anchor="start" style="fill:#202b33;">por tamaño, medido por partición</text>
<rect x="820" y="593" width="714" height="160" rx="5" fill="white" stroke="#d6dbd8" stroke-width="2" />

<section aria-label="Lámina 47: At-least-once"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title47 desc47"><title id="title47">At-least-once</title><desc id="desc47">Al reiniciar, el grupo retoma desde el último offset registrado. Lo que se procesó después de ese commit se procesa otra vez.</desc><defs>
<marker id="blue47" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#165bb5" /></marker>
<marker id="violet47" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7546b3" /></marker>
<marker id="amber47" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#986008" /></marker>
<marker id="green47" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#217448" /></marker>
<marker id="muted47" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#59666c" /></marker>
</defs>
<text x="64" y="57" font-size="22" text-anchor="start" style="fill:#202b33;">47 / EVENT STREAMING</text>
<path d="M64 82 H1536" fill="none" stroke="#d6dbd8" stroke-width="2.5" />
<text x="64" y="170" font-size="78" text-anchor="start" style="fill:#202b33;font-weight:700;">At-least-once</text>
<text x="66" y="218" font-size="36" text-anchor="start" style="fill:#59666c;">¿Qué pasa si el consumidor cae entre procesar y hacer commit?</text>
<rect x="66" y="330" width="260" height="56" rx="5" fill="#eee7f7" stroke="#7546b3" stroke-width="2" />
<text x="196.0" y="365.7" font-size="22" text-anchor="middle" style="fill:#202b33;font-weight:700;">movimientos · P1</text>
<path d="M196.0 386 V654" fill="none" stroke="#59666c" stroke-width="2.5" stroke-dasharray="6 5" />
<rect x="430" y="330" width="300" height="56" rx="5" fill="white" stroke="#d6dbd8" stroke-width="2" />
<text x="580.0" y="365.7" font-size="22" text-anchor="middle" style="fill:#202b33;font-weight:700;">Consumidor contabilidad</text>
<path d="M580.0 386 V654" fill="none" stroke="#59666c" stroke-width="2.5" stroke-dasharray="6 5" />
<rect x="815" y="330" width="255" height="56" rx="5" fill="white" stroke="#d6dbd8" stroke-width="2" />
<text x="942.5" y="365.7" font-size="22" text-anchor="middle" style="fill:#202b33;font-weight:700;">BD contabilidad</text>
<path d="M942.5 386 V654" fill="none" stroke="#59666c" stroke-width="2.5" stroke-dasharray="6 5" />
<text x="206" y="410" font-size="22" text-anchor="start" style="fill:#165bb5;">poll → offsets 4, 5, 6</text>
<path d="M196 421 H580" fill="none" stroke="#165bb5" stroke-width="2.5" marker-end="url(#blue47)" />
<text x="590" y="452" font-size="22" text-anchor="start" style="fill:#986008;">asientos 4, 5, 6</text>
<path d="M580 463 H942" fill="none" stroke="#986008" stroke-width="2.5" marker-end="url(#amber47)" />
<text x="206" y="579" font-size="22" text-anchor="start" style="fill:#165bb5;">poll → offsets 4, 5, 6 otra vez</text>
<path d="M196 590 H580" fill="none" stroke="#165bb5" stroke-width="2.5" marker-end="url(#blue47)" />
<text x="590" y="625" font-size="22" text-anchor="start" style="fill:#bc3433;">asientos 4, 5, 6 duplicados</text>
<path d="M580 636 H942" fill="none" stroke="#986008" stroke-width="2.5" marker-end="url(#amber47)" />
<text x="580" y="515" font-size="42" text-anchor="middle" style="fill:#bc3433;font-weight:700;">×</text>
<text x="620" y="510" font-size="22" text-anchor="start" style="fill:#bc3433;">✗ cae antes del commit</text>
<text x="95" y="548" font-size="22" text-anchor="start" style="fill:#59666c;">último offset registrado = 4</text>
<rect x="1100" y="330" width="434" height="320" rx="5" fill="#f7faf6" stroke="#217448" stroke-width="2" />
<text x="1120" y="371" font-size="24" text-anchor="start" style="fill:#217448;font-weight:700;">IDEMPOTENCIA (S03)</text>
<rect x="1120" y="401" width="390" height="36" rx="5" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2" />
<text x="1132" y="426" font-size="22" text-anchor="start" style="fill:#202b33;font-family:Menlo,Consolas,'Courier New',monospace;">UNIQUE (movimiento_id)</text>
<text x="1120" y="484" font-size="24" text-anchor="start" style="fill:#202b33;">El segundo INSERT choca y se</text>
<text x="1120" y="515" font-size="24" text-anchor="start" style="fill:#202b33;">ignora.</text>
<text x="1120" y="567" font-size="24" text-anchor="start" style="fill:#202b33;">Procesar dos veces equivale</text>
<text x="1120" y="598" font-size="24" text-anchor="start" style="fill:#202b33;">a procesar una.</text>
<rect x="66" y="687" width="1468" height="64" rx="5" fill="#eee7f7" stroke="#7546b3" stroke-width="2" />
<text x="800.0" y="729.5" font-size="30" text-anchor="middle" style="fill:#202b33;font-weight:700;">Ya hay tres modelos: ¿cuándo cola, cuándo pub/sub y cuándo log?</text>
<path d="M64 777 H1536" fill="none" stroke="#d6dbd8" stroke-width="2.5" />
<text x="66" y="884" font-size="21" text-anchor="start" style="fill:#59666c;">SISTEMAS DISTRIBUIDOS · FI-UNAM</text>
<text x="66" y="264" font-size="30" text-anchor="start" style="fill:#202b33;">Al reiniciar, el grupo retoma desde el último offset registrado. Lo que se procesó</text><text x="66" y="300" font-size="30" text-anchor="start" style="fill:#202b33;">después de ese commit se procesa otra vez.</text><text x="66" y="810" font-size="34" text-anchor="start" style="fill:#202b33;font-weight:700;">Tras una caída se reprocesa: el consumidor debe ser idempotente.</text></svg></section>
<section aria-label="Lámina 48: Cola, tópico o log"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title48 desc48"><title id="title48">Cola, tópico o log</title><desc id="desc48">Comparación por filas de SQS, SNS y Kafka: destinatarios, borrado, entrega, orden, consumidores, pasado y caso en Mexi Banco.</desc><defs>
<marker id="blue48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#165bb5"/></marker>
<marker id="violet48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7546b3"/></marker>
<marker id="amber48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#986008"/></marker>
<marker id="muted48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#59666c"/></marker>
<marker id="red48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#bc3433"/></marker>
<marker id="green48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#217448"/></marker>
</defs>
<text x="64" y="57" font-size="22" style="fill:#202b33;">48 / COMPARACIÓN</text>
<text x="1536" y="57" font-size="22" style="fill:#59666c;" text-anchor="end">LOS TRES, FILA POR FILA</text>
<path d="M64 82 L1536 82" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<text x="64" y="170" font-size="78" style="fill:#202b33;" font-weight="700">Cola, tópico o log</text>
<text x="66" y="218" font-size="36" style="fill:#59666c;">¿Qué cambia si elijo uno u otro?</text>
<text x="66" y="265" font-size="30" style="fill:#202b33;">Los tres desacoplan al emisor. Cambia quién recibe cada mensaje y cuánto tiempo vive.</text>
<rect x="66" y="295" width="1468" height="457" rx="8" fill="white" stroke="#d6dbd8" stroke-width="2"/>
<path d="M67 670 H1533 V744 Q1533 752 1525 752 H75 Q67 752 67 744Z" fill="#eee7f7"/>
<path d="M366 295 L366 752" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<text x="382" y="325" font-size="26" style="fill:#7546b3;" font-weight="700">Productor-consumidor</text>
<rect x="382" y="334" width="56.6" height="32" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<text x="392" y="358" font-size="20" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">SQS</text>
<text x="771" y="325" font-size="26" style="fill:#7546b3;" font-weight="700">Publisher-subscriber</text>
<rect x="771" y="334" width="56.6" height="32" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<text x="781" y="358" font-size="20" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">SNS</text>
<text x="1160" y="325" font-size="26" style="fill:#7546b3;" font-weight="700">Event streaming</text>
<rect x="1160" y="334" width="81.0" height="32" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<text x="1170" y="358" font-size="20" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">Kafka</text>
<path d="M66 370 L1534 370" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<path d="M66 420 L1534 420" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<path d="M66 470 L1534 470" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<path d="M66 520 L1534 520" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<path d="M66 570 L1534 570" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<path d="M66 620 L1534 620" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<path d="M66 670 L1534 670" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<text x="82" y="389" font-size="22" style="fill:#202b33;" font-weight="700">¿Quién recibe</text>
<text x="82" y="412" font-size="22" style="fill:#202b33;" font-weight="700">cada mensaje?</text>
<text x="82" y="451" font-size="22" style="fill:#202b33;" font-weight="700">¿Se borra al leer?</text>
<text x="82" y="501" font-size="22" style="fill:#202b33;" font-weight="700">¿Cómo se entrega?</text>
<text x="82" y="551" font-size="22" style="fill:#202b33;" font-weight="700">Orden</text>
<text x="82" y="601" font-size="22" style="fill:#202b33;" font-weight="700">Consumidores</text>
<text x="82" y="639" font-size="22" style="fill:#202b33;" font-weight="700">¿Se puede leer</text>
<text x="82" y="662" font-size="22" style="fill:#202b33;" font-weight="700">el pasado?</text>
<text x="82" y="701" font-size="22" style="fill:#202b33;" font-weight="700">Caso en Mexi Banco</text>
<text x="382" y="401" font-size="23"><tspan font-weight="700" style="fill:#202b33">Uno solo</tspan></text>
<text x="771" y="401" font-size="23"><tspan font-weight="700" style="fill:#202b33">Todos</tspan><tspan style="fill:#202b33"> los suscriptores</tspan></text>
<text x="1160" y="401" font-size="23"><tspan font-weight="700" style="fill:#202b33">Uno por grupo</tspan><tspan style="fill:#202b33"> de consumo</tspan></text>
<text x="382" y="451" font-size="23"><tspan font-weight="700" style="fill:#202b33">Sí</tspan><tspan style="fill:#202b33">, con</tspan></text>
<rect x="459" y="426" width="178.6" height="32" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<text x="469" y="450" font-size="20" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">DeleteMessage</text>
<text x="771" y="451" font-size="23"><tspan style="fill:#202b33">No lo guarda: </tspan><tspan font-weight="700" style="fill:#202b33">lo entrega</tspan></text>
<text x="1160" y="451" font-size="23"><tspan font-weight="700" style="fill:#202b33">No</tspan><tspan style="fill:#202b33">: lo borra la retención</tspan></text>
<text x="382" y="501" font-size="23"><tspan font-weight="700" style="fill:#165bb5">Pull</tspan><tspan style="fill:#202b33">:</tspan></text>
<rect x="436" y="476" width="190.79999999999998" height="32" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<text x="446" y="500" font-size="20" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">ReceiveMessage</text>
<text x="771" y="501" font-size="23"><tspan font-weight="700" style="fill:#7546b3">Push</tspan><tspan style="fill:#202b33">: SNS te llama</tspan></text>
<text x="1160" y="501" font-size="23"><tspan font-weight="700" style="fill:#165bb5">Pull</tspan><tspan style="fill:#202b33">: lees desde tu offset</tspan></text>
<text x="382" y="551" font-size="23" style="fill:#202b33;">Sin garantía</text>
<text x="771" y="551" font-size="23" style="fill:#202b33;">Sin garantía</text>
<text x="1160" y="551" font-size="23" style="fill:#202b33;" font-weight="700">FIFO por partición</text>
<text x="382" y="601" font-size="23"><tspan font-weight="700" style="fill:#202b33">Homogéneos</tspan><tspan style="fill:#202b33">: compiten</tspan></text>
<text x="771" y="601" font-size="23" style="fill:#202b33;" font-weight="700">Heterogéneos</text>
<text x="1160" y="589" font-size="23"><tspan font-weight="700" style="fill:#202b33">Heterogéneos</tspan><tspan style="fill:#202b33">, cada uno</tspan></text>
<text x="1160" y="612" font-size="23" style="fill:#202b33;">a su ritmo</text>
<text x="382" y="651" font-size="23" style="fill:#59666c;">No</text>
<text x="771" y="651" font-size="23" style="fill:#59666c;">No: solo lo nuevo</text>
<text x="1160" y="651" font-size="23"><tspan font-weight="700" style="fill:#217448">Sí</tspan><tspan style="fill:#202b33">: replay con el offset</tspan></text>
<text x="382" y="703" font-size="23" style="fill:#202b33;">Estados de cuenta en PDF,</text>
<text x="382" y="734" font-size="23" style="fill:#202b33;">varios workers</text>
<rect x="771" y="680" width="288.4" height="32" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<text x="781" y="704" font-size="20" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">TransferenciaRealizada</text>
<text x="771" y="734" font-size="23" style="fill:#202b33;">a antifraude y contabilidad</text>
<text x="1160" y="703" font-size="23" style="fill:#202b33;">Movimientos por CLABE,</text>
<text x="1160" y="734" font-size="23" style="fill:#202b33;">antifraude con replay</text>
<path d="M64 777 L1536 777" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<text x="66" y="828" font-size="32" style="fill:#202b33;" font-weight="700">Una cola reparte el trabajo, un tópico reparte el aviso y un log guarda la historia.</text>
<text x="66" y="869" font-size="21" style="fill:#59666c;">SISTEMAS DISTRIBUIDOS · FI-UNAM</text>
</svg></section>
<section aria-label="Lámina 49: Doble escritura"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title49 desc49"><title id="title49">Doble escritura</title><desc id="desc49">Dos órdenes de escritura fallan: guardar sin publicar pierde el aviso; publicar sin guardar anuncia una transferencia inexistente.</desc><defs>
<marker id="blue49" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#165bb5"/></marker>
<marker id="violet49" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7546b3"/></marker>
<marker id="amber49" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#986008"/></marker>
<marker id="muted49" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#59666c"/></marker>
<marker id="red49" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#bc3433"/></marker>
<marker id="green49" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#217448"/></marker>
</defs>
<text x="64" y="57" font-size="22" style="fill:#202b33;">49 / OUTBOX</text>
<text x="1536" y="57" font-size="22" style="fill:#59666c;" text-anchor="end">VIENE DE LA S08</text>
<path d="M64 82 L1536 82" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<text x="64" y="170" font-size="78" style="fill:#202b33;" font-weight="700">Doble escritura</text>
<text x="66" y="218" font-size="36" style="fill:#59666c;">¿Qué pasa si el servicio cae entre guardar y avisar?</text>
<text x="66" y="265" font-size="30" style="fill:#202b33;">Escribir el dato en la base y el evento en el broker, en el mismo flujo,</text>
<text x="66" y="304" font-size="30" style="fill:#202b33;">sin una transacción que los una.</text>
<path d="M800 326 L800 615" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<text x="66" y="342" font-size="22" style="fill:#59666c;">GUARDAR, LUEGO PUBLICAR</text>
<path d="M66 416 C66 394 236 394 236 416 V470 C236 492 66 492 66 470 Z" fill="white" stroke="#202b33" stroke-width="2"/>
<ellipse cx="151.0" cy="416" rx="85.0" ry="16" fill="white" stroke="#202b33" stroke-width="2"/>
<text x="151" y="446" font-size="25" style="fill:#202b33;" font-weight="700" text-anchor="middle">Postgres</text>
<rect x="300" y="400" width="220" height="86" rx="8" fill="white" stroke="#202b33" stroke-width="2"/>
<text x="410.0" y="451.75" font-size="25" style="fill:#202b33;" font-weight="700" text-anchor="middle">transferencias</text>
<rect x="590" y="400" width="180" height="86" rx="8" fill="#eee7f7" stroke="#7546b3" stroke-width="2"/>
<text x="680.0" y="452.1" font-size="26" style="fill:#7546b3;" font-weight="700" text-anchor="middle">Broker</text>
<text x="305" y="380" font-size="25" style="fill:#bc3433;" font-weight="700">✗ cae el proceso</text>
<path d="M300 424 H244" fill="none" stroke="#986008" stroke-width="3" marker-end="url(#amber49)"/>
<text x="71" y="385" font-size="22" style="fill:#986008;">1 · COMMIT</text>
<path d="M520 446 H582" fill="none" stroke="#59666c" stroke-width="3" marker-end="url(#muted49)" stroke-dasharray="7 6"/>
<text x="546" y="451" font-size="29" style="fill:#bc3433;" font-weight="700">✗</text>
<rect x="264" y="495" width="506" height="32" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<text x="274" y="519" font-size="20" style="fill:#59666c;font-family:Menlo, Consolas, 'Courier New', monospace;">2 · publish(TransferenciaRealizada)</text>
<text x="66" y="517" font-size="21" style="fill:#217448;">✓ $500 movidos</text>
<rect x="66" y="540" width="704" height="76" rx="8" fill="#fceceb" stroke="#bc3433" stroke-width="2"/>
<text x="84" y="570" font-size="25" style="fill:#bc3433;">La base dice que hubo transferencia.</text>
<text x="84" y="601" font-size="25" style="fill:#bc3433;">Antifraude y notificaciones nunca se enteran.</text>
<text x="830" y="342" font-size="22" style="fill:#59666c;">PUBLICAR, LUEGO GUARDAR</text>
<path d="M830 416 C830 394 1000 394 1000 416 V470 C1000 492 830 492 830 470 Z" fill="white" stroke="#202b33" stroke-width="2"/>
<ellipse cx="915.0" cy="416" rx="85.0" ry="16" fill="white" stroke="#202b33" stroke-width="2"/>
<text x="915" y="446" font-size="25" style="fill:#202b33;" font-weight="700" text-anchor="middle">Postgres</text>
<rect x="1064" y="400" width="220" height="86" rx="8" fill="white" stroke="#202b33" stroke-width="2"/>
<text x="1174.0" y="451.75" font-size="25" style="fill:#202b33;" font-weight="700" text-anchor="middle">transferencias</text>
<rect x="1354" y="400" width="180" height="86" rx="8" fill="#eee7f7" stroke="#7546b3" stroke-width="2"/>
<text x="1444.0" y="452.1" font-size="26" style="fill:#7546b3;" font-weight="700" text-anchor="middle">Broker</text>
<text x="1069" y="380" font-size="25" style="fill:#bc3433;" font-weight="700">✗ cae el proceso</text>
<path d="M1064 424 H1008" fill="none" stroke="#59666c" stroke-width="3" marker-end="url(#muted49)" stroke-dasharray="7 6"/>
<text x="835" y="385" font-size="22" style="fill:#59666c;">2 · COMMIT</text>
<path d="M1284 446 H1346" fill="none" stroke="#7546b3" stroke-width="3" marker-end="url(#violet49)"/>
<text x="1024" y="430" font-size="29" style="fill:#bc3433;" font-weight="700">✗</text>
<rect x="1028" y="495" width="506" height="32" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<text x="1038" y="519" font-size="20" style="fill:#7546b3;font-family:Menlo, Consolas, 'Courier New', monospace;">1 · publish(TransferenciaRealizada)</text>
<text x="830" y="517" font-size="21" style="fill:#59666c;">sin transferencia</text>
<text x="1365" y="385" font-size="22" style="fill:#217448;">✓ publicado</text>
<rect x="830" y="540" width="704" height="76" rx="8" fill="#fceceb" stroke="#bc3433" stroke-width="2"/>
<text x="848" y="570" font-size="25" style="fill:#bc3433;">Notificaciones avisa de $500</text>
<text x="848" y="601" font-size="25" style="fill:#bc3433;">que nunca se movieron.</text>
<rect x="66" y="640" width="1468" height="95" rx="8" fill="#f8e7bf" stroke="#d6dbd8" stroke-width="2"/>
<text x="90" y="677" font-size="28" style="fill:#202b33;" font-weight="700">¿Y una transacción que abarque las dos escrituras?</text>
<text x="90" y="717" font-size="28" style="fill:#202b33;">2PC existe (S08), pero RabbitMQ y Kafka no participan en él.</text>
<path d="M64 777 L1536 777" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<text x="66" y="828" font-size="30" style="fill:#202b33;" font-weight="700">Dos escrituras en dos sistemas no son atómicas: tarde o temprano quedan en desacuerdo.</text>
<text x="66" y="869" font-size="21" style="fill:#59666c;">SISTEMAS DISTRIBUIDOS · FI-UNAM</text>
</svg></section>
<section aria-label="Lámina 50: Outbox"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title50 desc50"><title id="title50">Outbox</title><desc id="desc50">Una transacción local guarda t-81 y e-81 en Postgres. El relay lee pendientes, publica al broker y marca publicado.</desc><defs>
<marker id="blue50" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#165bb5"/></marker>
<marker id="violet50" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7546b3"/></marker>
<marker id="amber50" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#986008"/></marker>
<marker id="muted50" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#59666c"/></marker>
<marker id="red50" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#bc3433"/></marker>
<marker id="green50" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#217448"/></marker>
</defs>
<text x="64" y="57" font-size="22" style="fill:#202b33;">50 / OUTBOX</text>
<text x="1536" y="57" font-size="22" style="fill:#59666c;" text-anchor="end">TRANSACTIONAL OUTBOX</text>
<path d="M64 82 L1536 82" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<text x="64" y="170" font-size="78" style="fill:#202b33;" font-weight="700">Outbox</text>
<text x="66" y="218" font-size="36" style="fill:#59666c;">¿Y si el aviso se guarda junto con el dato?</text>
<text x="66" y="265" font-size="30" style="fill:#202b33;">El evento se guarda como una fila de la tabla</text>
<rect x="674" y="239" width="110" height="32" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<text x="684" y="263" font-size="24" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">outbox</text>
<text x="799" y="265" font-size="30" style="fill:#202b33;">, en la misma transacción que el dato de negocio.</text>
<text x="66" y="304" font-size="30" style="fill:#202b33;">Otro proceso, el relay, lee esas filas y las publica después.</text>
<rect x="66" y="424" width="220" height="100" rx="8" fill="white" stroke="#202b33" stroke-width="2"/>
<text x="176.0" y="482.75" font-size="25" style="fill:#202b33;" font-weight="700" text-anchor="middle">transferencias</text>
<path d="M380 354 C380 332 820 332 820 354 V612 C820 634 380 634 380 612 Z" fill="white" stroke="#202b33" stroke-width="2"/>
<ellipse cx="600.0" cy="354" rx="220.0" ry="16" fill="white" stroke="#202b33" stroke-width="2"/>
<text x="600" y="391" font-size="30" style="fill:#202b33;" font-weight="700" text-anchor="middle">Postgres</text>

<rect x="410" y="421" width="380" height="74" rx="8" fill="white" stroke="#d6dbd8" stroke-width="2"/>
<rect x="420" y="426" width="190.79999999999998" height="32" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<text x="430" y="450" font-size="20" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">transferencias</text>
<text x="420" y="482" font-size="23" style="fill:#202b33;">t-81 · C-100 → C-200 · $500</text>
<rect x="410" y="511" width="380" height="74" rx="8" fill="#eee7f7" stroke="#7546b3" stroke-width="2"/>
<rect x="420" y="516" width="93.2" height="32" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<text x="430" y="540" font-size="20" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">outbox</text>
<text x="420" y="571" font-size="22" style="fill:#202b33;">e-81 · TransferenciaRealizada</text>
<text x="394" y="653" font-size="25" style="fill:#986008;" font-weight="700">una transacción · todo o nada</text>
<rect x="770" y="396" width="24" height="24" rx="8" fill="#f8e7bf" stroke="#986008" stroke-width="2"/>
<path d="M775 396 V389 A7 7 0 0 1 789 389 V396" fill="none" stroke="#986008" stroke-width="3"/>
<path d="M286 472 H372" fill="none" stroke="#986008" stroke-width="3" marker-end="url(#amber50)"/>
<text x="66" y="365" font-size="22" style="fill:#986008;font-family:Menlo, Consolas, 'Courier New', monospace;">1 · BEGIN … COMMIT</text>
<rect x="920" y="440" width="210" height="100" rx="8" fill="white" stroke="#202b33" stroke-width="2"/>
<text x="1025" y="481" font-size="30" style="fill:#202b33;" font-weight="700" text-anchor="middle">Relay</text>
<text x="1025" y="519" font-size="22" style="fill:#59666c;" text-anchor="middle">proceso aparte</text>
<path d="M920 464 H858 V537 H814" fill="none" stroke="#165bb5" stroke-width="3" marker-end="url(#blue50)"/>

<text x="850" y="610" font-size="22" style="fill:#986008;">4 · marca publicado</text>

<text x="1392.0" y="501.2" font-size="32" style="fill:#7546b3;" font-weight="700" text-anchor="middle">Broker</text>
<path d="M1130 479 H1242" fill="none" stroke="#7546b3" stroke-width="3" marker-end="url(#violet50)"/>
<text x="1164" y="424" font-size="22" style="fill:#7546b3;">3 · publica</text>
<text x="1392" y="578" font-size="22" style="fill:#59666c;" text-anchor="middle">antifraude · contabilidad</text>
<text x="1392" y="607" font-size="22" style="fill:#59666c;" text-anchor="middle">notificaciones</text>
<rect x="66" y="674" width="1468" height="78" rx="8" fill="white" stroke="#d6dbd8" stroke-width="2"/>
<rect x="87" y="697" width="50" height="33" rx="8" fill="white" stroke="#d6dbd8" stroke-width="2"/>
<path d="M87 697 L112 716" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<path d="M112 716 L137 697" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<text x="159" y="706" font-size="25" style="fill:#202b33;" font-weight="700">Como la bandeja de salida del correo:</text>
<text x="1508" y="705" font-size="22" style="fill:#59666c;" text-anchor="end">En FIUBA: «la cola como tabla».</text>
<text x="159" y="739" font-size="26" style="fill:#202b33;">sin red, el mensaje espera en Salida; cuando vuelve la conexión, se envía solo.</text>
<path d="M64 777 L1536 777" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<text x="66" y="828" font-size="34" style="fill:#202b33;" font-weight="700">El evento comparte el destino del dato: si uno se guarda, el otro también.</text>
<text x="66" y="869" font-size="21" style="fill:#59666c;">SISTEMAS DISTRIBUIDOS · FI-UNAM</text>
</svg></section>
<section aria-label="Lámina 51: Todo o nada"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title51 desc51"><title id="title51">Todo o nada</title><desc id="desc51">SQL con un solo BEGIN y COMMIT; tablas transferencias y outbox después del COMMIT. Una caída previa revierte ambas filas.</desc><defs>
<marker id="blue51" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#165bb5"/></marker>
<marker id="violet51" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7546b3"/></marker>
<marker id="amber51" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#986008"/></marker>
<marker id="muted51" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#59666c"/></marker>
<marker id="red51" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#bc3433"/></marker>
<marker id="green51" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#217448"/></marker>
</defs>
<text x="64" y="57" font-size="22" style="fill:#202b33;">51 / OUTBOX</text>
<text x="1536" y="57" font-size="22" style="fill:#59666c;" text-anchor="end">CÓMO SE USA</text>
<path d="M64 82 L1536 82" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<text x="64" y="170" font-size="78" style="fill:#202b33;" font-weight="700">Todo o nada</text>
<text x="66" y="218" font-size="36" style="fill:#59666c;">¿Cómo se ve en la base?</text>
<text x="66" y="265" font-size="30" style="fill:#202b33;">Dos INSERT en la misma transacción local. Si algo falla antes del COMMIT,</text>
<text x="66" y="304" font-size="30" style="fill:#202b33;">no queda ninguna de las dos filas.</text>
<rect x="66" y="330" width="834" height="310" rx="8" fill="white" stroke="#d6dbd8" stroke-width="2"/>
<rect x="78" y="450" width="808" height="114" rx="8" fill="#eee7f7" stroke="#d6dbd8" stroke-width="2"/>
<text x="80" y="367" font-size="20" style="fill:#59666c;">1</text>
<text x="111" y="367" font-size="23" style="fill:#986008;font-family:Menlo, Consolas, 'Courier New', monospace;" font-weight="700">BEGIN;</text>
<text x="80" y="405" font-size="20" style="fill:#59666c;">2</text>
<text x="111" y="405" font-size="23" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">INSERT INTO transferencias (id, origen, destino, monto)</text>
<text x="80" y="443" font-size="20" style="fill:#59666c;">3</text>
<text x="111" y="443" font-size="23" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">  VALUES (&#x27;t-81&#x27;, &#x27;C-100&#x27;, &#x27;C-200&#x27;, 500);</text>
<text x="80" y="481" font-size="20" style="fill:#59666c;">4</text>
<text x="111" y="481" font-size="23" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">INSERT INTO outbox (id, tipo, payload)</text>
<text x="80" y="519" font-size="20" style="fill:#59666c;">5</text>
<text x="111" y="519" font-size="23" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">  VALUES (&#x27;e-81&#x27;, &#x27;TransferenciaRealizada&#x27;,</text>
<text x="80" y="557" font-size="20" style="fill:#59666c;">6</text>
<text x="111" y="557" font-size="23" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">          &#x27;{&quot;transferencia&quot;:&quot;t-81&quot;,&quot;monto&quot;:500}&#x27;);</text>
<text x="80" y="595" font-size="20" style="fill:#59666c;">7</text>
<text x="111" y="595" font-size="23" style="fill:#986008;font-family:Menlo, Consolas, 'Courier New', monospace;" font-weight="700">COMMIT;</text>
<path d="M908 348 H920 V615 H908" fill="none" stroke="#986008" stroke-width="3"/>
<text x="576" y="678" font-size="25" style="fill:#986008;" font-weight="700">una sola transacción</text>
<text x="950" y="347" font-size="22" style="fill:#59666c;">DESPUÉS DEL COMMIT</text>
<rect x="950" y="362" width="207.88" height="32" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<text x="960" y="386" font-size="22" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">transferencias</text>
<rect x="950" y="404" width="584" height="79" rx="8" fill="white" stroke="#d6dbd8" stroke-width="2"/>
<text x="965" y="432" font-size="22" style="fill:#59666c;">id</text>
<text x="965" y="468" font-size="23" style="fill:#202b33;">t-81</text>
<text x="1080" y="432" font-size="22" style="fill:#59666c;">origen</text>
<text x="1080" y="468" font-size="23" style="fill:#202b33;">C-100</text>
<text x="1240" y="432" font-size="22" style="fill:#59666c;">destino</text>
<text x="1240" y="468" font-size="23" style="fill:#202b33;">C-200</text>
<text x="1430" y="432" font-size="22" style="fill:#59666c;">monto</text>
<text x="1430" y="468" font-size="23" style="fill:#202b33;">500</text>
<path d="M950 442 L1534 442" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<rect x="950" y="496" width="100.52" height="32" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<text x="960" y="520" font-size="22" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">outbox</text>
<rect x="950" y="538" width="584" height="92" rx="8" fill="white" stroke="#d6dbd8" stroke-width="2"/>
<text x="963" y="562" font-size="21" style="fill:#59666c;">id</text>
<text x="963" y="590" font-size="22" style="fill:#202b33;">e-81</text>
<text x="1041" y="562" font-size="21" style="fill:#59666c;">tipo</text>
<text x="1041" y="590" font-size="22" style="fill:#202b33;">TransferenciaRealizada</text>
<text x="1375" y="562" font-size="21" style="fill:#59666c;">publicado</text>
<rect x="1365" y="567" width="84" height="32" rx="8" fill="#f8e7bf" stroke="#d6dbd8" stroke-width="2"/>
<text x="1375" y="591" font-size="20" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">false</text>
<text x="1375" y="619" font-size="20" style="fill:#986008;">pendiente</text>
<rect x="950" y="651" width="584" height="85" rx="8" fill="#fceceb" stroke="#bc3433" stroke-width="2"/>
<text x="967" y="683" font-size="24" style="fill:#bc3433;">✗ Cae antes del COMMIT → ROLLBACK:</text>
<text x="967" y="718" font-size="24" style="fill:#bc3433;">ni transferencia ni evento.</text>
<path d="M64 777 L1536 777" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<text x="66" y="828" font-size="34" style="fill:#202b33;" font-weight="700">Una transacción local hace lo que no podíamos pedirle a una distribuida.</text>
<text x="66" y="869" font-size="21" style="fill:#59666c;">SISTEMAS DISTRIBUIDOS · FI-UNAM</text>
</svg></section>
<section aria-label="Lámina 52: Al menos una vez"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title52 desc52"><title id="title52">Al menos una vez</title><desc id="desc52">El relay espera el ack, pero cae antes de confirmar publicado. Reenvía e-81 y notificaciones lo descarta por idempotencia.</desc><defs>
<marker id="blue52" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#165bb5"/></marker>
<marker id="violet52" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7546b3"/></marker>
<marker id="amber52" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#986008"/></marker>
<marker id="muted52" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#59666c"/></marker>
<marker id="red52" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#bc3433"/></marker>
<marker id="green52" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#217448"/></marker>
</defs>
<text x="64" y="57" font-size="22" style="fill:#202b33;">52 / OUTBOX</text>
<text x="1536" y="57" font-size="22" style="fill:#59666c;" text-anchor="end">QUÉ SE ROMPE</text>
<path d="M64 82 L1536 82" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<text x="64" y="170" font-size="78" style="fill:#202b33;" font-weight="700">Al menos una vez</text>
<text x="66" y="218" font-size="36" style="fill:#59666c;">¿Y si el relay cae entre publicar y marcar?</text>
<text x="66" y="265" font-size="30" style="fill:#202b33;">El relay publica y luego marca. Si cae en medio, la fila sigue pendiente</text>
<text x="66" y="304" font-size="30" style="fill:#202b33;">y el evento sale dos veces.</text>
<text x="66" y="338" font-size="22" style="fill:#59666c;">EL RELAY, EN BUCLE</text>
<rect x="66" y="350" width="870" height="280" rx="8" fill="white" stroke="#d6dbd8" stroke-width="2"/>
<text x="80" y="380" font-size="20" style="fill:#59666c;">1</text>
<text x="108" y="380" font-size="20" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">BEGIN;</text>
<text x="80" y="411" font-size="20" style="fill:#59666c;">2</text>
<text x="108" y="411" font-size="20" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">filas = SELECT * FROM outbox WHERE publicado = false</text>
<text x="80" y="442" font-size="20" style="fill:#59666c;">3</text>
<rect x="421.07" y="423" width="264.91" height="29" rx="8" fill="#eeedf5" stroke="#7546b3" stroke-width="2"/>
<text x="108" y="442" font-size="20" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">        ORDER BY creado LIMIT 100 FOR UPDATE SKIP LOCKED;</text>
<text x="80" y="473" font-size="20" style="fill:#59666c;">4</text>
<text x="108" y="473" font-size="20" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">for (fila : filas) {</text>
<text x="80" y="504" font-size="20" style="fill:#59666c;">5</text>
<text x="108" y="504" font-size="20" style="fill:#7546b3;font-family:Menlo, Consolas, 'Courier New', monospace;">  broker.publicar(fila.id, fila.tipo, fila.payload);  // espera el ack</text>
<text x="80" y="535" font-size="20" style="fill:#59666c;">6</text>
<text x="108" y="535" font-size="20" style="fill:#986008;font-family:Menlo, Consolas, 'Courier New', monospace;">  UPDATE outbox SET publicado = true WHERE id = fila.id;</text>
<text x="80" y="566" font-size="20" style="fill:#59666c;">7</text>
<text x="108" y="566" font-size="20" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">}</text>
<text x="80" y="597" font-size="20" style="fill:#59666c;">8</text>
<text x="108" y="597" font-size="20" style="fill:#986008;font-family:Menlo, Consolas, 'Courier New', monospace;">COMMIT;</text>
<path d="M943 491 H952 V606 H943" fill="none" stroke="#bc3433" stroke-width="3"/>
<text x="68" y="657" font-size="23" style="fill:#bc3433;">ventana: publicado, sin marcar</text>
<path d="M980 367 L980 614" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<circle cx="980" cy="367" r="8" fill="#7546b3"/>
<circle cx="980" cy="432" r="8" fill="#bc3433"/>
<circle cx="980" cy="497" r="8" fill="#986008"/>
<circle cx="980" cy="580" r="8" fill="#217448"/>
<text x="1004" y="368" font-size="24" style="fill:#202b33;">El relay publica</text>
<rect x="1183" y="344" width="68" height="32" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<text x="1193" y="368" font-size="20" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">e-81</text>
<text x="1264" y="368" font-size="24" style="fill:#202b33;">→ broker</text>
<text x="1420" y="368" font-size="24" style="fill:#217448;">✓ ack</text>
<text x="1004" y="433" font-size="24" style="fill:#bc3433;">✗ El relay cae antes del COMMIT.</text>
<text x="1004" y="494" font-size="24" style="fill:#202b33;">Al volver,</text>
<rect x="1114" y="471" width="70" height="32" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<text x="1124" y="495" font-size="20" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">e-81</text>
<text x="1197" y="494" font-size="24" style="fill:#202b33;">sigue con</text>
<rect x="1004" y="506" width="225" height="32" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<text x="1014" y="530" font-size="20" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">publicado = false</text>
<text x="1240" y="530" font-size="23" style="fill:#202b33;">: lo publica otra vez.</text>
<text x="1004" y="581" font-size="24" style="fill:#202b33;">notificaciones recibe</text>
<rect x="1238" y="558" width="70" height="32" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<text x="1248" y="582" font-size="20" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">e-81</text>
<text x="1322" y="581" font-size="24" style="fill:#202b33;">dos veces:</text>
<text x="1004" y="617" font-size="24" font-style="italic" style="fill:#217448">«ya procesé e-81, lo ignoro»</text>
<text x="66" y="705" font-size="25" style="fill:#202b33;" font-weight="700">• Varios relays:</text>
<rect x="245" y="680" width="289" height="32" rx="8" fill="#eeedf5" stroke="#d6dbd8" stroke-width="2"/>
<text x="255" y="704" font-size="21" style="fill:#202b33;font-family:Menlo, Consolas, 'Courier New', monospace;">FOR UPDATE SKIP LOCKED</text>
<text x="551" y="705" font-size="25" style="fill:#202b33;">cada fila la toma uno solo (como la cola sobre Postgres).</text>
<text x="66" y="747" font-size="25"><tspan font-weight="700" style="fill:#202b33">• Otra forma de relay: </tspan><tspan style="fill:#202b33">CDC (por ejemplo, Debezium) lee el log de la base en vez de consultar la tabla.</tspan></text>
<path d="M64 777 L1536 777" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<text x="66" y="828" font-size="29" style="fill:#202b33;" font-weight="700">El Outbox garantiza que el evento sale, no que salga una sola vez: el consumidor es idempotente.</text>
<text x="66" y="869" font-size="21" style="fill:#59666c;">SISTEMAS DISTRIBUIDOS · FI-UNAM</text>
</svg></section>
<section aria-label="Lámina 53: Coreografía"><svg viewBox="0 0 1600 900" role="img" aria-labelledby="title53 desc53"><title id="title53">Coreografía</title><desc id="desc53">Cadena de eventos entre transferencias, cuentas y notificaciones; si SPEI se rechaza, cuentas libera la reserva y notificaciones avisa del rechazo.</desc><defs>
<marker id="blue53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#165bb5"/></marker>
<marker id="violet53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7546b3"/></marker>
<marker id="amber53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#986008"/></marker>
<marker id="muted53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#59666c"/></marker>
<marker id="red53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#bc3433"/></marker>
<marker id="green53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#217448"/></marker>
</defs>
<text x="64" y="57" font-size="22" style="fill:#202b33;">53 / CIERRE</text>
<text x="1536" y="57" font-size="22" style="fill:#59666c;" text-anchor="end">PENDIENTE DE LA S08</text>
<path d="M64 82 L1536 82" fill="none" stroke="#d6dbd8" stroke-width="2"/>
<text x="64" y="170" font-size="78" style="fill:#202b33;" font-weight="700">Coreografía</text>
<text x="66" y="218" font-size="36" style="fill:#59666c;">¿Y la saga sin director?</text>
<text x="66" y="265" font-size="30" style="fill:#202b33;">Cada servicio escucha un evento, hace su paso local y publica el siguiente.</text>
